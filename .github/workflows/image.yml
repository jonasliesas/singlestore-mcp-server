# Builds the SAS SpeedyStore Studio server image (deploy/Dockerfile) and publishes it to GitHub's container registry:
#   ghcr.io/jonasliesas/speedystore-studio:<version>   (e.g. 0.11.2, from the tag v0.11.2)
# Runs on every release tag v*; "Run workflow" builds any existing tag again (e.g. v0.11.2, tagged before this file).
# An admin then copies it into their own registry (docker pull / tag / push) or the cluster pulls it from ghcr.io.
# The image holds no secrets: master key, collector password and CA bundle are given at run time.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.11.2"
        required: true

concurrency:
  group: image-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/speedystore-studio
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: The tag matches pyproject.toml
        run: grep -q "^version = \"$VERSION\"" pyproject.toml || { echo "pyproject.toml is not $VERSION"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=SAS SpeedyStore Studio
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (non-root, app and notebook environment import)
        run: |
          docker run --rm --entrypoint sh "$IMAGE:$VERSION" -c '
            test "$(id -u)" = 10001 &&
            python -c "import singlestore_mcp.hub.app, singlestore_mcp.collector" &&
            /opt/notebook-env/bin/python -c "import pandas, ipykernel" &&
            echo smoke ok'

      - name: Push
        run: |
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
