# EXAMPLE ONLY - never commit real values. STUDIO_NOTEBOOKS=gateway (step 2a). Create it from the command line:
#
#   kubectl -n speedystore-studio create secret generic studio-gateway \
#     --from-literal=STUDIO_GATEWAY_AUTH_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
#
# STUDIO_GATEWAY_AUTH_TOKEN: the kernel gateway accepts only requests with this token. The hub holds it (its kernel
#   broker starts kernels and relays their channels); Studios and kernels never get it. Its own Secret so that the
#   gateway pod gets this one value and nothing of studio-secrets (master key, OAuth client secret).
#   Changing it: update the Secret, restart both Deployments (running kernels are lost).
apiVersion: v1
kind: Secret
metadata:
  name: studio-gateway
  namespace: speedystore-studio
type: Opaque
stringData:
  STUDIO_GATEWAY_AUTH_TOKEN: "<generate: 48+ random characters>"
