# Settings without secrets. Every key is described in deploy/README.md ("Settings").
apiVersion: v1
kind: ConfigMap
metadata:
  name: studio-config
  namespace: speedystore-studio
  labels:
    app.kubernetes.io/name: speedystore-studio
data:
  # The address users open (the Ingress host below). Cookies are Secure and the OAuth redirect URI is
  # <STUDIO_PUBLIC_URL>/oauth/callback.
  STUDIO_PUBLIC_URL: "https://studio.<internal-domain>"
  # The Viya whose SAS Logon signs users in (Zeus).
  STUDIO_VIYA_URL: "https://<zeus-viya-host>"
  STUDIO_VIYA_NAME: "Zeus"
  STUDIO_VIYA_VERIFY: "1"
  # Sign-in: "redirect" with the client the Viya admin registered (preferred), or "paste" with the built-in
  # vscode client (fallback, no registration: users paste the code SAS Logon shows).
  STUDIO_OAUTH_MODE: "redirect"
  STUDIO_OAUTH_CLIENT_ID: "speedystore-studio"
  # Empty: SAS Logon grants the client's registered scopes (["openid", "*"]: the user's own groups), as for vscode.
  STUDIO_OAUTH_SCOPE: ""
  # SAS user ids (as SAS Logon / identities know them), comma-separated.
  STUDIO_ADMINS: "<sas-user-id>"
  # Who may use Studio / notebooks: SAS groups the Viya admin creates in SAS Environment Manager (ADMIN-GUIDE §8).
  # Empty: every SAS user who can sign in. Notebooks also need STUDIO_NOTEBOOKS=local.
  STUDIO_USERS_GROUP: "SpeedyStoreStudioUsers"
  STUDIO_NOTEBOOK_GROUP: "SpeedyStoreStudioNotebooks"
  # Extra SAS user ids allowed besides the groups' members (comma-separated); without groups: the only list.
  STUDIO_ALLOWED_USERS: ""
  STUDIO_MAX_USERS: "20"
  STUDIO_IDLE_MINUTES: "30"
  STUDIO_SESSION_HOURS: "10"
  # Pre-filled SingleStore connection for every new user (no user name or password: each user adds their own).
  STUDIO_DEFAULT_S2_NAME: "SingleStore"
  STUDIO_DEFAULT_S2_HOST: "<singlestore-host-or-service>"
  STUDIO_DEFAULT_S2_PORT: "3306"
  STUDIO_DEFAULT_S2_DATABASE: ""
  # Notebooks: off | local | gateway, for members of SpeedyStoreStudioNotebooks only.
  #   local   = kernels in each notebook user's own Studio process (test version: Jonas + one colleague). No isolation
  #             between users' kernels - test use with a few trusted users only.
  #   gateway = kernels in the kernel gateway pod (step 2a, 80-83-*.yaml + the Secret studio-gateway): limits per kernel,
  #             own egress rules, package installs per STUDIO_PIP_MODE. Still no isolation between users' kernels
  #             (one shared kernel pod, one OS user) - one pod per kernel is step 2b.
  STUDIO_NOTEBOOKS: "local"
  # --- Kernel gateway (STUDIO_NOTEBOOKS=gateway). Read by the hub and by the gateway pod.
  STUDIO_GATEWAY_URL: "http://studio-gateway:8888"
  STUDIO_KERNELS_PER_USER: "3"          # notebook kernels per user at once (the Studio closes its oldest idle one first)
  STUDIO_KERNELS_TOTAL: "20"            # notebook kernels on the gateway at once
  STUDIO_KERNEL_IDLE_MINUTES: "30"      # the gateway stops a kernel idle this long (busy ones stay)
  STUDIO_KERNEL_MEMORY_MB: "3072"       # per kernel: address-space cap (RLIMIT_AS); a cell that needs more gets MemoryError
  STUDIO_KERNEL_NICE: "10"              # lower CPU priority for kernels
  STUDIO_KERNEL_QUOTA_GB: "5"           # per user on the kernel volume (checked before / reported after each install)
  # Package installs from notebooks: mirror (an internal PyPI proxy, STUDIO_PIP_INDEX_URL; egress only to it) |
  # pypi (pypi.org + files.pythonhosted.org; needs that egress, 83-gateway-networkpolicy-pypi.yaml) | off (image only).
  # Apply the matching 83-gateway-networkpolicy-<mode>.yaml.
  STUDIO_PIP_MODE: "pypi"
  STUDIO_PIP_INDEX_URL: ""
  # The hub's token relay that kernels ask for the user's fresh tokens (port 8801; only the gateway pod may reach it).
  STUDIO_RELAY_BIND: "0.0.0.0"
  STUDIO_RELAY_PORT: "8801"
  STUDIO_RELAY_URL: "http://studio-hub-relay:8801"
  # Ask Claude: off.
  STUDIO_ASSISTANT: "0"
  STUDIO_METRICS: "1"
  # The Ingress sets X-Forwarded-For; the pod accepts traffic from the ingress controller only (NetworkPolicy).
  STUDIO_TRUST_FORWARDED: "1"
