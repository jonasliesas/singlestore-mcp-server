# EXAMPLE ONLY - never commit real values. Create the Secret from the command line instead, e.g.:
#
#   kubectl -n speedystore-studio create secret generic studio-secrets \
#     --from-literal=STUDIO_MASTER_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" \
#     --from-literal=STUDIO_OAUTH_CLIENT_SECRET='<the secret chosen when the SAS Logon client was registered>'
#
# STUDIO_MASTER_KEY: signs nothing public; it derives each user's key for their encrypted secrets file
#   (SingleStore passwords, Viya refresh tokens). Keep it outside the volume's backups. Changing it makes the
#   saved passwords and Viya sign-ins unreadable (users enter them again; nothing else is lost).
# STUDIO_OAUTH_CLIENT_SECRET: only with the hub's own SAS Logon client (STUDIO_OAUTH_MODE=redirect).
# Ask Claude (later, STUDIO_ASSISTANT=1 and an image built with INSTALL_CLAUDE=1): ANTHROPIC_API_KEY, or for
#   Microsoft Foundry CLAUDE_CODE_USE_FOUNDRY=1 + ANTHROPIC_FOUNDRY_RESOURCE + ANTHROPIC_FOUNDRY_API_KEY.
apiVersion: v1
kind: Secret
metadata:
  name: studio-secrets
  namespace: speedystore-studio
type: Opaque
stringData:
  STUDIO_MASTER_KEY: "<generate: 48+ random characters>"
  STUDIO_OAUTH_CLIENT_SECRET: "<from the SAS Logon client registration>"
