<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cluster Monitor</title>
<!--S2:HEAD-->
<style>
  .cm-auto { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .cm-section { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 14px 0 8px; }
  .cm-section h2 { font-size: var(--font-text-md-size, 14px); font-weight: var(--font-weight-semibold, 600); margin: 0; }
  .cm-nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .cm-node { padding: 10px 12px; }
  .cm-node.down { border-color: var(--s2-err); }
  .cm-node-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cm-node-name { font-weight: var(--font-weight-semibold, 600); font-family: var(--s2-mono); font-size: var(--s2-fs-xs); }
  .cm-node-meta { color: var(--s2-text-3); font-size: 11px; margin-top: 2px; }
  .cm-meter { margin-top: 10px; }
  .cm-meter-top { display: flex; justify-content: space-between; gap: 8px; font-size: var(--s2-fs-xs); color: var(--s2-text-2); }
  .cm-meter-top strong { color: var(--s2-text); font-weight: var(--font-weight-medium, 500); font-variant-numeric: tabular-nums; }
  .cm-track { height: 8px; border-radius: 4px; background: var(--s2-bg-3); overflow: hidden; margin-top: 4px; }
  .cm-track > span { display: block; height: 100%; border-radius: 4px; background: var(--s2-ok); transition: width .5s; }
  .cm-track.warn > span { background: var(--s2-warn); }
  .cm-track.crit > span { background: var(--s2-err); }
  .cm-sub { font-size: 11px; color: var(--s2-text-3); margin-top: 3px; font-variant-numeric: tabular-nums; }
  /* Categorical series colors (validated light/dark steps), assigned per node in fixed order. */
  :root {
    --series-1: light-dark(#2a78d6, #3987e5);
    --series-2: light-dark(#eb6834, #d95926);
    --series-3: light-dark(#1baf7a, #199e70);
    --series-4: light-dark(#eda100, #c98500);
    --series-5: light-dark(#e87ba4, #d55181);
    --series-6: light-dark(#008300, #008300);
    --series-7: light-dark(#4a3aa7, #9085e9);
    --series-8: light-dark(#e34948, #e66767);
  }
  .cm-key { display: inline-block; width: 12px; height: 3px; border-radius: 2px; flex: none; }
  .cm-chart { padding: 10px 12px 6px; }
  .cm-chart-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cm-chart-head h2 { font-size: var(--font-text-md-size, 14px); font-weight: var(--font-weight-semibold, 600); margin: 0; }
  .cm-seg { display: inline-flex; border: 1px solid var(--s2-border); border-radius: var(--s2-radius-sm); overflow: hidden; }
  .cm-seg button { border: 0; background: transparent; padding: 3px 10px; font-size: var(--s2-fs-xs); cursor: pointer; color: var(--s2-text-2); }
  .cm-seg button + button { border-left: 1px solid var(--s2-border); }
  .cm-seg button[aria-pressed="true"] { background: var(--s2-bg-3); color: var(--s2-text); font-weight: var(--font-weight-semibold, 600); }
  .cm-legend { display: flex; gap: 4px 12px; flex-wrap: wrap; margin: 8px 0 2px; }
  .cm-legend button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 2px 0; cursor: pointer;
    font-size: var(--s2-fs-xs); color: var(--s2-text-2); font-family: var(--s2-mono); }
  .cm-legend button[aria-pressed="false"] { color: var(--s2-text-3); text-decoration: line-through; }
  .cm-legend button[aria-pressed="false"] .cm-key { opacity: .3; }
  .cm-plot { position: relative; outline: none; touch-action: none; }
  .cm-plot:focus-visible { box-shadow: 0 0 0 2px var(--s2-ring); border-radius: 4px; }
  .cm-plot svg { display: block; width: 100%; overflow: visible; }
  .cm-plot .grid { stroke: var(--s2-border-2); stroke-width: 1; shape-rendering: crispEdges; }
  .cm-plot .base { stroke: var(--s2-border); stroke-width: 1; shape-rendering: crispEdges; }
  .cm-plot .tick { fill: var(--s2-text-3); font-size: 11px; font-variant-numeric: tabular-nums; font-family: var(--s2-font); }
  .cm-plot .series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .cm-plot .label { fill: var(--s2-text-2); font-size: 11px; font-family: var(--s2-mono); }
  .cm-plot .cross { stroke: var(--s2-text-3); stroke-width: 1; shape-rendering: crispEdges; }
  .cm-plot .dot { stroke: var(--s2-bg); stroke-width: 2; }
  .cm-tip { position: absolute; top: 4px; pointer-events: none; z-index: 2; min-width: 150px;
    background: var(--s2-bg); border: 1px solid var(--s2-border); border-radius: var(--s2-radius-sm);
    box-shadow: var(--shadow-md, 0 2px 8px rgba(0,0,0,.15)); padding: 6px 9px; font-size: var(--s2-fs-xs); }
  .cm-tip .when { color: var(--s2-text-3); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
  .cm-tip .row { display: flex; align-items: center; gap: 7px; line-height: 1.6; }
  .cm-tip .row strong { color: var(--s2-text); font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }
  .cm-tip .row span:last-child { color: var(--s2-text-2); font-family: var(--s2-mono); }
  .cm-chart-empty { padding: 30px 0; text-align: center; color: var(--s2-text-2); font-size: var(--s2-fs-xs); }
  .cm-q { width: 100%; }
  .cm-q td.sql { font-family: var(--s2-mono); max-width: 460px; }
  .cm-q tr.open td.sql { white-space: pre-wrap; word-break: break-word; overflow: visible; text-overflow: clip; }
  .cm-q td.long { color: var(--s2-warn); font-weight: var(--font-weight-semibold, 600); }
  .cm-q td.verylong { color: var(--s2-err); font-weight: var(--font-weight-semibold, 600); }
  .cm-q tbody tr { cursor: pointer; }
  .cm-q-detail td { background: var(--s2-bg-2); white-space: normal !important; }
  .cm-q-detail .row { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--s2-fs-xs); color: var(--s2-text-2); margin-bottom: 6px; }
  html[data-display-mode="fullscreen"] .cm-q-wrap { max-height: calc(100vh - 420px) !important; }
  /* Tabs, and the overview's two columns: chart beside the node cards on wide screens. */
  .cm-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--s2-border); margin: 4px 0 12px; }
  .cm-tabs button { border: 0; border-bottom: 2px solid transparent; background: none; padding: 6px 12px; cursor: pointer;
    font-size: var(--s2-fs-sm, 13px); color: var(--s2-text-2); margin-bottom: -1px; display: inline-flex; align-items: center; gap: 6px; }
  .cm-tabs button[aria-selected="true"] { color: var(--s2-text); font-weight: var(--font-weight-semibold, 600); border-bottom-color: var(--s2-info); }
  .cm-tabs .count { font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--s2-bg-3); color: var(--s2-text-2); font-variant-numeric: tabular-nums; }
  .cm-tabs .count.busy { background: var(--s2-info-bg); color: var(--s2-info); }
  .cm-overview { display: grid; grid-template-columns: minmax(0, 3fr) minmax(300px, 2fr); gap: 12px; align-items: start; }
  .cm-overview .cm-nodes { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  @media (max-width: 1000px) { .cm-overview { grid-template-columns: minmax(0, 1fr); } }
  .cm-q-wrap.recent { max-height: 420px; }
  .cm-q td.ago, .cm-q td.ms { white-space: nowrap; }
  /* Disk / Bottomless / IO tabs */
  .cm-stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--s2-bg-3); margin-top: 8px; gap: 1px; }
  .cm-stack > span { display: block; height: 100%; min-width: 2px; }
  .cm-parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 2px 14px; margin-top: 8px; font-size: var(--s2-fs-xs); }
  .cm-part { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .cm-part .lbl { flex: 1; min-width: 0; color: var(--s2-text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cm-part strong { font-weight: var(--font-weight-medium, 500); font-variant-numeric: tabular-nums; }
  .cm-part .pct { color: var(--s2-text-3); width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
  .cm-sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .cm-total { font-variant-numeric: tabular-nums; }
  .cm-nodes.cm-wide { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
  .cm-node.compact .cm-parts { grid-template-columns: 1fr; }
  .cm-kv { display: flex; flex-direction: column; gap: 3px; margin-top: 10px; font-size: var(--s2-fs-xs); }
  .cm-kv > div { display: flex; justify-content: space-between; gap: 10px; }
  .cm-kv span { color: var(--s2-text-2); }
  .cm-kv strong { font-weight: var(--font-weight-medium, 500); font-variant-numeric: tabular-nums; text-align: right; }
  .cm-top { margin-top: 10px; font-size: var(--s2-fs-xs); }
  .cm-top-h { color: var(--s2-text-3); text-transform: uppercase; letter-spacing: .04em; font-size: 10px; margin-bottom: 2px; }
  .cm-top-r { display: flex; justify-content: space-between; gap: 10px; }
  .cm-top-r span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .cm-top-r strong { font-weight: var(--font-weight-medium, 500); font-variant-numeric: tabular-nums; flex: none; }
  /* Health / History / Backups tabs */
  .cm-hbanner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--s2-radius, 6px); margin-bottom: 10px;
    border: 1px solid var(--s2-border); font-weight: var(--font-weight-semibold, 600); }
  .cm-hbanner.critical { background: var(--s2-err-bg); color: var(--s2-err); border-color: var(--s2-err); }
  .cm-hbanner.warning { background: var(--s2-warn-bg); color: var(--s2-warn); border-color: var(--s2-warn); }
  .cm-hbanner.healthy { background: var(--s2-ok-bg); color: var(--s2-ok); border-color: var(--s2-ok); }
  .cm-issues { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
  .cm-issue { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; padding: 8px 12px; }
  .cm-issue.critical { border-left: 3px solid var(--s2-err); }
  .cm-issue.warning { border-left: 3px solid var(--s2-warn); }
  .cm-issue.info { border-left: 3px solid var(--s2-info); }
  .cm-issue .t { font-weight: var(--font-weight-semibold, 600); font-size: var(--s2-fs-sm, 13px); }
  .cm-issue .x { color: var(--s2-text-2); font-size: var(--s2-fs-xs); margin-top: 2px; }
  .cm-issue .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .cm-ev td.det { font-family: var(--s2-mono); font-size: 11px; max-width: 520px; }
  .cm-io-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 12px; }
  @media (max-width: 900px) { .cm-io-charts { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div id="root"><div class="s2-empty"><span class="s2-spinner"></span> Measuring the cluster…</div></div>
<script type="module">
const { h, fmt } = S2;
const root = document.getElementById("root");
const REFRESH_MS = 5000;

const state = {
  data: null, error: null, loading: false,
  auto: true, timer: null,
  includeInternal: false,
  tab: "overview",      // "overview" | "health" | "queries" | "disk" | "bottomless" | "io" | "history" | "backups"
  history: [],          // [{t, cpu: {nodeId: pct}}] from the server
  chart: { group: "all", hidden: new Set(), hoverT: null },
  open: new Set(),      // expanded query keys
  // Data of the Disk / Bottomless / IO tabs (their own tools, only called while the tab is open).
  extra: { disk: { data: null, error: null, loading: false, at: 0 }, bottomless: { data: null, error: null, loading: false, at: 0 },
    io: { data: null, error: null, loading: false, at: 0 }, health: { data: null, error: null, loading: false, at: 0 },
    history: { data: null, error: null, loading: false, at: 0 }, backups: { data: null, error: null, loading: false, at: 0 } },
  hist: { range: "1h", group: "all", hidden: new Set() },
  healthEvents: "problems",
  backupWarnDays: 7,
  remote: { status: null },
  ioChart: { group: "all", hidden: new Set(), disk: "rd", cache: "down" },
};

const qkey = (q) => `${q.node_id}:${q.id}`;
const level = (pct) => (pct >= 90 ? "crit" : pct >= 70 ? "warn" : "");

function shortNames(nodes) {
  // Drop the hostname prefix every node shares ("node-sas-singlestore-cluster-").
  const names = nodes.map((n) => n.host);
  let prefix = names[0] ?? "";
  for (const n of names) while (prefix && !n.startsWith(prefix)) prefix = prefix.slice(0, -1);
  prefix = prefix.slice(0, prefix.lastIndexOf("-") + 1);
  return Object.fromEntries(nodes.map((n) => [n.id, names.length > 1 && prefix ? n.host.slice(prefix.length) : n.host]));
}

function uptime(s) {
  if (s == null) return "–";
  const d = Math.floor(s / 86400), hr = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  return d ? `${d}d ${hr}h` : hr ? `${hr}h ${m}m` : `${m}m`;
}

function meter(label, value, pct, sub, extra) {
  const p = Math.max(0, Math.min(100, pct ?? 0));
  return h("div", { class: "cm-meter" },
    h("div", { class: "cm-meter-top" }, h("span", {}, label), h("strong", {}, value)),
    h("div", { class: `cm-track ${level(p)}`, role: "meter", "aria-label": label, "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": String(Math.round(p)) },
      h("span", { style: { width: `${p}%` } })),
    sub ? h("div", { class: "cm-sub" }, sub) : null,
    extra ?? null);
}

// ---------------------------------------------------------------- charts
const NS = "http://www.w3.org/2000/svg";
const SERIES = 8;
// Color follows the node (its position in the full node list), never its rank
// among the visible lines, so filtering never repaints a line.
const nodeColor = (index) => (index < SERIES ? `var(--series-${index + 1})` : "var(--s2-text-3)");
const GROUPS = [["all", "All nodes"], ["agg", "Aggregators"], ["leaf", "Leaves"]];
const inGroupOf = (chart, n) => chart.group === "all" || (chart.group === "leaf" ? n.type === "LEAF" : n.type !== "LEAF");
const inGroup = (n) => inGroupOf(state.chart, n);

function svgEl(tag, attrs = {}, text) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (text != null) el.textContent = text;
  return el;
}

function niceCeil(value) {
  const raw = value / 4;
  const p = 10 ** Math.floor(Math.log10(raw));
  const f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  return { max: Math.ceil(value / step) * step, step };
}

function timeLabel(t, withSeconds, withDay, dayOnly) {
  const d = new Date(t * 1000);
  if (dayOnly) return d.toLocaleDateString([], { weekday: "short", day: "numeric" });
  if (withDay) return d.toLocaleString([], { weekday: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", ...(withSeconds ? { second: "2-digit" } : {}) });
}

// A line chart over time, one line per series, with direct labels, crosshair and tooltip.
// plot.spec = { hist: [{t, ...}], series: [{id, name, color, get(point) -> number|null}], tick(v), value(v),
//               cap (max of the y axis, e.g. 100 for %), floor (smallest y range), what (aria text), empty, none,
//               t0 / t1 (time axis; default: the data), gapS (break a line where readings are further apart) }
function createPlot(label) {
  const plot = { el: h("div", { class: "cm-plot", tabindex: "0", "aria-label": label }), spec: null, hoverT: null, geo: null };
  let frame = 0;
  new ResizeObserver(() => { cancelAnimationFrame(frame); frame = requestAnimationFrame(() => drawSeriesPlot(plot)); }).observe(plot.el);
  const nearest = (t) => {
    const hist = plot.spec.hist;
    return hist.reduce((best, p, i) => (Math.abs(p.t - t) < Math.abs(hist[best].t - t) ? i : best), 0);
  };
  plot.el.addEventListener("pointermove", (e) => {
    const geo = plot.geo;
    if (!geo) return;
    const rect = plot.el.getBoundingClientRect();
    const px = ((e.clientX - rect.left) / rect.width) * geo.W;
    if (px < geo.l - 8 || px > geo.l + geo.pw + 8) { if (plot.hoverT != null) { plot.hoverT = null; drawSeriesPlot(plot); } return; }
    plot.hoverT = geo.t0 + ((px - geo.l) / geo.pw) * (geo.t1 - geo.t0);
    drawSeriesPlot(plot);
  });
  plot.el.addEventListener("pointerleave", () => { plot.hoverT = null; drawSeriesPlot(plot); });
  plot.el.addEventListener("keydown", (e) => {
    const hist = plot.spec?.hist ?? [];
    if (!hist.length) return;
    if (e.key === "Escape") { plot.hoverT = null; drawSeriesPlot(plot); return; }
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    let i = plot.hoverT == null ? hist.length - 1 : nearest(plot.hoverT);
    i = Math.max(0, Math.min(hist.length - 1, i + (e.key === "ArrowLeft" ? -1 : 1)));
    plot.hoverT = hist[i].t;
    drawSeriesPlot(plot);
  });
  plot.nearest = nearest;
  return plot;
}

function setPlot(plot, spec) {
  plot.spec = spec;
  drawSeriesPlot(plot);
  return plot.el;
}

function drawSeriesPlot(plot) {
  const spec = plot.spec;
  if (!spec) return;
  const { hist, series } = spec;
  const el = plot.el;
  const has = (s) => hist.some((p) => s.get(p) != null);
  if (hist.length < 2 || !series.length || !series.some(has)) {
    plot.geo = null;
    el.replaceChildren(h("div", { class: "cm-chart-empty" }, !series.length ? (spec.none ?? "No nodes selected.") : spec.empty));
    return;
  }
  const W = Math.max(320, el.clientWidth || 600);
  // Height follows the width (about 2.4 : 1) so a wide window doesn't flatten the lines.
  const maxH = S2.displayMode === "fullscreen" ? Math.max(260, Math.round(window.innerHeight * 0.5)) : (spec.maxH ?? 340);
  const H = Math.max(spec.minH ?? 200, Math.min(maxH, Math.round(W / 2.4)));
  const m = { l: spec.left ?? 40, r: spec.right ?? 104, t: 10, b: 24 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const t1 = spec.t1 ?? hist.at(-1).t, t0 = spec.t0 ?? Math.min(hist[0].t, t1 - 60);
  const x = (t) => m.l + ((t - t0) / (t1 - t0)) * pw;
  let vmax = 0;
  for (const p of hist) for (const s of series) vmax = Math.max(vmax, s.get(p) ?? 0);
  const { max: ymax, step } = niceCeil(Math.min(spec.cap ?? Infinity, Math.max(spec.floor ?? 1, vmax * 1.15)));
  const y = (v) => m.t + ph - (v / ymax) * ph;

  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img",
    "aria-label": `${spec.what} over the last ${t1 - t0 > 7200 ? `${Math.round((t1 - t0) / 3600)} hours` : `${Math.round((t1 - t0) / 60)} minutes`} for ${series.map((s) => s.name).join(", ")}; peak ${spec.value(vmax)}` });
  for (let v = 0; v <= ymax + 1e-9; v += step) {
    svg.append(svgEl("line", { class: v === 0 ? "base" : "grid", x1: m.l, x2: m.l + pw, y1: y(v), y2: y(v) }));
    svg.append(svgEl("text", { class: "tick", x: m.l - 6, y: y(v) + 4, "text-anchor": "end" }, spec.tick(v)));
  }
  const span = t1 - t0;
  const longAxis = span > 86400 * 1.5;
  // As many time labels as fit (a label is about 60-80 px wide), at most 6.
  const maxTicks = Math.max(2, Math.min(6, Math.floor(pw / (longAxis ? 80 : 64))));
  const tstep = [10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400].find((s) => span / s <= maxTicks) ?? 172800;
  // Hour steps start on local hours (and day steps on local midnight), not on UTC boundaries.
  const tz = tstep >= 3600 ? new Date(t0 * 1000).getTimezoneOffset() * 60 : 0;
  for (let t = Math.ceil((t0 - tz) / tstep) * tstep + tz; t <= t1; t += tstep) {
    svg.append(svgEl("text", { class: "tick", x: x(t), y: H - 6, "text-anchor": "middle" }, timeLabel(t, tstep < 60, longAxis, tstep >= 86400)));
  }

  const labels = [];
  for (const s of series) {
    let dpath = "", pen = false, last = null, lastT = null;
    for (const p of hist) {
      const v = s.get(p);
      if (v == null) { pen = false; continue; }
      if (spec.gapS && lastT != null && p.t - lastT > spec.gapS) pen = false;  // no readings in between: don't bridge
      lastT = p.t;
      dpath += `${pen ? "L" : "M"}${x(p.t).toFixed(1)},${y(v).toFixed(1)}`;
      pen = true;
      last = v;
    }
    if (dpath) svg.append(svgEl("path", { class: "series", d: dpath, stroke: s.color }));
    if (last != null) labels.push({ s, y: y(last), v: last });
  }
  // Direct labels at the line ends, nudged apart so they never overlap.
  labels.sort((a, b) => a.y - b.y);
  for (let k = 1; k < labels.length; k++) labels[k].y = Math.max(labels[k].y, labels[k - 1].y + 14);
  const overflow = labels.length ? labels.at(-1).y - (m.t + ph) : 0;
  if (overflow > 0) for (const l of labels) l.y -= overflow;
  for (const l of labels) {
    svg.append(svgEl("line", { x1: m.l + pw + 6, x2: m.l + pw + 16, y1: l.y, y2: l.y, stroke: l.s.color, "stroke-width": 2, "stroke-linecap": "round" }));
    svg.append(svgEl("text", { class: "label", x: m.l + pw + 20, y: l.y + 4 }, `${l.s.name} ${spec.value(l.v)}`));
  }

  // Crosshair + tooltip: snap to the nearest reading.
  const idx = plot.hoverT == null ? null : plot.nearest(plot.hoverT);
  let tip = null;
  if (idx != null) {
    const p = hist[idx], cx = x(p.t);
    svg.append(svgEl("line", { class: "cross", x1: cx, x2: cx, y1: m.t, y2: m.t + ph }));
    const rows = series.filter((s) => s.get(p) != null).sort((a, b) => (b.get(p) ?? 0) - (a.get(p) ?? 0));
    for (const s of rows) svg.append(svgEl("circle", { class: "dot", cx, cy: y(s.get(p)), r: 4, fill: s.color }));
    tip = h("div", { class: "cm-tip" },
      h("div", { class: "when" }, timeLabel(p.t, !spec.gapS || spec.gapS < 600, t1 - t0 > 3 * 3600)),
      rows.map((s) => h("div", { class: "row" },
        h("span", { class: "cm-key", style: { background: s.color } }),
        h("strong", {}, spec.value(s.get(p))),
        h("span", {}, s.name))));
    const left = cx + 14;
    tip.style.left = `${left}px`;
    requestAnimationFrame(() => { if (left + tip.offsetWidth > W - 4) tip.style.left = `${cx - tip.offsetWidth - 14}px`; });
  }
  el.replaceChildren(svg, ...(tip ? [tip] : []));
  plot.geo = { l: m.l, pw, t0, t1, W };
}

    body.append(h("tr", { class: open ? "open" : "", onclick: () => { open ? state.open.delete(k) : state.open.add(k); render(); } },

// Statements the aggregators ran in the last minute (plan cache): the many short queries that finish
// between two refreshes and so never appear under "Running now".
function recentTable(rs, names) {
  const secs = state.data.recent_seconds ?? 60;
  if (!rs.length) return h("div", { class: "s2-empty" }, `No user statements ran in the last ${secs} s`);
  const body = h("tbody");
  for (const r of rs) {
    const k = `recent:${r.node_id}:${r.database}:${r.sql}`;
    const open = state.open.has(k);
    body.append(h("tr", { class: open ? "open" : "", onclick: () => { open ? state.open.delete(k) : state.open.add(k); render(); } },
      h("td", { class: "num ago" }, r.ago_s ? `${r.ago_s}s ago` : "now"),
      h("td", { title: r.node }, names[r.node_id] ?? r.node),
      h("td", {}, r.database),
      h("td", { class: "num ms" }, r.avg_ms != null ? `${fmt.number(r.avg_ms)} ms` : "–"),
      h("td", { class: "num", title: "Runs since this plan was compiled, not only in the last minute" }, fmt.number(r.runs)),
      h("td", { class: "sql", title: open ? "" : r.sql }, r.sql)));
    if (open) {
      body.append(h("tr", { class: "cm-q-detail" }, h("td", { colspan: "6" },
        h("div", { class: "row" }, h("span", {}, `${fmt.number(r.runs)} runs since compiled`), r.rollbacks ? h("span", {}, `${fmt.number(r.rollbacks)} rolled back`) : null,
          h("span", {}, "Constants are shown as ^ (parameterized plan text)")),
        h("button", { class: "s2-btn", onclick: (e) => { e.stopPropagation(); S2.sendPrompt(`This statement ran on SingleStore (database ${r.database}, average ${r.avg_ms} ms over ${r.runs} runs since its plan was compiled). Explain what it does and whether it could be faster:\n\n${r.sql}`); } }, "Ask Claude about this statement"))));
    }
  }
  return h("div", { class: "s2-table-wrap cm-q-wrap recent" },
    h("table", { class: "s2-table cm-q" }, h("thead", {}, h("tr", {},
      ["Last run", "Node", "Database", "Avg time", "Runs", "Statement"].map((c) => h("th", { class: ["Last run", "Avg time", "Runs"].includes(c) ? "num" : "" }, c)))), body));
}

// Queued queries: show the pools and the queue in the Security view (a Workspace view, or its own window).
function openPools() {
  if (S2.embedded()) { S2.openView("security", { tab: "pools" }); return; }
  S2.openAppInBrowser("security", { tab: "pools" }).catch((err) => S2.toast(String(err.message ?? err), "err"));
}

function askAbout(q) {
  S2.sendPrompt(`This query has been running for ${q.seconds}s on SingleStore node ${q.node} (user ${q.user}, database ${q.database ?? "none"}, state "${q.state}"). Explain what it does and whether its runtime or resource use is a concern:\n\n${q.sql}`);
}

// ---------------------------------------------------------------- Disk, Bottomless and IO tabs
// Each has its own app tool, only called while the tab is open, so the overview refresh stays light.
const TAB_TOOLS = { disk: "cluster_monitor_disk", bottomless: "cluster_monitor_bottomless", io: "cluster_monitor_io",
  health: "cluster_monitor_health", history: "cluster_monitor_history", backups: "cluster_monitor_backups" };
const DISK_REFRESH_MS = 60000;  // directory sizes are measured by walking the directories: once a minute is plenty
// Tabs whose data changes slowly are refreshed less often than the overview (none of them run on open).
const TAB_MIN_MS = { disk: DISK_REFRESH_MS, health: 30000, history: 60000, backups: 60000 };
function tabArgs(tab, force) {
  if (tab === "disk") return force ? { force: true } : {};
  if (tab === "history") return { range: state.hist.range, ...(force === "sample" ? { sample_now: true } : {}) };
  if (tab === "backups") return { warn_days: state.backupWarnDays };
  return {};
}
const MBs = (b) => (b == null ? null : b / 1e6);
const mbText = (v) => (v == null ? "–" : v >= 100 ? `${v.toFixed(0)} MB/s` : v >= 1 ? `${v.toFixed(1)} MB/s` : `${v.toFixed(2)} MB/s`);
const bytesOrDash = (b) => (b == null ? "–" : fmt.bytes(b));
const agoText = (s) => s == null ? "–" : s < 90 ? `${Math.round(s)} s ago` : s < 5400 ? `${Math.round(s / 60)} min ago`
  : s < 172800 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} days ago`;
const pctOf = (a, b) => (a != null && b ? (a / b) * 100 : null);

async function refreshTab(force = false) {
  const tab = state.tab, tool = TAB_TOOLS[tab];
  if (!tool) return;
  const slot = state.extra[tab];
  if (slot.loading) return;
  if (!force && slot.data && TAB_MIN_MS[tab] && Date.now() - slot.at < TAB_MIN_MS[tab]) return;
  slot.loading = true;
  if (state.tab === tab) render();
  try {
    slot.data = await S2.callTool(tool, tabArgs(tab, force));
    slot.error = null;
    slot.at = Date.now();
  } catch (e) {
    slot.error = e;
  } finally {
    slot.loading = false;
    if (state.tab === tab) render();
  }
  // The History range changed while a read was on its way: read the range now selected.
  if (tab === "history" && !slot.error && slot.data && slot.data.range !== state.hist.range) refreshTab(true);
}

function tabStatus(slot, what) {
  if (slot.error) return h("div", { class: "s2-error", style: { marginBottom: "10px" } }, `${what} failed: ${slot.error.message}`);
  return null;
}

function stackBar(parts, total, label) {
  // parts: [{label, bytes, color}] — widths relative to total.
  return h("div", { class: "cm-stack", role: "img", "aria-label": `${label}: ${parts.map((p) => `${p.label} ${fmt.bytes(p.bytes)}`).join(", ")}` },
    parts.filter((p) => p.bytes > 0 && total > 0).map((p) => h("span", { style: { width: `${Math.max(0.4, (p.bytes / total) * 100)}%`, background: p.color }, title: `${p.label}: ${fmt.bytes(p.bytes)} (${((p.bytes / total) * 100).toFixed(1)}%)` })));
}

function legendRows(parts, total) {
  return h("div", { class: "cm-parts" }, parts.map((p) => h("div", { class: "cm-part", title: p.title ?? "" },
    h("span", { class: "cm-sw", style: { background: p.color } }),
    h("span", { class: "lbl" }, p.label),
    h("strong", {}, p.bytes == null ? "–" : fmt.bytes(p.bytes)),
    h("span", { class: "pct" }, p.bytes != null && total ? `${((p.bytes / total) * 100).toFixed(p.bytes / total < 0.01 ? 2 : 0)}%` : ""))));
}

  ["rowstore_snapshots_b", "Rowstore snapshots", "var(--series-3)", "Snapshots of the in-memory rowstore data (SNAPSHOTS_B)"],
  ["temp_blobs_b", "Temporary table blobs", "var(--series-7)", "TEMP_BLOBS_B"],
  ["other_database_files_b", "Other database files", "var(--series-5)", "OTHER_B"],
  ["user_data_unattributed_b", "Other user data", "var(--s2-border)", "user_data the per-database view doesn't explain"],
  ["plan_cache_b", "Plan cache", "var(--series-4)", "Compiled query plans on disk (plancache)"],
  ["trace_logs_b", "Trace logs", "var(--series-6)", "tracelogs"],
  ["audit_logs_b", "Audit logs", "var(--series-8)", "auditlogs"],
  ["system_files_b", "System files", "var(--s2-text-3)", "other_data: SingleStore's own system files"],

function mountCard(g, nodes, names) {
  const members = nodes.filter((n) => g.node_ids.includes(n.id));
  const parts = [
    { label: "SingleStore (these nodes)", bytes: g.singlestore_b, color: "var(--s2-info)", title: "Sum of the nodes' SingleStore directories (MV_DISK_USAGE)" },
    { label: "Other / not SingleStore", bytes: g.other_b, color: "var(--s2-warn)", title: "Used space no SingleStore node on this mount accounts for: other software, file system overhead" },
    { label: "Free", bytes: g.free_b, color: "var(--s2-bg-3)" },
  ];
  return h("div", { class: "s2-card cm-node" },
    h("div", { class: "cm-node-head" },
      h("span", { class: "cm-node-name" }, `Mount ${g.mount_point}`),
      h("span", { class: `s2-badge ${g.shared ? "info" : "plain"}` }, g.shared ? `shared by ${g.node_ids.length} nodes` : "one node"),
      g.server ? h("span", { class: "s2-badge plain", title: g.mount_names.join("\n") }, `network storage ${g.server}`) : null),
    h("div", { class: "cm-node-meta" }, g.shared
      ? `Total, used and free are for the whole file system: every node on it (${members.map((n) => names[n.id]).join(", ")}) reports the same numbers.`
      : `Used by ${members.map((n) => names[n.id]).join(", ")}.`),
    meter("Used", `${fmt.bytes(g.used_b)} of ${fmt.bytes(g.total_b)}`, pctOf(g.used_b, g.total_b), `${fmt.bytes(g.free_b)} free`),
    stackBar(parts, g.total_b, "Mount usage"),
    legendRows(parts, g.total_b),
    h("div", { class: "cm-sub" }, "SingleStore per node: ", members.map((n) => `${names[n.id]} ${fmt.bytes(n.singlestore_b)}`).join(" · ")));
}

function diskNodeCard(n, name, index, compact) {
  const u = n.usage;

  const limit = bc.limit_adjusted_b ?? bc.limit_b;
  const top = (rows, key, label) => rows.length ? h("div", { class: "cm-top" },
    h("div", { class: "cm-top-h" }, label),
    rows.slice(0, compact ? 3 : 6).map((r) => h("div", { class: "cm-top-r" },
      h("span", { class: "s2-mono", title: key(r) }, key(r)), h("strong", {}, fmt.bytes(r.bytes))))) : null;
  return h("div", { class: `s2-card cm-node${compact ? " compact" : ""}` },
    h("div", { class: "cm-node-head" },
      h("span", { class: "cm-key", style: { background: nodeColor(index) } }),
      h("span", { class: "cm-node-name", title: n.host }, name),
      h("span", { class: `s2-badge plain ${n.type === "LEAF" ? "" : "info"}` }, n.type_label),
      h("span", { class: "s2-spacer" }),
      h("strong", { class: "cm-total", title: "This node's SingleStore directories (MV_DISK_USAGE)" }, fmt.bytes(n.singlestore_b))),
    h("div", { class: "cm-node-meta" }, "This node's own SingleStore files, by type"),
    stackBar(parts, n.singlestore_b, `${name} disk use by type`),
    legendRows(parts, n.singlestore_b),
    h("div", { class: "cm-kv" },
      h("div", { title: "MV_CACHED_BLOBS (bottomless databases only); limit = maximum_blob_cache_size_mb, adjusted by the engine for low disk" },
        h("span", {}, "Blob cache (bottomless)"),
        h("strong", {}, bc.blobs ? `${fmt.bytes(bc.bytes)} of ${bytesOrDash(limit)}` : `empty · limit ${bytesOrDash(limit)}`)),
      n.spilling.used_b != null ? h("div", { title: "Disk_spilling_usage_mb / Disk_spilling_usage_limit_mb" },
        h("span", {}, "Query spilling"), h("strong", {}, `${fmt.bytes(n.spilling.used_b)}${n.spilling.limit_b ? ` of ${fmt.bytes(n.spilling.limit_b)}` : ""}`)) : null,
      n.engine_disk.uncategorized_b != null ? h("div", { title: "Disk_uncategorized_usage_mb: used space on this disk the engine doesn't attribute to this node's SingleStore files. On a shared mount this includes the other nodes' data." },
        h("span", {}, "Not this node's (engine view)"), h("strong", {}, fmt.bytes(n.engine_disk.uncategorized_b))) : null),
    compact ? null : top(n.databases, (r) => r.database, "Largest databases on this node"),
    top(n.tables, (r) => `${r.database}.${r.table}`, "Largest columnstore tables on this node"));

function diskTab(d, names) {
  const slot = state.extra.disk;
  const x = slot.data;
  const head = h("div", { class: "cm-section", style: { marginTop: 0 } },
    h("h2", {}, "Disk"),
    h("span", { class: "s2-faint s2-small" }, x ? `Directory sizes measured ${fmt.relTime(x.dirs_measured_at)} · refreshed every minute` : ""),
    h("span", { class: "s2-spacer" }),
    h("button", { class: "s2-btn", disabled: slot.loading, title: "Measure the SingleStore directories again now (takes a few seconds on network storage)",
      onclick: () => refreshTab(true) }, slot.loading ? h("span", { class: "s2-spinner" }) : null, "Measure again"));
  if (!x) return [head, tabStatus(slot, "Disk") ?? h("div", { class: "s2-empty" }, h("span", { class: "s2-spinner" }), " Measuring disk use per node…")];
  const nodeIndex = Object.fromEntries(d.nodes.map((n, i) => [n.id, i]));
  const leaves = x.nodes.filter((n) => n.type === "LEAF"), aggs = x.nodes.filter((n) => n.type !== "LEAF");
  return [head, tabStatus(slot, "Disk refresh"),
    h("div", { class: "s2-small s2-muted", style: { marginBottom: "8px" } },
      h("strong", {}, "Per mount"), " = the file system (MV_SYSINFO_DISK). ", h("strong", {}, "Per node"),
      " = that node's own SingleStore directories (MV_DISK_USAGE, split per database by MV_DATA_DISK_USAGE). Largest tables: compressed columnstore size on that node (COLUMNAR_SEGMENTS); rowstore tables live in memory and reach disk only as their database's snapshots and logs."),
    h("div", { class: "cm-nodes cm-wide" }, x.mounts.map((g) => mountCard(g, x.nodes, names))),
    h("div", { class: "cm-section" }, h("h2", {}, `Leaves (${leaves.length})`)),
    h("div", { class: "cm-nodes cm-wide" }, leaves.map((n) => diskNodeCard(n, names[n.id] ?? n.host, nodeIndex[n.id] ?? 0, false))),

    h("div", { class: "cm-nodes" }, aggs.map((n) => diskNodeCard(n, names[n.id] ?? n.host, nodeIndex[n.id] ?? 0, true))),

}

const BL_COLS = [["UPLOADED_BYTES", "Upload"], ["BLOB_CACHE_DOWNLOADED_BYTES", "Fetch"], ["BLOB_CACHE_EVICTED_BYTES", "Evict"]];

function blTable(rows, first, firstLabel) {
  const body = rows.map((r) => {

      ...BL_COLS.map(([k]) => h("td", { class: "num", title: `Total ${bytesOrDash(t[k])}` }, mbText(MBs(rt[k])))),
      ...BL_COLS.map(([k]) => h("td", { class: "num" }, bytesOrDash(t[k]))),
      h("td", { class: "num", title: "GET / PUT requests per second" }, rt.NUM_GET_REQUESTS != null ? `${rt.NUM_GET_REQUESTS.toFixed(1)} / ${(rt.NUM_PUT_REQUESTS ?? 0).toFixed(1)}` : "–"),
      h("td", { class: `num ${r.upload_lag_s > 60 ? "long" : ""}`, title: "UPLOAD_QUEUE_WAIT_SECS: how far uploads lag behind" }, r.upload_lag_s != null ? fmt.duration(r.upload_lag_s) : "–"),
      h("td", { class: "num" }, r.since_last_upload_s != null ? fmt.duration(r.since_last_upload_s) : "–"),

async function loadRemote() {
  state.remote = { status: "loading" };
  render();
  try { state.remote = { status: "ok", data: await S2.callTool("cluster_monitor_remote_stats", {}) }; }
  catch (e) { state.remote = { status: "error", error: e }; }
  render();
}

// ---- IO tab: two charts over the session (disk throughput, blob cache traffic) + statements waiting on the blob cache
const diskPlot = createPlot("Disk throughput per node");
const cachePlot = createPlot("Blob cache traffic per node");
const DISK_METRICS = [["rd", "Read"], ["wr", "Write"]];
const CACHE_METRICS = [["down", "Fetched"], ["evict", "Evicted"], ["up", "Uploaded"]];
const mbSpec = (hist, series, what, empty) => ({
  hist, series, what, empty,
  tick: (v) => `${+v.toPrecision(3)}`, value: mbText, floor: 0.1, left: 44, right: 170,
});

function ioCharts(d) {
  const io = state.ioChart;
  const x = state.extra.io.data;
  const diskCard = h("section", { class: "s2-card cm-chart", "aria-label": "Disk throughput per node" },
    h("div", { class: "cm-chart-head" },
      h("h2", {}, "Disk throughput"),
      h("span", { class: "s2-subtitle" }, "MB/s the node's SingleStore process read or wrote · per node · MV_SYSINFO_DISK"),
      h("span", { class: "s2-spacer" }),
      seg("Metric", DISK_METRICS, io.disk, (k) => { io.disk = k; render(); }),
      seg("Nodes to show", GROUPS, io.group, (k) => { io.group = k; io.hidden.clear(); render(); })),
    nodeLegend(d.nodes, io, render),
    setPlot(diskPlot, mbSpec(state.history, nodeSeries(d.nodes, io, (p, id) => MBs(p[io.disk]?.[id])),
      `Disk ${io.disk === "rd" ? "reads" : "writes"}`, "Collecting disk readings — the chart fills in as the monitor refreshes.")));
  const bl = x?.bottomless;
  const cacheCard = h("section", { class: "s2-card cm-chart", "aria-label": "Blob cache traffic per node" },
    h("div", { class: "cm-chart-head" },
      h("h2", {}, "Blob cache traffic"),
      h("span", { class: "s2-subtitle" }, "MB/s fetched from / evicted to / uploaded to remote storage · per node"),
      h("span", { class: "s2-spacer" }),
      seg("Metric", CACHE_METRICS, io.cache, (k) => { io.cache = k; render(); })),
    bl && !bl.has_bottomless
      ? h("div", { class: "cm-chart-empty" }, "No bottomless databases: the blob cache isn't used, so there is no fetch / eviction traffic.")
      : setPlot(cachePlot, mbSpec(x?.io_history ?? [], nodeSeries(d.nodes, io, (p, id) => MBs(p[io.cache]?.[id])),
        `Blob cache ${io.cache}`, "Collecting blob cache readings — the chart fills in while this tab is open.")));
  return h("div", { class: "cm-io-charts" }, diskCard, cacheCard);
}

function ioNow(d, names) {
  const rows = d.nodes.map((n) => {
    const m = n.disks[0];
    return { n, m };
  });
  const iops = rows.some(({ m }) => (m?.read_iops ?? 0) + (m?.write_iops ?? 0) > 0);
  return [h("div", { class: "s2-table-wrap" }, h("table", { class: "s2-table cm-q" },
    h("thead", {}, h("tr", {}, ["Node", "Mount", "Read", "Write", ...(iops ? ["Read IOPS", "Write IOPS"] : [])].map((c, i) => h("th", { class: i > 1 ? "num" : "" }, c)))),
    h("tbody", {}, rows.map(({ n, m }) => h("tr", {},
      h("td", { title: n.host }, names[n.id]), h("td", { class: "s2-mono" }, m?.mount_point ?? "–"),
      h("td", { class: "num" }, mbText(MBs(m?.read_bps))), h("td", { class: "num" }, mbText(MBs(m?.write_bps))),
      ...(iops ? [h("td", { class: "num" }, String(m?.read_iops ?? "–")), h("td", { class: "num" }, String(m?.write_iops ?? "–"))] : [])))))),
  iops];
}

function blobWaitTable(ws, names) {
  if (!ws.length) return h("div", { class: "s2-empty" }, "No cached plan has waited on the blob cache");
  const body = h("tbody");
  for (const w of ws) {
    const k = `bw:${w.node_id}:${w.database}:${w.sql}`;
    const open = state.open.has(k);
    body.append(h("tr", { class: open ? "open" : "", onclick: () => { open ? state.open.delete(k) : state.open.add(k); render(); } },
      h("td", { title: w.node_type }, names[w.node_id] ?? w.node_id),
      h("td", {}, w.database),
      h("td", { class: "num", title: "BLOB_CACHE_WAIT_TIME_MS: total over all execution threads and runs since the plan was compiled" }, `${fmt.number(w.wait_ms)} ms`),
      h("td", { class: "num" }, fmt.number(w.runs)),
      h("td", { class: "num", title: "AVERAGE_BLOB_CACHE_MISS_BYTES: bytes per run not in the cache, fetched from remote storage" }, bytesOrDash(w.avg_miss_bytes)),
      h("td", { class: "num ms" }, w.avg_ms != null ? `${fmt.number(w.avg_ms)} ms` : "–"),
      h("td", { class: "num ago" }, agoText(w.ago_s)),
      h("td", { class: "sql", title: open ? "" : w.sql }, w.sql)));
  }
  return h("div", { class: "s2-table-wrap cm-q-wrap recent" }, h("table", { class: "s2-table cm-q" },
    h("thead", {}, h("tr", {}, ["Node", "Database", "Cache wait", "Runs", "Avg miss", "Avg time", "Last run", "Statement"].map((c) => h("th", { class: ["Cache wait", "Runs", "Avg miss", "Avg time", "Last run"].includes(c) ? "num" : "" }, c)))), body));
}

function ioTab(d, names) {
  const slot = state.extra.io;
  const x = slot.data;
  const [nowTable, iops] = ioNow(d, names);
  return [
    h("div", { class: "cm-section", style: { marginTop: 0 } }, h("h2", {}, "IO"),
      h("span", { class: "s2-faint s2-small" }, `charts over this session (up to ${Math.round((d.history_seconds ?? 900) / 60)} min) · refreshed every ${REFRESH_MS / 1000}s`)),
    tabStatus(slot, "IO refresh"),
    ioCharts(d),
    h("div", { class: "cm-section" }, h("h2", {}, "Now"),
      h("span", { class: "s2-faint s2-small" }, iops ? "" : "IOPS not shown: the devices report no operation counts (e.g. network storage).")),
    nowTable,
    h("div", { class: "cm-kv", style: { marginTop: "8px" } },
      h("div", {}, h("span", {}, "Blob cache hit ratio"), h("strong", { title: "SingleStore 9.0 exposes no blob cache hit counter. Fetches (cache misses) are in the chart above and on the Bottomless tab." }, "not available in SingleStore 9.0"))),
    h("div", { class: "cm-section" }, h("h2", {}, "Statements waiting on the blob cache"),
      h("span", { class: "s2-faint s2-small" }, "From every node's plan cache, most total wait first. Leaf plans are the per-partition part of a query.")),
    x ? blobWaitTable(x.blob_waits ?? [], names) : h("div", { class: "s2-empty" }, h("span", { class: "s2-spinner" }), " Loading…"),
  ];
}

async function openDocs(url) {
  try { const r = await S2.app.openLink({ url }); if (r?.isError) throw new Error("refused"); }
  catch { S2.copy(url, "Docs link copied (this host can't open links)"); }
}

const SEV_TEXT = { critical: "Critical", warning: "Check", info: "Info" };

function healthCount() {
  const x = state.extra.health.data;
  return x ? x.issues.filter((i) => i.severity !== "info").length : null;
}

function issueList(issues, docsFallback, what) {
  if (!issues.length) return null;
  return h("div", { class: "cm-issues" }, issues.map((i) => h("div", { class: `s2-card cm-issue ${i.severity}` },
    h("span", { class: `s2-badge ${SEV_BADGE[i.severity] ?? "plain"}` }, SEV_TEXT[i.severity] ?? i.severity),
    h("div", {}, h("div", { class: "t" }, i.title), h("div", { class: "x" }, i.explanation,
      i.last_ago_s != null ? ` Last: ${agoText(i.last_ago_s)}.` : "")),
    h("div", { class: "acts" },
      (i.docs ?? docsFallback) ? h("button", { class: "s2-btn", title: i.docs ?? docsFallback, onclick: () => openDocs(i.docs ?? docsFallback) }, "Docs") : null,
      h("button", { class: "s2-btn", title: "Ask Claude what this means and what to check (advice only)",

        h("strong", {}, lic.expires_at ? fmt.dateTime(lic.expires_at) : "no expiry date", lic.expired ? h("span", { class: "s2-badge warn", style: { marginLeft: "6px" } }, "expired") : null)),
      h("div", { title: "Used_cluster_capacity / Maximum_cluster_capacity" }, h("span", {}, "Capacity used"),
        h("strong", {}, `${lic.used_units ?? "?"} units of ${lic.unlimited || lic.max_units == null ? "unlimited" : lic.max_units}`)),
      h("div", {}, h("span", {}, "redundancy_level"), h("strong", {}, String(x.settings.redundancy_level ?? "–"))),
      h("div", {}, h("span", {}, "leaf_failure_detection"), h("strong", {}, yes(x.settings.leaf_failure_detection) || "–")))),
  ];
}

// ---- History tab: per-node metrics kept in SQLite by the server's background sampler.
const HIST_RANGES = [["1h", "1 hour"], ["24h", "24 hours"], ["7d", "7 days"]];
const pctFmt = { tick: (v) => `${+v.toFixed(1)}%`, value: (v) => `${v.toFixed(1)}%`, cap: 100, floor: 1 };
const cntFmt = { tick: (v) => `${+v.toFixed(1)}`, value: (v) => (v >= 10 ? v.toFixed(0) : `${+v.toFixed(1)}`), floor: 1 };
const HIST_METRICS = [
  ["cpu", "SingleStore CPU", "% of each node's core limit · average per point", pctFmt],
  ["mem", "Memory", "% of max_memory", pctFmt],
  ["disk", "Disk", "% of the data mount used", pctFmt],
  ["queued", "Queued queries", "peak per point (workload manager queue)", cntFmt],
  ["running", "Running queries", "average per point", cntFmt],
  ["conns", "Connections", "client connections · average per point", cntFmt],
];
const histPlots = Object.fromEntries(HIST_METRICS.map(([k, label]) => [k, createPlot(`${label} per node, stored history`)]));

// The loaded History range as CSV: one row per point and node, the same values the charts show.
function historyCsv(x, nodes) {
  const host = Object.fromEntries(nodes.map((n) => [String(n.id), n.host]));
  const cols = [["cpu", "cpu_pct"], ["cpu_max", "cpu_max_pct"], ["mem", "memory_pct_of_max"], ["disk", "disk_pct_used"],
    ["queued", "queued_peak"], ["running", "running_avg"], ["conns", "connections_avg"]];
  const cell = (v) => (v == null ? "" : /[",\r\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v));
  const lines = [["time_utc", "node_id", "host", ...cols.map(([, name]) => name)].join(",")];
  for (const p of x.points) {
    const ids = [...new Set(cols.flatMap(([k]) => Object.keys(p[k] ?? {})))].sort((a, b) => Number(a) - Number(b));
    for (const id of ids) lines.push([new Date(p.t * 1000).toISOString(), id, host[id] ?? "", ...cols.map(([k]) => p[k]?.[id])].map(cell).join(","));
  }
  return lines.join("\r\n") + "\r\n";
}

function historyTab(d) {
  const slot = state.extra.history;
  const x = slot.data;
  const hs = state.hist;
  const st = x?.status;
  const head = h("div", { class: "cm-section", style: { marginTop: 0 } },
    h("h2", {}, "History"),
    h("span", { class: "s2-faint s2-small" }, st ? (st.enabled
      ? `sampled every ${st.interval_s} s while the server runs · kept ${st.retention_days} days (older than 24 h: 10-minute averages)${st.last_sample ? ` · last sample ${fmt.relTime(st.last_sample)}` : ""}`
      : "sampling is off (SINGLESTORE_MCP_METRICS=0): only data stored earlier is shown") : ""),
    h("span", { class: "s2-spacer" }),
    seg("Time range", HIST_RANGES, hs.range, (k) => { hs.range = k; refreshTab(true); render(); }),
    seg("Nodes to show", GROUPS, hs.group, (k) => { hs.group = k; hs.hidden.clear(); render(); }),
    h("button", { class: "s2-btn", disabled: slot.loading, title: "Take one sample now and add it to the history", onclick: () => refreshTab("sample") },
      slot.loading ? h("span", { class: "s2-spinner" }) : null, "Sample now"),
    h("button", { class: "s2-btn ghost", disabled: !x?.points?.length, title: "Save the points of this range (one row per point and node) as a CSV file",
      onclick: () => S2.download(`cluster-history-${x.range}-${new Date().toISOString().slice(0, 16).replace(/[T:]/g, "")}.csv`,
        historyCsv(x, [...d.nodes, ...x.nodes.filter((n) => !d.nodes.some((m) => m.id === n.id))]), "text/csv") }, "Export CSV"));
  if (!x) return [head, tabStatus(slot, "History") ?? h("div", { class: "s2-empty" }, h("span", { class: "s2-spinner" }), " Reading the stored history…")];
  // The live node list first (same colors as the other tabs), then nodes that only exist in the history.
  const nodes = [...d.nodes, ...x.nodes.filter((n) => !d.nodes.some((m) => m.id === n.id))];
  const stale = x.range !== hs.range;
  const now = Date.now() / 1000;
  const every = st?.interval_s ?? 60;
  const empty = x.points.length === 1
    ? `One sample so far: the lines start with the next one${st?.enabled ? ` (every ${every} s)` : " (Sample now, a minute from now)"}.`
    : st?.enabled ? `No samples for this range yet. The server stores one every ${every} s (the first about 20 s after it starts).`
      : "No samples stored, and sampling is off (SINGLESTORE_MCP_METRICS=0).";
  const cards = HIST_METRICS.map(([key, label, sub, f]) => h("section", { class: "s2-card cm-chart", "aria-label": `${label} per node` },
    h("div", { class: "cm-chart-head" }, h("h2", {}, label), h("span", { class: "s2-subtitle" }, sub)),
    setPlot(histPlots[key], { ...f, hist: x.points, series: nodeSeries(nodes, hs, (p, id) => p[key]?.[id] ?? null),
      what: label, empty, t0: now - x.range_s, t1: now, gapS: x.bucket_s * 3, left: 44, right: 140 })));
  return [head, tabStatus(slot, "History refresh"),
    stale ? h("div", { class: "s2-small s2-faint" }, h("span", { class: "s2-spinner" }), " Loading the new range…") : null,
    nodeLegend(nodes, hs, render),
    h("div", { class: "cm-io-charts" }, cards),
    h("div", { class: "s2-small s2-faint", style: { marginTop: "8px" } },
      `One point per ${x.bucket_s >= 3600 ? `${x.bucket_s / 3600} h` : x.bucket_s >= 60 ? `${x.bucket_s / 60} min` : `${x.bucket_s} s`}. `,
      "Gaps are times no server was running. Stored locally in ", h("span", { class: "s2-mono" }, st?.file ?? "metrics.db"),
      " per cluster; the Claude and the desktop Workspace server both add to it (one sample per interval).")];
}

// ---- Backups tab
const BACKUP_STATE = { ok: ["ok", "OK"], old: ["warn", "too old"], failed: ["err", "last backup failed"], never: ["plain", "no backup"], dropped: ["plain", "database dropped"] };
const mbBytes = (mb) => (mb == null ? "–" : fmt.bytes(Number(mb) * 1024 * 1024));

function backupsTab() {
  const slot = state.extra.backups;
  const x = slot.data;
  const head = h("div", { class: "cm-section", style: { marginTop: 0 } },
    h("h2", {}, "Backups"),
    h("span", { class: "s2-faint s2-small" }, "MV_BACKUP_HISTORY and MV_BACKUP_STATUS · read-only: this app never starts a backup"),
    h("span", { class: "s2-spacer" }),
    h("span", { class: "s2-small s2-muted" }, "Warn when older than"),
    seg("Warn when the last good backup is older than", [["1", "1 day"], ["7", "7 days"], ["30", "30 days"]], String(state.backupWarnDays),
      (k) => { state.backupWarnDays = Number(k); refreshTab(true); }),
    h("button", { class: "s2-btn", disabled: slot.loading, onclick: () => refreshTab(true) }, slot.loading ? h("span", { class: "s2-spinner" }) : null, "Refresh"));
  if (!x) return [head, tabStatus(slot, "Backups") ?? h("div", { class: "s2-empty" }, h("span", { class: "s2-spinner" }), " Reading the backup history…")];
  const errs = Object.entries(x.errors ?? {});
  return [head, tabStatus(slot, "Backups refresh"),
    errs.length ? h("div", { class: "s2-small s2-faint" }, "Couldn't read: ", errs.map(([k, v]) => `${k} (${v})`).join("; ")) : null,
    issueList(x.issues, x.docs.backup, "Cluster Monitor backup overview"),
    x.running.length ? h("div", { class: "cm-section" }, h("h2", {}, `Running now (${x.running.length})`)) : null,
    x.running.length ? S2.dataTable(["Database", "Status", "Rowstore", "Columnstore", "Step left", "Target"],
      x.running.map((r) => ({ Database: r.database, Status: r.status, Rowstore: r.rowstore_pct != null ? `${r.rowstore_pct}%` : "–",
        Columnstore: r.columnstore_pct != null ? `${r.columnstore_pct}%` : "–", "Step left": r.step_remaining_s != null ? fmt.duration(r.step_remaining_s) : "–", Target: r.target })),
      { maxHeight: "200px" }) : null,
    h("div", { class: "cm-section" }, h("h2", {}, `Per database (${x.databases.length})`),
      h("span", { class: "s2-faint s2-small" }, `${x.total} backup${x.total === 1 ? "" : "s"} recorded, ${x.failed_total} failed`)),
    h("div", { class: "s2-table-wrap", style: { maxHeight: "380px" } }, h("table", { class: "s2-table cm-q" },
      h("thead", {}, h("tr", {}, ["Database", "State", "Last good backup", "Age", "Type", "Size", "Took", "Backups", "Failed", "Last failure"].map((c, i) => h("th", { class: [3, 5, 6, 7, 8].includes(i) ? "num" : "" }, c)))),
      h("tbody", {}, x.databases.map((r) => {
        const ls = r.last_success, lf = r.last_failure;
        const [cls, label] = BACKUP_STATE[r.state] ?? ["plain", r.state];
        return h("tr", {},
          h("td", {}, r.database),
          h("td", {}, h("span", { class: `s2-badge ${cls}` }, label)),
          h("td", { title: ls?.path ?? "" }, ls ? String(ls.end ?? ls.start) : "–"),
          h("td", { class: `num ${r.state === "old" ? "long" : ""}` }, r.age_s != null ? agoText(r.age_s).replace(" ago", "") : "–"),
          h("td", {}, ls?.type ?? "–"),
          h("td", { class: "num" }, mbBytes(ls?.size_mb)),
          h("td", { class: "num" }, ls?.duration_s != null ? fmt.duration(ls.duration_s) : "–"),
          h("td", { class: "num" }, String(r.backups)),
          h("td", { class: `num ${r.failures ? "verylong" : ""}` }, String(r.failures)),
          h("td", { title: lf?.error ?? "" }, lf ? `${lf.end ?? lf.start}${lf.error_code ? ` · error ${lf.error_code}` : ""}` : "–"));
      })))),
    h("div", { class: "cm-section" }, h("h2", {}, "History"), h("span", { class: "s2-faint s2-small" }, "newest first, up to 200")),
    x.history.length ? S2.dataTable(["Finished", "Database", "Status", "Type", "Size", "Took", "Partitions", "Path", "Error"],
      x.history.map((r) => ({ Finished: r.end ?? r.start, Database: r.database, Status: r.status, Type: r.type ?? "", Size: mbBytes(r.size_mb),
        Took: r.duration_s != null ? fmt.duration(r.duration_s) : "–", Partitions: r.partitions, Path: r.path, Error: r.error ?? "" })), { maxHeight: "320px" })
      : h("div", { class: "s2-card", style: { padding: "14px 16px" } },
        h("div", {}, h("strong", {}, "No backups recorded on this cluster.")),
        h("div", { class: "s2-small s2-muted", style: { marginTop: "6px" } },
          "MV_BACKUP_HISTORY lists backups made with BACKUP DATABASE (full or incremental) on this cluster; CLEAR BACKUP_HISTORY empties it. ",
          "Backups taken outside SingleStore (e.g. volume snapshots in Kubernetes) don't appear here. "),
        h("button", { class: "s2-btn", style: { marginTop: "8px" }, onclick: () => openDocs(x.docs.backup) }, "Backup and restore docs")),
  ];
}

// render() rebuilds the page. One landing between a button's mousedown and mouseup (auto-refresh, or a tab's data
// arriving) replaces the button under the pointer, and the browser then fires no click: a tab or button click was
// lost now and then. Renders wait while a button is pressed (at most 1.5 s) and the last one runs right after the click.
const press = { down: false, at: 0, pending: false };
document.addEventListener("pointerdown", () => { press.down = true; press.at = Date.now(); }, true);
function release() {
  if (!press.down) return;
  press.down = false;
  if (press.pending) { press.pending = false; setTimeout(render, 0); }  // after this pointerup's click
}
for (const ev of ["pointerup", "pointercancel"]) document.addEventListener(ev, release, true);
window.addEventListener("blur", release);

function render() {
  if (press.down && Date.now() - press.at < 1500) { press.pending = true; return; }
  if (!state.data) {
    root.replaceChildren(state.error ? S2.errorBox(state.error) : h("div", { class: "s2-empty" }, h("span", { class: "s2-spinner" }), " Measuring the cluster…"));
    return;
  }
  const d = state.data;
  const names = shortNames(d.nodes);
  const versions = [...new Set(d.nodes.map((n) => n.version))].join(", ");
  const online = d.nodes.filter((n) => (n.state || "").toLowerCase() === "online").length;
  root.replaceChildren(...[
    h("div", { class: "s2-header" },
      h("div", {},
        h("h1", { class: "s2-title" }, "Cluster Monitor"),
        h("div", { class: "s2-subtitle" }, `${d.nodes.length} nodes · ${online} online · SingleStore ${versions} · CPU over ${d.sample_seconds}s · updated ${fmt.relTime(d.generated_at)}`)),
      h("span", { class: "s2-spacer" }),
      h("label", { class: "cm-auto s2-small s2-muted", title: `Refresh every ${REFRESH_MS / 1000}s` },
        h("input", { type: "checkbox", checked: state.auto, onchange: (e) => setAuto(e.target.checked) }), "Auto-refresh"),
      h("button", { class: "s2-btn", onclick: () => refresh(), disabled: state.loading },
        state.loading ? h("span", { class: "s2-spinner" }) : null, "Refresh"),
      S2.openInBrowserButton("cluster_monitor", () => ({})),
      S2.fullscreenButton()),
    state.error ? h("div", { class: "s2-error", style: { marginBottom: "10px" } }, `Refresh failed: ${state.error.message}`) : null,
    tabs(d),
    ...(state.tab === "queries" ? queriesTab(d, names) : state.tab === "disk" ? diskTab(d, names)
      : state.tab === "bottomless" ? bottomlessTab(d, names) : state.tab === "io" ? ioTab(d, names)
      : state.tab === "health" ? healthTab(d, names) : state.tab === "history" ? historyTab(d)
      : state.tab === "backups" ? backupsTab() : [
      h("div", { class: "cm-overview" },
        chartEl,
        h("div", {}, h("div", { class: "cm-nodes" }, d.nodes.map((n, i) => nodeCard(n, names[n.id], i))))),
    ]),
  ].filter(Boolean));
  if (state.tab === "overview") buildChart();
}

function tabs(d) {
  const recent = (d.recent ?? []).length;
  const tab = (key, label, count, busy) => h("button", { role: "tab", "aria-selected": String(state.tab === key),
    onclick: () => { state.tab = key; render(); refreshTab(); } }, label, count != null ? h("span", { class: `count${busy ? " busy" : ""}` }, String(count)) : null);
  return h("div", { class: "cm-tabs", role: "tablist" },
    tab("overview", "Overview"),
    tab("health", "Health", healthCount(), healthCount() > 0),
    tab("queries", "Queries", d.queries.length, d.queries.length > 0),
    tab("disk", "Disk"),
    tab("bottomless", "Bottomless"),
    tab("io", "IO"),
    tab("history", "History"),
    tab("backups", "Backups"),
    recent ? h("span", { class: "s2-faint s2-small", style: { alignSelf: "center", marginLeft: "6px" } }, `${recent} ran in the last ${d.recent_seconds ?? 60} s`) : null);
}

function queriesTab(d, names) {
  return [
    h("div", { class: "cm-section", style: { marginTop: 0 } },
      h("h2", {}, `Running now (${d.queries.length})`),
      h("span", { class: "s2-faint s2-small" }, `${d.idle_connections} idle connection${d.idle_connections === 1 ? "" : "s"} · refreshed every ${REFRESH_MS / 1000}s`),
      h("span", { class: "s2-spacer" }),
      h("label", { class: "cm-auto s2-small s2-muted", title: "Also show the work leaves do on behalf of user queries (user 'distributed')" },
        h("input", { type: "checkbox", checked: state.includeInternal, onchange: (e) => { state.includeInternal = e.target.checked; refresh(); } }),
        "Include internal leaf activity")),
    queriesTable(d.queries, names),
    h("div", { class: "cm-section" },
      h("h2", {}, `Ran in the last ${d.recent_seconds ?? 60} s (${(d.recent ?? []).length})`),
      h("span", { class: "s2-faint s2-small" }, "From the aggregators' plan caches: also the short statements that finish between two refreshes. System-view reads are left out.")),
    recentTable(d.recent ?? [], names),
  ];
}

function accept(data) {
  state.data = data;
  state.error = null;
  if (data.history) state.history = data.history;
  const live = new Set([...data.queries.map(qkey), ...(data.recent ?? []).map((r) => `recent:${r.node_id}:${r.database}:${r.sql}`)]);
  for (const k of state.open) if (!live.has(k)) state.open.delete(k);
  reportContext();
}

function reportContext() {
  const d = state.data;
  const names = shortNames(d.nodes);
  const nodeLines = d.nodes.map((n) => {
    const disk = n.disks[0];
    return `${names[n.id]} (${n.type_label}, ${n.state}): CPU ${n.cpu ? `${n.cpu.singlestore_pct}% of ${n.cpu.cores} cores` : "n/a"}, ` +
      `memory ${n.memory.max_memory_b ? Math.round((n.memory.singlestore_b / n.memory.max_memory_b) * 100) : "?"}%, ` +
      `disk ${disk && disk.total_b ? Math.round((disk.used_b / disk.total_b) * 100) : "?"}%`;
  });
  const qLines = d.queries.slice(0, 5).map((q) => `${q.seconds}s ${q.user}@${q.database ?? "-"}: ${(q.sql ?? q.command ?? "").replace(/\s+/g, " ").slice(0, 120)}`);
  S2.updateModelContext(`User is viewing the Cluster Monitor:\n${nodeLines.join("\n")}\n${d.queries.length} active queries${qLines.length ? ":\n" + qLines.join("\n") : ""}`);
}

async function refresh() {
  if (state.loading) return;
  state.loading = true;
  try {
    // The open tab's own data in parallel (Disk: at most once a minute).
    const extra = refreshTab();
    accept(await S2.callTool("cluster_monitor_data", { include_internal: state.includeInternal }));
    await extra;
  } catch (e) {
    state.error = e;
  } finally {
    state.loading = false;
    render();
  }
}

function setAuto(on) {
  state.auto = on;
  clearInterval(state.timer);
  state.timer = on ? setInterval(() => { if (!S2.isHidden()) refresh(); }, REFRESH_MS) : null;
  render();
}

S2.onDisplayModeChange = () => { if (state.data) render(); };
await S2.connect({
  name: "singlestore-cluster-monitor",
  onToolResult(result) {
    try { accept(S2.resultData(result)); } catch (e) { state.error = e; }
    render();
    refresh(); // the opening result carries no CPU history; fetch it right away
    if (state.auto && !state.timer) setAuto(true);
  },
  onToolCancelled() {
    if (!state.data) root.replaceChildren(h("div", { class: "s2-empty" }, "Cancelled."));
  },
});
</script>
</body>
</html>
