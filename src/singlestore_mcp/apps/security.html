<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security</title>
<!--S2:HEAD-->
<style>
  .sc-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--s2-border); margin: 4px 0 12px; }
  .sc-tabs button { border: 0; border-bottom: 2px solid transparent; background: none; padding: 6px 12px; cursor: pointer;
    font-size: var(--s2-fs-sm, 13px); color: var(--s2-text-2); margin-bottom: -1px; display: inline-flex; align-items: center; gap: 6px; }
  .sc-tabs button[aria-selected="true"] { color: var(--s2-text); font-weight: var(--font-weight-semibold, 600); border-bottom-color: var(--s2-info); }
  .sc-tabs .count { font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--s2-bg-3); color: var(--s2-text-2); font-variant-numeric: tabular-nums; }
  .sc-tabs .count.busy { background: var(--s2-warn-bg); color: var(--s2-warn); }
  .sc-section { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 16px 0 8px; }
  .sc-section h2 { font-size: var(--font-text-md-size, 14px); font-weight: var(--font-weight-semibold, 600); margin: 0; }
  .sc-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .sc-bar .s2-input[type="search"] { width: 220px; }
  .sc-chip { border: 1px solid var(--s2-border); background: var(--s2-bg); border-radius: 999px; padding: 2px 10px; cursor: pointer;
    font-size: var(--s2-fs-xs); color: var(--s2-text-2); display: inline-flex; gap: 5px; align-items: center; }
  .sc-chip[aria-pressed="true"] { background: var(--s2-info-bg); color: var(--s2-info); border-color: var(--s2-info); }
  .sc-chip .n { font-variant-numeric: tabular-nums; color: var(--s2-text-3); }
  .sc-chip[aria-pressed="true"] .n { color: inherit; }
  .sc-chip:disabled { opacity: .45; cursor: default; }
  .sc-notice { padding: 7px 10px; border-radius: var(--s2-radius-sm); background: var(--s2-info-bg); color: var(--s2-text-2);
    font-size: var(--s2-fs-xs); margin-bottom: 8px; }
  .sc-notice.warn { background: var(--s2-warn-bg); color: var(--s2-warn); }
  .sc-wrap { max-height: 460px; }
  html[data-display-mode="fullscreen"] .sc-wrap.tall { max-height: calc(100vh - 260px); }
  .sc-table td.mono, .sc-table td.user { font-family: var(--s2-mono); }
  .sc-table tbody tr.row { cursor: pointer; }
  .sc-table tr.open td { background: var(--s2-bg-2); }
  .sc-table td.wrap { white-space: normal; max-width: 520px; }
  .sc-flags { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .sc-flags .s2-badge { font-size: 11px; padding: 0 7px; }
  .sc-detail td { background: var(--s2-bg-2); white-space: normal !important; max-width: none !important; padding: 10px 12px 14px !important; }
  .sc-detail h3 { font-size: var(--s2-fs-xs); margin: 10px 0 5px; color: var(--s2-text-2); font-weight: var(--font-weight-semibold, 600); }
  .sc-detail h3:first-child { margin-top: 0; }
  .sc-chain { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: var(--s2-fs-xs); }
  .sc-node { font-family: var(--s2-mono); border: 1px solid var(--s2-border); border-radius: var(--s2-radius-sm); padding: 1px 6px; background: var(--s2-bg); }
  .sc-node.u { border-color: var(--s2-info); color: var(--s2-info); }
  .sc-node.g { border-style: dashed; }
  .sc-arrow { color: var(--s2-text-3); }
  .sc-how { font-size: 11px; }
  .sc-how.direct { color: var(--s2-text); }
  .sc-how.role { color: var(--s2-info); }
  .sc-how.global { color: var(--s2-warn); }
  .sc-grants { display: flex; gap: 6px; align-items: flex-start; }
  .sc-grants pre { flex: 1; max-height: 220px; overflow: auto; }
  .sc-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  @media (max-width: 1000px) { .sc-grid { grid-template-columns: minmax(0, 1fr); } }
  .sc-card { padding: 10px 12px; }
  .sc-card h2 { font-size: var(--font-text-md-size, 14px); font-weight: var(--font-weight-semibold, 600); margin: 0 0 8px; }
  .sc-privs { font-family: var(--s2-mono); font-size: 11px; color: var(--s2-text-2); }
  .sc-tag { display: inline-block; font-family: var(--s2-mono); font-size: 11px; padding: 0 5px; margin: 1px 3px 1px 0; border-radius: 4px;
    background: var(--s2-bg-3); color: var(--s2-text-2); }
  .sc-tag.user { background: var(--s2-info-bg); color: var(--s2-info); }
  .sc-tag.role { background: var(--s2-ok-bg); color: var(--s2-ok); }
  .sc-pools td.num { min-width: 52px; }
  .sc-spark { display: block; }
  .sc-spark .run { stroke: var(--s2-info); fill: none; stroke-width: 1.5; }
  .sc-spark .que { stroke: var(--s2-warn); fill: none; stroke-width: 1.5; }
  .sc-res { display: grid; grid-template-columns: auto auto; gap: 1px 8px; font-size: 11px; font-variant-numeric: tabular-nums; }
  .sc-res .lack { color: var(--s2-err); font-weight: var(--font-weight-semibold, 600); }
  .sc-key { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .sc-auto { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  /* v2: change panel (preview + confirmation) */
  .sc-acts { display: inline-flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .sc-acts .s2-btn, .sc-mini { padding: 0 7px; font-size: 11px; }
  .sc-chg { border: 1px solid var(--s2-info); border-radius: var(--s2-radius-sm, 6px); background: var(--s2-bg); padding: 12px 14px; margin: 4px 0 12px; }
  .sc-chg.danger { border-color: var(--s2-err); }
  .sc-chg h2 { font-size: var(--font-text-md-size, 14px); font-weight: var(--font-weight-semibold, 600); margin: 0; }
  .sc-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 12px; margin: 10px 0; }
  .sc-f { display: flex; flex-direction: column; gap: 3px; font-size: var(--s2-fs-xs); color: var(--s2-text-2); }
  .sc-f .s2-input { width: 100%; box-sizing: border-box; }
  .sc-f.wide { grid-column: 1 / -1; }
  .sc-fixed { font-family: var(--s2-mono); color: var(--s2-text); padding: 4px 0; }
  .sc-privpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 2px 10px; max-height: 180px; overflow: auto;
    border: 1px solid var(--s2-border); border-radius: var(--s2-radius-sm, 6px); padding: 6px 8px; }
  .sc-privpick label { display: flex; gap: 5px; align-items: center; font-family: var(--s2-mono); font-size: 11px; color: var(--s2-text); cursor: pointer; }
  .sc-stmts { margin: 6px 0; }
  .sc-confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .sc-confirm .s2-input { width: 220px; }
  .sc-res-list { margin: 6px 0 0; padding-left: 18px; font-size: var(--s2-fs-xs); }
  .sc-res-list .ok { color: var(--s2-ok); }
  .sc-res-list .error { color: var(--s2-err); }
  .sc-steps { display: flex; gap: 6px; align-items: flex-start; margin: 4px 0 10px; }
  .sc-steps pre { flex: 1; margin: 0; }
</style>
</head>
<body>
<div id="root"><div class="s2-empty"><span class="s2-spinner"></span> Reading users and privileges…</div></div>
<script type="module">
const { h, fmt } = S2;
const root = document.getElementById("root");
const POOL_REFRESH_MS = 5000;

const FLAGS = {
  all: ["ALL on *.*", "err", "SHOW GRANTS has ALL PRIVILEGES ON *.*"],
  super: ["SUPER", "err", "Has the SUPER privilege (directly or through a role)"],
  grant_option: ["grant option", "warn", "Global privileges WITH GRANT OPTION: can pass them on to others"],
  any_host: ["host %", "warn", "Can connect from any host"],
  no_pw_expiry: ["no expiry", "plain", "PASSWORD_EXPIRATION is NULL: password_expiration_seconds isn't enabled, so the password never expires"],
  locked: ["locked", "err", "ACCOUNT_STATUS = LOCKED (failed logins exceeded the limit)"],
  unused: ["unused", "warn", "No traced query in the local Query History store for the chosen number of days"],
};

const state = {
  tab: "users",
  users: null, roles: null, pools: null,
  errors: {}, loading: {},
  // Users tab
  search: "", flags: new Set(), unusedDays: 90, openUser: null, detail: {}, detailErr: {},
  // Roles tab
  roleSearch: "", onlyUsed: true, whoDb: "", whoTable: "", whoTables: [], who: null, whoErr: null, whoLoading: false,
  // Pools tab
  auto: true, timer: null,
  // Audit tab
  audit: null,
  // v2: what the connected user may change (security_admin_capabilities)
  cap: null, capErr: null,
};
const ukey = (u) => `${u.user}@${u.host}`;
const qid = (s) => `'${String(s).replace(/\\/g, "\\\\").replace(/'/g, "''")}'`;
const acct = (user, host) => `${qid(user)}@${qid(host)}`;
const bt = (s) => "`" + String(s).replace(/`/g, "``") + "`";

// ---------------------------------------------------------------- loading
const LOADERS = {
  users: () => S2.callTool("security_users", { unused_days: state.unusedDays }),
  roles: () => S2.callTool("security_roles", {}),
  pools: () => S2.callTool("security_pools", {}),
  audit: () => S2.callTool("security_audit", {}),
};

async function load(tab, quiet) {
  if (state.loading[tab]) return;
  state.loading[tab] = true;
  if (!quiet) render();
  try {
    state[tab] = await LOADERS[tab]();
    delete state.errors[tab];
    if (tab === "roles" && !state.whoDb && state.roles.databases?.length) state.whoDb = state.roles.databases.find((d) => d !== "information_schema") ?? "";
  } catch (e) {
    state.errors[tab] = e;
  } finally {
    state.loading[tab] = false;
    render();
    reportContext();
  }
}

function setTab(tab) {
  state.tab = tab;
  if (!state[tab] && !state.loading[tab]) load(tab);
  syncTimer();
  render();
  reportContext();
}

function syncTimer() {
  clearInterval(state.timer);
  state.timer = state.tab === "pools" && state.auto ? setInterval(() => { if (!S2.isHidden()) load("pools", true); }, POOL_REFRESH_MS) : null;
}

// ---------------------------------------------------------------- shell
function render() {
  const t = state.tab;
  const queued = state.pools ? state.pools.queue.length : null;
  const tab = (key, label, count, busy) => h("button", { role: "tab", "aria-selected": String(t === key), onclick: () => setTab(key) },
    label, count != null ? h("span", { class: `count${busy ? " busy" : ""}` }, String(count)) : null);
  const me = state.users?.me;
  const kids = [
    h("div", { class: "s2-header" },
      h("div", {}, h("h1", { class: "s2-title" }, "Security"),
        h("div", { class: "s2-subtitle" }, `${me ? `Connected as ${me.user}@${me.host} · ` : ""}${canChange()
          ? "changes show the exact SQL first and run only after you confirm"
          : "read-only: nothing is granted or changed from here; copy the SQL shown and run it yourself"}`)),
      h("span", { class: "s2-spacer" }),
      h("button", { class: "s2-btn", disabled: state.loading[t], onclick: () => { if (t === "users") state.detail = {}; load(t); } },
        state.loading[t] ? h("span", { class: "s2-spinner" }) : null, "Refresh"),
      S2.openInBrowserButton("security", () => ({ tab: state.tab })),
      S2.fullscreenButton()),
    h("div", { class: "sc-tabs", role: "tablist" },
      tab("users", "Users", state.users?.users?.length ?? null),
      tab("roles", "Roles & groups", state.roles ? state.roles.roles.length : null),
      tab("pools", "Resource pools", queued, queued > 0),
      tab("audit", "Audit log", null)),
    chgEl,
    state.errors[t] ? h("div", { class: "s2-error", style: { marginBottom: "8px" } }, String(state.errors[t].message ?? state.errors[t])) : null,
    ...(state[t] ? { users: usersTab, roles: rolesTab, pools: poolsTab, audit: auditTab }[t]() :
      state.errors[t] ? [] : [h("div", { class: "s2-empty" }, h("span", { class: "s2-spinner" }), " Loading…")]),
  ].filter(Boolean);
  // The change panel stays in place (re-rendering around it), so typing in it survives the 5 s pool refresh.
  if (chgEl.parentNode !== root) { root.replaceChildren(...kids); return; }
  const i = kids.indexOf(chgEl);
  while (chgEl.previousSibling) chgEl.previousSibling.remove();
  while (chgEl.nextSibling) chgEl.nextSibling.remove();
  chgEl.before(...kids.slice(0, i));
  chgEl.after(...kids.slice(i + 1));
}

// ---------------------------------------------------------------- Users tab
const userSearch = h("input", { class: "s2-input", type: "search", placeholder: "Filter users, groups…", "aria-label": "Filter users",
  oninput: (e) => { state.search = e.target.value; render(); requestAnimationFrame(() => { userSearch.focus(); }); } });

function usersTab() {
  const d = state.users;
  if (d.mode === "limited") return limitedView(d);
  const q = state.search.trim().toLowerCase();
  const list = d.users.filter((u) => (!q || ukey(u).toLowerCase().includes(q) || u.groups.some((g) => g.toLowerCase().includes(q))
    || (u.default_pool ?? "").toLowerCase().includes(q)) && [...state.flags].every((f) => u.flags.includes(f)));
  const hist = d.history ?? {};
  const covers = hist.covers_days;
  return [
    h("div", { class: "sc-bar" }, userSearch,
      Object.entries(FLAGS).map(([f, [label, , title]]) => {
        const n = d.users.filter((u) => u.flags.includes(f)).length;
        return h("button", { class: "sc-chip", title, "aria-pressed": String(state.flags.has(f)), disabled: !n && !state.flags.has(f),
          onclick: () => { state.flags.has(f) ? state.flags.delete(f) : state.flags.add(f); render(); } }, label, h("span", { class: "n" }, String(n)));
      }),
      h("span", { class: "s2-spacer" }),
      h("label", { class: "s2-small s2-muted" }, "Unused after ",
        h("select", { class: "s2-input", onchange: (e) => { state.unusedDays = Number(e.target.value); load("users"); } },
          [30, 60, 90, 180, 365].map((n) => h("option", { value: String(n), selected: n === state.unusedDays }, `${n} days`)))),
      actBtn("+ New user", { action: "create_user", host: "%" }, { cls: "primary" })),
    capNotice(),
    h("div", { class: "sc-notice" },
      `"Unused" reads the local Query History store (${hist.source ?? "this connection"}): ${hist.note ?? ""} `,
      hist.error ? `It couldn't be read: ${hist.error}. ` :
        covers == null ? "It holds no queries yet, so unused accounts can't be told. " :
        `It covers ${covers} day${covers === 1 ? "" : "s"} (since ${fmt.dateTime(hist.oldest)})` +
          (covers < state.unusedDays ? `, less than ${state.unusedDays}: users without queries there show "–", not unused. ` : ". "),
      d.password_expiration_seconds != null ? `password_expiration_seconds = ${d.password_expiration_seconds}.` : ""),
    Object.keys(d.errors ?? {}).length ? h("div", { class: "sc-notice warn" }, "Some views couldn't be read: " +
      Object.entries(d.errors).map(([k, v]) => `${k} (${v})`).join("; ")) : null,
    usersTable(list),
  ];
}

function limitedView(d) {
  return [
    h("div", { class: "sc-notice warn" }, d.notice),
    h("div", { class: "s2-card sc-card" },
      h("h2", {}, `${d.me.user}@${d.me.host}`),
      h("div", { class: "sc-chain" }, h("span", { class: "sc-node u" }, `${d.me.user}@${d.me.host}`),
        d.groups.length ? [h("span", { class: "sc-arrow" }, "→ groups"), d.groups.map((g) => h("span", { class: "sc-node g" }, g))] : h("span", { class: "s2-faint" }, "no groups"),
        d.roles.length ? [h("span", { class: "sc-arrow" }, "→ roles"), d.roles.map((r) => h("span", { class: "sc-node" }, r))] : null),
      h("h3", { class: "s2-small s2-muted" }, "SHOW GRANTS (password hash hidden)"),
      grantsBlock(d.grants)),
  ];
}

function grantsBlock(lines) {
  const text = (lines ?? []).map((l) => `${l};`).join("\n");
  return h("div", { class: "sc-grants" }, h("pre", { class: "s2-pre" }, text || "(none)"),
    h("button", { class: "s2-btn", onclick: (e) => { e.stopPropagation(); S2.copy(text, "Grants copied"); } }, "Copy"));
}

function pwCell(u) {
  if (String(u.type).toUpperCase() === "JWT") return h("span", { class: "s2-faint", title: "JWT users sign in with a token" }, "JWT");
  const age = u.password_age_days;
  const exp = u.password_expires_in_s;
  return h("span", { title: `Password changed ${fmt.dateTime(u.password_updated)}` },
    age == null ? "–" : `${age} d`, exp != null ? h("span", { class: "s2-faint" }, ` · expires in ${fmt.duration(exp)}`) : null);
}

function usersTable(list) {
  if (!list.length) return h("div", { class: "s2-empty" }, "No users match.");
  const cols = ["User", "Type", "Status", "Conns", "Password age", "Default pool", "Groups", "Last traced query", "Flags"];
  const body = h("tbody");
  for (const u of list) {
    const k = ukey(u);
    const open = state.openUser === k;
    body.append(h("tr", { class: `row${open ? " open" : ""}`, onclick: () => toggleUser(u) },
      h("td", { class: "user", title: k }, u.user, h("span", { class: "s2-faint" }, `@${u.host}`), u.is_local ? h("span", { class: "s2-faint", title: "IS_LOCAL: local to the node, not a distributed user" }, " (local)") : null),
      h("td", {}, u.type),
      h("td", { title: `EFFECTIVE_FAILED_LOGIN_ATTEMPTS ${u.failed_login_attempts ?? "?"} · EFFECTIVE_PASSWORD_LOCK_TIME ${u.password_lock_time ?? "?"} ms` },
        h("span", { class: `s2-badge ${String(u.account_status).toUpperCase() === "LOCKED" ? "err" : "plain"}` }, u.account_status ?? "?"),
        u.failed_login_attempts ? h("span", { class: "s2-faint" }, ` ${u.failed_login_attempts} failed`) : null),
      h("td", { class: "num" }, String(u.connections)),
      h("td", {}, pwCell(u)),
      h("td", { class: u.default_pool ? "mono" : "null" }, u.default_pool ?? "–"),
      h("td", { title: u.groups.join(", ") }, u.groups.length ? `${u.groups.length}: ${u.groups.slice(0, 2).join(", ")}${u.groups.length > 2 ? " …" : ""}` : "–"),
      h("td", { title: u.last_seen ? `${u.history_queries} traced queries in the store` : "" },
        u.last_seen ? fmt.relTime(u.last_seen) : u.unused === true ? h("span", { class: "s2-faint" }, "none") : h("span", { class: "s2-faint" }, "–")),
      h("td", {}, h("span", { class: "sc-flags" }, u.flags.map((f) => h("span", { class: `s2-badge ${FLAGS[f][1]}`, title: FLAGS[f][2] }, FLAGS[f][0])),
        u.all_checked === false ? h("span", { class: "s2-faint", title: "SHOW GRANTS couldn't be read for this user, so ALL PRIVILEGES wasn't checked" }, "?") : null))));
    if (open) body.append(h("tr", { class: "sc-detail" }, h("td", { colspan: String(cols.length) }, userDetail(u))));
  }
  return h("div", { class: "s2-table-wrap sc-wrap tall" },
    h("table", { class: "s2-table sc-table" }, h("thead", {}, h("tr", {}, cols.map((c) => h("th", { class: c === "Conns" ? "num" : "" }, c)))), body));
}

async function toggleUser(u) {
  const k = ukey(u);
  state.openUser = state.openUser === k ? null : k;
  render();
  if (state.openUser && !state.detail[k]) {
    try { state.detail[k] = await S2.callTool("security_user_detail", { user: u.user, host: u.host }); delete state.detailErr[k]; }
    catch (e) { state.detailErr[k] = e; }
    render();
    reportContext();
  }
}

function privLevel(obj) {
  // "*.*", "db.*", "db.table" -> GRANT/REVOKE priv_level
  const m = /^(.*?)\.(.*)$/.exec(obj);
  if (!m) return obj;
  return `${m[1] === "*" ? "*" : bt(m[1])}.${m[2] === "*" ? "*" : bt(m[2])}`;
}

// Copy-only SQL that would take these privileges away along one path ("direct" or "via role R ← group G").
function revokeFor(privs, object, scope, how, d) {
  const list = privs.join(", ");
  if (how === "direct") {
    return scope === "column" ? [] : [["⧉ REVOKE", `REVOKE ${list} ON ${privLevel(object)} FROM ${acct(d.user, d.host)};`, "Removes these privileges from the user"]];
  }
  const m = /^via role (.+) ← group (.+)$/.exec(how);
  if (!m) return [];
  return [
    ["⧉ REVOKE GROUP", `REVOKE GROUP ${qid(m[2])} FROM ${acct(d.user, d.host)};`, `Takes the user out of group ${m[2]}: removes everything that group gives the user`],
    ["⧉ FROM ROLE", `REVOKE ${list} ON ${privLevel(object)} FROM ROLE ${qid(m[1])};`, `Removes the privileges from role ${m[1]}: affects every group and user with that role`],
  ];
}

function userDetail(u) {
  const k = ukey(u);
  const d = state.detail[k];
  if (state.detailErr[k]) return S2.errorBox(state.detailErr[k]);
  if (!d) return h("div", { class: "s2-small s2-muted" }, h("span", { class: "s2-spinner" }), " Reading privileges…");
  const roles = [...new Set(d.chain.map(([, r]) => r))];
  return h("div", {},
    h("h3", {}, "Membership"),
    h("div", { class: "sc-chain" }, h("span", { class: "sc-node u" }, `${d.user}@${d.host}`),
      d.groups.length ? d.groups.map((g) => [h("span", { class: "sc-arrow" }, "→"), h("span", { class: "sc-node g", title: "group" }, g),
        h("span", { class: "sc-arrow" }, "→"), ...(d.chain.filter(([cg]) => cg === g).map(([, r]) => h("span", { class: "sc-node", title: "role" }, r))),
        d.chain.some(([cg]) => cg === g) ? null : h("span", { class: "s2-faint" }, "(no roles)"), h("span", { style: { width: "12px" } })])
        : h("span", { class: "s2-faint" }, "not in any group: only direct grants apply")),
    h("h3", {}, `Effective privileges (${d.effective.length})`),

function spark(hist, pool) {
  const pts = hist.map((p) => [p.t, p.running?.[pool], p.queued?.[pool]]).filter((p) => p[1] != null || p[2] != null);
  if (pts.length < 2) return h("span", { class: "s2-faint s2-small" }, "collecting…");
  const W = 110, H = 26;
  const t0 = pts[0][0], t1 = pts.at(-1)[0] || t0 + 1;
  const max = Math.max(1, ...pts.map((p) => Math.max(p[1] ?? 0, p[2] ?? 0)));
  const path = (i) => pts.map((p, k) => `${k ? "L" : "M"}${(((p[0] - t0) / Math.max(1, t1 - t0)) * (W - 2) + 1).toFixed(1)},${(H - 2 - ((p[i] ?? 0) / max) * (H - 4)).toFixed(1)}`).join("");
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("class", "sc-spark"); s.setAttribute("width", W); s.setAttribute("height", H); s.setAttribute("viewBox", `0 0 ${W} ${H}`);
  s.setAttribute("role", "img"); s.setAttribute("aria-label", `Running and queued queries in ${pool}, peak ${max}`);
  for (const [i, cls] of [[1, "run"], [2, "que"]]) {

    p.setAttribute("d", path(i)); p.setAttribute("class", cls); s.append(p);
  }
  return h("span", { title: `Running (blue) and queued (orange) over the last ${Math.round((t1 - t0) / 60)} min, peak ${max}` }, s);
}

// Shown once per tab when the connected user can't change anything: why the change buttons are missing.

// A change button: hidden when the user can't change anything, disabled (with the reason) when it lacks this privilege.
function actBtn(label, action, opts = {}) {
  if (!canChange()) return null;

  return h("button", { class: `s2-btn ${opts.cls ?? ""}`, disabled: !c?.ok, title: c?.ok ? `${TITLES[action.action]}: preview the SQL, then confirm` : c?.reason,

// "*.*" / "db.*" / "db.t" (+ scope) -> { level, database, table } for a prefilled grant/revoke.
function levelOf(object, scope) {
  if (scope === "global" || object === "*.*") return { level: "global" };
  const m = /^(.*?)\.(.*)$/.exec(object);
  if (!m) return { level: "database", database: object };
  return m[2] === "*" ? { level: "database", database: m[1] } : { level: "table", database: m[1], table: m[2] };
}

function openChange(action) {
  const a = structuredClone(action);
  if (a.privileges) a.privileges = a.privileges.map((p) => p.toUpperCase()).filter((p) => (state.cap?.privileges ?? []).includes(p));
  chg = { action: a, plan: null, planErr: null, busy: false, result: null, runErr: null, typed: "", ack: false, tables: [], fixedUser: a.user != null };
  pwInput = a.action === "create_user" ? h("input", { class: "s2-input", type: "password", autocomplete: "new-password", "aria-label": "Password",
    spellcheck: "false", oninput: () => updateRun() }) : null;
  if (a.database && a.level === "table") loadChgTables();
  renderChange();
  render();
  chgEl.scrollIntoView({ block: "nearest" });
  reportContext();
}

function closeChange() {
  if (pwInput) pwInput.value = "";
  pwInput = null;
  chg = null;
  chgEl.replaceChildren();
  render();
  reportContext();
}

function setField(key, value) {
  chg.action[key] = value;
  chg.plan = chg.planErr = chg.result = chg.runErr = null;
  chg.typed = ""; chg.ack = false;
  renderChange();
}

// The action as sent to the server: UI-only keys and empty fields removed. Never holds a password.
function payload() {
  const a = { ...chg.action };
  const level = a.level;
  delete a.level;
  if (["grant", "revoke"].includes(a.action)) {
    if (level === "global") { delete a.database; delete a.table; }
    if (level === "database") delete a.table;
  }
  if (a.grantee_type === "role") { delete a.user; delete a.host; } else if (a.grantee_type === "user") delete a.role;
  if (a.settings) a.settings = Object.fromEntries(Object.entries(a.settings).filter(([, v]) => v !== "" && v != null).map(([k, v]) => [k, Number(v)]));
  for (const [k, v] of Object.entries(a)) if (v === "" || v == null) delete a[k];
  delete a.password;
  return a;
}

async function loadChgTables() {
  chg.tables = [];
  if (!chg.action.database) return;
  const forDb = chg.action.database;
  try {
    const t = (await S2.callTool("security_tables", { database: forDb })).tables;
    if (chg && chg.action.database === forDb) { chg.tables = t; renderChange(); }
  } catch { /* the table picker stays empty */ }
}

const groupF = () => selectF("group", "Group", [["", "Pick a group"], ...(state.cap?.pick.groups ?? []).map((g) => [g, g])]);

function poolSettingFields(current) {

function formFields() {

// ---- preview, confirm, run
async function previewChange() {
  chg.busy = true; chg.plan = chg.planErr = chg.result = chg.runErr = null; chg.typed = ""; chg.ack = false;
  renderChange();
  try { chg.plan = await S2.callTool("security_change_plan", { action: payload() }); }
  catch (e) { if (chg) chg.planErr = e; }
  if (!chg) return;
  chg.busy = false;
  renderChange();
  reportContext();
}

let runBtn = null;
function ready() {
  if (!chg?.plan || chg.plan.blockers.length || chg.busy || chg.result?.ok) return false;
  if (pwInput && !pwInput.value) return false;
  return chg.plan.confirm.typed ? chg.typed.trim() === chg.plan.confirm.phrase : chg.ack;
}
function updateRun() { if (runBtn) runBtn.disabled = !ready(); }

async function runChange() {
  if (!ready()) return;
  chg.busy = true; chg.runErr = null;
  renderChange();
  const args = { action: payload(), confirm: true };
  if (chg.plan.confirm.typed) args.typed_confirmation = chg.typed.trim();
  if (pwInput) args.password = pwInput.value;
  try {
    chg.result = await S2.callTool("security_change_apply", args);
    if (chg.result.ok && pwInput) pwInput.value = "";
  } catch (e) { chg.runErr = e; }
  finally { delete args.password; }
  chg.busy = false;
  renderChange();
  const refresh = chg.result?.refresh ?? [];
  if (refresh.includes("users")) state.detail = {};
  for (const t of refresh) if (state[t]) load(t, true);
  loadCap();
  if (chg.result) S2.toast(chg.result.ok ? `${chg.result.title}: done` : `${chg.result.title}: failed`, chg.result.ok ? "" : "err");
  reportContext();
}

function renderChange() {
  if (!chg) { chgEl.replaceChildren(); return; }
  const a = chg.action;
  const p = chg.plan;
  const danger = a.action.startsWith("drop_") || a.action === "revoke_all" || p?.confirm?.typed;
  runBtn = h("button", { class: `s2-btn ${danger ? "danger" : "primary"}`, disabled: true, onclick: runChange },
    chg.busy && p ? h("span", { class: "s2-spinner" }) : null, chg.result?.ok ? "Done" : "Run");
  const stmtText = (p?.statements ?? []).join("\n");
  chgEl.replaceChildren(h("div", { class: `sc-chg${danger ? " danger" : ""}`, role: "dialog", "aria-label": TITLES[a.action] },
    h("div", { class: "sc-bar" }, h("h2", {}, TITLES[a.action]), h("span", { class: "s2-spacer" }),
      h("button", { class: "s2-btn ghost", onclick: closeChange, title: "Close (Esc)" }, chg.result?.ok ? "Close" : "Cancel")),
    h("div", { class: "sc-form" }, formFields()),
    h("div", { class: "sc-bar" },
      h("button", { class: "s2-btn", disabled: chg.busy, onclick: previewChange }, chg.busy && !p ? h("span", { class: "s2-spinner" }) : null,
        p ? "Preview again" : "Preview SQL"),
      h("span", { class: "s2-small s2-faint" }, "Nothing runs until you confirm the exact statements.")),
    chg.planErr ? S2.errorBox(chg.planErr) : null,
    p ? [
      h("div", { class: "sc-steps sc-stmts" }, h("pre", { class: "s2-pre", "aria-label": "Statements to run" }, stmtText || "(no statements)"),
        h("button", { class: "s2-btn", onclick: () => S2.copy(stmtText, "Statements copied") }, "Copy")),
      p.blockers.map((b) => h("div", { class: "s2-error", style: { marginBottom: "6px" } }, b)),
      p.warnings.map((w) => h("div", { class: "sc-notice warn" }, w)),
      !p.blockers.length && !chg.result?.ok ? h("div", { class: "sc-confirm" },
        p.confirm.typed
          ? [h("span", { class: "s2-small" }, `Type `, h("strong", { class: "s2-mono" }, p.confirm.phrase), ` to confirm (${p.confirm.reasons.join("; ")}):`),
            h("input", { class: "s2-input", "aria-label": "Type the name to confirm", value: chg.typed, spellcheck: "false",
              oninput: (e) => { chg.typed = e.target.value; updateRun(); } })]
          : h("label", { class: "sc-auto s2-small" }, h("input", { type: "checkbox", "aria-label": "I have checked the statements", checked: chg.ack,
              onchange: (e) => { chg.ack = e.target.checked; updateRun(); } }), `I've checked the statement${p.statements.length === 1 ? "" : "s"} above: run ${p.statements.length === 1 ? "it" : "them"}`),
        pwInput && !pwInput.value ? h("span", { class: "s2-small s2-faint" }, "Enter the password first.") : null,
        runBtn) : null,
    ] : null,
    chg.runErr ? S2.errorBox(chg.runErr) : null,
    chg.result ? h("ul", { class: "sc-res-list", "aria-label": "Result" }, chg.result.results.map((r) =>
      h("li", { class: r.status }, `${r.status}: ${r.statement}`, r.error ? ` – ${r.error}` : ""))) : null));
  updateRun();
}

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && chg && !chg.busy) { e.preventDefault(); closeChange(); }

    h("div", { class: "s2-small s2-muted" }, d.kubernetes_operator ? "Or with SingleStore Tools (Toolbox):" : "With the Kubernetes Operator: in the MemsqlCluster custom resource"),
    stepsBlock(d.kubernetes_operator ? d.steps.toolbox : d.steps.operator),
    h("ul", { class: "s2-small s2-faint", style: { margin: "6px 0 0", paddingLeft: "18px" } }, (d.notes ?? []).map((n) => h("li", {}, n))),
  ];
}

// ---------------------------------------------------------------- model context, host wiring
function reportContext() {
  const parts = [`User is viewing the Security view, tab "${state.tab}". Changes are made only in the view, after the user confirms the previewed SQL.`];
  if (state.tab === "users" && state.users?.users) {
    const flagged = state.users.users.filter((u) => u.flags.length).slice(0, 20).map((u) => `${ukey(u)} [${u.flags.join(", ")}]`);
    parts.push(`${state.users.users.length} users${flagged.length ? `; flagged: ${flagged.join("; ")}` : ""}.`);
    if (state.openUser) parts.push(`Selected user: ${state.openUser}.`);
  }
  if (state.tab === "roles" && state.who) parts.push(`Looked up who can access ${state.who.database}${state.who.table ? "." + state.who.table : ""}: ${state.who.users_with_access} users.`);
  if (state.tab === "pools" && state.pools) parts.push(`${state.pools.pools.length} pools; ${state.pools.queue.length} queries queued now.`);
  if (state.tab === "audit" && state.audit) parts.push(`Audit logging is ${state.audit.enabled ? `on (${state.audit.level})` : "off"}; the log is files on the nodes, not readable through SQL.`);
  if (chg) {
    parts.push(`The user has the change panel open: ${TITLES[chg.action.action]}.`);
    if (chg.plan) parts.push(`Previewed statements (not run unless the user confirms in the panel):\n${chg.plan.statements.join("\n")}`);
    if (chg.result) parts.push(`Result: ${chg.result.ok ? "done" : "failed"}.`);
  }
  S2.updateModelContext(parts.join("\n"));
}

function accept(result) {
  const p = S2.resultData(result);
  if (p.kind === "user") {
    const d = p.data;
    state.tab = "users";
    state.openUser = `${d.user}@${d.host}`;
    state.detail[state.openUser] = d;
  } else if (p.kind === "who") {
    state.tab = "roles";
    state.who = p.data;
    state.whoDb = p.data.database;
    state.whoTable = p.data.table ?? "";
  } else if (p.kind === "tab" && p.data) {
    state.tab = p.tab;
    state[p.tab] = p.data;
    if (p.tab === "roles" && !state.whoDb && p.data.databases?.length) state.whoDb = p.data.databases.find((x) => x !== "information_schema") ?? "";
  }
}

window.addEventListener("s2:connection-changed", () => {
  if (chg) closeChange();
  state.users = state.roles = state.pools = state.who = state.audit = state.cap = null;
  loadCap();
  state.detail = {}; state.openUser = null;
  load(state.tab);
});
// The Workspace can hand over a tab ("s2-open-view" with {tab}) when the view is already open.
window.addEventListener("s2:set-sql", (e) => { if (e.detail?.tab && LOADERS[e.detail.tab]) setTab(e.detail.tab); });

let started = false;
S2.onDisplayModeChange = () => render();
await S2.connect({
  name: "singlestore-security",
  onToolInput(args) { if (args?.tab && LOADERS[args.tab]) state.tab = args.tab; },
  onToolResult(result) {
    if (started) return;
    started = true;
    try { accept(result); } catch (e) { state.errors[state.tab] = e; }
    if (!state[state.tab]) load(state.tab); else render();
    if (state.tab === "roles" && state.whoDb && !state.whoTables.length) loadTables();
    if (state.tab === "pools") load("pools", true);  // the opening result has no history yet
    loadCap();
    syncTimer();
    reportContext();
  },
  onToolCancelled() { if (!state[state.tab]) root.replaceChildren(h("div", { class: "s2-empty" }, "Cancelled.")); },
});
</script>
</body>
</html>
