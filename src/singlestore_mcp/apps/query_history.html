      trendChart("Total runtime", per, series, (p) => p.total_ms / 1000, (v) => fmt.duration(v), "bar", t.hourly, (p) => pickBucket(p, false), t.picked?.failed ? null : t.picked?.bucket),
      trendChart("Failures", per, series, (p) => p.failed, (v) => fmt.number(v), "err", t.hourly, (p) => pickBucket(p, true), t.picked?.failed ? t.picked.bucket : null),
      trendChart("p95 duration", per, series, (p) => p.p95_ms / 1000, (v) => fmt.duration(v), "line", t.hourly, (p) => pickBucket(p, false))),
    trendRuns(),
    h("section", { class: "s2-card qh-adv-work" },
      h("h2", {}, "Slower than before"),
      h("div", { class: "s2-small s2-faint", style: { marginBottom: "6px" } }, "Per query shape: the median duration in the last 7 days against the 7 days before (at least 1.5× and 1 s slower). Click one to see its runs."),
      d.slower.length ? h("div", { class: "s2-table-wrap" }, h("table", { class: "s2-table qh-tr-table" },
        h("thead", {}, h("tr", {}, h("th", { class: "num" }, "Before"), h("th", { class: "num" }, "Last 7 days"), h("th", { class: "num" }, "Slower"), h("th", { class: "num" }, "Runs"), h("th", {}, "Query"))),
        h("tbody", {}, d.slower.map((s) => shapeRow(s, [h("td", { class: "num" }, secs(s.before_ms)), h("td", { class: "num" }, secs(s.median_ms)),
          h("td", { class: "num" }, h("span", { class: "s2-badge err plain" }, `${s.ratio}×`)), h("td", { class: "num", title: `${s.runs_before} runs the week before` }, `${s.runs} / ${s.runs_before}`)])))))
        : h("div", { class: "s2-small s2-muted" }, "No query shape got markedly slower.")),
    h("section", { class: "s2-card qh-adv-work" },
      h("h2", {}, "New heavy queries"),
      h("div", { class: "s2-small s2-faint", style: { marginBottom: "6px" } }, `Shapes first seen in the last 7 days with over a minute of runtime in total${d.oldest ? ` (the local copy starts ${when(d.oldest)})` : ""}.`),
      d.new_heavy.length ? h("div", { class: "s2-table-wrap" }, h("table", { class: "s2-table qh-tr-table" },
        h("thead", {}, h("tr", {}, h("th", { class: "num" }, "Median"), h("th", { class: "num" }, "Total"), h("th", { class: "num" }, "Runs"), h("th", {}, "Query"))),
        h("tbody", {}, d.new_heavy.map((s) => shapeRow(s, [h("td", { class: "num" }, secs(s.median_ms)), h("td", { class: "num" }, secs(s.total_ms)), h("td", { class: "num" }, fmt.number(s.runs))])))))
        : h("div", { class: "s2-small s2-muted" }, "No new heavy query shapes.")));
}

// ---------------------------------------------------------------- advisor (whole history)
const advisorEl = h("div");
const PRIO = { high: ["err", "High"], medium: ["warn", "Medium"], low: ["plain", "Low"], ok: ["ok", "OK"] };
const KIND = { sort: "Sort key", shard: "Shard key", reference: "Reference table", index: "Index", stats: "Statistics" };

async function loadAdvisor(refresh) {
  state.advisor.loading = true;
  state.advisor.error = null;
  renderAdvisor();
  try { state.advisor.data = await S2.callTool("query_history_advisor", { refresh }); }
  catch (err) { state.advisor.error = err; }
  state.advisor.loading = false;
  renderAdvisor();
  reportContext();
}

function colChips(label, cols) {
  if (!cols?.length) return null;
  return h("div", { class: "qh-chips" }, h("span", { class: "s2-faint" }, label),
    cols.slice(0, 5).map((c) => h("span", { class: "qh-chip", title: `${c.queries} queries · ${secs(c.ms)}${c.kinds ? ` · ${c.kinds.join(", ")}` : ""}` },
      `${c.column} ×${c.queries}`)));
}

function renderAdvisor() {
  if (state.tab !== "advisor") return;
  const a = state.advisor;
  const d = a.data;
  const head = h("div", { class: "qh-adv-meta" },
    d ? `${fmt.number(d.analyzed)} distinct queries analyzed (from ${fmt.number(d.events)} history events) in ${d.seconds} s` +
      `${d.explain_failed ? ` · ${d.explain_failed} couldn't be explained (e.g. tables that no longer exist)` : ""}` +
      `${d.skipped ? ` · ${d.skipped} smaller ones skipped` : ""}${d.cached ? " · from the last analysis" : ""}`
      : "Every distinct query in the history is EXPLAINed (compiled, not run) to see which columns it filters, joins and groups on.",
    h("span", { class: "s2-spacer" }),
    h("button", { class: "s2-btn", disabled: a.loading, onclick: () => loadAdvisor(true) },
      a.loading ? h("span", { class: "s2-spinner" }) : null, d ? "Analyze again" : "Analyze history"));
  if (a.loading && !d) { fill(advisorEl, head, h("div", { class: "s2-empty" }, h("span", { class: "s2-spinner" }), " Analyzing the query history…")); return; }
  if (a.error) { fill(advisorEl, head, S2.errorBox(a.error)); return; }
  if (!d) { fill(advisorEl, head); return; }

  const w = d.workload;
  const work = (w.big_results.length || w.select_star.length || w.failures.length) ? h("section", { class: "s2-card qh-adv-work" },
    h("h2", {}, "Workload"),
    h("ul", { style: { margin: 0, paddingLeft: "18px" } },
      w.big_results.length ? h("li", {}, `${w.big_results.length} quer${w.big_results.length === 1 ? "y returns" : "ies return"} over a million rows to the client, e.g. `,
        h("code", {}, w.big_results[0].sql.slice(0, 90)), ` (${fmt.number(w.big_results[0].rows)} rows, ${secs(w.big_results[0].ms)}). Filter or aggregate in the database instead.`) : null,
      w.select_star.length ? h("li", {}, `${w.select_star.length} large SELECT * quer${w.select_star.length === 1 ? "y" : "ies"}: list only the columns needed (columnstore reads only those).`) : null,
      w.failures.slice(0, 5).map((f) => h("li", {}, h("strong", {}, `${fmt.number(f.count)}× ${f.error_code}`), " — e.g. ", h("code", {}, f.sample.slice(0, 110)))))) : null;

  const cards = d.tables.map((t) => h("section", { class: "s2-card qh-adv-table" },
    h("div", { style: { display: "flex", alignItems: "center", gap: "6px" } },
      h("h3", {}, t.table), h("span", { class: "s2-spacer" }),
      h("span", { class: `s2-badge ${PRIO[t.priority][0]}` }, PRIO[t.priority][1])),
    h("div", { class: "qh-adv-sub" },
      `${t.rows != null ? `${fmt.number(t.rows)} rows · ` : ""}${t.storage} · shard key ${t.shard_key == null ? "none" : t.shard_key.length ? `(${t.shard_key.join(", ")})` : "() keyless"}` +
      ` · sort key ${t.sort_key == null || !t.sort_key.length ? "none" : `(${t.sort_key.join(", ")})`} · ${t.queries} quer${t.queries === 1 ? "y" : "ies"}, ${secs(t.ms)}`),
    colChips("Filtered on", t.filters), colChips("Joined on", t.joins), colChips("Grouped by", t.groups),
    t.recommendations.length ? t.recommendations.map((r) => h("div", { class: `qh-rec ${r.priority === "high" ? "high" : r.priority === "medium" ? "medium" : r.priority}` },
      h("div", { class: "t" }, h("span", { class: `s2-badge ${PRIO[r.priority][0]}` }, KIND[r.kind] ?? r.kind), r.title),
      h("p", {}, r.detail),
      r.sql ? [h("pre", { class: "s2-pre" }, r.sql), h("button", { class: "s2-btn ghost", style: { marginTop: "4px" }, onclick: () => copy(r.sql) }, "Copy"),
        editorButton(r.sql, t.database),
        r.new_table ? h("button", { class: "s2-btn ghost", style: { marginTop: "4px" }, title: "Once the copy is built: time the heaviest queries from the history on both tables",
          onclick: () => openCompare(t.table, r.new_table) }, "Compare with new table") : null] : null))
      : h("div", { class: "s2-small s2-faint" }, "No changes suggested for this table."),
    t.examples.length ? h("details", { class: "qh-more" }, h("summary", {}, "Example queries"),
      t.examples.map((x) => h("div", { style: { margin: "4px 0" } }, h("span", { class: "s2-faint" }, `${x.runs}× · ${secs(x.ms)} `), h("code", { class: "s2-mono" }, x.sql)))) : null));
  fill(advisorEl, head, cmpEl, work,
    d.tables.length ? h("div", { class: "qh-adv-grid" }, cards) : h("div", { class: "s2-empty" }, "No user tables in the analyzed queries."),
    h("div", { class: "s2-small s2-faint", style: { marginTop: "10px" } },
      "Changing a shard or sort key means rebuilding the table: the suggested statements build a copy next to it. Review them, test with your queries, then swap the names."));
}

// ---------------------------------------------------------------- before/after check (Advisor)
// Times the heaviest read-only queries from the history on the original table and on the rebuilt copy.
const cmpEl = h("div");

function openCompare(table, newTable) {
  state.cmp = { table, newTable, runs: 3, timeout: 120, cand: null, loading: false, error: null, selected: new Set(), job: null };
  renderCompare();
  cmpEl.scrollIntoView({ behavior: "smooth", block: "start" });
  loadCandidates();
}

async function loadCandidates() {
  const c = state.cmp;
  c.loading = true; c.error = null; c.cand = null; c.job = null;
  renderCompare();
  try {
    c.cand = await S2.callTool("query_history_compare_candidates", { table: c.table, new_table: c.newTable });
    c.selected = new Set(c.cand.queries.slice(0, 3).map((q) => q.shape));
  } catch (err) { c.error = err; }
  c.loading = false;
  renderCompare();
}

async function startCompare() {
  const c = state.cmp;
  try {
    c.job = await S2.callTool("query_history_compare_start", { table: c.table, new_table: c.newTable, shapes: [...c.selected], runs: c.runs, timeout_s: c.timeout });
  } catch (err) { S2.toast(err.message, "err"); return; }
  renderCompare();
  const poll = async () => {
    if (state.cmp !== c || !c.job) return;
    try { c.job = await S2.callTool("query_history_compare_status", { job_id: c.job.id }); }
    catch (err) { c.error = err; renderCompare(); return; }
    renderCompare();
    if (c.job.state === "running") setTimeout(poll, 1500);
    else reportContext();
  };
  setTimeout(poll, 1000);
}

function speedCell(q) {
  if (q.speedup == null) return h("td", { class: "num" }, "–");
  const s = q.speedup;
  const cls = s >= 1.1 ? "faster" : s <= 0.9 ? "slower" : "";
  return h("td", { class: `num ${cls}`, title: "Old median / new median. Differences under ~10% (or a few ms) are noise." },
    s >= 1 ? `${s}× faster` : `${(1 / s).toFixed(2)}× slower`);
}

function renderCompare() {
  const c = state.cmp;
  if (!c) { cmpEl.replaceChildren(); return; }
  const job = c.job;
  const running = job?.state === "running";
  const nameInput = h("input", { class: "s2-input s2-mono", value: c.newTable, size: 32, "aria-label": "New table name", disabled: running,
    onchange: (e) => { c.newTable = e.target.value.trim(); } });
  const head = h("div", { style: { display: "flex", alignItems: "center", gap: "8px" } },
    h("h2", {}, `Before / after: ${c.table}`), h("span", { class: "s2-spacer" }),
    h("button", { class: "s2-btn ghost", "aria-label": "Close the comparison", disabled: running, onclick: () => { state.cmp = null; renderCompare(); } }, "✕"));
  const nameRow = h("div", { class: "row" }, "New table", nameInput,
    h("button", { class: "s2-btn", disabled: c.loading || running, onclick: () => { c.newTable = nameInput.value.trim(); loadCandidates(); } },
      c.loading ? h("span", { class: "s2-spinner" }) : null, "Find queries"));
  const parts = [head, nameRow];
  if (c.error) parts.push(S2.errorBox(c.error));
  const cand = c.cand;
  if (cand && !cand.exists) parts.push(h("div", { class: "s2-error" }, cand.message));
  else if (cand && !cand.queries.length) parts.push(h("div", { class: "s2-small s2-muted" }, cand.message));
  else if (cand && !job) {
    const picked = cand.queries.filter((q) => c.selected.has(q.shape));
    const est = picked.reduce((a, q) => a + q.median_ms, 0) * 2 * c.runs;
    parts.push(
      h("div", { class: "s2-small s2-faint" }, `The heaviest read-only queries (SELECT / WITH) from the history that read ${cand.table}, with the table name replaced by ${cand.new_table}. Pick the ones to time:`),
      h("div", { class: "s2-table-wrap", style: { maxHeight: "300px", marginTop: "6px" } }, h("table", { class: "s2-table" },
        h("thead", {}, h("tr", {}, h("th", {}, ""), h("th", { class: "num" }, "Runs"), h("th", { class: "num" }, "Median"), h("th", { class: "num" }, "Total"), h("th", {}, "Query"))),
        h("tbody", {}, cand.queries.map((q) => h("tr", {},
          h("td", {}, h("input", { type: "checkbox", checked: c.selected.has(q.shape), "aria-label": "Include this query",
            onchange: (e) => { e.target.checked ? c.selected.add(q.shape) : c.selected.delete(q.shape); renderCompare(); } })),
          h("td", { class: "num" }, fmt.number(q.runs)), h("td", { class: "num" }, secs(q.median_ms)), h("td", { class: "num" }, secs(q.total_ms)),
          h("td", { class: "sql", title: q.sql },
            h("details", {}, h("summary", {}, q.sql.slice(0, 110)),
              h("div", { class: "s2-small s2-faint" }, `Original (${q.database ?? "no database"}):`), h("pre", { class: "s2-pre" }, q.sql),
              h("div", { class: "s2-small s2-faint" }, `On the new table (${q.replacements} name${q.replacements === 1 ? "" : "s"} replaced):`), h("pre", { class: "s2-pre" }, q.new_sql)))))))),
      h("div", { class: "row" },
        "Runs per table", h("input", { class: "s2-input", type: "number", min: "1", max: "10", value: c.runs, style: { width: "56px" }, "aria-label": "Runs per table",
          onchange: (e) => { c.runs = Math.max(1, Math.min(10, Number(e.target.value) || 3)); renderCompare(); } }),
        "Timeout per query", h("input", { class: "s2-input", type: "number", min: "5", value: c.timeout, style: { width: "64px" }, "aria-label": "Timeout per query in seconds",
          onchange: (e) => { c.timeout = Math.max(5, Number(e.target.value) || 120); } }), "s",
        h("span", { class: "s2-spacer" }),
        h("button", { class: "s2-btn primary", disabled: !picked.length, onclick: async (e) => {
          const ok = await S2.confirmInline(e.currentTarget,
            `Run ${picked.length} quer${picked.length === 1 ? "y" : "ies"} ${c.runs}× on ${cand.table} and ${c.runs}× on ${cand.new_table} (${2 * c.runs * picked.length} runs, about ${fmt.duration(est / 1000)} from the history)? They really run on the cluster.`,
            "Run them");
          if (ok) startCompare();
        } }, `Run comparison (${2 * c.runs * picked.length} runs)`)),
      h("div", { class: "s2-small s2-faint" },
        "Each query runs as SELECT COUNT(*) AS n FROM (<query>) AS _q, so no rows are sent to the client and the row counts show whether both tables give the same answer. ",
        "The database may skip columns that are only returned, so this times the filtering, joining and grouping rather than the output. ",
        "Old and new alternate; times are server time (wall time minus one network round trip). A query over the timeout is cancelled (KILL QUERY)."));
  }
  if (job) {
    const pct = job.total_runs ? Math.round((job.done_runs / job.total_runs) * 100) : 0;
    parts.push(
      h("div", { class: "row" },
        running ? [h("span", { class: "s2-spinner" }), ` Running ${job.done_runs} of ${job.total_runs} · ${fmt.duration(job.elapsed_s)}`]
          : `${job.state === "done" ? "Finished" : job.state === "cancelled" ? "Stopped" : "Failed"}: ${job.done_runs} of ${job.total_runs} runs in ${fmt.duration(job.elapsed_s)}`,
        h("span", { class: "s2-spacer" }),
        running ? h("button", { class: "s2-btn danger", disabled: job.cancelling, onclick: async () => {
          try { c.job = await S2.callTool("query_history_compare_cancel", { job_id: job.id }); } catch (err) { S2.toast(err.message, "err"); }
          renderCompare(); } }, job.cancelling ? "Stopping…" : "Stop")
          : h("button", { class: "s2-btn", onclick: () => { c.job = null; renderCompare(); } }, "New comparison")),
      running ? h("div", { class: "qh-prog" }, h("span", { style: { width: `${pct}%` } })) : null,
      job.error ? S2.errorBox(job.error) : null,
      h("div", { class: "s2-table-wrap" }, h("table", { class: "s2-table" },
        h("thead", {}, h("tr", {}, h("th", { class: "num" }, "Old (median)"), h("th", { class: "num" }, "New (median)"), h("th", { class: "num" }, "Speed-up"),
          h("th", {}, "Rows"), h("th", {}, "Status"), h("th", {}, "Query"))),
        h("tbody", {}, job.queries.map((q) => h("tr", {},
          h("td", { class: "num", title: q.old.map((r) => r.ms != null ? `${r.ms} ms` : r.error).join(", ") }, q.old_median_ms == null ? "–" : secs(q.old_median_ms)),
          h("td", { class: "num", title: q.new.map((r) => r.ms != null ? `${r.ms} ms` : r.error).join(", ") }, q.new_median_ms == null ? "–" : secs(q.new_median_ms)),
          speedCell(q),
          h("td", {}, q.rows_match == null ? "–" : q.rows_match ? h("span", { class: "s2-badge ok" }, `match (${fmt.number(q.old_rows)})`)
            : h("span", { class: "s2-badge err", title: `old ${q.old_rows}, new ${q.new_rows}` }, "differ")),
          h("td", {}, q.errors.length ? h("span", { class: "s2-badge err", title: q.errors.join("\n") }, q.errors[0].slice(0, 60))
            : q.status === "running" ? h("span", {}, h("span", { class: "s2-spinner" }), ` ${q.current ?? ""}`) : q.status),
          h("td", { class: "sql", title: q.sql }, q.sql.slice(0, 120))))))));
  }
  fill(cmpEl, h("section", { class: "s2-card qh-cmp", "aria-label": "Before/after comparison" }, parts));
}

function reportContext() {
  const rows = filtered().slice(0, 8);
  const sel = state.data?.events.find((e) => e.key === state.selected);
  const recs = sel && state.tuning[sel.key]?.result?.recommendations;
  S2.updateModelContext(`User is viewing the Query History (queries ≥ ${state.minSeconds} s${state.hours ? `, last ${state.hours} h` : ""}):\n` +
    rows.map((e) => `${secs(e.ms)} ${e.user}@${e.database ?? "-"} ${e.ok ? "" : "FAILED "}${e.sql.slice(0, 120)}`).join("\n") +
    (sel ? `\nSelected: ${secs(sel.ms)} ${sel.sql.slice(0, 300)}` : "") +
    (recs ? `\nRecommendations: ${recs.map((r) => r.title).join("; ")}` : "") +
    (selectedPlan() ? `\nSelected (plan cache totals): ${fmt.number(selectedPlan().runs)} runs, avg ${secs(selectedPlan().avg_ms)}: ${selectedPlan().sql.slice(0, 300)}` : "") +
    (state.tab === "usage" && state.usage.data ? `\nUsage tab, most used tables: ${state.usage.data.tables.slice(0, 8)
      .map((t) => `${t.database}.${t.table} (${t.execs || t.runs} runs, ${secs(Math.max(t.exec_ms, t.ms))})`).join("; ") || "none"}; most active users: ${state.usage.data.users.slice(0, 5)
      .map((u) => `${u.user} (${u.queries} queries, ${secs(u.ms)}, ${u.failed} failed)`).join("; ") || "none"}` : "") +
    (state.tab === "trends" && state.trends.data ? `\nTrends tab, slower than the week before: ${state.trends.data.slower.slice(0, 5)
      .map((s) => `${secs(s.before_ms)} -> ${secs(s.median_ms)} (${s.runs} runs) ${s.sample.slice(0, 80)}`).join("; ") || "none"}` : "") +
    (state.cmp?.job && state.cmp.job.state !== "running" ? `\nBefore/after ${state.cmp.job.table} vs ${state.cmp.job.new_table}: ${state.cmp.job.queries
      .map((q) => `${q.old_median_ms ?? "?"} ms -> ${q.new_median_ms ?? "?"} ms${q.rows_match === false ? " (row counts differ)" : ""}`).join("; ")}` : ""));
}

async function refresh() {
  if (state.loading) return;
  state.loading = true;
  render();
  try {
    state.data = await S2.callTool("query_history_data", { min_ms: Math.round(state.minSeconds * 1000), ...(state.hours ? { hours: Number(state.hours) } : {}) });
    state.error = null;
    if (state.selected && !state.data.events.some((e) => e.key === state.selected)) state.selected = null;
  } catch (e) { state.error = e; }
  finally { state.loading = false; render(); reportContext(); }
}

function setAuto(on) {
  state.auto = on;
  clearInterval(state.timer);
  state.timer = on ? setInterval(() => { if (!S2.isHidden()) refresh(); }, REFRESH_MS) : null;
}

S2.onDisplayModeChange = () => { if (state.data) render(); };
// From the SQL Editor ("Find in Query History" on SQL that SAS sent to SingleStore): search for it. A statement
// only the plan cache knows (all its runs under the trace threshold) comes as ``plan``: it's listed and selected.
window.addEventListener("s2:set-sql", (e) => {
  if (typeof e.detail?.search !== "string" && !e.detail?.plan) return;
  state.search = e.detail.search ?? "";
  if (e.detail.plan?.key) {
    state.pinnedPlan = e.detail.plan;
    state.selected = e.detail.plan.key;
    state.tab = "queries";
  }
  if (state.data) render();
});
await S2.connect({
  name: "singlestore-query-history",
  onToolInput(args) {
    if (args?.min_seconds) state.minSeconds = Math.max(1, Number(args.min_seconds));
    if (args?.hours) state.hours = String(args.hours);
  },
  onToolResult(result) {
    try {
      state.data = S2.resultData(result);
      state.minSeconds = Math.max(1, (state.data.min_ms ?? 1000) / 1000);
      state.hours = state.data.hours ? String(state.data.hours) : "";
      if (state.data.advisor) state.advisor.data = state.data.advisor;
    } catch (e) { state.error = e; }
    if (["advisor", "trends", "usage"].includes(state.data?.tab)) setTab(state.data.tab);
    else render();
    reportContext();
    // The tool result carries only the latest queries (it must stay small); load the full list now.
    if (state.data?.partial) refresh();
  },
  onToolCancelled() {
    if (!state.data) root.replaceChildren(h("div", { class: "s2-empty" }, "Cancelled."));
  },
});
</script>
