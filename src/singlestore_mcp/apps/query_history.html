<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Query History</title>
<!--S2:HEAD-->
<style>
  .qh-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 4px 0 10px; }
  .qh-field { display: inline-flex; align-items: center; gap: 6px; font-size: var(--s2-fs-xs); color: var(--s2-text-2); }
  .qh-field .s2-input { width: auto; min-width: 0; padding: 3px 7px; font-size: var(--s2-fs-xs); }
  .qh-field input[type="number"] { width: 72px; }
  .qh-field input[type="search"] { width: 200px; }
  .qh-seg { display: inline-flex; border: 1px solid var(--s2-border); border-radius: var(--s2-radius-sm); overflow: hidden; }
  .qh-seg button { border: 0; background: transparent; padding: 3px 9px; font-size: var(--s2-fs-xs); cursor: pointer; color: var(--s2-text-2); }
  .qh-seg button + button { border-left: 1px solid var(--s2-border); }
  .qh-seg button[aria-pressed="true"] { background: var(--s2-bg-3); color: var(--s2-text); font-weight: var(--font-weight-semibold, 600); }

  .qh-list { max-height: 560px; }
  html[data-display-mode="fullscreen"] .qh-list { max-height: calc(100vh / var(--s2-zoom) - 250px); }
  html[data-display-mode="fullscreen"] .qh-detail { max-height: calc(100vh / var(--s2-zoom) - 250px); overflow: auto; }

  .qh-table tbody tr { cursor: pointer; }

  .qh-tabs button { border: 0; background: none; padding: 6px 12px; cursor: pointer; color: var(--s2-text-2); font-size: var(--s2-fs-sm, 13px);
    border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .qh-tabs button[aria-selected="true"] { color: var(--s2-text); font-weight: var(--font-weight-semibold, 600); border-bottom-color: var(--s2-info); }
  .qh-claude { margin-top: 10px; border: 1px solid var(--s2-border-2); border-radius: var(--s2-radius-sm); padding: 8px 10px; background: var(--s2-bg-2); }
  .qh-claude .who { font-weight: var(--font-weight-semibold, 600); font-size: var(--s2-fs-xs); margin-bottom: 4px; }

  .qh-stats-box.stale { border-color: var(--s2-warn); }

  .qh-stats-box table { width: 100%; font-size: var(--s2-fs-xs); }

  .qh-ep h3 { font-size: var(--s2-fs-sm, 13px); margin: 0 0 4px; }

<body>
<div id="root"><div class="s2-empty"><span class="s2-spinner"></span> Reading the query history…</div></div>
<script type="module">
const { h, fmt } = S2;
const root = document.getElementById("root");
const PRESETS = [[1, "1 s"], [5, "5 s"], [30, "30 s"], [60, "1 min"], [300, "5 min"]];
const PERIODS = [["", "All"], ["1", "1 h"], ["24", "24 h"], ["168", "7 days"]];
const REFRESH_MS = 30000;
// replaceChildren() would turn null slots into the text "null".
const fill = (el, ...kids) => el.replaceChildren(...kids.flat().filter((k) => k != null && k !== false));

const state = {
  data: null, error: null, loading: false,
  minSeconds: 1, hours: "",
  user: "", database: "", status: "", category: "", origin: "", search: "",
  shape: null,           // {shape, sample}: list filtered to one query shape (from Trends)
  trends: { loading: false, error: null, data: null, days: 30, hourly: false },
  cmp: null,             // before/after check (Advisor)
  sort: { key: "finished", dir: -1 },
  selected: null,        // event key
  detail: {},            // key -> {event, loading, error}
  tuning: {},            // key -> {loading, error, result}
  claude: {},            // key -> {running, job, answer, error}
  assistant: null,       // {available, reason} — Claude Code for in-app answers
  tab: "queries",        // "queries" | "advisor"
  advisor: { loading: false, error: null, data: null },
  auto: false, timer: null,
  group: true,           // merge repeated runs of the same statement into one row
  expanded: new Set(),   // statement keys of opened groups
  plansOn: false,        // list plan-cache-only statements (aggregates) too (remembered per browser)
  pinnedPlan: null,      // a plan-cache statement the SQL Editor's "Find in Query History" opened (listed and selected)
  table: null,           // "db.table": list filtered to statements naming it (from Usage)
  usage: { loading: false, error: null, data: null, days: 7, sortT: "time", sortU: "ms" },
  planView: {},          // key -> "tree" | "text" | "json" | "profile"
  profile: {},           // key -> {loading, error, result}
  analyze: {},           // key -> {db: {loading, error, plan, running, result}}
  traceOpen: false,
};
try { state.group = localStorage.getItem("qh-group") !== "0"; state.plansOn = localStorage.getItem("qh-plans") === "1"; } catch {}

// ---------------------------------------------------------------- Claude, in the app
// Headless Claude Code with read-only database tools answers here (works in the desktop window and the
// browser). Only without Claude Code does the question go to the Claude chat (inside Claude).
async function assistantInfo() {
  if (!state.assistant) {
    try { state.assistant = await S2.callTool("query_history_assistant", {}); }
    catch { state.assistant = { available: false, reason: "Couldn't check for Claude Code." }; }
  }
  return state.assistant;
}

async function askInApp(row, ev, tuning) {
  const info = await assistantInfo();
  if (!info.available) {
    if (!S2.inBrowserView() && await S2.sendPrompt(chatPrompt(row, ev, tuning), { quiet: true })) {
      S2.toast("Sent to the Claude chat", "ok");
      return;
    }
    state.claude[row.key] = { error: `Claude isn't available here: ${info.reason}` };
    renderDetail();
    return;
  }
  const key = row.key;
  state.claude[key] = { running: true, job: null };
  renderDetail();
  try {
    await S2.callTool("query_history_ask", { key });
  } catch (err) {
    state.claude[key] = { error: err.message };
    renderDetail();
    return;
  }
  const poll = async () => {
    const c = state.claude[key];
    if (!c?.running) return;
    try {
      const r = await S2.callTool("query_history_answer", { key });
      if (r.answer) { state.claude[key] = { answer: r.answer }; }
      else { c.job = r.job; setTimeout(poll, 1000); }
    } catch (err) { state.claude[key] = { error: err.message }; }
    if (state.selected === key) renderDetail();
  };
  setTimeout(poll, 1200);
}

async function stopAsking(key) {
  try { await S2.callTool("query_history_ask_cancel", { key }); } catch {}
  state.claude[key] = { answer: { text: "Stopped.", kind: "note" } };
  renderDetail();
}

// Plain text with ``` fenced code blocks.
function answerBody(text) {
  const parts = [];
  const re = /```[\w-]*\n?([\s\S]*?)```/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    const before = text.slice(last, m.index).trim();
    if (before) parts.push(h("div", { class: "txt" }, before));
    const code = m[1].replace(/\s+$/, "");
    parts.push(h("pre", { class: "s2-pre" }, code), h("button", { class: "s2-btn ghost", onclick: () => copy(code) }, "Copy"),
      /^\s*(--|\/\*|select|with|create|insert|alter|analyze|drop|update|delete|explain|show|set)\b/i.test(code)
        ? editorButton(code, state.data?.events.find((e) => e.key === state.selected)?.database) : null);
    last = re.lastIndex;
  }
  const rest = text.slice(last).trim();
  if (rest) parts.push(h("div", { class: "txt" }, rest));
  return parts;
}

function claudeBox(key) {
  const c = state.claude[key];
  if (!c) return null;
  if (c.running) {
    const j = c.job;
    return h("div", { class: "qh-claude" },
      h("div", { class: "who" }, h("span", { class: "s2-spinner" }),
        ` Claude · ${j ? `${j.activity}${j.seconds >= 5 ? ` · ${j.seconds}s` : ""}` : "Starting…"} `,
        h("button", { class: "s2-btn ghost", onclick: () => stopAsking(key) }, "Stop")),
      j?.partial ? answerBody(j.partial) : h("div", { class: "txt s2-faint" },
        "Claude reads the query, the plan and the tables, and may run a few read-only checks. This usually takes 30–90 seconds."));
  }
  if (c.error) return h("div", { class: "s2-error", style: { marginTop: "10px" } }, c.error);
  const a = c.answer;
  return h("div", { class: "qh-claude" },
    h("div", { class: "who" }, a.kind === "claude" ? "Claude" : a.kind === "error" ? "Couldn't answer" : "Note"),
    answerBody(a.text));
}

// Cluster times have no zone; utc_offset_min says how far the cluster's clock is from UTC.
function toLocal(v) {
  if (!v) return null;
  const d = new Date(String(v).replace(" ", "T").replace(/(\.\d{3})\d*$/, "$1") + "Z");
  return Number.isNaN(d.getTime()) ? null : new Date(d.getTime() - (state.data?.utc_offset_min ?? 0) * 60000);
}
const when = (v) => { const d = toLocal(v); return d ? d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "–"; };
const secs = (ms) => fmt.duration(ms / 1000);

// The plan-cache-only statements (aggregates, no individual runs), when they pass the filters. They have no user
// and no single duration: the runtime filter applies to their average, and only above the 1 s default.
function planRows() {
  const pin = state.pinnedPlan;
  const rows = planRowsFiltered();
  return pin && !rows.some((p) => p.key === pin.key) ? [pin, ...rows] : rows;
}
// "Show Studio's own queries": the statements this Studio sends for itself (flagged ``own`` by the server: marked
// /* s2-… */, system-view reads, session checks) are hidden unless ticked (remembered in this browser).
const showOwn = () => state.showOwn ?? (state.showOwn = (() => { try { return localStorage.getItem("s2-show-own") === "1"; } catch { return false; } })());
function setShowOwn(on) {
  state.showOwn = on;
  try { localStorage.setItem("s2-show-own", on ? "1" : "0"); } catch {}
  render();
}
// The details say where a statement ran (the active connection's name, read once).
S2.onConnections(() => { if (state.selected && state.data) renderDetail(); });
const ownHidden = () => (showOwn() ? 0 : (state.data?.events ?? []).filter((e) => e.own).length);
// Where a statement came from, for the Source column and the details: every row ran on SingleStore; SAS ones were sent by
// SAS Compute, CAS or SAS's embedded process (guessed from the SQL, so "probably").
const SENT_BY = { "SAS CAS": "CAS", "SAS in-database": "SAS Compute", "SAS EP": "SAS (embedded process)" };
const sentBy = (origin) => (SENT_BY[origin] ?? (/^Workload: /.test(origin ?? "") ? "the Studio's Workload" : null));
function planRowsFiltered() {
  const d = state.data;
  if (!d?.plans?.length || !state.plansOn || state.shape || state.user || state.category) return [];
  const q = state.search.trim().toLowerCase();
  return d.plans.filter((p) => (showOwn() || !p.own) &&
    (!state.database || (p.database ?? "") === state.database) &&
    (!state.status || (state.status === "ok" ? p.failed === 0 : p.failed > 0)) &&
    (!state.origin || state.origin === "plan" || (state.origin === "-" ? !p.origin : p.origin === state.origin)) &&
    (state.minSeconds <= 1 || p.avg_ms >= state.minSeconds * 1000) &&
    (!state.table || (p.tables ?? []).includes(state.table)) &&
    (!q || p.sql.toLowerCase().includes(q)));
}

function filtered() {
  const d = state.data;
  if (!d) return [];
  if (state.origin === "plan") return [];
  const q = state.search.trim().toLowerCase();
  const rows = d.events.filter((e) => (showOwn() || !e.own) &&
    (!state.user || e.user === state.user) &&
    (!state.database || (e.database ?? "") === state.database) &&
    (!state.status || (state.status === "ok") === e.ok) &&
    (!state.category || e.category === state.category) &&
    (!state.origin || (state.origin === "-" ? !e.origin : e.origin === state.origin)) &&
    (!state.shape || e.shape === state.shape.shape) &&
    (!state.table || (e.tables ?? []).includes(state.table)) &&
    (!q || e.sql.toLowerCase().includes(q) || (e.error_code ?? "").toLowerCase().includes(q)));
  const { key, dir } = state.sort;
  const val = (e) => key === "finished" ? (toLocal(e.finished)?.getTime() ?? 0) : key === "rows" ? (e.rows ?? -1) : key === "runs" ? 1 : e.ms;
  return rows.sort((a, b) => (val(a) - val(b)) * dir);
}

const p95 = (values) => {
  if (!values.length) return 0;
  const v = [...values].sort((a, b) => a - b);
  return v[Math.min(v.length - 1, Math.round(0.95 * (v.length - 1)))];
};
const planOf = (e) => (e && e.plan_id != null ? state.data?.plan_stats?.[`${e.node_id}:${e.plan_id}`] : null);
const runTime = (e) => toLocal(e.finished)?.getTime() ?? 0;

// List items: single runs, groups of runs of the same statement (same text once literals are replaced, same
// database) and plan-cache statements, sorted together.
function listItems() {
  const runs = filtered();
  const items = [];
  if (state.group) {
    const by = new Map();
    for (const e of runs) {
      if (!by.has(e.stmt)) by.set(e.stmt, []);
      by.get(e.stmt).push(e);
    }
    for (const [stmt, list] of by) {
      if (list.length === 1) { items.push({ kind: "run", e: list[0] }); continue; }
      const ms = list.map((e) => e.ms);
      const total = ms.reduce((a, b) => a + b, 0);
      const latest = list.reduce((a, e) => (runTime(e) > runTime(a) ? e : a));
      items.push({ kind: "group", stmt, runs: list, latest, count: list.length, total, avg: total / list.length,
        p95: p95(ms), max: Math.max(...ms), failed: list.filter((e) => !e.ok).length,
        users: [...new Set(list.map((e) => e.user).filter(Boolean))], rows: list.reduce((a, e) => a + (e.rows ?? 0), 0),
        plan: list.map(planOf).find(Boolean) ?? null });
    }
  } else {
    for (const e of runs) items.push({ kind: "run", e });
  }
  for (const p of planRows()) items.push({ kind: "plan", p });
  const { key, dir } = state.sort;
  const time = (it) => it.kind === "run" ? runTime(it.e) : it.kind === "group" ? runTime(it.latest) : (toLocal(it.p.last_executed)?.getTime() ?? 0);
  const val = (it) => key === "finished" ? time(it)
    : key === "rows" ? (it.kind === "run" ? it.e.rows ?? -1 : it.kind === "group" ? it.rows : it.p.rows)
    : key === "runs" ? (it.kind === "run" ? 1 : it.kind === "group" ? it.count : it.p.runs)
    : (it.kind === "run" ? it.e.ms : it.kind === "group" ? it.max : it.p.avg_ms);
  return items.sort((a, b) => (val(a) - val(b)) * dir);
}

function setMin(s) {

function stats(rows, plans) {
  const total = rows.reduce((a, e) => a + e.ms, 0);
  const failed = rows.filter((e) => !e.ok).length;
  const longest = rows.reduce((a, e) => Math.max(a, e.ms), 0);
  const statements = new Set(rows.map((e) => e.stmt)).size;
  const card = (v, l, title, onclick) => h(onclick ? "button" : "div", { class: "s2-card qh-stat", title, onclick,
    style: onclick ? { cursor: "pointer", textAlign: "left", font: "inherit", color: "inherit" } : null }, h("div", { class: "v" }, v), h("div", { class: "l" }, l));
  const cacheOnly = state.data?.plans?.length ?? 0;

    card(fmt.number(rows.length), `queries ≥ ${fmt.duration(state.minSeconds)}`),
    card(fmt.number(statements), "distinct statements", "Runs of the same statement with other literal values count once"),
    card(secs(total), "total runtime"),

    card(fmt.number(failed), "failed"),

      "Statements the trace never kept (all their runs were faster than its threshold), with their totals from the plan cache. Click to list them or hide them.",

const listEl = h("div");

        h("div", { class: "qh-dur" }, h("span", {}, secs(g.avg), h("span", { class: "qh-sub" }, `p95 ${secs(g.p95)} · max ${secs(g.max)}`)), bar(g.max))),
      h("td", { title: g.users.join(", ") }, g.users.length > 1 ? `${g.users[0]} +${g.users.length - 1}` : g.users[0] ?? "–"),

        sortHead("ms", "Duration", true, "Single runs: duration; groups: average (p95, max); plan cache: average"), h("th", {}, "User"), h("th", {}, "Database"),
        h("th", {}, "Type"), h("th", { title: "Probable origin, guessed from the SQL" }, "Source"), sortHead("rows", "Rows", true), h("th", {}, "Status"), h("th", {}, "Query"))),

}

// ---------------------------------------------------------------- detail + tuning
const detailEl = h("section", { class: "s2-card qh-detail", "aria-label": "Selected query" });
const isPlanKey = (key) => String(key ?? "").startsWith("plan:");
const selectedPlan = () => state.data?.plans?.find((p) => p.key === state.selected)
  ?? (state.pinnedPlan?.key === state.selected ? state.pinnedPlan : null);

async function choose(key) {
  state.selected = state.selected === key ? null : key;
  render();
  if (!state.selected || isPlanKey(key)) return;
  // Start Claude in the background now, so Ask Claude doesn't wait for it to start.
  assistantInfo().then((info) => { if (info.available && !state.warmed) { state.warmed = true; S2.callTool("query_history_assistant_warm", {}).catch(() => {}); } });
  if (!state.detail[key]) {
    state.detail[key] = { loading: true };
    renderDetail();
    try { state.detail[key] = { event: (await S2.callTool("query_history_event", { key })).event }; }
    catch (err) { state.detail[key] = { error: err }; }
    renderDetail();
  }
}

async function tune(key) {
  state.tuning[key] = { loading: true };
  renderDetail();
  try {
    state.tuning[key] = { result: isPlanKey(key)
      ? await S2.callTool("query_history_plan_tuning", { plan_key: selectedPlan()?.plan_keys?.[0] ?? "" })
      : await S2.callTool("query_history_tuning", { key }) };
  } catch (err) { state.tuning[key] = { error: err }; }
  renderDetail();
  reportContext();
}

// Hand statements to the SQL Editor (added below what's there, not run). In the workspace it switches
// to the SQL view; on its own it opens the SQL Editor in the browser.
function toEditor(sql, database) {
  if (S2.embedded()) { S2.openView("sql", { sql, database: database ?? null, append: true }); return; }
  S2.openAppInBrowser("sql_editor", { sql, database: database ?? null }).catch((err) => S2.toast(String(err.message ?? err), "err"));
}
const editorButton = (sql, database) => h("button", { class: "s2-btn ghost", style: { marginTop: "4px" },
  title: "Put these statements in the SQL Editor (below what's there; nothing runs)", onclick: () => toEditor(sql, database) }, "Open in SQL Editor");

const S2W = { strip: (sql) => sql.replace(/^\s*\/\* workload:[^*]*\*\/\s*/, "") };

function copy(text) {
  S2.copy(text);
}

function chatPrompt(row, ev, tuning) {
  const recs = tuning?.result?.recommendations?.map((r) => `- [${r.severity}] ${r.title}: ${r.detail}${r.sql ? `\n  ${r.sql}` : ""}`).join("\n");
  const plan = tuning?.result?.explain?.lines?.join("\n");
  return (`This SingleStore query ran ${secs(row.ms)} (user ${row.user}, database ${row.database ?? "none"}, ${row.ok ? "succeeded" : `failed: ${ev.error_message ?? row.error_code}`}, ${row.rows ?? "?"} rows). ` +
    `How can it be made faster?\n\n${maskSecrets(ev.query_text)}` +
    (recs ? `\n\nThe Query History app's analysis:\n${recs}` : "") + (plan ? `\n\nEXPLAIN:\n${plan}` : ""));
}

function renderDetail() {
  const key = state.selected;
  if (isPlanKey(key)) { renderPlanDetail(); return; }
  const row = state.data?.events.find((e) => e.key === key);
  if (!key || !row) { detailEl.replaceChildren(); return; }
  const d = state.detail[key] ?? {};
  const ev = d.event;
  const t = state.tuning[key];
  const pc = planOf(row);
  const same = state.data.events.filter((e) => e.stmt === row.stmt);
  const meta = [
    ["Started", when(ev?.start_time ?? row.started)], ["Finished", when(row.finished)], ["Duration", secs(row.ms)],
    ["User", row.user ?? "–"], ["Database", row.database ?? "–"], ["Type", row.category ?? "–"],
    ["Rows", row.rows == null ? "–" : fmt.number(row.rows)], ["Resource pool", row.pool ?? "–"],
    ...(row.origin ? [["Source", `${row.origin} (probably)${sentBy(row.origin) ? ` · ran on SingleStore, sent by ${sentBy(row.origin)}` : ""}`]] : []),
    ["Connection", ev?.connection_id ?? "–"], ["Plan ID", row.plan_id ?? "–"],
    ...(row.tables?.length ? [["Tables", row.tables.join(", ")]] : []),
    ...(same.length > 1 ? [["Same statement", `${same.length} runs in the list · avg ${secs(same.reduce((a, e) => a + e.ms, 0) / same.length)} · p95 ${secs(p95(same.map((e) => e.ms)))}`]] : []),
  ];
  const r = t?.result;
  fill(detailEl,
    h("div", { style: { display: "flex", alignItems: "center", gap: "8px" } },
      h("h2", {}, `${secs(row.ms)} query`),
      S2.engineChip("s2", S2.connections().s2, { verb: "Ran" }),
      sentBy(row.origin) ? h("span", { class: "s2-small s2-muted", title: "Guessed from the SQL" }, `sent by ${sentBy(row.origin)}`) : null,
      row.own ? h("span", { class: "s2-badge plain", title: "A statement this Studio sent for itself" }, "Studio") : null,
      row.ok ? h("span", { class: "s2-badge ok" }, "Succeeded") : h("span", { class: "s2-badge err" }, "Failed"),
      row.kept ? h("span", { class: "s2-badge plain", title: KEPT_TITLE }, "Kept locally") : null,
      h("span", { class: "s2-spacer" }),
      h("button", { class: "s2-btn ghost", "aria-label": "Close details", onclick: () => { state.selected = null; render(); } }, "✕")),
    h("dl", { class: "qh-meta" }, meta.flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, String(v))])),
    ev?.kept_note ? h("div", { class: "s2-small s2-faint", style: { marginBottom: "6px" } }, ev.kept_note) : null,
    pc ? h("details", { class: "qh-more", open: true }, h("summary", {}, "This statement in the plan cache (every run, since its plan was compiled)"), planCacheTable(pc)) : null,
    !row.ok && ev?.error_message ? h("div", { class: "s2-error", style: { marginBottom: "8px" } }, `${ev.error_code ?? ""} ${ev.error_message}`) : null,
    d.loading ? h("div", { class: "s2-small s2-muted" }, h("span", { class: "s2-spinner" }), " Loading the full SQL…")
      : d.error ? S2.errorBox(d.error)
      : h("pre", { class: "s2-pre qh-sql" }, maskSecrets(ev?.query_text ?? row.sql)),
    h("div", { class: "qh-actions" },
      h("button", { class: "s2-btn primary", disabled: !ev || t?.loading, onclick: () => tune(key) },
        t?.loading ? h("span", { class: "s2-spinner" }) : null, r ? "Analyze again" : "Get tuning recommendations"),
      h("button", { class: "s2-btn", disabled: !ev, onclick: () => copy(ev.query_text ?? "") }, "Copy SQL"),
      S2.embedded() ? h("button", { class: "s2-btn", disabled: !ev, title: "Add this query to a test workload (Workload view) to replay it at a set rate",
        onclick: () => S2.openView("workload", { sql: S2W.strip(ev.query_text ?? ""), database: row.database ?? null }) }, "Add to workload") : null,
      S2.askClaudeButton({ disabled: !ev || state.claude[key]?.running, title: "Ask Claude: Claude looks at the query, the plan and the tables (read-only) and answers here",
        onclick: () => askInApp(row, ev, t) })),
    claudeBox(key),
    t?.loading ? h("div", { class: "s2-small s2-muted" }, "Analyzing: EXPLAIN, plan statistics and table design (EXPLAIN doesn't run the query)…") : null,
    t?.error ? S2.errorBox(t.error) : null,
    r ? tuningBlock(key, r, row.database, { ms: row.ms }) : null);
}

// A statement known only from the plan cache: its totals, its (parameterized) text, and tuning from its plan.
function renderPlanDetail() {
  const key = state.selected;
  const p = selectedPlan();
  if (!p) { detailEl.replaceChildren(); return; }
  const t = state.tuning[key];
  const r = t?.result;
  fill(detailEl,
    h("div", { style: { display: "flex", alignItems: "center", gap: "8px" } },
      h("h2", {}, `${secs(p.avg_ms)} on average`),
      h("span", { class: "s2-badge plain" }, p.live ? "Plan cache" : "Plan cache (kept locally)"),
      p.pinned ? h("span", { class: "s2-badge info plain", title: "Opened from the SQL Editor's Find in Query History: SAS sent this statement to SingleStore" }, "from the SQL Editor") : null,
      h("span", { class: "s2-spacer" }),
      h("button", { class: "s2-btn ghost", "aria-label": "Close details", onclick: () => { state.selected = null; render(); } }, "✕")),
    h("div", { class: "s2-small s2-faint", style: { margin: "6px 0" } },
      "Aggregates from the plan cache (MV_PLANCACHE), not a single run: every execution since the plan was compiled, however short. ",
      `The trace keeps only runs of at least ${fmt.number(state.data?.trace?.duration_threshold_ms ?? 1000)} ms, and none of this statement's runs are in it. `,
      "The plan cache shows the statement with its values replaced (@ numbers, ^ strings), and keeps no user."),
    h("dl", { class: "qh-meta" }, [["Database", p.database ?? "–"], ["Aggregators", p.nodes.map((n) => `node ${n}`).join(", ")],
      ...(p.origin ? [["Source", `${p.origin} (probably)${sentBy(p.origin) ? ` · ran on SingleStore, sent by ${sentBy(p.origin)}` : ""}`]] : []), ...(p.tables?.length ? [["Tables", p.tables.join(", ")]] : [])]
      .flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, String(v))])),
    planCacheTable(p),
    h("pre", { class: "s2-pre qh-sql" }, p.sql + (p.sql_truncated ? " …" : "")),
    h("div", { class: "qh-actions" },
      h("button", { class: "s2-btn primary", disabled: t?.loading, onclick: () => tune(key) },
        t?.loading ? h("span", { class: "s2-spinner" }) : null, r ? "Analyze again" : "Get tuning recommendations"),
      h("button", { class: "s2-btn", onclick: () => copy(p.sql) }, "Copy SQL")),
    t?.loading ? h("div", { class: "s2-small s2-muted" }, "Analyzing the cached plan (nothing runs)…") : null,
    t?.error ? S2.errorBox(t.error) : null,
    r ? tuningBlock(key, r, p.database, { aggregate: true }) : null);
}

// Plan cache totals: from collect()'s plan rows (lower-case keys).
function planCacheTable(p) {
  const runs = Number(p.runs) || 0;
  const rows = [
    ["Executions", `${fmt.number(runs)}${p.failed ? ` (${fmt.number(p.failed)} failed / rolled back)` : ""}`],
    ["Average time", secs(Number(p.avg_ms) || 0)], ["Total time", secs(Number(p.exec_ms) || 0)],
    ["CPU time / run", runs ? secs((Number(p.cpu_ms) || 0) / runs) : "–"],
    ["Average memory (max)", fmt.bytes(p.avg_max_mem || p.avg_mem || 0)],
    ["Average disk spilling", fmt.bytes(p.avg_spill ?? 0)],
    ["Blob cache misses / run", fmt.bytes(p.avg_blob_miss ?? 0)],
    ["Blob cache wait / run", runs ? secs((Number(p.blob_wait_ms) || 0) / runs) : "–"],
    ["Queued / run", runs ? secs((Number(p.queued_ms) || 0) / runs) : "–"],
    ["Rows (all runs)", fmt.number(p.rows ?? 0)],
    ["Compiled", when(p.first_load)], ["Last run", when(p.last_executed)],
  ];
  return h("div", {}, h("table", { class: "qh-kv" }, h("tbody", {}, rows.map(([k, v]) => h("tr", {}, h("td", {}, k), h("td", {}, v))))),
    p.warnings ? h("div", { class: "s2-small", style: { marginTop: "4px" } }, h("strong", {}, "Plan warnings: "), p.warnings) : null);
}

// ---------------------------------------------------------------- SAS Embedded Process card
// For sasepFunction calls (and EP.sasep… bookkeeping): what drives an EP job's runtime, from sas_ep.analyze.
const maskSecrets = (sql) => String(sql ?? "").replace(/(\w*(?:password|secret|token)\w*\s*=\s*\\?")((?:[^"\\]|\\.)*?)(\\?")/gi, "$1***$3");
const EP_LEVEL = { ok: ["ok", "Fine"], warn: ["warn", "Worth a look"], crit: ["err", "Problem"], info: ["plain", "Not available"] };

function sparkline(runs) {
  if (!runs?.length) return null;
  const W = 220, H = 40, pad = 3;
  const max = Math.max(...runs.map((r) => r.ms), 1);
  const x = (i) => pad + (runs.length === 1 ? (W - 2 * pad) / 2 : (i / (runs.length - 1)) * (W - 2 * pad));
  const y = (v) => H - pad - (v / max) * (H - 2 * pad);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img", "aria-label": "Runtime of each run" });
  svg.append(svgEl("path", { d: runs.map((r, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(r.ms).toFixed(1)}`).join(""),
    fill: "none", stroke: "var(--s2-info)", "stroke-width": 1.5 }));
  runs.forEach((r, i) => {
    const dot = svgEl("circle", { cx: x(i), cy: y(r.ms), r: 2.2, fill: r.ok ? "var(--s2-info)" : "var(--s2-err)" });
    dot.append(svgEl("title", {}, `${when(r.t)}: ${secs(r.ms)}${r.ok ? "" : " (failed)"}`));
    svg.append(dot);
  });
  return svg;
}

const EP_SEG = { wait: "wait", queue: "queue", work: "work", other: "other" };
function epSplit(segments, total) {
  const sum = Math.max(total || 0, segments.reduce((a, x) => a + x.ms, 0), 1);
  return h("div", {},
    h("div", { class: "qh-ep-split", role: "img", "aria-label": segments.map((x) => `${x.label} ${secs(x.ms)}`).join(", ") },
      segments.map((x) => h("span", { class: EP_SEG[x.kind] ?? "other", style: { width: `${(x.ms / sum) * 100}%` }, title: `${x.label}: ${secs(x.ms)} (${x.how})` }))),
    h("div", { class: "qh-ep-legend" }, segments.map((x) => h("span", {}, h("i", { class: EP_SEG[x.kind] ?? "other" }),
      `${x.label} ${secs(x.ms)}${x.how === "estimate" ? " (est.)" : ""}`))));
}

function epExtra(p) {
  if (p.key === "breakdown" && p.segments?.length) return epSplit(p.segments, p.total_ms);
  if (p.key === "peers" && p.histogram?.length) {
    const max = Math.max(...p.histogram.map((b) => b.n), 1);
    const inBucket = (b) => p.this_ms >= b.lo_ms && p.this_ms < b.lo_ms + 250;
    const onPlateau = (b) => p.plateau && b.lo_ms + 250 > p.plateau.low_ms && b.lo_ms <= p.plateau.high_ms;
    return h("details", { class: "qh-more" }, h("summary", {}, "Runtime of the traced EP calls"),
      h("div", { class: "qh-ep-parts qh-ep-hist" }, p.histogram.map((b) => h("div", { class: `qh-ep-part${inBucket(b) ? " on" : ""}` },
        h("span", { class: "lbl" }, `${(b.lo_ms / 1000).toFixed(2)}${b.more ? "+" : ""} s`),
        h("span", { class: `qh-bar${onPlateau(b) ? " warn" : ""}` }, h("span", { style: { width: `${Math.max(2, (b.n / max) * 100)}%` } })),
        h("span", { class: "num" }, `${b.n} call${b.n === 1 ? "" : "s"}${inBucket(b) ? " (this one)" : ""}`)))));
  }
  if (p.key === "burst" && p.members?.length) {
    const end = Math.max(...p.members.map((m) => m.end_offset_s), 0.001);
    return h("div", { class: "qh-ep-parts" }, p.members.map((m) => h("div", { class: `qh-ep-part${m.this ? " on" : ""}`, title: `starts +${m.start_offset_s} s, ends +${m.end_offset_s} s` },
      h("span", { class: "lbl" }, m.this ? "this" : ""),
      h("span", { class: "qh-bar" }, h("span", { style: { marginLeft: `${(m.start_offset_s / end) * 100}%`, width: `${Math.max(2, ((m.end_offset_s - m.start_offset_s) / end) * 100)}%` } })),
      h("span", { class: "num" }, `+${m.start_offset_s} s → +${m.end_offset_s} s · ${secs(m.ms)}${m.rows != null ? ` · ${fmt.number(m.rows)} rows` : ""}`))));
  }
  if (p.key === "skew" && p.partitions?.length) {
    const max = Math.max(...p.partitions.map((x) => x.rows), 1);
    return h("div", { class: "qh-ep-parts" }, p.partitions.map((x) => h("div", { class: "qh-ep-part", title: `${x.host ?? ""}${x.bytes ? ` · ${fmt.bytes(x.bytes)}` : ""}` },
      h("span", { class: "lbl" }, `p${x.partition}`),
      h("span", { class: "qh-bar" }, h("span", { style: { width: `${Math.max(2, (x.rows / max) * 100)}%` } })),
      h("span", { class: "num" }, `${fmt.number(x.rows)} rows${x.bytes ? ` · ${fmt.bytes(x.bytes)}` : ""}`))));
  }
  if (p.key === "spread" && p.partitions?.length) {
    const max = Math.max(...p.partitions.map((x) => x.ms), 1);
    return h("div", { class: "qh-ep-parts" }, p.partitions.map((x) => h("div", { class: "qh-ep-part" },
      h("span", { class: "lbl" }, `p${x.partition}`),
      h("span", { class: "qh-bar" }, h("span", { style: { width: `${Math.max(2, (x.ms / max) * 100)}%` } })),
      h("span", { class: "num" }, secs(x.ms)))));
  }
  if (p.key === "data" && !p.generated && (p.filter || p.passed)) {
    return p.filter ? h("div", { class: "s2-small" }, h("strong", {}, "Filter: "), p.filter,
      h("span", { class: "s2-faint" }, ` · input sort key: ${p.sort_key?.length ? `(${p.sort_key.join(", ")})` : "none"}`)) : null;
  }
  if (p.key === "cores" && p.leaves?.length) {
    return h("div", { class: "s2-small s2-faint" }, p.leaves.map((l) =>
      `node ${l.node}: ${l.partitions} partition${l.partitions === 1 ? "" : "s"}, ${l.cores} core${l.cores === 1 ? "" : "s"}${l.cores < l.host_cpus ? ` (limit; host has ${l.host_cpus})` : ""}`).join(" · "));
  }
  if (p.key === "data" && (p.generated || p.filter)) {
    return h("details", { class: "qh-more" }, h("summary", {}, `The statement the EP generated (from the ${p.generated_source ?? "history"})`),
      p.filter ? h("div", { class: "s2-small" }, h("strong", {}, "Filter: "), p.filter) : null,
      p.sort_key ? h("div", { class: "s2-small s2-faint" }, `Input sort key: ${p.sort_key.length ? `(${p.sort_key.join(", ")})` : "none"}`) : null,
      h("pre", { class: "s2-pre" }, p.generated));
  }
  if (p.key === "trend" && p.runs?.length) {
    return h("div", { style: { display: "flex", alignItems: "center", gap: "10px", flexWrap: "wrap" } }, sparkline(p.runs),
      p.change != null ? h("span", { class: "s2-small" }, `${p.change >= 1 ? "+" : ""}${Math.round((p.change - 1) * 100)}% (later half vs earlier half)`) : null);
  }
  return null;
}

function epCard(ep) {
  if (!ep) return null;
  if (ep.error) return h("section", { class: "qh-ep" }, h("h3", {}, "SAS Embedded Process"), S2.errorBox(ep.error));
  if (ep.bookkeeping) return h("section", { class: "qh-ep" }, h("h3", {}, "SAS Embedded Process bookkeeping"), h("p", { class: "s2-small" }, ep.summary));
  return h("section", { class: "qh-ep", "aria-label": "SAS Embedded Process analysis" },
    h("h3", {}, `SAS Embedded Process · ${ep.kind_label ?? "sasepFunction job"}${ep.command ? ` · ${ep.command}` : ""}`),
    h("div", { class: "s2-small s2-faint" },
      ep.kind === "format"
        ? [`Reads ${(ep.inputs ?? []).join(", ") || "?"}${ep.partition != null ? ` (partition ${ep.partition} of a parallel load)` : ""}. `,
          "SAS Visual Analytics / CAS joins the rows with a per-job EP format function (",
          (ep.functions ?? []).map((f) => `EP.${f.name.slice(0, 10)}…(${f.args.join(", ")})`).join(", "),
          "); the function name changes every run, so runs are matched by the statement with the name left out. "]
        : [ep.input ? `Reads ${ep.input}${ep.output ? ` → writes ${ep.output}` : ""}. ` : "",
          "SAS runs the step inside SingleStore: the EP generates CREATE TABLE … AS SELECT … FROM the input JOIN a per-job EP function, which runs on the leaves, one task per partition. "],
      "What sets its time: a fixed wait on the EP side (compared with every other EP call), the largest partition, partitions per core, how much data goes in, and queueing."),
    ep.note ? h("div", { class: "s2-small" }, ep.note) : null,
    (ep.points ?? []).map((p) => {
      const v = p.verdict ?? {};
      const [cls, label] = EP_LEVEL[v.level] ?? EP_LEVEL.info;
      return h("div", { class: `qh-ep-point ${v.level ?? "info"}` },
        h("div", { class: "t" }, h("span", { class: `s2-badge ${cls}` }, label), h("strong", {}, p.title),
          p.value ? h("span", { class: "s2-small s2-faint" }, ` · ${p.value}`) : null),
        v.text ? h("p", {}, v.text) : null,
        v.step ? h("p", { class: "step" }, h("strong", {}, "Next step: "), v.step) : null,
        epExtra(p));
    }),
    epTips(ep.tips));
}

const TIP_KIND = { measured: ["info", "Measured"], documented: ["ok", "Documented"], hypothesis: ["warn", "Hypothesis"] };
function epTips(tips) {
  if (!tips?.length) return null;
  return h("div", { class: "qh-ep-point" },
    h("div", { class: "t" }, h("strong", {}, "Tuning tips"), h("span", { class: "s2-small s2-faint" }, " · measured here, documented, or a hypothesis to verify")),
    h("ul", { class: "qh-ep-tips" }, tips.map((t) => {
      const [cls, label] = TIP_KIND[t.kind] ?? TIP_KIND.hypothesis;
      return h("li", {}, h("span", { class: `s2-badge ${cls}` }, label), " ", t.text,
        t.sources?.length ? h("span", { class: "src" }, " Sources: ", t.sources.map((x, i) => [i ? ", " : "",
          h("a", { href: x.url, target: "_blank", rel: "noopener", title: x.title, onclick: (ev) => { ev.preventDefault(); openDoc(x.url); } },
            x.short ?? x.title)])) : null);
    })));
}

// Links go through the host (MCP Apps can't navigate themselves); copied when the host can't open them.
async function openDoc(url) {
  try {
    const res = await S2.app.openLink({ url });
    if (res?.isError) throw new Error("refused");
  } catch {
    S2.copy(url, "Link copied (this host can't open links)");
  }
}

function tuningBlock(key, r, database, ctx) {
  return h("div", {},
    epCard(r.sas_ep),
    r.recommendations.length || !r.sas_ep ? h("h2", { style: { marginTop: "6px" } }, "Recommendations") : null,
    r.recommendations.map((rec) => h("div", { class: `qh-rec ${rec.severity}` },
      h("div", { class: "t" }, h("span", { class: `s2-badge ${rec.severity === "high" ? "err" : rec.severity === "medium" ? "warn" : "info"}` },
        rec.severity === "high" ? "High" : rec.severity === "medium" ? "Medium" : "Info"), rec.title),
      h("p", {}, rec.detail),
      rec.sql ? h("div", {}, h("pre", { class: "s2-pre" }, rec.sql),
        h("button", { class: "s2-btn ghost", style: { marginTop: "4px" }, onclick: () => copy(rec.sql) }, "Copy"),
        editorButton(rec.sql, database)) : null)),
    statsBox(key, r),
    r.plan_note ? h("div", { class: "s2-small s2-faint", style: { marginTop: "8px" } }, r.plan_note) : null,
    planSection(key, r, ctx),
    r.plan && !ctx.aggregate ? h("details", { class: "qh-more" }, h("summary", {}, "Plan cache statistics"), planTable(r.plan)) : null,
    r.tables.length ? h("details", { class: "qh-more" }, h("summary", {}, `Tables (${r.tables.length})`),
      r.tables.map((tb) => h("div", { style: { marginTop: "6px" } },
        h("strong", {}, `${tb.database}.${tb.table}`), " ",
        tb.error ? h("span", { class: "s2-faint" }, tb.error)
          : h("span", { class: "s2-faint" }, `${tb.reference ? "reference" : tb.rowstore ? "rowstore" : "columnstore"} · shard key ${tb.shard_key == null ? "none" : tb.shard_key === "" ? "() keyless" : `(${tb.shard_key})`} · sort key ${tb.sort_key == null ? "none" : tb.sort_key === "" ? "() unordered" : `(${tb.sort_key})`}`),
        tb.ddl ? h("pre", { class: "s2-pre" }, tb.ddl) : null))) : null);
}

// ---------------------------------------------------------------- the plan: tree, raw text / JSON, PROFILE
const OP_ICONS = [
  [/^(ColumnStoreScan|ColumnStoreScanByKey|TableScan)$/, "▤"], [/^Index/, "⌕"], [/Filter/, "⧩"],
  [/Join|HashTableProbe/, "⋈"], [/HashTableBuild/, "#"], [/GroupBy|Aggregate/, "Σ"], [/Sort|Top|OrderedUnion/, "⇅"],
  [/^Gather/, "⇡"], [/^Broadcast/, "⇶"], [/Repartition|Shuffle/, "⇄"], [/^Insert|^Update|^Delete/, "✎"],
  [/Project/, "▸"], [/Union/, "∪"], [/GeneratedTable|TableFunc/, "ƒ"],
];
const opIcon = (op) => (OP_ICONS.find(([re]) => re.test(op)) ?? [null, "•"])[1];
const num = (v) => (v == null || v === "" ? null : Number(v));

function opNode(n, scale, profiled) {
  const flags = n.flags ?? [];
  const level = flags.some((f) => f[0] === "crit") ? "crit" : flags.length ? "warn" : "";
  const m = n.m ?? {};
  const facts = [];
  if (profiled) {
    if (m.actual_row_count != null) facts.push(`${fmt.number(m.actual_row_count)} rows`);
    if (m.actual_total_time != null) facts.push(`${fmt.number(m.actual_total_time)} ms`);
    if (m.memory_usage) facts.push(fmt.bytes(m.memory_usage));
    if (m.segments_scanned != null) facts.push(`segments ${fmt.number(m.segments_scanned)} read / ${fmt.number(m.segments_skipped ?? 0)} skipped`);
    if (m.network_traffic) facts.push(`${fmt.bytes(m.network_traffic)} sent`);
  }
  if (n.est_rows != null) facts.push(`est. ${fmt.number(num(n.est_rows))} rows`);
  if (n.est_table_rows != null) facts.push(`table ${fmt.number(num(n.est_table_rows))} rows${n.est_filtered != null ? ` → ${fmt.number(num(n.est_filtered))} after filter` : ""}`);
  if (n.local_est_rows != null) facts.push(`join est. ${fmt.number(num(n.local_est_rows))} rows`);
  if (n.est_select_cost != null) facts.push(`cost ${fmt.number(num(n.est_select_cost))}`);
  if (n.type) facts.push(n.type);
  if (n.shard_key) facts.push(`on (${n.shard_key.join(", ")})`);
  if (n.index && /SORT KEY|KEY/.test(n.index)) facts.push(n.index.includes("__UNORDERED") ? "no sort key" : n.index);
  if (n.table_type) facts.push(n.table_type);
  const weight = profiled ? (m.actual_total_time ?? 0) : Math.log10(1 + (num(n.est_rows) ?? num(n.est_table_rows) ?? 0));
  const detail = [...(n.condition ?? []), ...(n.groups ? [`group by ${n.groups.join(", ")}`] : []), ...(n.order ? [`order by ${n.order.join(", ")}`] : [])];
  const box = h("div", { class: `qh-op ${level}`, title: n.query ? `Runs on the leaves: ${n.query}` : "" },
    h("span", { class: "ic", "aria-hidden": "true" }, opIcon(n.op)),
    h("span", { class: "nm" }, n.subselect ? `${n.op} (subquery)` : n.op),
    n.table ? h("span", { class: "tb" }, `${n.db ? `${n.db}.` : ""}${n.table}${n.alias && n.alias !== n.table ? ` ${n.alias}` : ""}`) : null,
    scale > 0 ? h("span", { class: "heat", title: profiled ? "Share of the slowest operator's time" : "Rows (log scale)" },
      h("span", { style: { width: `${Math.max(2, Math.min(100, (weight / scale) * 100))}%` } })) : null,
    facts.length ? h("span", { class: "kv" }, facts.join(" · ")) : null,
    detail.length ? h("span", { class: "cond" }, detail.join(" · ").slice(0, 300)) : null,
    flags.map(([lvl, text]) => h("span", { class: `qh-flag ${lvl}` }, `${lvl === "crit" ? "✖" : "▲"} ${text}`)));
  return h("li", {}, box, n.inputs?.length ? h("ul", {}, n.inputs.map((c) => opNode(c, scale, profiled))) : null);
}

function planTree(tree) {
  const profiled = tree.kind === "profile";
  let scale = 0;
  const walk = (n) => {
    scale = Math.max(scale, profiled ? (n.m?.actual_total_time ?? 0) : Math.log10(1 + (num(n.est_rows) ?? num(n.est_table_rows) ?? 0)));
    (n.inputs ?? []).forEach(walk);
  };
  tree.operators.forEach(walk);
  const flagged = [];
  const collect = (n) => { (n.flags ?? []).forEach((f) => flagged.push([f[0], `${n.op}${n.table ? ` ${n.table}` : ""}: ${f[1]}`])); (n.inputs ?? []).forEach(collect); };
  tree.operators.forEach(collect);
  return h("div", {},
    flagged.length ? h("div", { class: "s2-small", style: { margin: "6px 0" } }, h("strong", {}, `${flagged.length} expensive part${flagged.length === 1 ? "" : "s"}: `),
      flagged.slice(0, 6).map(([, t]) => t).join(" · ")) : h("div", { class: "s2-small s2-faint", style: { margin: "6px 0" } }, "Nothing stands out in this plan."),
    tree.missing_histograms?.length ? h("div", { class: "s2-small", style: { marginBottom: "4px" } }, "No histograms on: ",
      tree.missing_histograms.map((x) => `${x.database}.${x.table} (${x.columns.join(", ")})`).join("; ")) : null,
    tree.warnings?.length ? h("div", { class: "s2-small", style: { marginBottom: "4px" } }, h("strong", {}, "Warnings: "), tree.warnings.join(" · ")) : null,
    h("div", { class: "qh-ptree" }, h("ul", {}, tree.operators.map((n) => opNode(n, scale, profiled)))),
    h("div", { class: "s2-small s2-faint", style: { marginTop: "4px" } }, profiled
      ? "Read top-down: each operator gets its rows from the ones indented under it. Bars: time, relative to the slowest operator."
      : "Read top-down: each operator gets its rows from the ones indented under it. Bars: estimated rows (log scale). Hover an operator that runs on the leaves for its SQL."));
}

async function runProfile(key) {
  state.profile[key] = { loading: true };
  renderDetail();
  try {
    state.profile[key] = { result: await S2.callTool("query_history_profile", { key }) };
    state.planView[key] = "profile";
  } catch (err) { state.profile[key] = { error: err }; }
  renderDetail();
}

function planSection(key, r, ctx) {
  const pr = state.profile[key];
  const views = [];
  if (r.tree) views.push(["tree", "Plan"]);
  if (pr?.result) views.push(["profile", "Profile"]);
  if (r.explain.lines.length) views.push(["text", "Raw EXPLAIN"]);
  if (r.tree?.raw) views.push(["json", "Raw JSON"]);
  if (pr?.result?.raw) views.push(["pjson", "Raw profile JSON"]);
  const view = views.some(([v]) => v === state.planView[key]) ? state.planView[key] : views[0]?.[0];
  const profileBtn = r.profile_allowed ? h("button", { class: "s2-btn ghost", disabled: pr?.loading,
    title: "PROFILE runs the query once more and measures each operator: actual rows, time, memory, spilling, segments skipped",
    onclick: async (e) => {
      const ok = await S2.confirmInline(e.currentTarget,
        `PROFILE runs this query again on the cluster${ctx.ms ? ` (last time it took ${secs(ctx.ms)})` : ""}; it's read-only and is cancelled after 5 minutes. Run it?`, "Profile it");
      if (ok) runProfile(key);
    } }, pr?.loading ? [h("span", { class: "s2-spinner" }), " Profiling…"] : pr?.result ? "Profile again" : "Profile (runs it)") : null;
  if (!views.length && !profileBtn) return r.explain.error ? h("div", { class: "s2-small s2-faint", style: { marginTop: "8px" } }, r.explain.error) : null;
  let body = null;
  if (view === "tree") body = planTree(r.tree);
  else if (view === "profile") body = h("div", {}, h("div", { class: "s2-small", style: { marginTop: "6px" } },
    `Profiled run: ${secs(pr.result.total_ms ?? pr.result.wall_ms)} on the server${pr.result.wall_ms ? ` (${secs(pr.result.wall_ms)} including reading the result)` : ""}.`), planTree(pr.result));
  else if (view === "text") body = h("pre", { class: "s2-pre", style: { maxHeight: "360px", overflow: "auto", whiteSpace: "pre" } }, r.explain.lines.join("\n"));
  else if (view === "json") body = h("pre", { class: "s2-pre", style: { maxHeight: "360px", overflow: "auto", whiteSpace: "pre" } }, r.tree.raw);
  else if (view === "pjson") body = h("pre", { class: "s2-pre", style: { maxHeight: "360px", overflow: "auto", whiteSpace: "pre" } }, pr.result.raw);
  return h("section", {},
    h("div", { class: "qh-planbar" }, h("h2", {}, "Plan"),
      views.length > 1 ? h("span", { class: "qh-seg", role: "group", "aria-label": "Plan view" },
        views.map(([v, label]) => h("button", { "aria-pressed": String(v === view), onclick: () => { state.planView[key] = v; renderDetail(); } }, label))) : null,
      h("span", { class: "s2-spacer" }), profileBtn),
    pr?.error ? S2.errorBox(pr.error) : null,
    body,
    !r.tree && r.explain.error ? h("div", { class: "s2-small s2-faint", style: { marginTop: "6px" } }, r.explain.error) : null);
}

// ---------------------------------------------------------------- statistics: ANALYZE TABLE from here
// The Schema Explorer's tools do the work: schema_explorer_analyze_plan (read-only: stats age, why stale, the
// exact statements) and schema_explorer_analyze (runs ANALYZE TABLE, only with confirm=true after the user said so).
function statsBox(key, r) {
  const tables = r.stats_tables ?? [];
  if (!tables.length) return null;
  const stale = tables.some((t) => t.missing_stats) || r.recommendations.some((x) => /statistics/i.test(x.title));
  const byDb = {};
  for (const t of tables) (byDb[t.database] ??= []).push(t.table);
  const a = (state.analyze[key] ??= {});
  const parts = Object.entries(byDb).map(([dbname, names]) => {
    const s = a[dbname] ?? {};
    const head = h("div", { style: { display: "flex", alignItems: "center", gap: "8px", marginTop: "6px", flexWrap: "wrap" } },
      h("span", { class: "s2-mono" }, `${dbname}: ${names.join(", ")}`), h("span", { class: "s2-spacer" }),
      !s.plan && !s.result ? h("button", { class: `s2-btn ${stale ? "primary" : ""}`, disabled: s.loading, onclick: () => analyzePlan(key, dbname, names) },
        s.loading ? h("span", { class: "s2-spinner" }) : null, `Check statistics${names.length > 1 ? ` (${names.length} tables)` : ""}…`) : null);
    const out = [head];
    if (s.error) out.push(S2.errorBox(s.error));
    if (s.plan) {
      const p = s.plan;
      out.push(h("table", { class: "s2-table" },
        h("thead", {}, h("tr", {}, h("th", {}, "Table"), h("th", { class: "num" }, "Rows"), h("th", {}, "Statistics"), h("th", {}, "Stale?"))),
        h("tbody", {}, (p.tables ?? []).map((t) => h("tr", {},
          h("td", { class: "s2-mono" }, t.table), h("td", { class: "num" }, t.rows == null ? "–" : fmt.number(t.rows)),
          h("td", {}, t.stats?.age_days != null ? `updated ${t.stats.age_days} days ago` : t.stats?.last_updated_newest ? `updated ${when(t.stats.last_updated_newest)}` : "none"),
          h("td", {}, t.stale ? h("span", { class: "s2-badge warn", title: (t.reasons ?? []).join("; ") }, (t.reasons ?? []).join("; ") || "stale") : h("span", { class: "s2-badge ok" }, "up to date")))))),
      (p.missing?.length || p.skipped_views?.length) ? h("div", { class: "s2-small s2-faint" },
        [p.missing?.length ? `Not found: ${p.missing.join(", ")}.` : "", p.skipped_views?.length ? ` Views skipped: ${p.skipped_views.join(", ")}.` : ""].join("")) : null,
      p.statements?.length ? h("pre", { class: "s2-pre" }, p.statements.join("\n")) : null);
      if (p.statements?.length && !s.result) {
        const tablesToRun = (p.tables ?? []).map((t) => t.table);
        out.push(h("div", { class: "qh-actions" },
          h("button", { class: "s2-btn primary", disabled: s.running, onclick: async (e) => {
            const ok = await S2.confirmInline(e.currentTarget,
              `Run ${tablesToRun.length} ANALYZE TABLE statement${tablesToRun.length === 1 ? "" : "s"} in ${dbname}? It reads the table${tablesToRun.length === 1 ? "" : "s"} to rebuild the optimizer's statistics (load on the cluster; data is not changed).`, "Analyze");
            if (ok) runAnalyze(key, dbname, tablesToRun);
          } }, s.running ? [h("span", { class: "s2-spinner" }), " Analyzing…"] : `Analyze table${tablesToRun.length === 1 ? "" : "s"}`),
          h("button", { class: "s2-btn ghost", onclick: () => copy(p.statements.join("\n")) }, "Copy"),
          h("button", { class: "s2-btn ghost", onclick: () => { delete a[dbname]; renderDetail(); } }, "Cancel")));
      }
    }
    if (s.result) {
      const res = s.result;
      out.push(h("div", { class: "s2-small", style: { marginTop: "4px" } },
        `${fmt.number(res.analyzed ?? 0)} analyzed${res.errors ? `, ${res.errors} error${res.errors === 1 ? "" : "s"}` : ""}: `,
        (res.results ?? []).map((x) => `${x.table} ${x.status}${x.seconds != null ? ` (${x.seconds} s)` : ""}${x.error ? ` – ${x.error}` : ""}`).join(" · ")),
        h("div", { class: "s2-small s2-faint" }, "Run the tuning analysis again to see the plan with the new statistics."));
    }
    return out;
  });
  return h("section", { class: `qh-stats-box${stale ? " stale" : ""}` },
    h("h3", {}, stale ? "Statistics may be missing or stale" : "Statistics of the tables this query reads"),
    h("div", { class: "s2-small s2-faint" }, stale
      ? "Poor statistics make the optimizer misjudge row counts, join order and data movement. Check them, then refresh them with ANALYZE TABLE."
      : "If the plan's row estimates look wrong, check the optimizer's statistics and refresh them."),
    parts);
}

async function analyzePlan(key, dbname, tables) {
  const a = state.analyze[key];
  a[dbname] = { loading: true };
  renderDetail();
  try { a[dbname] = { plan: await S2.callTool("schema_explorer_analyze_plan", { database: dbname, tables }) }; }
  catch (err) {
    const msg = String(err?.message ?? err);
    a[dbname] = { error: /unknown tool|not found|not an app tool/i.test(msg) ? new Error("Analyzing tables isn't available in this server version (the Schema Explorer's ANALYZE tools are missing).") : err };
  }
  renderDetail();
}

async function runAnalyze(key, dbname, tables) {
  const s = state.analyze[key][dbname];
  s.running = true;
  renderDetail();
  try { s.result = await S2.callTool("schema_explorer_analyze", { database: dbname, tables, confirm: true }); }
  catch (err) { s.error = err; }
  s.running = false;
  renderDetail();
}

function planTable(p) {
  const runs = Number(p.runs) || 1;
  const rows = [
    ["Runs in the plan cache", fmt.number(p.runs)], ["Average time", secs(Number(p.AVERAGE_EXEC_TIME) || 0)],
    ["Average memory (max)", fmt.bytes(p.AVERAGE_MAX_MEMORY_USE ?? p.AVERAGE_MEMORY_USE)],
    ["Average disk spilling", fmt.bytes(p.AVERAGE_DISK_SPILLING_USE ?? 0)],
    ["CPU time / run", secs((Number(p.CPU_TIME) || 0) / runs)],
    ["Waiting on leaves / run", secs((Number(p.LEAFNETWORK_TIME) || 0) / runs)],
    ["Queued / run", secs(((Number(p.WORKLOAD_MANAGEMENT_QUEUED_TIME) || 0) + (Number(p.RESOURCE_POOL_QUEUED_TIME) || 0)) / runs)],
    ["Blob cache wait / run", secs((Number(p.BLOB_CACHE_WAIT_TIME_MS) || 0) / runs)],
    ["Last run", when(p.LAST_EXECUTED)],
  ];
  return h("table", { class: "qh-kv" }, h("tbody", {}, rows.map(([k, v]) => h("tr", {}, h("td", {}, k), h("td", {}, v)))));
}

// Older runs the cluster's trace no longer has (it restarted, or its ring buffer moved on), listed from the local copy.
const keptText = (d) => d.kept?.runs
  ? ` · plus ${fmt.number(d.kept.runs)} older run${d.kept.runs === 1 ? "" : "s"} kept locally (since ${when(d.kept.oldest)})`
  : "";

// ---------------------------------------------------------------- page
function render() {
  if (!state.data) {
    root.replaceChildren(state.error ? S2.errorBox(state.error) : h("div", { class: "s2-empty" }, h("span", { class: "s2-spinner" }), " Reading the query history…"));
    return;
  }
  const d = state.data;
  const hist = d.history;
  fill(root,
    h("div", { class: "s2-header" },
      h("div", {},
        h("h1", { class: "s2-title" }, "Query History"),
        h("div", { class: "s2-subtitle" }, hist.events
          ? `${fmt.number(hist.events)} traced queries since ${when(hist.oldest)} · newest ${when(hist.newest)}${d.limited ? ` · showing the latest ${fmt.number(d.limit)}` : ""}${keptText(d)}`
          : d.kept?.runs ? `The cluster's query history is empty${keptText(d)}` : "Query history is empty")),
      h("span", { class: "s2-spacer" }),
      traceChip(),
      h("label", { class: "qh-field", title: `Refresh every ${REFRESH_MS / 1000} s` },
        h("input", { type: "checkbox", checked: state.auto, onchange: (e) => setAuto(e.target.checked) }), "Auto-refresh"),
      h("button", { class: "s2-btn", onclick: () => refresh(), disabled: state.loading }, state.loading ? h("span", { class: "s2-spinner" }) : null, "Refresh"),
      S2.openInBrowserButton("query_history", () => ({ min_seconds: state.minSeconds, ...(state.hours ? { hours: Number(state.hours) } : {}), ...(state.tab !== "queries" ? { tab: state.tab } : {}) })),
      S2.fullscreenButton()),
    state.error ? h("div", { class: "s2-error", style: { marginBottom: "10px" } }, `Refresh failed: ${state.error.message}`) : null,
    h("div", { class: "qh-tabs", role: "tablist" },
      [["queries", "Queries"], ["usage", "Usage"], ["trends", "Trends"], ["advisor", "Advisor"]].map(([k, label]) => h("button", { role: "tab", "aria-selected": String(state.tab === k),
        onclick: () => setTab(k) }, label))),
    state.tab === "advisor" ? advisorEl : state.tab === "trends" ? trendsEl : state.tab === "usage" ? usageEl : [
      filters(),
      h("div", { id: "qh-stats" }),
      h("div", { class: `qh-main${state.selected ? " with-detail" : ""}` }, listEl, state.selected ? detailEl : null)]);
  if (state.tab === "advisor") renderAdvisor();
  else if (state.tab === "trends") renderTrends();
  else if (state.tab === "usage") renderUsage();
  else { renderList(); renderDetail(); }
}

function setTab(tab) {
  state.tab = tab;
  render();
  if (tab === "advisor" && !state.advisor.data && !state.advisor.loading) loadAdvisor(false);
  if (tab === "trends" && !state.trends.data && !state.trends.loading) loadTrends();
  if (tab === "usage" && !state.usage.data && !state.usage.loading) loadUsage();
}

// ---------------------------------------------------------------- the event trace's configuration (read-only)
// What the history can contain: SingleStore records a finished query only if it ran at least
// Duration_threshold_ms (and every failed one with Trace_all_failed_executions). MV_TRACE_EVENTS_STATUS.
function traceChip() {
  const t = state.data?.trace;
  if (!t) return null;
  const thr = t.duration_threshold_ms;
  const label = t.error ? "Trace: unknown" : !t.active ? "Query tracing is off"
    : `Tracing queries ≥ ${thr >= 1000 && thr % 1000 === 0 ? `${thr / 1000} s` : `${fmt.number(thr ?? 0)} ms`}${t.trace_failed ? " + failures" : ""}`;
  const yesNo = (v) => (v ? "on" : "off");
  const pop = state.traceOpen ? h("div", { class: "qh-trace-pop", role: "dialog", "aria-label": "Event trace configuration" },
    h("strong", {}, "Query_completion event trace"),
    t.error ? h("p", {}, `Couldn't read the trace status: ${t.error}`) : !t.active
      ? h("p", {}, "The cluster doesn't trace finished queries, so the history is empty. An admin turns it on with CREATE EVENT TRACE Query_completion WITH (Query_text = on, Duration_threshold_ms = 1000);")
      : h("p", {},
        `The history only contains queries that ran at least ${fmt.number(thr ?? 0)} ms`,
        t.trace_failed ? ", plus every failed query whatever its duration" : "",
        t.query_text ? "" : "; query text is off, so the SQL isn't recorded",
        ". Faster statements are only in the plan cache (as totals, listed as \"Plan cache\"). ",
        t.same_everywhere ? "" : "The nodes don't all have the same settings. ",
        "This view only shows the settings; changing them needs ALTER EVENT TRACE (an admin)."),
    h("div", { style: { overflowX: "auto" } }, h("table", { class: "s2-table" },
      h("thead", {}, h("tr", {}, h("th", {}, "Node"), h("th", {}, "Active"), h("th", { class: "num" }, "Threshold"), h("th", {}, "Text"),
        h("th", {}, "Failed"), h("th", {}, "Enhanced stats"), h("th", { class: "num" }, "Memory"), h("th", { class: "num" }, "Traced"), h("th", { class: "num" }, "Unconsumed"))),
      h("tbody", {}, (t.nodes ?? []).map((n) => h("tr", {},
        h("td", {}, `${n.node_id} ${n.node_type ?? ""}`), h("td", {}, n.active ? "yes" : "no"),
        h("td", { class: "num" }, n.config?.Duration_threshold_ms != null ? `${fmt.number(n.config.Duration_threshold_ms)} ms` : "–"),
        h("td", {}, yesNo([1, "1", true, "ON", "on"].includes(n.config?.Query_text))),
        h("td", {}, yesNo([1, "1", true, "ON", "on"].includes(n.config?.Trace_all_failed_executions))),
        h("td", {}, String(n.config?.Enhanced_stats_collection ?? "–").toLowerCase()),
        h("td", { class: "num" }, fmt.bytes(n.memory_b)), h("td", { class: "num" }, fmt.number(n.traced)), h("td", { class: "num" }, fmt.number(n.unconsumed))))))),
    h("p", {}, "Traced: events recorded on that node since the trace was created; the ring buffer keeps only the latest. Unconsumed: events not read yet by a consumer.")) : null;
  return h("span", { class: "qh-trace" },
    h("button", { class: `s2-btn ghost`, "aria-expanded": String(state.traceOpen), title: "What the query history records (event trace settings)",
      onclick: () => { state.traceOpen = !state.traceOpen; render(); } }, `ⓘ ${label}`), pop);
}

// ---------------------------------------------------------------- usage: most used tables, most active users
const usageEl = h("div");
const USAGE_DAYS = [[1, "24 h"], [7, "7 days"], [30, "30 days"], [90, "90 days"], [0, "All"]];

}

  state.minSeconds = 1; state.hours = "";
  state.database = state.status = state.category = state.origin = state.search = "";

function sortable(rows, sortKey, columns, onSort) {

    ? h("th", { class: isNum ? "num" : "", title, "aria-sort": sortKey === key ? "descending" : "none" },

// The Queries list over the overview's period (24 h / 7 days; longer periods: everything, which includes them).
function showEp() {
  const days = state.usage.days;
  state.minSeconds = 1; state.hours = days === 1 ? "24" : days === 7 ? "168" : "";

  state.shape = null; state.table = null;
  state.tab = "queries";

}

  return h("section", { class: "s2-card qh-adv-work", "aria-label": "SAS Embedded Process overview" },
    h("h2", {}, "SAS Embedded Process"),
    h("div", { class: "s2-small s2-faint", style: { marginBottom: "6px" } },
      `Over ${period}: ${fmt.number(o.calls)} traced EP calls (sasepFunction jobs and SAS VA / CAS format functions), ${secs(o.ms)} in all`,

      pl ? `; ${fmt.number(o.plateau_calls)} sat on the ${secs(pl.low_ms)}–${secs(pl.high_ms)} plateau, ${share(o.plateau_time_share)} of the EP time` +

// ---------------------------------------------------------------- trends (local durable copy of the history)
const trendsEl = h("div");
const TREND_DAYS = [[7, "7 days"], [30, "30 days"], [90, "90 days"], [365, "1 year"]];
const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs = {}, text) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (text != null) el.textContent = text;
  return el;
}
function niceCeil(value) {
  const raw = Math.max(value, 1e-9) / 4;
  const p = 10 ** Math.floor(Math.log10(raw));
  const f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  return { max: Math.ceil(value / step) * step || step, step };
}

async function loadTrends() {
  const t = state.trends;
  t.loading = true; t.error = null;
  renderTrends();
  try { t.data = await S2.callTool("query_history_trends", { days: t.days }); }
  catch (err) { t.error = err; }
  t.loading = false;
  renderTrends();
  reportContext();
}

// Every bucket in the period, including empty ones. Keys are cluster-local "YYYY-MM-DD" / "YYYY-MM-DD HH".
function bucketSeries(points, hourly, now, days) {
  const pad = (n) => String(n).padStart(2, "0");
  const [d, tm] = String(now).split(" ");
  const [Y, M, D] = d.split("-").map(Number);
  const H = Number((tm ?? "0").slice(0, 2));
  const by = Object.fromEntries((points ?? []).map((p) => [p.t, p]));
  const out = [];
  const n = hourly ? 48 : days;
  for (let i = n - 1; i >= 0; i--) {
    const dt = hourly ? new Date(Y, M - 1, D, H - i) : new Date(Y, M - 1, D - i);
    const key = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}${hourly ? ` ${pad(dt.getHours())}` : ""}`;
    out.push(by[key] ?? { t: key, queries: 0, total_ms: 0, failed: 0, p95_ms: 0 });
  }
  return out;
}
const bucketLabel = (key, hourly) => {
  const [d, hh] = key.split(" ");
  const [Y, M, D] = d.split("-").map(Number);
  const dt = new Date(Y, M - 1, D, Number(hh ?? 0));
  return hourly ? dt.toLocaleString([], { weekday: "short", hour: "2-digit" }) : dt.toLocaleDateString([], { month: "short", day: "numeric" });
};

function trendChart(title, note, series, value, format, kind, hourly, onPick, picked) {
  const W = 420, H = 150, m = { l: 46, r: 8, t: 8, b: 22 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const vals = series.map(value);
  const { max, step } = niceCeil(Math.max(...vals, 0) * 1.1 || 1);
  const y = (v) => m.t + ph - (v / max) * ph;
  const bw = pw / series.length;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${title}: peak ${format(Math.max(...vals, 0))}` });
  for (let v = 0; v <= max + 1e-9; v += step) {
    svg.append(svgEl("line", { class: v === 0 ? "base" : "grid", x1: m.l, x2: m.l + pw, y1: y(v), y2: y(v) }));
    svg.append(svgEl("text", { class: "tick", x: m.l - 6, y: y(v) + 4, "text-anchor": "end" }, format(v)));
  }
  const every = Math.ceil(series.length / 6);
  series.forEach((p, i) => {
    if (i % every === 0) svg.append(svgEl("text", { class: "tick", x: m.l + bw * (i + 0.5), y: H - 6, "text-anchor": "middle" }, bucketLabel(p.t, hourly)));
  });
  const pickText = onPick ? (kind === "line" ? "Click a point to list its queries." : "Click a bar to list its queries.") : " ";
  const hint = h("div", { class: "hint" }, pickText);
  const show = (i) => { const p = series[i]; hint.textContent = `${bucketLabel(p.t, hourly)}: ${format(vals[i])}${kind !== "line" ? "" : ` · ${fmt.number(p.queries)} queries`}`; };
  if (kind === "line") {
    let d = "";
    series.forEach((p, i) => { if (p.queries) d += `${d ? "L" : "M"}${(m.l + bw * (i + 0.5)).toFixed(1)},${y(vals[i]).toFixed(1)}`; });
    svg.append(svgEl("path", { class: "line", d }));
  }
  series.forEach((p, i) => {
    const x = m.l + bw * i;
    if (kind === "line") {
      if (p.queries) svg.append(svgEl("circle", { class: "dot", cx: x + bw / 2, cy: y(vals[i]), r: series.length > 60 ? 1.5 : 3 }));
      const hit = svgEl("rect", { x, y: m.t, width: bw, height: ph, fill: "transparent", class: p.queries ? "pick" : "" });
      hit.addEventListener("pointerenter", () => show(i));
      if (p.queries && onPick) hit.addEventListener("click", () => onPick(p));
      svg.append(hit);
    } else {
      const bar = svgEl("rect", { class: `bar${kind === "err" ? " err" : ""}${picked === p.t ? " picked" : ""}`, x: x + bw * 0.12, width: Math.max(1, bw * 0.76),
        y: y(vals[i]), height: Math.max(0, m.t + ph - y(vals[i])) });
      const hit = svgEl("rect", { x, y: m.t, width: bw, height: ph, fill: "transparent", class: vals[i] ? "pick" : "" });
      if (vals[i] && onPick) hit.addEventListener("click", () => onPick(p));
      hit.addEventListener("pointerenter", () => { show(i); bar.classList.add("on"); });
      hit.addEventListener("pointerleave", () => bar.classList.remove("on"));
      svg.append(bar, hit);
    }
  });
  svg.addEventListener("pointerleave", () => { hint.textContent = pickText; });
  return h("section", { class: "s2-card qh-chart" }, h("h3", {}, title, note ? h("span", { class: "s2-faint" }, note) : null), svg, hint);
}

// Clicking a bar lists the stored runs behind it (Failures: only the failed ones), slowest first.
async function pickBucket(p, failedOnly) {
  const t = state.trends;
  t.picked = { bucket: p.t, failed: failedOnly, loading: true, data: null, error: null };
  renderTrends();
  try { t.picked.data = await S2.callTool("query_history_trend_runs", { bucket: p.t, failed_only: failedOnly }); }
  catch (err) { t.picked.error = err; }
  t.picked.loading = false;
  renderTrends();
  document.getElementById("qh-trend-runs")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

// Open one run in the Queries tab (full SQL, tuning, Ask Claude) while the cluster still has it.
async function openRun(run) {
  state.tab = "queries";
  state.shape = null;
  state.minSeconds = 1; state.hours = "";
  state.user = state.database = state.status = state.category = state.origin = state.search = "";
  state.table = null;
  state.selected = null;
  await refresh();
  if (state.data?.events.some((e) => e.key === run.key)) choose(run.key);
  else S2.toast("That run is no longer in the cluster's query history (it keeps a limited number); the Trends list shows the start of its SQL.", "err");
}
