<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAS SpeedyStore Studio</title>
<!--S2:FAVICON-->
<!--S2:SERVER-->
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: light-dark(#ffffff, #1e1e1e); }
  iframe { display: block; width: 100%; height: 100vh; border: 0; }
  #status { font: 14px/1.5 system-ui, "Segoe UI", sans-serif; padding: 24px; color: light-dark(#555, #aaa); }
  #status:empty { display: none; }
  #conn { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 60; display: none;
    font: 13px/1.4 system-ui, "Segoe UI", sans-serif; padding: 6px 12px; border-radius: 6px;
    background: light-dark(#fff8e1, #3a3220); color: light-dark(#6b4e00, #f3d9a0); border: 1px solid light-dark(#f0d48a, #6b5a2e);
    box-shadow: 0 2px 8px rgb(0 0 0 / 0.15); }
  #conn.on { display: block; }
  #conn .spin { display: inline-block; width: 11px; height: 11px; margin-right: 7px; vertical-align: -1px; border-radius: 50%;
    border: 2px solid currentColor; border-top-color: transparent; animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  #ended { font: 14px/1.55 system-ui, "Segoe UI", sans-serif; color: light-dark(#222, #ddd); max-width: 620px; margin: 12vh auto 0; padding: 0 20px; }
  #ended h1 { font-size: 20px; margin: 0 0 8px; }
  #ended p { margin: 0 0 10px; color: light-dark(#555, #aaa); }
  #ended button { font: inherit; padding: 5px 14px; border-radius: 5px; cursor: pointer; border: 1px solid light-dark(#bbb, #555);
    background: light-dark(#f5f5f5, #2a2a2a); color: inherit; }
  #ended .drafts { margin-top: 16px; padding: 10px 12px; border-radius: 6px; background: light-dark(#f6f6f6, #262626); }
  #ended .drafts div { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
  #ended code { font-size: 12px; }
</style>
</head>
<body>
<!--S2:SPLASH-->
<div id="status"></div>
<div id="conn" role="status" aria-live="polite"><span class="spin"></span>Reconnecting to the SingleStore MCP server…</div>
<script type="module">
// Minimal MCP Apps host: renders one app full-window and forwards its tool
// calls to the SingleStore MCP server that served this page.
//
// The server keeps this page's address (port + token) across restarts, so when
// it goes away (restart_server, a crash restart, Claude restarting, the laptop
// sleeping) the page holds the app's calls, shows "Reconnecting…" and retries
// for a while (the server tells how long: reconnect_s). Back again: the held
// calls go through and the app carries on. Not back in time, or the token is
// refused (reset, or another server now has this port): a "Session ended" page
// replaces the app, which stops all its polling. Unsent editor drafts are kept
// in this tab (sessionStorage) and saved when the server is reachable again.
// Database errors are ordinary tool results and reach the app as before.
const params = new URLSearchParams(location.search);
const toolName = params.get("tool");
const args = JSON.parse(params.get("args") || "{}");
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
const theme = () => (darkQuery.matches ? "dark" : "light");
// Presenter mode is remembered per browser (the Workspace's switch asks this page to keep it); ?present=1 / 0 sets it.
const PRESENT_KEY = "s2-presenter";
function presenter() {
  const asked = params.get("present");
  try {
    if (asked != null) localStorage.setItem(PRESENT_KEY, asked === "1" || asked === "true" ? "1" : "0");
    return localStorage.getItem(PRESENT_KEY) === "1";
  } catch { return asked === "1" || asked === "true"; }
}
const status = document.getElementById("status");
const connEl = document.getElementById("conn");
let frame = null;

// ---------------------------------------------------------------- splash
// The Studio logo until the app is usable: for the Workspace that is when it says so (s2-splash-done, once its
// first view has its data; it sends its progress as s2-splash), for other apps when they have their opening result.
// Never kept longer than that. From the desktop shortcut's "Starting…" page (#s2-continue) the logo carries on
// without a second intro.
const splash = window.S2Splash;
splash.big(presenter());
if (location.hash === "#s2-continue") {
  splash.skipIntro();
  history.replaceState(null, "", location.pathname + location.search);
}
let splashFallback = null;
function splashDone() { clearTimeout(splashFallback); splash.done(); }

// ---------------------------------------------------------------- connection state
const DRAFT_TOOL = "sql_editor_save_draft";
const DRAFTS_KEY = "s2-unsent-drafts";
const session = { reconnectMs: 60000, repeatable: new Set([DRAFT_TOOL]) };
// The app's own requests time out after 60 s: answer a held call before that.
const HOLD_MS = 50000;
let conn = "ok";           // ok | reconnecting | ended
let downSince = 0;
let waiters = [];          // resolve(true) when back, resolve(false) when ended
let wake = null;           // cuts the current wait between probes short
let heartbeat = null;

class SessionEnded extends Error {}

function setConn(next) {
  conn = next;
  document.documentElement.dataset.conn = next;  // for tests and styles
  connEl.classList.toggle("on", next === "reconnecting");
}
setConn("ok");

// Probe until the server answers, the time is up, or the token is refused.
async function reconnectLoop() {
  const delays = [250, 500, 1000, 2000, 3000, 5000];
  for (let i = 0; conn === "reconnecting"; i++) {
    let res = null;
    try { res = await fetch("ping", { cache: "no-store" }); } catch { /* still down */ }
    if (res?.ok) return back();
    if (res) return end("refused");
    // Probe first, then check the clock: after a laptop sleep the time jumps, but the server may be up.
    if (Date.now() - downSince >= session.reconnectMs) return end("gone");
    await new Promise((resolve) => { wake = resolve; setTimeout(resolve, delays[Math.min(i, delays.length - 1)]); });
    wake = null;
  }
}

function lost() {
  if (conn === "ok") {
    setConn("reconnecting");
    downSince = Date.now();
    reconnectLoop();
  }
}

// Resolves true once the server answers again, false when the session ended (or after maxMs).
function whenBack(maxMs = Infinity) {
  if (conn === "ok") return Promise.resolve(true);
  if (conn === "ended") return Promise.resolve(false);
  return new Promise((resolve) => {
    const w = (v) => { clearTimeout(t); waiters = waiters.filter((x) => x !== w); resolve(v); };
    const t = Number.isFinite(maxMs) ? setTimeout(() => w(conn === "ok"), Math.max(0, maxMs)) : null;
    waiters.push(w);
  });
}

async function back() {
  setConn("ok");
  await flushDrafts();
  for (const w of waiters.slice()) w(true);
}

// Laptop resume / network back: check at once instead of at the next timer.
function checkNow() {
  if (conn === "reconnecting") wake?.();
  else if (conn === "ok" && frame && !document.hidden) {
    fetch("ping", { cache: "no-store" }).then((r) => { if (!r.ok) confirmSession(); }).catch(lost);
  }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkNow(); });
window.addEventListener("online", checkNow);
window.addEventListener("pageshow", (e) => { if (e.persisted) checkNow(); });

// A 403/404: the token was refused (reset, or another server owns this port now) - or just a missing
// resource. The ping tells which.
async function confirmSession() {
  let res = null;
  try { res = await fetch("ping", { cache: "no-store" }); } catch { lost(); return conn !== "ended"; }
  if (res.ok) return true;
  end("refused");
  return false;
}

// ---------------------------------------------------------------- unsent editor drafts
function readDrafts() {
  try { return JSON.parse(sessionStorage.getItem(DRAFTS_KEY) || "{}") ?? {}; } catch { return {}; }
}
function writeDrafts(d) {
  try { Object.keys(d).length ? sessionStorage.setItem(DRAFTS_KEY, JSON.stringify(d)) : sessionStorage.removeItem(DRAFTS_KEY); } catch { /* storage off */ }
}
const draftKey = (a) => String(a?.tab_id ?? "default");
function keepDraft(a) {
  const d = readDrafts();
  d[draftKey(a)] = { args: a, at: Date.now() };
  writeDrafts(d);
  return d[draftKey(a)].at;
}
function dropDraft(a, at) {
  const d = readDrafts();
  if (d[draftKey(a)]?.at === at) { delete d[draftKey(a)]; writeDrafts(d); }
}
// Save drafts this tab couldn't send (the server was away) - unless the server's draft of that tab is as new
// or newer (this one got through after all, or the tab was edited somewhere else since).
async function flushDrafts() {
  for (const item of Object.values(readDrafts())) {
    try {
      const st = await post("sql_editor_state", { tab_id: item.args.tab_id ?? null });
      const updated = st?.structuredContent?.draft?.updated ?? 0;
      if (updated * 1000 < item.at) {
        const res = await post(DRAFT_TOOL, item.args);
        if (!res || res.isError) continue;
      }
      dropDraft(item.args, item.at);  // unless a newer one came meanwhile
    } catch { break; }  // away again: try on the next reconnect
  }
}

// ---------------------------------------------------------------- calls
async function post(name, toolArgs) {
  const res = await fetch("call", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ name, arguments: toolArgs ?? {} }),
  });
  if (!res.ok) { const e = new Error(`HTTP ${res.status}`); e.status = res.status; throw e; }
  return res.json();
}

const errorResult = (text) => ({ isError: true, content: [{ type: "text", text }] });
const RECONNECTING_TEXT = "Reconnecting to the SingleStore MCP server…";

async function callTool(name, toolArgs) {
  const started = Date.now();
  const kept = name === DRAFT_TOOL ? keepDraft(toolArgs) : null;
  for (;;) {
    if (conn !== "ok" && !(await whenBack(HOLD_MS - (Date.now() - started)))) {
      return errorResult(conn === "ended" ? "The browser session ended." : RECONNECTING_TEXT);
    }
    try {
      const result = await post(name, toolArgs);
      if (kept) dropDraft(toolArgs, kept);
      return result;
    } catch (e) {
      if (e.status === 403 || e.status === 404) {
        // The token was refused: the session ended (or, with the server reachable again, a stray refusal).
        if (!(await confirmSession())) return errorResult("The browser session ended.");
        if (conn === "ok") return errorResult(`The SingleStore MCP server refused the call (HTTP ${e.status}).`);
        continue;  // it went away just now: wait for it like any other call
      }
      if (e.status) return errorResult(`The SingleStore MCP server answered HTTP ${e.status}.`);
      // Network error: the server went away (before or during the call).
      lost();
      if (Date.now() - started > HOLD_MS) return errorResult(RECONNECTING_TEXT);
      if (!session.repeatable.has(name)) {
        // It may have run: don't run it twice. Say so once the server is back (or the session ended).
        await whenBack(HOLD_MS - (Date.now() - started));
        return errorResult("The SingleStore MCP server restarted while this ran, so it may or may not have finished. Check, then try again.");
      }
    }
  }
}

// GETs (page parts) wait for the server like calls do.
async function get(path) {
  for (;;) {
    if (conn !== "ok" && !(await whenBack())) throw new SessionEnded();
    let res;
    try { res = await fetch(path, { cache: "no-store" }); } catch { lost(); continue; }
    if ((res.status === 403 || res.status === 404) && !(await confirmSession())) throw new SessionEnded();
    return res;
  }
}

// ---------------------------------------------------------------- the end
function end(why) {
  if (conn === "ended") return;
  setConn("ended");
  clearInterval(heartbeat);
  for (const w of waiters.slice()) w(false);
  frame?.remove();  // stops every timer and poll of the app
  frame = null;
  status.remove();
  splash.hide();
  document.title = "Session ended · SAS SpeedyStore Studio";
  const drafts = Object.values(readDrafts());
  // On a server (behind the Studio hub) the hub stops a Studio after a while without use, or at sign-out.
  const onServer = Boolean(window.S2_SERVER);
  const box = el("div", { id: "ended", role: "alert" },
    el("h1", {}, onServer ? "Studio stopped" : "Session ended"),
    el("p", {}, onServer
      ? "Your Studio was stopped (unused for a while, signed out, or stopped by an admin). Your tabs and files are kept."
      : why === "refused"
      ? "This link isn't valid any more: browser links were reset, or another SingleStore MCP server now uses this address."
      : "The SingleStore MCP server that served this page isn't running any more (Claude was closed or the server stopped)."),
    el("p", {}, onServer ? "Start it again (you may be asked to sign in)."
      : "Reopen the app from Claude (ask for the app or its browser link again) or with the SingleStore Workspace desktop shortcut."),
    el("button", { onclick: () => location.reload() }, onServer ? "Start Studio again" : "Try again"),
    drafts.length ? el("div", { class: "drafts" },
      el("strong", {}, `Unsaved editor text (${drafts.length}) is kept in this browser tab.`),
      el("p", {}, "It's saved to the SQL Editor when this page reconnects (Try again). You can also copy it:"),
      ...drafts.map((d) => el("div", {},
        el("code", {}, `${(d.args.sql || "").split("\n")[0].slice(0, 60) || "(empty)"}…`),
        el("button", { onclick: (e) => navigator.clipboard?.writeText(d.args.sql || "").then(() => { e.target.textContent = "Copied"; }) }, "Copy")))) : null);
  connEl.after(box);
}

function el(tag, props, ...children) {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...children.filter((c) => c != null));
  return n;
}

// ---------------------------------------------------------------- MCP Apps host
const send = (msg) => frame?.contentWindow.postMessage(msg, "*");
const reply = (id, result) => send({ jsonrpc: "2.0", id, result });
const replyError = (id, message, code = -32603) => send({ jsonrpc: "2.0", id, error: { code, message } });

function download(contents) {
  for (const item of contents ?? []) {
    const r = item.resource ?? {};
    const data = r.text ?? Uint8Array.from(atob(r.blob ?? ""), (c) => c.charCodeAt(0));
    const a = Object.assign(document.createElement("a"), {
      href: URL.createObjectURL(new Blob([data], { type: r.mimeType || "text/plain" })),
      download: (r.uri || "download").split("/").pop(),
    });
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }
}

let opening = null;  // the app's opening tool call, sent while its page loads
async function open() {
  // Session settings and the tool's metadata at the same time; the opening call (often a cluster round trip, the
  // slowest step) goes out now too instead of after the app's page has loaded and connected.
  const sessionReq = get("session");
  const toolReq = get(`tool?name=${encodeURIComponent(toolName)}`);
  try {
    const s = await (await sessionReq).json();
    session.reconnectMs = (Number(params.get("reconnect")) || s.reconnect_s || 60) * 1000;
    session.repeatable = new Set([DRAFT_TOOL, ...(s.repeatable ?? [])]);
  } catch (e) {
    if (e instanceof SessionEnded) throw e;  // otherwise an older server without /session: defaults
  }
  const toolRes = await toolReq;
  if (!toolRes.ok) throw new Error("this link has expired");
  const tool = await toolRes.json();
  const isStudio = /workspace\.html$/.test(tool._meta?.ui?.resourceUri ?? "");
  splash.status(isStudio ? "Connecting to SingleStore…" : `Opening ${tool.title || tool.name}…`);
  opening = callTool(toolName, args);
  const htmlReq = get(`resource?uri=${encodeURIComponent(tool._meta.ui.resourceUri)}`).then((r) => r.text());
  await flushDrafts();  // before the app reads its saved state
  const html = await htmlReq;
  // The Workspace (sql_editor's page) is the Studio itself; other apps are named after their tool.
  document.title = toolName === "sql_editor" ? "SAS SpeedyStore Studio" : `${tool.title || tool.name} · SAS SpeedyStore Studio`;

  window.addEventListener("message", async (ev) => {
    if (!frame || ev.source !== frame.contentWindow) return;
    if (ev.data?.type === "s2-presenter-save") { try { localStorage.setItem(PRESENT_KEY, ev.data.on ? "1" : "0"); } catch {} return; }
    if (ev.data?.type === "s2-splash") { splash.status(String(ev.data.text ?? "")); return; }
    if (ev.data?.type === "s2-splash-done") { splashDone(); return; }
    if (ev.data?.type === "s2-account" && window.S2_SERVER?.account) { location.href = window.S2_SERVER.account; return; }
    const { id, method, params: p, jsonrpc } = ev.data ?? {};
    if (jsonrpc !== "2.0" || !method) return;
    switch (method) {
      case "ui/initialize":
        return reply(id, {
          protocolVersion: p.protocolVersion,
          hostCapabilities: { openLinks: {}, downloadFile: {}, serverTools: {}, serverResources: {}, logging: {} },
          hostInfo: { name: "singlestore-browser-view", version: "0.3.0" },
          hostContext: {
            theme: theme(), displayMode: "fullscreen", availableDisplayModes: ["fullscreen"],
            containerDimensions: { width: innerWidth, height: innerHeight },
            locale: navigator.language, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            platform: "web", toolInfo: { tool }, s2Presenter: presenter(),
          },
        });
      case "ui/notifications/initialized":
        send({ jsonrpc: "2.0", method: "ui/notifications/tool-input", params: { arguments: args } });
        send({ jsonrpc: "2.0", method: "ui/notifications/tool-result", params: await (opening ?? callTool(toolName, args)) });
        // The Workspace says when its first view is usable; a safety net in case it can't.
        if (isStudio && splash.active) splashFallback = setTimeout(splashDone, 20000);
        else splashDone();
        return;
      case "tools/call": {
        const result = await callTool(p.name, p.arguments);
        // Reset browser links from this page: carry on at the new link (this one's token is gone).
        if (p.name === "browser_reset_links" && !result.isError && result.structuredContent?.browser_url) {
          reply(id, result);
          return location.replace(result.structuredContent.browser_url);
        }
        return reply(id, result);
      }
      case "resources/read": {
        let res;
        try { res = await get(`resource?uri=${encodeURIComponent(p.uri)}`); } catch { return replyError(id, "The browser session ended."); }
        if (!res.ok) return replyError(id, `Resource not found: ${p.uri}`);
        return reply(id, { contents: [{ uri: p.uri, mimeType: "text/html;profile=mcp-app", text: await res.text() }] });
      }
      case "ui/message":
      case "ui/update-model-context":
        return replyError(id, "Only available inside Claude");
      case "ui/download-file": download(p.contents); return reply(id, {});
      case "ui/open-link": window.open(p.url, "_blank", "noopener"); return reply(id, {});
      case "ui/request-display-mode": return reply(id, { mode: "fullscreen" });
      case "ping": return reply(id, {});
      default:
        if (id !== undefined) replyError(id, `Method not found: ${method}`, -32601);
    }
  });

  frame = Object.assign(document.createElement("iframe"), { sandbox: "allow-scripts allow-downloads", allow: "clipboard-write", srcdoc: html });
  // Heartbeat: a standalone workspace server shuts down once no page pings it; a failed ping starts reconnecting.
  heartbeat = setInterval(() => {
    if (conn !== "ok") return;
    fetch("ping", { cache: "no-store" }).then((r) => { if (!r.ok) confirmSession(); }).catch(lost);
  }, 30000);
  status.replaceWith(frame);
  darkQuery.addEventListener("change", () =>
    send({ jsonrpc: "2.0", method: "ui/notifications/host-context-changed", params: { theme: theme() } }));
}

open().catch((e) => {
  if (e instanceof SessionEnded || conn === "ended") return end("refused");
  splash.hide();
  status.textContent = `Couldn't open the app: ${e.message}. Open the app in the browser again from Claude.`;
});
</script>
</body>
</html>
