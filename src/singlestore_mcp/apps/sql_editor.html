<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL Editor</title>
<!--S2:HEAD-->
<!--S2:VENDOR:codemirror-bundle.js-->
<!--S2:VENDOR:singlestore_functions.json-->
<!--S2:VENDOR:s2-charts.js-->
<!--S2:VENDOR:sas-complete.js-->
<style>
  body { padding: 10px 12px; }
  .sq-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .sq-head select { max-width: 200px; }
  .sq-body { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 10px; height: 640px; }
  .sq-body.no-tree { grid-template-columns: minmax(0, 1fr); }
  .sq-body.no-tree .sq-tree { display: none; }
  .sq-body.chat-open { grid-template-columns: 230px minmax(0, 1fr) 340px; }
  .sq-body.no-tree.chat-open { grid-template-columns: minmax(0, 1fr) 340px; }
  @media (max-width: 900px) { .sq-body.chat-open, .sq-body.no-tree.chat-open { grid-template-columns: minmax(0, 1fr) 300px; } .sq-body.chat-open .sq-tree { display: none; } }
  .sq-chat { border: 1px solid var(--s2-border-2); border-radius: var(--s2-radius); overflow: hidden; }
  .sq-chat-top { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--s2-border-2); background: var(--s2-bg-2); font-size: var(--s2-fs-xs); }
  .sq-chat-top strong { flex: 1; }
  .sq-claude-btn .count { background: var(--s2-info); color: #fff; border-radius: 999px; font-size: 10px; padding: 0 6px; font-weight: 600; margin-left: 4px; }
  html[data-display-mode="fullscreen"] .sq-body { height: calc(100vh - 70px); }
  .sq-filebtns { display: inline-flex; align-items: center; gap: 2px; margin-left: 4px; }
  .sq-file { font-size: var(--s2-fs-xs); color: var(--s2-text-2); margin-left: 6px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sq-file .dirty { color: var(--s2-warn); margin-left: 3px; }
  .sq-files { border: 1px solid var(--s2-border-2); border-radius: var(--s2-radius); padding: 8px 10px; margin-bottom: 8px; background: var(--s2-bg-2); font-size: var(--s2-fs-xs); }
  .sq-files[hidden] { display: none; }
  .sq-files .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sq-files .row + .row, .sq-files .list + .row { margin-top: 6px; }
  .sq-files .s2-input { min-width: 220px; }
  .sq-files .list { margin-top: 6px; max-height: 190px; overflow: auto; border: 1px solid var(--s2-border-2); border-radius: var(--s2-radius-sm); background: var(--s2-bg); }
  .sq-files .item { display: flex; gap: 10px; width: 100%; border: 0; background: none; text-align: left; padding: 4px 8px; cursor: pointer; font: inherit; color: inherit; }
  .sq-files .item:hover, .sq-files .item:focus-visible { background: var(--s2-info-bg); }
  .sq-files .item .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--s2-mono); }
  .sq-files .item .m { color: var(--s2-text-3); white-space: nowrap; }
  .sq-files .warn { color: var(--s2-warn); }
  .sq-files .sub { margin-top: 2px; font-weight: var(--font-weight-semibold, 600); color: var(--s2-text-2); }
  .sq-files .recent { max-height: 130px; margin-bottom: 8px; }
  .sq-origin { display: inline-flex; align-items: center; gap: 4px; font-size: var(--s2-fs-xs); }
  .sq-origin .warn { color: var(--s2-warn); white-space: nowrap; }
  .sq-onerr { display: inline-flex; align-items: center; gap: 3px; font-size: var(--s2-fs-xs); color: var(--s2-text-2); white-space: nowrap; }
  /* Run history panel */
  .sq-hist .list { max-height: 260px; }
  .sq-hitem { display: flex; flex-direction: column; gap: 2px; padding: 5px 8px; border-bottom: 1px solid var(--s2-border-2); }
  .sq-hitem:last-child { border-bottom: 0; }
  .sq-hitem:hover { background: var(--s2-bg-2); }
  .sq-hitem .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--s2-text-3); }
  .sq-hitem .top .s2-btn { padding: 0 8px; font-size: 11px; }
  .sq-hitem .sql { font-family: var(--s2-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--s2-text); }
  .sq-hitem .err { color: var(--s2-err); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Run all: one tab per statement above the results */
  .sq-batch { display: flex; align-items: center; gap: 2px; padding: 0 6px; border-bottom: 1px solid var(--s2-border-2); background: var(--s2-bg-2); overflow-x: auto; flex: none; }
  .sq-batch[hidden] { display: none; }
  .sq-batch .sq-tab { white-space: nowrap; flex: none; }
  .sq-tab .st { font-weight: 700; }
  .sq-tab.ok .st { color: var(--s2-ok); }
  .sq-tab.error .st { color: var(--s2-err); }
  .sq-tab.skipped, .sq-tab.pending { color: var(--s2-text-3); }
  .sq-confirm ol { margin: 8px 0; padding-left: 22px; max-height: 200px; overflow: auto; }
  .sq-confirm li pre { margin: 2px 0 6px; max-height: 80px; }
  @media (max-width: 640px) { .sq-body { grid-template-columns: minmax(0, 1fr); } .sq-tree { display: none; } }

  .sq-tree { display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--s2-border-2); border-radius: var(--s2-radius); overflow: hidden; }
  .sq-tree-top { padding: 6px; border-bottom: 1px solid var(--s2-border-2); display: flex; flex-direction: column; gap: 5px; }
  .sq-tree-top .s2-input { width: 100%; }
  .sq-tree-list { overflow: auto; flex: 1; padding: 3px 0; font-size: var(--s2-fs-xs); }
  .sq-row { display: flex; align-items: center; gap: 5px; padding: 2px 8px; cursor: pointer; white-space: nowrap; min-height: 22px; }
  .sq-row:hover { background: var(--s2-bg-2); }
  .sq-row.cur { color: var(--s2-info); font-weight: var(--font-weight-semibold, 600); }
  .sq-row .name { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .sq-row .meta { color: var(--s2-text-3); font-size: 11px; }
  .sq-row .act { display: none; font-size: 11px; padding: 0 6px; }
  .sq-row:hover .act, .sq-row .act.on { display: inline-flex; }
  .sq-row.tbl { padding-left: 22px; }
  .sq-row.col { padding-left: 40px; cursor: copy; color: var(--s2-text-2); }
  .sq-row.col input[type=checkbox] { margin: 0 2px 0 -18px; cursor: pointer; }
  .sq-row.sq-pick { cursor: default; gap: 3px; }
  .sq-row.sq-pick .s2-btn { font-size: 11px; padding: 0 7px; min-height: 20px; }
  .sq-caret { width: 10px; color: var(--s2-text-3); font-size: 9px; transition: transform .12s; flex: none; }
  .sq-caret.open { transform: rotate(90deg); }

  .sq-main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .sq-editor { border: 1px solid var(--s2-border-2); border-radius: var(--s2-radius); overflow: hidden; min-height: 60px; }
  .sq-editor .cm-editor { height: 100%; }
  .sq-split { flex: none; height: 9px; cursor: row-resize; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .sq-split::before { content: ""; width: 44px; height: 3px; border-radius: 2px; background: var(--s2-border); }
  .sq-split:hover::before, .sq-split.drag::before { background: var(--s2-info); }
  .sq-results { flex: 1; min-height: 60px; display: flex; flex-direction: column; border: 1px solid var(--s2-border-2); border-radius: var(--s2-radius); overflow: hidden; }
  .sq-status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 5px 8px; border-bottom: 1px solid var(--s2-border-2); font-size: var(--s2-fs-xs); color: var(--s2-text-2); min-height: 32px; }
  .sq-out { flex: 1; overflow: auto; min-height: 0; }
  .sq-tabs { display: flex; gap: 2px; padding: 0 6px; border-bottom: 1px solid var(--s2-border-2); background: var(--s2-bg-2); }
  .sq-tab { border: 0; background: none; padding: 6px 10px; font-size: var(--s2-fs-xs); color: var(--s2-text-2); cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 6px; }
  .sq-tab[aria-selected="true"] { color: var(--s2-text); border-bottom-color: var(--s2-info); font-weight: var(--font-weight-semibold, 600); }
  .sq-tab .count { background: var(--s2-info); color: #fff; border-radius: 999px; font-size: 10px; padding: 0 6px; font-weight: 600; }
  .sq-chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .sq-chat[hidden], .sq-resultview[hidden] { display: none; }
  .sq-resultview { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .sq-msgs { flex: 1; overflow: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .sq-msg { max-width: 92%; font-size: var(--s2-fs-xs); line-height: 1.5; }
  .sq-msg.you { align-self: flex-end; background: var(--s2-info-bg); border-radius: 10px 10px 2px 10px; padding: 6px 10px; white-space: pre-wrap; }
  .sq-msg.claude { align-self: flex-start; background: var(--s2-bg-2); border-radius: 10px 10px 10px 2px; padding: 6px 10px; width: 92%; }
  .sq-msg.note { align-self: center; color: var(--s2-text-3); font-style: italic; }
  .sq-msg .who { font-size: 11px; color: var(--s2-text-3); margin-bottom: 2px; }
  .sq-msg p { margin: 0 0 4px; white-space: pre-wrap; }
  .sq-msg p code { font-family: var(--s2-mono); font-size: 11.5px; background: var(--s2-bg-3); border-radius: 3px; padding: 0 3px; }
  .sq-code { margin: 6px 0; border: 1px solid var(--s2-border-2); border-radius: var(--s2-radius-sm); overflow: hidden; background: var(--s2-bg); }
  .sq-code pre { margin: 0; padding: 7px 9px; font-family: var(--s2-mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
  .sq-code .bar { display: flex; gap: 4px; padding: 4px 6px; border-top: 1px solid var(--s2-border-2); background: var(--s2-bg-2); }
  .sq-ask { display: flex; gap: 6px; align-items: flex-end; padding: 6px 8px; border-top: 1px solid var(--s2-border-2); }
  .sq-ask textarea { flex: 1; resize: none; min-height: 34px; max-height: 120px; font-size: var(--s2-fs-xs); }
  .sq-ask-opts { font-size: 11px; color: var(--s2-text-3); padding: 0 8px 6px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .sq-ask-opts .sq-mode { font-size: 11px; padding: 1px 4px; height: auto; width: auto; }
  .sq-msg.error { align-self: flex-start; background: var(--s2-err-bg, var(--s2-warn-bg)); border-radius: 10px; padding: 6px 10px; width: 92%; }
  .sq-msg.note .s2-btn { font-style: normal; margin-left: 6px; }
  .sq-out .s2-table-wrap { border: 0; border-radius: 0; overflow: visible; }
  .sq-placeholder { padding: 18px; color: var(--s2-text-2); font-size: var(--s2-fs-xs); line-height: 1.6; }
  .sq-placeholder kbd { font-family: var(--s2-mono); background: var(--s2-bg-2); border: 1px solid var(--s2-border-2); border-radius: 3px; padding: 0 4px; }
  .sq-confirm { margin: 10px; padding: 10px 12px; border-radius: var(--s2-radius-sm); background: var(--s2-warn-bg); color: var(--s2-text); font-size: var(--s2-fs-xs); }
  .sq-confirm strong { color: var(--s2-warn); }
  .sq-confirm pre { margin: 8px 0; max-height: 120px; overflow: auto; }
  .sq-out .s2-error { margin: 10px; }

  /* CodeMirror autocomplete popup */
  .cm-tooltip.cm-tooltip-autocomplete > ul { font-family: var(--s2-mono); max-height: 16em; }
  .cm-completionDetail { color: var(--s2-text-3); margin-left: .6em; font-style: normal; }
  .cm-tooltip.cm-completionInfo { max-width: 340px; padding: 6px 9px; font-family: var(--s2-font); font-size: var(--s2-fs-xs); white-space: normal; }
  .sq-seg { display: inline-flex; border: 1px solid var(--s2-border); border-radius: var(--s2-radius-sm); overflow: hidden; }
  .sq-seg button { border: 0; background: transparent; padding: 2px 10px; font-size: var(--s2-fs-xs); cursor: pointer; color: var(--s2-text-2); }
  .sq-seg button + button { border-left: 1px solid var(--s2-border); }
  .sq-seg button[aria-pressed="true"] { background: var(--s2-bg-3); color: var(--s2-text); font-weight: var(--font-weight-semibold, 600); }

  /* SAS in the editor: "Run as" languages and their colours (SingleStore blue, PROC SQL / FedSQL orange, CAS purple, plain SAS teal) */
  :root { --lang-singlestore: var(--s2-info); --lang-procsql: #c2410c; --lang-fedsql: #c2410c; --lang-cas: #7c3aed; --lang-sas: #0f766e; }
  .sq-lang { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; letter-spacing: .02em; padding: 0 6px;
    border-radius: 4px; line-height: 17px; white-space: nowrap; color: var(--lc); background: color-mix(in srgb, var(--lc) 13%, transparent);
    border: 1px solid color-mix(in srgb, var(--lc) 35%, transparent); }
  .sq-lang[data-lang="singlestore"] { --lc: var(--lang-singlestore); } .sq-lang[data-lang="procsql"] { --lc: var(--lang-procsql); }
  .sq-lang[data-lang="fedsql"] { --lc: var(--lang-fedsql); } .sq-lang[data-lang="cas"] { --lc: var(--lang-cas); } .sq-lang[data-lang="sas"] { --lc: var(--lang-sas); }
  .sq-runas { border-width: 2px; font-weight: 600; max-width: 170px; }
  .sq-runas[data-lang="singlestore"] { border-color: var(--lang-singlestore); } .sq-runas[data-lang="procsql"], .sq-runas[data-lang="fedsql"] { border-color: var(--lang-procsql); }
  .sq-runas[data-lang="cas"] { border-color: var(--lang-cas); }
  .sq-editor { position: relative; }
  .sq-editor > .sq-lang { position: absolute; top: 4px; right: 8px; z-index: 5; pointer-events: none; opacity: .9; }
  .sq-sasopts { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sq-sasopts input[type=number] { width: 90px; min-width: 0; }
  .sq-hint { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px; padding: 8px 10px; border-radius: var(--s2-radius-sm);
    background: var(--s2-warn-bg); font-size: var(--s2-fs-xs); }
  .sq-saslog { margin: 0; padding: 8px 10px; font-family: var(--s2-mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  .sq-saslog .e { color: var(--s2-err); font-weight: 600; } .sq-saslog .w { color: var(--s2-warn); } .sq-saslog .n { color: var(--s2-info); }
  .sq-saslog .s { color: var(--s2-text-2); }
  .sq-gen { border-bottom: 1px solid var(--s2-border-2); background: var(--s2-bg-2); }
  .sq-gen .bar { display: flex; align-items: center; gap: 6px; padding: 5px 10px; font-size: var(--s2-fs-xs); color: var(--s2-text-2); }
  .sq-gen pre { margin: 0; padding: 0 10px 8px; font-family: var(--s2-mono); font-size: 12px; white-space: pre-wrap; max-height: 220px; overflow: auto; }
  .sq-verdict { margin: 10px; padding: 10px 12px; border-radius: var(--s2-radius-sm); font-size: var(--s2-fs-xs); border-left: 4px solid var(--vc); background: color-mix(in srgb, var(--vc) 10%, transparent); }
  .sq-verdict strong { color: var(--vc); font-size: 13px; }
  .sq-verdict[data-v="full"] { --vc: var(--s2-ok); } .sq-verdict[data-v="partly"] { --vc: var(--s2-warn); }
  .sq-verdict[data-v="pulled"] { --vc: var(--s2-err); } .sq-verdict[data-v="none"] { --vc: var(--s2-text-3); }
  .sq-sent { margin: 0 10px 10px; border: 1px solid var(--s2-border-2); border-radius: var(--s2-radius-sm); overflow: hidden; }
  .sq-sent pre { margin: 0; padding: 7px 9px; font-family: var(--s2-mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow: auto; }
  .sq-sent .bar { display: flex; gap: 6px; align-items: center; padding: 4px 8px; border-top: 1px solid var(--s2-border-2); background: var(--s2-bg-2); font-size: 11px; color: var(--s2-text-3); }
  .sq-listing { margin: 0; padding: 8px 10px; font-family: var(--s2-mono); font-size: 12px; white-space: pre; overflow: auto; }
  .sq-row .lib-db { color: var(--s2-info); font-size: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
const { h, fmt } = S2;
const CM = globalThis.CM;
const FUNCTIONS = JSON.parse(document.getElementById("vendor-singlestore_functions")?.textContent || "[]");
const SYSTEM = new Set(["information_schema", "cluster", "memsql"]);
const MAX_ROWS = 1000;          // writes (sql_editor_execute) and SAS runs: rows sent back at most
// SingleStore reads stream (sql_editor_query): the first page shows as soon as it's in, the rest keeps loading on the
// server (up to 100,000 rows by default) and the grid fetches it page by page as you scroll (sql_editor_rows).
const PAGE_ROWS = 1000;
const MORE_ROWS = 5000;
const newStreamId = () => "r" + Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => b.toString(16).padStart(2, "0")).join("");
const isStream = (r) => Boolean(r?.stream_id);
const SINGLESTORE_KEYWORDS = "pipeline pipelines extractor batch_interval shard sort columnstore rowstore reference link links stage aggregator aggregators leaf leaves partition partitions rebalance attach detach snapshot extension extensions resource_pool workload infer inferred offsets earliest latest skip parser vector autostats sparse unenforced global temporary";

const state = {
  resultAs: "table",             // results pane: "table" | "chart"
  chartSettings: null,           // the chart's settings (S2Charts), kept per column set
  databases: [], database: null,
  schemas: new Map(),            // db -> {status: "loading"|"ok"|"error", data, error}
  expanded: new Set(),           // db names and "db\u0000table" keys
  showSystem: false, treeOpen: true, filter: "",
  running: false, result: null, error: null, confirm: null,
  streamId: null,                // the statement running now (streamed): what Stop cancels
  batch: null,                   // Run all: {items: [{sql, write, status, result, error}], sel, stop}
  continueOnError: false,        // Run all keeps going after a failed statement
  historyCount: 0, recent: [],   // run history size and recent files (both kept by the server)
  picked: new Map(),             // "db\u0000table" -> Set of ticked column names (tree)
  editorFrac: 0.42,
  language: "singlestore",       // what this tab's SQL runs as ("Run as"; saved with the tab and in the history)
  sasOpts: { library: null, caslib: null, outobs: null, noexec: false, feedback: false, pushdown: true },
  sasView: "result",             // SAS results pane: "result" | "log" | "pushdown"
  hint: null,                    // {message, suggest, sql, database}: the SQL looks like another language
  origin: null,                 // {workload, statement_id, statement_name}: the workload statement this tab was opened from
};

// The editor tab this page is. In the Workspace each tab is its own page: the
// workspace says which (tool input tab_id / tab_label) and keeps the tab bar.
// Elsewhere (or if the workspace couldn't load its tabs) the server picks the
// active tab and this page stays on it.
const tab = { id: null, label: null, fromShell: false, closed: false };
const tabbed = () => tab.fromShell && S2.embedded();
// Which tab and file a run came from, for the run history.
const runSource = () => ({ tab_id: tab.id, tab: tab.label, file: file.name });

const cleanError = (e) => new Error(String(e?.message ?? e).replace(/^Error executing tool [\w-]+:\s*/, ""));
const ident = (name) => (/^[A-Za-z_][A-Za-z0-9_$]*$/.test(name) ? name : "`" + name.replace(/`/g, "``") + "`");

// ---------------------------------------------------------------- SAS: "Run as" languages, libraries and caslibs
// The user writes only SQL; the server wraps it (proc sql; … quit; / proc fedsql / CAS fedSql.execDirect) and
// runs it in the Workspace's SAS session (sas_query / sas_execute). Text starting with proc / data / % runs as
// plain SAS code. The language is the tab's (saved with it), never guessed from the SQL.
const LANGS = [
  { id: "singlestore", label: "SingleStore SQL", short: "S2" },
  { id: "procsql", label: "PROC SQL", short: "PROC SQL" },
  { id: "fedsql", label: "FedSQL", short: "FedSQL" },
  { id: "cas", label: "FedSQL in CAS", short: "CAS" },
];
const langOf = (id) => LANGS.find((l) => l.id === id) ?? LANGS[0];
const isSas = (lang = state.language) => lang !== "singlestore";
const SAS_STEP = /^\s*(proc|data|%|libname|filename|options|title\d?|footnote\d?|ods|run|quit|caslib|cas|endsas)\b|^\s*%/i;
const isPlainSas = (sql) => SAS_STEP.test(sql.replace(LEADING_SAS_COMMENTS, ""));
const LEADING_SAS_COMMENTS = /^(\s+|\/\*[\s\S]*?\*\/)*/;
function langBadge(lang, title) {
  const l = lang === "sas" ? { short: "SAS", label: "plain SAS code" } : langOf(lang);
  return h("span", { class: "sq-lang", "data-lang": lang, title: title ?? `Runs as ${l.label}` }, l.short);
}
// SAS names: plain when valid, else a name literal ('a b'n); FedSQL / CAS: always "quoted" (case kept).
const sasName = (name) => (/^[A-Za-z_][A-Za-z0-9_]{0,31}$/.test(name) ? name : `'${name.replace(/'/g, "''")}'n`);
const fedName = (name) => `"${String(name).replace(/"/g, '""')}"`;
const sasIdent = (name, lang = state.language) => (lang === "procsql" ? sasName(name) : fedName(name));
const libQual = (lib, lang = state.language) => (lang === "cas" && /[^A-Za-z0-9_]/.test(lib) ? fedName(lib) : lib);

const sas = {
  status: null,                  // sas_sources: {configured, signed_in, problem, …}
  libs: null, libsError: null, libsLoading: false,     // SAS libraries (Compute)
  caslibs: null, casError: null, casLoading: false,    // caslibs (CAS)
  tables: new Map(),             // "sas|LIB" / "cas|CASLIB" -> {status, data, error}

// Statement ranges, skipping delimiters inside strings, quoted names and

  const reset = () => { declared = opened = closed = false; };
  const head = () => text.slice(start, i).replace(LEADING_COMMENTS, "");
  const nextWord = (from) => /^\s*([A-Za-z_]+)/.exec(text.slice(from, from + 40))?.[1]?.toUpperCase();

    const ch = text[i], next = text[i + 1];

    } else if (ch === "'" || ch === '"' || ch === "`") quote = ch;
    else if ((ch === "-" && next === "-") || ch === "#") { while (i < text.length && text[i] !== "\n") i++; }

        onclick: () => { topen ? state.expanded.delete(key) : state.expanded.add(key); renderTree(); },
        ondblclick: () => insert(db === state.database ? ident(t.name) : `${ident(db)}.${ident(t.name)}`) },
        h("span", { class: `sq-caret${topen ? " open" : ""}` }, "▶"),
        h("span", { class: "name" }, t.name),
        t.view ? h("span", { class: "meta" }, "view") : null,
        h("button", { class: `s2-btn ghost act${picked.size ? " on" : ""}`,
          title: picked.size ? `Insert a SELECT of the ${picked.size} ticked column(s) at the cursor` : "Insert SELECT with every column listed, at the cursor (expand the table to tick just some)",
          onclick: (e) => { e.stopPropagation(); insertBlock(selectSql(db, t.name, selectCols)); } }, picked.size ? `SELECT (${picked.size})` : "SELECT columns"),
        h("button", { class: "s2-btn ghost act", title: "Run SELECT * … LIMIT 100",
          onclick: (e) => { e.stopPropagation(); placeSql(`SELECT * FROM ${ident(db)}.${ident(t.name)} LIMIT 100;`); if (state.database !== db) chooseDatabase(db); run(); } }, "Top 100")));
      if (topen) {
        t.columns.forEach((c, ci) => {
          rows.push(h("div", { class: "sq-row col", title: `Click to insert ${c.name}`, onclick: () => insert(ident(c.name)) },
            h("input", { type: "checkbox", checked: picked.has(c.name), "aria-label": `Pick column ${c.name}`,
              onclick: (e) => { e.stopPropagation(); pickColumn(key, t, ci, e.target.checked, e.shiftKey); } }),
            h("span", { class: "name" }, c.name), h("span", { class: "meta" }, c.type)));
        });
        if (t.columns.length) {
          const set = (names) => { state.picked.set(key, new Set(names)); renderTree(); };
          rows.push(h("div", { class: "sq-row col sq-pick" },
            h("button", { class: "s2-btn ghost", onclick: () => set(t.columns.map((c) => c.name)) }, "All"),
            h("button", { class: "s2-btn ghost", onclick: () => set([]) }, "None"),
            h("span", { class: "meta" }, picked.size ? `${picked.size} ticked: SELECT (${picked.size}) above` : "Tick columns, then SELECT above")));
        }
      }
    }
  }
  treeList.replaceChildren(...(rows.length ? rows : [h("div", { class: "sq-placeholder" }, state.databases.length ? "No matches" : "Loading…")]));
}

// ---------------------------------------------------------------- running
// Each statement runs on a pooled connection, so a session-level "USE db"
// wouldn't stick: the editor handles it by switching its own database.
const USE_DB = /^\s*USE\s+(`(?:[^`]|``)+`|[\w$]+)\s*;?\s*$/i;
const SCHEMA_DDL = /^\s*(create|drop|alter|rename|truncate)\b/i;
function useStatement(sql) {
  const m = USE_DB.exec(sql.replace(LEADING_COMMENTS, ""));
  if (!m) return null;
  const db = m[1].startsWith("`") ? m[1].slice(1, -1).replace(/``/g, "`") : m[1];
  if (!state.databases.includes(db)) throw new Error(`Unknown database '${db}' (names are case-sensitive)`);
  if (db !== state.database) chooseDatabase(db);
  return { kind: "use", sql, database: db, columns: [], rows: [], has_result_set: false, row_count: 0, elapsed_ms: 0, warnings: [] };
}

// sql / database default to the statement at the cursor and the editor's
// database (history's Run passes its own).
async function run(sql = statementAtCursor(), database = state.database, lang = state.language) {
  if (!sql || state.running) return;
  if (!checkHint(sql, lang, database)) return;
  if (isSas(lang)) return runSas(sql, lang);
  state.running = true; state.error = null; state.confirm = null; state.batch = null;
  renderResults(); renderHeader();
  try {
    const use = useStatement(sql);
    if (use) accept(use);
    else {
      const prev = isStream(state.result) ? state.result.stream_id : null;
      state.streamId = newStreamId();
      const data = await S2.callTool("sql_editor_query", { sql, database, max_rows: PAGE_ROWS, stream_id: state.streamId, replaces: prev, ...runSource() });
      if (data.needs_confirmation) state.confirm = { sql, database };
      else { accept(data); historyChanged(); }
    }
  } catch (e) {
    state.error = cleanError(e); report(sql, state.error.message); historyChanged();
  } finally {
    state.running = false; state.streamId = null; renderResults(); renderHeader();
  }
}

// Stop: cancels the statement on the cluster (KILL QUERY on its own connection) or stops loading more rows.
async function stopStream(id) {
  if (!id) return;
  try { await S2.callTool("sql_editor_stop", { stream_id: id }); }
  catch (e) { S2.toast(`Couldn't stop: ${cleanError(e).message}`, "err"); }
}

// ---------------------------------------------------------------- streamed results
// While a result is still loading on the server, poll its progress (about once a second; the call returns at
// once when it's done) and update the status line; the grid keeps what it shows. Rows come in pages: the
// grid asks for the next one when you scroll near its end; sorting and Export CSV load all of them first.
let following = false;
async function followStream() {
  if (following) return;
  following = true;
  try {
    for (;;) {
      const r = state.result;
      if (!isStream(r) || r.done || tab.closed) break;
      let st;
      try { st = await S2.callTool("sql_editor_rows", { stream_id: r.stream_id, offset: 1e9, limit: 0, wait_ms: 1000 }); }
      catch (e) { r.done = true; r.error = cleanError(e).message; }
      if (st) Object.assign(r, progressOf(st));
      if (state.result === r) {
        renderResultStatus();
        if (r.done) { historyChanged(); reportResult(r); maybeLoadMore(); }
      }
    }
  } finally { following = false; }
  if (isStream(state.result) && !state.result.done && !tab.closed) followStream();  // switched to another loading result
}
const progressOf = (st) => ({ loaded: st.loaded, row_count: st.loaded, done: st.done, capped: st.capped, truncated: st.capped,
  stopped: st.stopped, error: st.error, elapsed_ms: st.elapsed_ms, total_ms: st.total_ms });

let grid = null;          // {r, el}: the result grid on screen, to append pages to
let loadingMore = false;
async function fetchMore(r, waitMs = 0) {
  const st = await S2.callTool("sql_editor_rows", { stream_id: r.stream_id, offset: r.rows.length, limit: MORE_ROWS, wait_ms: waitMs });
  Object.assign(r, progressOf(st));
  if (st.rows.length && st.offset === r.rows.length) {
    r.rows.push(...st.rows);
    if (grid?.r === r) grid.el.appendRows(st.rows);
  }
  return st.rows.length;
}
const moreToFetch = (r) => isStream(r) && (r.rows.length < r.loaded || !r.done);
async function maybeLoadMore() {
  const r = state.result;
  if (loadingMore || !moreToFetch(r) || grid?.r !== r || state.resultAs === "chart") return;
  if (outEl.scrollTop + outEl.clientHeight < outEl.scrollHeight - 600) return;
  if (r.rows.length >= r.loaded && !r.done) return;  // nothing new yet: the progress poll calls again when done
  loadingMore = true;
  try { await fetchMore(r); }
  catch (e) { S2.toast(`Couldn't load more rows: ${cleanError(e).message}`, "err"); return; }
  finally { loadingMore = false; }
  if (state.result === r) { renderResultStatus(); requestAnimationFrame(maybeLoadMore); }
}
outEl.addEventListener("scroll", () => maybeLoadMore(), { passive: true });
// Every row of the result (up to the server's limit), e.g. before a sort or an export; waits for loading to end.
async function loadAllRows(r) {
  if (!moreToFetch(r)) return;
  loadingMore = true;
  try {
    while (moreToFetch(r)) {
      const got = await fetchMore(r, r.done ? 0 : 2000);
      if (state.result === r) renderResultStatus(`Loading all rows… ${fmt.number(r.rows.length)}`);
      if (!got && r.done && r.rows.length < r.loaded) throw new Error("the result is no longer complete on the server; run it again");
    }
  } finally { loadingMore = false; if (state.result === r) renderResultStatus(); }
}
async function exportCsv(r, btn) {
  if (btn) { btn.disabled = true; btn.textContent = "Exporting…"; }
  try {
    if (isStream(r)) await loadAllRows(r);
    S2.download("query-result.csv", toCsv(r.columns, r.rows), "text/csv");
    if (r.capped) S2.toast(`Exported the first ${fmt.number(r.rows.length)} rows: the result was cut off there (more rows exist)`, "");
    else if (r.stopped) S2.toast(`Exported the ${fmt.number(r.rows.length)} rows read before Stop`, "");
  } catch (e) { S2.toast(`Couldn't export: ${cleanError(e).message}`, "err"); }
  finally { if (btn) { btn.disabled = false; btn.textContent = "Export CSV"; } }
}

// ---------------------------------------------------------------- running as SAS
// "Looks wrong" check before a run: the language is the tab's choice, never switched silently, but SQL that
// looks like another language gets a one-time question (switch, or run anyway).
function languageHint(sql, lang) {
  const text = sql.replace(/'(?:[^']|'')*'/g, "''").replace(/\/\*[\s\S]*?\*\//g, " ");
  const refs = [...text.matchAll(/\b(?:from|join|into|update|table)\s+([A-Za-z_][\w]*)\s*\.\s*["`]?[A-Za-z_]/gi)].map((m) => m[1]);
  const sasLib = (n) => (sas.libs ?? []).some((l) => l.name === n.toUpperCase());
  const s2Db = (n) => state.databases.includes(n);
  if (lang === "singlestore") {
    if (isPlainSas(sql)) return { message: "This is SAS code (it starts with a SAS step), but the tab runs SingleStore SQL.", suggest: "procsql" };
    const lib = refs.find((n) => !s2Db(n) && sasLib(n));
    if (lib) return { message: `${lib} is a SAS library, not a SingleStore database, but the tab runs SingleStore SQL.`, suggest: "procsql" };
    if (/\(\s*obs\s*=|'[^']*'n\b|\bcalculated\b/i.test(sql)) return { message: "This looks like PROC SQL (obs= / name literal / CALCULATED), but the tab runs SingleStore SQL.", suggest: "procsql" };
    return null;
  }
  if (isPlainSas(sql)) return null;
  if (/`/.test(text)) return { message: "Backtick-quoted names are SingleStore syntax; SAS quotes names with \"…\" (FedSQL) or 'name'n (PROC SQL).", suggest: "singlestore" };
  const db = refs.find((n) => s2Db(n) && !libMeta(n) && !sasLib(n));
  if (db && (sas.libs || sas.caslibs)) return { message: `${db} is a SingleStore database, not a ${lang === "cas" ? "caslib" : "SAS library"}.`, suggest: "singlestore" };
  if (lang === "procsql" && /\blimit\s+\d+\s*;?\s*$/i.test(text)) return { message: "PROC SQL has no LIMIT: set OUTOBS in the ⚙ options, or run it as FedSQL.", suggest: "fedsql" };
  return null;
}
function checkHint(sql, lang, database) {
  if (state.hintOk === sql) { state.hintOk = null; return true; }
  const hint = languageHint(sql, lang);
  if (!hint) return true;
  state.hint = { ...hint, sql, lang, database };
  state.error = null; state.confirm = null;
  renderResults();
  return false;
}

const sasArgs = (sql, lang) => ({
  language: lang, sql, library: lang === "cas" ? state.sasOpts.caslib : state.sasOpts.library,
  options: { outobs: state.sasOpts.outobs, noexec: state.sasOpts.noexec, feedback: state.sasOpts.feedback },
  max_rows: MAX_ROWS, pushdown: state.sasOpts.pushdown, ...runSource(),
});
async function runSas(sql, lang, { confirmed = false } = {}) {
  state.running = true; state.error = null; state.confirm = null; state.batch = null; state.hint = null;
  renderResults(); renderHeader();
  try {
    const data = await S2.callTool(confirmed ? "sas_execute" : "sas_query", sasArgs(sql, lang));
    if (data.needs_confirmation) state.confirm = { sql, lang, sas: data, database: sasArgs(sql, lang).library };
    else acceptSas(data);
  } catch (e) {
    state.error = cleanError(e); report(sql, state.error.message);
  } finally {
    state.running = false; renderResults(); renderHeader(); historyChanged();
  }
}
function acceptSas(data) {
  state.result = { ...data, sas: true };
  state.sasView = data.error ? "log" : data.has_result_set || data.listing ? "result" : "log";
  if (/^\s*(create|drop|alter)\b/i.test(data.sql ?? "") || data.plain_sas) {
    // Tables may have come or gone: reload the open library's table list.
    const lib = curLib(data.language);
    if (lib) loadSasTables(lib, true, data.language);
    if (data.language !== "cas") sas.tables.delete("sas|WORK");
  }
  const pd = data.pushdown && data.pushdown.verdict !== "none" ? ` Pushdown: ${data.pushdown.verdict}.` : "";
  report(data.sql ?? "", data.error ? `SAS error: ${data.error}`
    : data.has_result_set ? `${data.row_count} row(s) x ${data.columns.length} column(s) (run as ${langOf(data.language).label})${pd}`
    : `ran as ${data.plain_sas ? "plain SAS code" : langOf(data.language).label}${pd}`);
}
function cycleLanguage() {
  const i = LANGS.findIndex((l) => l.id === state.language);
  setLanguage(LANGS[(i + 1) % LANGS.length].id);
}

async function runConfirmed() {
  if (state.confirm.batch) return runBatch(state.confirm.batch, new Set(state.confirm.writes.map((w) => w.index)));
  if (state.confirm.sas) return runSas(state.confirm.sql, state.confirm.lang, { confirmed: true });
  const { sql, database } = state.confirm;
  state.confirm = null; state.running = true; state.error = null;
  renderResults(); renderHeader();
  try {
    accept(await S2.callTool("sql_editor_execute", { sql, database, max_rows: MAX_ROWS, ...runSource() }));
    if (SCHEMA_DDL.test(sql) && database) loadSchema(database, true);
  } catch (e) {
    state.error = cleanError(e); report(sql, state.error.message);
  } finally {
    state.running = false; renderResults(); renderHeader(); historyChanged();
  }
}

// ---------------------------------------------------------------- run all
// Every statement in the editor, in order, split like Ctrl+Enter splits them
// (strings, comments, quoted names, DELIMITER blocks, routine bodies). The
// server first says which statements change data; those are confirmed once
// for the whole batch, then run through sql_editor_execute.
function editorStatements() {
  const text = view.state.doc.toString();
  return statementRanges(text).map((r) => text.slice(r.from, r.to).trim()).filter(Boolean);
}

async function runAll() {
  if (state.running) return;
  const statements = editorStatements();
  if (!statements.length) return;
  state.running = true; state.error = null; state.confirm = null; state.batch = null;
  renderResults(); renderHeader();
  let writes;
  try {
    writes = isSas()
      ? (await S2.callTool("sas_classify", { language: state.language, statements, library: curLib() })).writes
      : (await S2.callTool("sql_editor_classify", { statements })).writes
        .filter((w) => !USE_DB.test(statements[w.index].replace(LEADING_COMMENTS, "")));
  } catch (e) {
    state.error = cleanError(e);
    state.running = false; renderResults(); renderHeader();
    return;
  }
  state.running = false;
  if (writes.length) {
    state.confirm = { batch: statements, writes, database: isSas() ? curLib() : state.database, lang: state.language };
    renderResults(); renderHeader();
    return;
  }
  return runBatch(statements, new Set());
}

async function runBatch(statements, writes) {
  const b = (state.batch = { items: statements.map((sql, i) => ({ sql, write: writes.has(i), status: "pending" })), sel: 0, stop: false });
  state.confirm = null; state.running = true; state.error = null; state.result = null;
  let database = state.database, ddl = false, failed = null;
  const started = performance.now();
  for (const [i, it] of b.items.entries()) {
    if (b.stop) break;
    it.status = "running"; b.sel = i;
    renderResults(); renderHeader();
    try {
      const use = isSas() ? null : useStatement(it.sql);
      if (use) { database = use.database; it.result = use; }
      else if (isSas()) {
        const data = await S2.callTool(it.write ? "sas_execute" : "sas_query", sasArgs(it.sql, state.language));
        if (data.needs_confirmation) throw new Error(`${data.reason}; run it on its own (Ctrl+Enter) to confirm it.`);
        it.result = { ...data, sas: true };
        historyChanged();
        if (data.error) throw new Error(data.error);
        if (SCHEMA_DDL.test(it.sql) || data.plain_sas) ddl = true;
      } else {
        const data = await S2.callTool(it.write ? "sql_editor_execute" : "sql_editor_query", it.write
          ? { sql: it.sql, database, max_rows: MAX_ROWS, ...runSource() }
          : { sql: it.sql, database, max_rows: PAGE_ROWS, stream_id: newStreamId(), ...runSource() });
        if (data.needs_confirmation) throw new Error("This statement changes data or schema; run it on its own (Ctrl+Enter) to confirm it.");
        it.result = data;
        historyChanged();
        if (SCHEMA_DDL.test(it.sql)) ddl = true;
        if (DB_DDL.test(it.sql)) refreshDatabases({ force: true });
      }
      it.status = "ok";
    } catch (e) {
      it.error = cleanError(e); it.status = "error"; failed ??= i;
      historyChanged();
      if (!state.continueOnError) break;
    }
  }
  for (const it of b.items) if (it.status === "pending") it.status = "skipped";
  b.elapsed = performance.now() - started;
  if (ddl && isSas()) { const lib = curLib(); if (lib) loadSasTables(lib, true); sas.tables.delete("sas|WORK"); }
  else if (ddl && database) loadSchema(database, true);
  // Show the first error if the run stopped there, else the last result set.
  const lastSet = b.items.findLastIndex((it) => it.result?.has_result_set);
  selectBatchItem(failed != null && !state.continueOnError ? failed : lastSet >= 0 ? lastSet : b.items.findLastIndex((it) => it.status !== "skipped"));
  const counts = batchCounts(b);
  report(statements.map((s) => s.replace(/\s+/g, " ").slice(0, 200)).join(";\n"),
    `Run all: ${counts.ok} ok, ${counts.error} failed, ${counts.skipped} not run`);
  state.running = false; renderResults(); renderHeader();
}

function batchCounts(b) {
  const counts = { ok: 0, error: 0, skipped: 0, pending: 0, running: 0 };
  for (const it of b.items) counts[it.status]++;
  return counts;
}

// The results pane (and Claude's "last result") show one statement at a time.
function selectBatchItem(i) {
  const b = state.batch;
  if (!b || i < 0) return;
  b.sel = i;
  state.result = b.items[i].result ?? null;
  state.error = b.items[i].error ?? null;
  if (isStream(state.result) && !state.result.done) followStream();
}

function batchSummary() {
  const b = state.batch;
  if (!b || state.running) return null;
  const c = batchCounts(b);
  return h("span", { class: "s2-faint" }, `Run all: statement ${b.sel + 1} of ${b.items.length} · ${c.ok} ok`
    + `${c.error ? `, ${c.error} failed` : ""}${c.skipped ? `, ${c.skipped} not run` : ""} · ${fmt.number(b.elapsed ?? 0)} ms in all`);
}

function renderBatch() {
  const b = state.batch;
  batchEl.hidden = !b;
  if (!b) return;
  const icon = { ok: "✓", error: "✕", skipped: "–", pending: "·" };
  batchEl.replaceChildren(...b.items.map((it, i) => {
    const verb = it.sql.replace(LEADING_COMMENTS, "").split(/\s+/)[0].toUpperCase().slice(0, 12);
    const r = it.result;
    const detail = it.error ? it.error.message : r ? (r.kind === "use" ? `database ${r.database}` : r.has_result_set ? `${r.row_count} row(s)` : `${r.affected_rows ?? 0} row(s) affected`) : it.status === "skipped" ? "not run" : "";
    return h("button", { class: `sq-tab ${it.status}`, role: "tab", "aria-selected": String(i === b.sel),
      title: `${it.sql.slice(0, 400)}${it.sql.length > 400 ? "…" : ""}\n\n${detail}${r ? ` · ${fmt.number(r.elapsed_ms, 1)} ms` : ""}`,
      disabled: it.status === "pending" || it.status === "running",
      onclick: () => { selectBatchItem(i); renderResults(); } },
      it.status === "running" ? h("span", { class: "s2-spinner" }) : h("span", { class: "st" }, icon[it.status]),
      `${i + 1} ${verb}`);
  }));
  batchEl.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: "nearest", inline: "nearest" });
}


// Database list: refreshed when the dropdown is opened (at most every few
// seconds), with the ↻ button, and after statements that create or drop a
// database, so databases made by code show up without reopening the app.
const DB_DDL = /\b(CREATE|DROP)\s+(DATABASE|SCHEMA)\b/i;
let dbListLoadedAt = 0;
async function refreshDatabases({ force = false } = {}) {
  if (!force && Date.now() - dbListLoadedAt < 4000) return;
  dbListLoadedAt = Date.now();
  try {
    const res = await S2.callTool("schema_explorer_databases", {});
    const names = (res.databases ?? []).map((d) => d.name ?? d);
    if (JSON.stringify(names) === JSON.stringify(state.databases)) return;
    state.databases = names;
    if (state.database && !names.includes(state.database)) S2.toast(`Database ${state.database} no longer exists`, "err");
    onDatabasesChanged();
  } catch (e) { if (force) S2.toast(`Couldn't refresh databases: ${cleanError(e).message}`, "err"); }
}
function onDatabasesChanged() { renderHeader(); renderTree(); }

function accept(data) {
  state.result = data;
  if (DB_DDL.test(data.sql ?? "")) refreshDatabases({ force: true });
  reportResult(data);
  if (isStream(data) && !data.done) followStream();
}
function reportResult(data) {
  report(data.sql, data.kind === "use" ? `switched the editor to database ${data.database}`
    : data.kind === "write" && !data.has_result_set
    ? `executed, ${data.affected_rows ?? "?"} row(s) affected`
    : `${data.row_count} row(s) x ${data.columns.length} column(s)${isStream(data) && !data.done ? " so far (still loading)" : ""}`
      + `${data.truncated ? ` (cut off at ${data.max_rows})` : ""}${data.stopped ? " (stopped)" : ""}`);
}

function report(sql, outcome) {
  S2.updateModelContext(`SQL Editor ${editorId}${tab.label ? ` (tab ${tab.label})` : ""} (database ${state.database ?? "default"}; send SQL to it with sql_editor_reply). The user ran:\n${sql.slice(0, 1500)}\nResult: ${outcome}`);
}

function toCsv(columns, rows) {
  const cell = (v) => {
    const s = v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v);
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  return [columns.map(cell).join(","), ...rows.map((r) => columns.map((c) => cell(r[c])).join(","))].join("\r\n");
}

function renderResults() {
  const r = state.result;
  outEl.scrollTop = 0;
  renderBatch();
  if (state.running) {
    const b = state.batch;
    statusEl.replaceChildren(...(b
      ? [h("span", { class: "s2-spinner" }), ` Running statement ${b.sel + 1} of ${b.items.length}…`,
         h("button", { class: "s2-btn ghost", disabled: b.stop, title: "Stop after the statement that is running now",
           onclick: () => { b.stop = true; renderResults(); } }, b.stop ? "Stopping…" : "Stop")]
      : [h("span", { class: "s2-spinner" }), " Running…",
         state.streamId ? h("button", { class: "s2-btn ghost", title: "Cancel the query on the cluster", onclick: (e) => { e.currentTarget.disabled = true; stopStream(state.streamId); } }, "Stop") : null]));
    return;
  }
  if (state.confirm?.batch) {
    const { batch, writes } = state.confirm;

// Short hash (cyrb53) of a file's saved text: the autosaved draft keeps it

  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, "0") + (h1 >>> 0).toString(16).padStart(8, "0");
}

    : "");

}

// Returns the tool result ({exists} asks the browser to confirm); throws on errors.

  file.name = res.name; file.path = res.path; file.external = false; file.folder = res.folder;

// Opening replaces the editor; ask first if there are unsaved changes.

// ---------------------------------------------------------------- autosave
// The editor's text, database and cursor are saved on the server
// (sql_editor_save_draft, one draft per tab) a second after the last change,
// and restored when the editor opens again, also after a restart. The draft
// never touches the open .sql file: that only changes with Save.
const draft = { ready: false, timer: null, saving: false, again: false, failed: false, savedAt: null, restoredDb: null };
function scheduleDraftSave() {
  if (!draft.ready || tab.closed) return;
  clearTimeout(draft.timer);
  draft.timer = setTimeout(saveDraft, 1000);
}
async function saveDraft() {
  clearTimeout(draft.timer); draft.timer = null;
  if (!draft.ready || !S2.app || tab.closed) return;
  if (draft.saving) { draft.again = true; return; }
  draft.saving = true;
  const sel = view.state.selection.main;
  try {
    const res = await S2.callTool("sql_editor_save_draft", {
      sql: view.state.doc.toString(),
      // While the connection fails there's no database list: keep the restored one.
      database: state.database ?? (state.databases.length ? null : draft.restoredDb),
      anchor: sel.anchor, head: sel.head,
      file_name: file.name, file_path: file.path ?? null, file_external: Boolean(file.external),
      saved_hash: file.name ? file.savedHash : null, continue_on_error: state.continueOnError,
      tab_id: tab.id, dirty: hasUnsaved(), language: state.language, sas: { ...state.sasOpts },
      origin: state.origin ? { workload: state.origin.workload, statement_id: state.origin.statement_id, statement_name: state.origin.statement_name ?? "" } : null,
    });
    if (res.closed) {
      // Closed in another window: keep the text on screen, but it's no longer autosaved.
      tab.closed = true;
      S2.toast("This editor tab was closed in another window: its text is no longer autosaved (copy it or Save it to a file)", "err");
      return;
    }
    draft.savedAt = res.updated; draft.failed = false;
    renderFileLabel();
  } catch (e) {
    if (!draft.failed) S2.toast(`Couldn't autosave the editor: ${cleanError(e).message}`, "err");
    draft.failed = true;
  } finally {
    draft.saving = false;
    if (draft.again) { draft.again = false; scheduleDraftSave(); }

const flushDraft = () => { if (draft.timer) saveDraft(); };
document.addEventListener("visibilitychange", () => { if (document.hidden) flushDraft(); });
window.addEventListener("pagehide", flushDraft);

async function restoreDraft(d) {
  setSql(d.sql);
  const len = view.state.doc.length;
  const clamp = (n) => Math.max(0, Math.min(len, Number(n) || 0));
  view.dispatch({ selection: { anchor: clamp(d.cursor?.anchor), head: clamp(d.cursor?.head) }, scrollIntoView: true });
  state.continueOnError = Boolean(d.continue_on_error);
  state.language = LANGS.some((l) => l.id === d.language) ? d.language : "singlestore";
  state.sasOpts = { library: null, caslib: null, outobs: null, noexec: false, feedback: false, pushdown: true, ...(d.sas ?? {}) };
  if (isSas()) { view.dispatch({ effects: sqlCompartment.reconfigure(sqlExtension()) }); loadSasLibraries(); }
  renderEditorBadge();
  state.origin = d.origin?.workload && d.origin?.statement_id ? { ...d.origin } : null;
  draft.restoredDb = d.database ?? null;
  draft.savedAt = d.updated ?? null;
  const f = d.file;
  if (!f?.name) { file.savedText = ""; file.savedHash = hashText(""); return; }
  file.name = f.name; file.path = f.path ?? null; file.external = Boolean(f.external);
  file.savedText = null; file.savedHash = f.saved_hash ?? null;
  if (!file.path || file.external) return;
  // Compare with the file as it is on disk now (without touching it).
  try {
    const res = await S2.callTool("sql_editor_open_file", { name: file.path, remember: false });
    file.folder = res.folder;
    const draftClean = hashText(d.sql) === f.saved_hash;
    const diskChanged = hashText(lf(res.sql)) !== f.saved_hash;
    setSaved(res.sql);
    if (draftClean && diskChanged) {
      setSql(res.sql);  // the file is unchanged in the editor: show the new version
      S2.toast(`${f.name} changed on disk: the editor shows the new version`, "");
    } else if (diskChanged) {
      S2.toast(`${f.name} changed on disk since you last saved it; your unsaved changes are kept in the editor`, "err");
    }
  } catch {
    S2.toast(`${f.name} can't be read any more; your text is kept as an unsaved draft`, "err");
  }
}

  const choices = code != null ? [["Claude's SQL block", [code]]]
    : [...(!sel.empty ? [["Selection", [view.state.sliceDoc(sel.from, sel.to)]]] : [["Statement at the cursor", [statementAtCursor()]]]),
       ...(all.length > 1 || (!sel.empty && all.length) ? [[`All ${all.length} statement${all.length === 1 ? "" : "s"} in this tab`, all]] : [])];
  if (!choices.some(([, sqls]) => sqls.some((s) => s.trim()))) { S2.toast("There's no SQL to send: write or select a statement first", "err"); return; }
  wlPanel.hidden = false;
  wlPanel.replaceChildren(h("div", { class: "row" }, h("span", { class: "s2-spinner" }), " Loading workloads…"));
  renderHeader();
  try { toWl.workloads = (await S2.callTool("workload_overview", {})).workloads.map((w) => w.name); }
  catch (e) { toWl.workloads = []; S2.toast(`Couldn't list the workloads: ${cleanError(e).message}`, "err"); }
  if (wlPanel.hidden) return;
  const NEW = "\u0000new";
  const what = h("select", { class: "s2-input", "aria-label": "What to send", style: { minWidth: "0" } },
    choices.map(([label], i) => h("option", { value: String(i) }, label)));
  const target = h("select", { class: "s2-input", "aria-label": "Workload", style: { minWidth: "180px" },
    onchange: () => { nameInput.hidden = target.value !== NEW; if (!nameInput.hidden) nameInput.focus(); } },
    toWl.workloads.map((n) => h("option", { value: n }, n)), h("option", { value: NEW }, "New workload…"));
  target.value = toWl.workloads.includes(toWl.last) ? toWl.last : toWl.workloads[0] ?? NEW;
  const nameInput = h("input", { class: "s2-input", type: "text", placeholder: "Name of the new workload", "aria-label": "New workload name",
    style: { minWidth: "180px" }, hidden: target.value !== NEW, onkeydown: (e) => { if (e.key === "Enter") send(); if (e.key === "Escape") hideToWorkload(); } });
  const rate = h("input", { class: "s2-input", type: "number", min: "0", step: "any", value: 60, "aria-label": "Runs per minute", style: { minWidth: "0", width: "80px" } });
  const sendBtn = h("button", { class: "s2-btn primary", onclick: () => send() }, "Add to workload");
  async function send() {
    const sqls = choices[Number(what.value)][1].map((s) => s.trim()).filter(Boolean);
    const isNew = target.value === NEW;
    const name = isNew ? nameInput.value.trim() : target.value;
    if (isNew && !name) { nameInput.focus(); S2.toast("Give the new workload a name", "err"); return; }
    if (isNew && toWl.workloads.includes(name)) { S2.toast(`A workload named "${name}" exists: pick it in the list`, "err"); return; }
    sendBtn.disabled = true;
    try {
      const { statements } = await S2.callTool("workload_parse_statements", { sql: sqls, per_minute: Number(rate.value) || 0 });
      if (!statements.length) throw new Error("There's no SQL to send.");
      const payload = { statements, database: state.database, workload: isNew ? null : name, new_name: isNew ? name : null };
      if (S2.embedded()) S2.openView("workload", payload);
      else {
        const { id } = await S2.callTool("workload_handoff_put", payload);
        await S2.openAppInBrowser("workload", { name: payload.workload, handoff: id });
      }
      toWl.last = isNew ? null : name;
      hideToWorkload();
      S2.toast(`${statements.length} statement${statements.length === 1 ? "" : "s"} sent to ${isNew ? "a new workload" : `workload ${name}`}: review and Save there`, "ok");
    } catch (e) { S2.toast(cleanError(e).message, "err"); sendBtn.disabled = false; }
  }
  wlPanel.replaceChildren(
    h("div", { class: "row" }, h("strong", {}, "→ Workload"), what, h("span", {}, "to"), target, nameInput,
      h("span", {}, "runs / min"), rate, sendBtn, h("button", { class: "s2-btn ghost", onclick: hideToWorkload }, "Cancel")),
    h("div", { class: "row s2-muted" }, `Database ${state.database ?? "(default)"} goes with it. A "-- name: …" or "-- per_minute: N" line above a statement names it or sets its rate. `,
      S2.embedded() ? "The Workload view opens with the statements added (not saved yet)." : "The Workload app opens in your browser with the statements added (not saved yet)."));
  (target.value === NEW ? nameInput : sendBtn).focus();
}

// A tab opened from a workload statement ("Open in SQL Editor" in the Workload view) writes its SQL back to it:
// the selection, else the whole tab when it holds one statement, else the statement at the cursor. That
// saves the workload (an open Workload view shows the new SQL).
function originControls() {
  const o = state.origin;
  if (!o) return null;
  const what = `statement "${o.statement_name || o.statement_id}" of workload ${o.workload}`;
  if (o.missing) {
    return h("span", { class: "sq-origin" }, h("span", { class: "warn", title: o.missing }, "⚠ Workload statement gone"),
      h("button", { class: "s2-btn ghost", title: `${o.missing}\nAdd this SQL to a workload instead`, onclick: () => showToWorkload() }, "→ Workload instead"),
      h("button", { class: "s2-btn ghost", title: "Forget where this tab came from", "aria-label": "Forget the workload statement",
        onclick: () => { state.origin = null; renderHeader(); scheduleDraftSave(); } }, "✕"));
  }
  return h("button", { class: "s2-btn", title: `Write this tab's SQL back to ${what} and save the workload\n(the selection, else the whole tab when it's one statement, else the statement at the cursor)`,
    onclick: (e) => updateInWorkload(e.currentTarget) }, "Update in workload");
}
function sqlForWorkload() {
  const sel = view.state.selection.main;
  if (!sel.empty) return view.state.sliceDoc(sel.from, sel.to).trim();
  return editorStatements().length <= 1 ? view.state.doc.toString().trim() : statementAtCursor();
}
async function updateInWorkload(btn) {
  const o = state.origin;
  const sql = sqlForWorkload();
  if (!o || !sql) { S2.toast("There's no SQL to write back", "err"); return; }
  btn.disabled = true;
  try {
    const r = await S2.callTool("workload_update_statement", { name: o.workload, statement_id: o.statement_id, sql, database: state.database });
    if (r.statement.name !== o.statement_name) { o.statement_name = r.statement.name; scheduleDraftSave(); }
    S2.toast(`Updated "${r.statement.name}" in workload ${o.workload} and saved it`, "ok");
    if (S2.embedded()) window.parent.postMessage({ type: "s2-notify", view: "workload", payload: { type: "s2-workload-updated", workload: r.workload, statement_id: o.statement_id } }, "*");
  } catch (e) {
    const msg = cleanError(e).message;
    if (/doesn't exist any more|no statement/.test(msg)) o.missing = msg;
    S2.toast(msg, "err");
  }
  btn.disabled = false;
  renderHeader();
}

// ---------------------------------------------------------------- chat with Claude
// Two ways to get an answer, both landing in this editor's inbox (polled):
//  - "app":  the server runs headless Claude Code with read-only database
//            tools (sql_editor_ask). No Send click; works in the browser view.
//  - "chat": the question goes to the Claude chat as a user message tagged
//            with this editor's id; Claude answers with sql_editor_reply.
const editorId = "e-" + Array.from(crypto.getRandomValues(new Uint8Array(3)), (b) => b.toString(16).padStart(2, "0")).join("");
let savedMode = null;
try { savedMode = localStorage.getItem("s2-sql-chat-mode"); } catch {}
const chat = { tab: "results", unread: 0, waiting: false, lastSeq: 0, messages: [],
               mode: savedMode === "chat" ? "chat" : "app", assistant: null, job: null };
const chatAvailable = () => !S2.inBrowserView();
const appAvailable = () => chat.assistant?.available !== false;
function effectiveMode() {
  if (chat.mode === "chat" && chatAvailable()) return "chat";
  return appAvailable() ? "app" : chatAvailable() ? "chat" : null;
}
function renderModeOptions() {
  const opts = [];
  if (appAvailable()) opts.push(h("option", { value: "app" }, "here in the editor"));
  if (chatAvailable()) opts.push(h("option", { value: "chat" }, "in the Claude chat"));
  modeSelect.replaceChildren(...opts);
  modeSelect.value = effectiveMode() ?? "";
  modeSelect.disabled = opts.length < 2;
  const mode = effectiveMode();
  profileLabel.hidden = mode !== "app";
  modeHint.textContent = mode === "app" ? "Claude can run read-only queries to check its answer."
    : mode === "chat" ? "Claude will put your question in the chat box; click Send there."
    : chat.assistant?.reason ?? "";
}

function renderTabs() {
  claudeBtn.className = `s2-btn sq-claude-btn${chat.open ? " primary" : ""}`;
  claudeBtn.replaceChildren(...["Claude",
    chat.waiting ? h("span", { class: "s2-spinner", style: { marginLeft: "4px" } }) : chat.unread ? h("span", { class: "count" }, chat.unread) : null].filter(Boolean));
}
// The chat lives in a panel on the right, like the Notebook's.
function toggleChat(open = !chat.open) {
  chat.open = open;
  chatView.hidden = !open;
  bodyEl.classList.toggle("chat-open", open);
  if (open) { chat.unread = 0; askBox.focus(); msgsEl.scrollTop = msgsEl.scrollHeight; warmAssistant(); }
  renderTabs();
}

// Inline **bold** and `code` only; everything else stays plain text (no HTML).
function inline(text) {
  const out = [];
  const re = /\*\*([^*\n]+)\*\*|`([^`\n]+)`/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    out.push(m[1] !== undefined ? h("strong", {}, m[1]) : h("code", {}, m[2]));
    last = re.lastIndex;
  }
  out.push(text.slice(last));
  return out;
}
const textPart = (t) => (t.trim() ? h("p", {}, ...inline(t.trim())) : null);
function codePart(code) {
  return h("div", { class: "sq-code" }, h("pre", {}, code),
    h("div", { class: "bar" },
      h("button", { class: "s2-btn", title: "Replace everything in the editor with this SQL",
        onclick: () => { setSql(code); view.focus(); S2.toast("Editor replaced", "ok"); } }, "Replace editor"),
      h("button", { class: "s2-btn", title: "Insert at the cursor (or over the selection)",
        onclick: () => { insert(code); S2.toast("Inserted at cursor", "ok"); } }, "Insert at cursor"),
      h("button", { class: "s2-btn ghost", title: "Add this SQL to a test workload (Workload view)", onclick: () => showToWorkload(code) }, "→ Workload"),
      h("button", { class: "s2-btn ghost", onclick: async () => {
        await S2.copy(code);
      } }, "Copy")));
}
// Plain text with ``` fenced code blocks (the format sql_editor_reply asks for).
function messageBody(text) {
  const parts = [];
  const re = /```[\w-]*\n?([\s\S]*?)```/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    parts.push(textPart(text.slice(last, m.index)), codePart(m[1].replace(/\s+$/, "")));
    last = re.lastIndex;
  }
  parts.push(textPart(text.slice(last)));
  return parts.filter(Boolean);
}

function waitingNote() {
  if (chat.waitingMode === "chat") {
    return h("div", { class: "sq-msg note" }, h("span", { class: "s2-spinner" }), " Waiting for Claude… (your question is in the Claude chat box; click Send there)");
  }
  const j = chat.job;
  const detail = j ? `${j.activity}${j.seconds >= 5 ? ` · ${j.seconds}s` : ""}` : "Starting Claude…";
  return h("div", { class: "sq-msg note" }, h("span", { class: "s2-spinner" }), ` ${detail}`,
    h("button", { class: "s2-btn ghost", onclick: stopAsking }, "Stop"));
}

function renderChat() {
  renderModeOptions();
  const items = chat.messages.map((msg) =>
    msg.from === "you" ? h("div", { class: "sq-msg you" }, msg.text)
    : msg.from === "note" ? h("div", { class: "sq-msg note" }, msg.text)
    : msg.from === "error" ? h("div", { class: "sq-msg error" }, h("div", { class: "who" }, "Couldn't answer"), messageBody(msg.text))
    : h("div", { class: "sq-msg claude" }, h("div", { class: "who" }, "Claude"), messageBody(msg.text)));
  if (!items.length) {
    items.push(h("div", { class: "sq-msg note" }, "Ask about the SQL in the editor, e.g. “make this faster”, “add a filter for 2024” or “explain this query”."));
  }
  if (chat.waiting) items.push(waitingNote());
  msgsEl.replaceChildren(...items);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function editorContext() {
  if (!includeSql.checked) return { sql: null, selected: false, lastResult: null };
  const sel = view.state.selection.main;
  const sql = (sel.empty ? view.state.doc.toString() : view.state.sliceDoc(sel.from, sel.to)).trim() || null;
  const r = state.result;
  let lastResult = null;
  if (state.error) lastResult = `failed: ${state.error.message}`;
  else if (r) {
    const what = r.has_result_set ? `${r.row_count} row(s); columns ${r.columns.join(", ")}` : `${r.affected_rows ?? 0} row(s) affected`;
    lastResult = `${what}${r.sql ? `, for: ${r.sql.replace(/\s+/g, " ").slice(0, 300)}` : ""}`;
  }
  return { sql, selected: !sel.empty, lastResult };
}

async function ask() {
  const question = askBox.value.trim();
  if (!question || chat.waiting) return;
  const mode = effectiveMode();
  if (!mode) { S2.toast(chat.assistant?.reason ?? "Chat isn't available here", "err"); return; }
  const ctx = editorContext();
  chat.messages.push({ from: "you", text: question });
  askBox.value = "";
  chat.waiting = true; chat.waitingMode = mode; chat.job = null;
  renderChat(); renderTabs();
  let failed = null;
  if (mode === "app") {
    try {
      await S2.callTool("sql_editor_ask", { editor_id: editorId, question, database: state.database,
        sql: ctx.sql, selected: ctx.selected, last_result: ctx.lastResult, profile: profileSelect.value });
    } catch (e) { failed = cleanError(e).message; }
  } else {
    const parts = [`[SQL Editor ${editorId}${tab.label ? ` · tab ${tab.label}` : ""} · database ${state.database ?? "default"}] ${question}`];
    if (ctx.sql) parts.push(`${ctx.selected ? "Selected SQL" : "Editor SQL"}:\n\`\`\`sql\n${ctx.sql.slice(0, 8000)}\n\`\`\``);
    if (ctx.lastResult) parts.push(`Last result: ${ctx.lastResult}`);
    parts.push(`(Answer with sql_editor_reply, editor_id "${editorId}", so it appears in the editor.)`);
    if (!(await S2.sendPrompt(parts.join("\n\n"), { quiet: true }))) failed = "Couldn't send the question to the Claude chat.";
  }
  if (failed) {
    chat.waiting = false;
    chat.messages.push({ from: "error", text: failed });
    renderChat(); renderTabs();
  }
}

async function stopAsking() {
  warmedProfile = null;  // Stop ends the process; warm a new one next time
  try { await S2.callTool("sql_editor_ask_cancel", { editor_id: editorId }); }
  catch (e) { S2.toast(`Couldn't stop: ${cleanError(e).message}`, "err"); }
}

async function pollInbox() {
  try {
    const { messages, job } = await S2.callTool("sql_editor_inbox", { editor_id: editorId, after: chat.lastSeq });
    const jobChanged = JSON.stringify(job) !== JSON.stringify(chat.job);
    chat.job = job ?? null;
    if (!messages.length) { if (chat.waiting && jobChanged) renderChat(); return; }
    for (const m of messages) {
      const from = m.kind === "error" ? "error" : m.kind === "note" ? "note" : "claude";
      chat.messages.push({ from, text: m.text });
      chat.lastSeq = Math.max(chat.lastSeq, m.seq);
      // An empty editor gets the answer's first SQL block straight away;
      // otherwise the user picks Replace / Insert, so nothing is overwritten.
      const firstSql = from === "claude" && /```[\w-]*\n?([\s\S]*?)```/.exec(m.text)?.[1]?.trim();
      if (firstSql && !view.state.doc.toString().trim()) {
        setSql(firstSql);
        S2.toast("Claude's SQL is in the editor", "ok");
      }
    }
    if (!job) chat.waiting = false;
    if (!chat.open) chat.unread += messages.length;
    renderChat(); renderTabs();
  } catch {
    // Transient (host busy, server restarting); the next poll retries.
  }
}

// Start the editor's Claude process while the user types, so the first
// answer doesn't wait for Claude Code to start. Cheap: no model call.
let warmedProfile = null;
function warmAssistant() {
  if (effectiveMode() !== "app" || !chat.assistant?.available || chat.waiting) return;
  if (warmedProfile === profileSelect.value) return;
  warmedProfile = profileSelect.value;
  S2.callTool("sql_editor_assistant_warm", { editor_id: editorId, profile: profileSelect.value }).catch(() => { warmedProfile = null; });
}

async function loadAssistantStatus() {
  try { chat.assistant = await S2.callTool("sql_editor_assistant", {}); }
  catch (e) { chat.assistant = { available: false, reason: cleanError(e).message }; }
  renderChat();
  if (chat.open) warmAssistant();
}
// Poll faster while waiting for an answer.
(function schedulePoll() {
  setTimeout(async () => {
    if (tab.closed && !chat.waiting) return;  // tab closed: stop polling
    if (S2.app && (chat.waiting || !S2.isHidden())) await pollInbox();
    schedulePoll();
  }, chat.waiting ? 2000 : 5000);
})();

// The workspace switched the active connection: new database list and schema.
window.addEventListener("s2:connection-changed", async (e) => {
  state.schemas.clear();
  await refreshDatabases({ force: true });
  if (state.database && !state.databases.includes(state.database)) chooseDatabase(state.databases.find((d) => !SYSTEM.has(d)) ?? null);
  else if (state.database) loadSchema(state.database, true);
  renderTree();
  S2.toast(`Connected to ${e.detail.name}`, "ok");
});

// Hand-off from another workspace view (e.g. the Explorer's "Query in grid").
// The editor text is the user's autosaved work: hand-offs add their SQL
// below it and select it (Run then runs just that) instead of replacing it.
function applyHandoff({ sql, database, run: runIt, origin, language, library }) {
  // From the Schema Explorer's SAS sources: the tab switches to that language and library.
  if (language && LANGS.some((l) => l.id === language) && language !== state.language) setLanguage(language, { quiet: true });
  if (library && isSas()) chooseLibrary(library);
  else if (database && database !== state.database && state.databases.includes(database)) chooseDatabase(database);
  if (sql) placeSql(sql);
  // Opened from a workload statement (Workload view's "Open in SQL Editor"): this tab can write it back.
  if (origin?.workload && origin?.statement_id) { state.origin = { ...origin }; renderHeader(); scheduleDraftSave(); }
  view.focus();
  if (runIt) run();
}
const pendingHandoffs = [];  // arriving while the draft is being restored (functions to run then)
const whenReady = (fn) => (draft.ready ? fn() : pendingHandoffs.push(fn));
window.addEventListener("s2:set-sql", (e) => whenReady(() => applyHandoff(e.detail)));

// Messages from the Workspace's tab bar (only to an editor that is one of its tabs).
window.addEventListener("message", (ev) => {
  if (ev.source !== window.parent || !tabbed()) return;
  const msg = ev.data;
  if (msg?.type === "s2-tab-label") { tab.label = msg.label || null; }
  else if (msg?.type === "s2-open-file") {
    // Open / Recent / Browse computer… answered by the tab bar: open the file in this tab.
    whenReady(() => (msg.local ? openLocalText(msg.local.name, msg.local.text) : msg.path && openServerFileHere(msg.path)));
  } else if (msg?.type === "s2-close") {
    // The tab is closed (its draft is gone): no more autosaves, and stop a running answer.
    tab.closed = true;
    clearTimeout(draft.timer);
    if (chat.waiting) S2.callTool("sql_editor_ask_cancel", { editor_id: editorId }).catch(() => {});
  }
});
// Tab shortcuts are the tab bar's: Ctrl+Alt+N, Ctrl+Tab / Ctrl+Shift+Tab, Ctrl+Alt+PageDown / PageUp.
window.addEventListener("keydown", (e) => {
  if (!tabbed()) return;
  const action = e.ctrlKey && e.altKey && !e.shiftKey && e.key?.toLowerCase() === "n" ? "new"
    : e.ctrlKey && !e.altKey && e.key === "Tab" ? (e.shiftKey ? "prev" : "next")
    : e.ctrlKey && e.altKey && (e.key === "PageDown" || e.key === "PageUp") ? (e.key === "PageDown" ? "next" : "prev")
    : null;
  if (!action) return;
  e.preventDefault(); e.stopPropagation();
  flushDraft();
  window.parent.postMessage({ type: "s2-tab-key", action }, "*");
}, true);

// Saved state: this tab's draft (restored once), recent files and the history size.
async function restoreEditor(incomingSql) {
  let saved = null;
  try { saved = await S2.callTool("sql_editor_state", { tab_id: tab.id }); }
  catch (e) { S2.toast(`Couldn't restore the editor's saved text: ${cleanError(e).message}`, "err"); }
  tab.id = saved?.tab_id ?? tab.id;  // without a tab from the workspace: the active tab, from now on this page's own
  state.recent = saved?.recent ?? [];
  state.historyCount = saved?.history_count ?? 0;
  if (saved?.draft && !view.state.doc.length) await restoreDraft(saved.draft);
  // SQL Claude (or a browser link) opened the editor with: below the draft,
  // unless the draft already holds it (reopening the same chat message).
  if (incomingSql && !view.state.doc.toString().includes(incomingSql.trim())) placeSql(incomingSql);
  renderFileLabel();
  return saved?.draft ?? null;
}

// ---------------------------------------------------------------- host wiring
renderHeader(); renderTree(); renderResults(); renderTabs(); renderChat(); renderFileLabel(); renderEditorBadge();
S2.onDisplayModeChange = () => renderHeader();
let inputSql = null, restored = false;
await S2.connect({
  name: "singlestore-sql-editor",
  onToolInput(args) {
    inputSql = args.sql ?? null;
    if (args.tab_id) { tab.id = args.tab_id; tab.label = args.tab_label ?? null; tab.fromShell = true; }
  },
  async onToolResult(result) {
    try {
      const data = S2.resultData(result);
      state.databases = data.databases ?? [];
      // A database given on open: load its schema while the draft is restored (chooseDatabase reuses it).
      if (data.database && state.databases.includes(data.database)) loadSchema(data.database);
      let restoredDb = null;
      if (!restored) {
        restored = true;
        const before = view.state.doc.toString();
        const d = await restoreEditor(inputSql ?? data.sql);
        restoredDb = d?.database && state.databases.includes(d.database) ? d.database : null;
        if (view.state.doc.toString() !== (d?.sql ?? before)) setTimeout(scheduleDraftSave);
      }
      chooseDatabase(data.database ?? restoredDb ?? state.databases.find((d) => !SYSTEM.has(d)) ?? null);
      S2.updateModelContext(`SQL Editor ${editorId}${tab.label ? ` (tab ${tab.label})` : ""} is open on database ${state.database ?? "default"}. Send SQL or answers to it with sql_editor_reply (editor_id "${editorId}").`);
    } catch (e) {
      state.error = cleanError(e);
      renderResults();
    } finally {
      draft.ready = true;
      for (const fn of pendingHandoffs.splice(0)) fn();
      reportTitle();
    }
    renderHeader();
    if (!state.result && !state.error && !state.running && !state.confirm) renderResults();  // the help mentions tabs
    view.focus();
    loadAssistantStatus();
  },});</script>
</body>
</html>
