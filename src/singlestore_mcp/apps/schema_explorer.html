<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schema Explorer</title>
<!--S2:HEAD-->
<style>
  .se { display: grid; grid-template-columns: minmax(220px, 280px) minmax(0, 1fr); gap: 12px; height: 580px; }
  .se-pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .se-left { border: 1px solid var(--s2-border-2); border-radius: var(--s2-radius); overflow: hidden; }
  .se-left-tools { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-bottom: 1px solid var(--s2-border-2); background: var(--s2-bg-2); }
  .se-left-tools .s2-input { width: 100%; }
  .se-toggle { display: flex; align-items: center; gap: 6px; font-size: var(--s2-fs-xs); color: var(--s2-text-2); cursor: pointer; user-select: none; }
  .se-toggle input { margin: 0; }
  .se-tree { overflow: auto; flex: 1; padding: 4px 0; }
  .se-row {
    display: flex; align-items: center; gap: 6px; width: 100%; padding: 3px 8px; border: 0; background: none;
    text-align: left; cursor: pointer; font-size: var(--s2-fs-xs); color: var(--s2-text); border-radius: 0; min-height: 24px;
  }
  .se-row:hover { background: var(--s2-bg-2); }
  .se-row:focus-visible { outline: 2px solid var(--s2-ring); outline-offset: -2px; }
  .se-row.sel { background: var(--s2-info-bg); color: var(--s2-info); }
  .se-row .se-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .se-row .se-count { color: var(--s2-text-3); font-variant-numeric: tabular-nums; }
  .se-row.db { font-weight: var(--font-weight-medium, 500); }
  .se-row.tbl { padding-left: 26px; }
  .se-caret { width: 12px; color: var(--s2-text-3); flex: none; display: inline-block; transition: transform .12s; font-size: 10px; }
  .se-caret.open { transform: rotate(90deg); }
  .se-sub { padding: 3px 8px 3px 26px; font-size: var(--s2-fs-xs); color: var(--s2-text-3); display: flex; gap: 6px; align-items: center; }
  .se-sub .s2-error { padding: 4px 8px; flex: 1; }
  .se-ico {
    flex: none; width: 18px; height: 16px; border-radius: 3px; font-size: 9px; font-weight: 700; line-height: 16px; text-align: center;
    background: var(--s2-bg-3); color: var(--s2-text-2); letter-spacing: .02em;
  }
  .se-ico.col { background: var(--s2-info-bg); color: var(--s2-info); }
  .se-ico.row { background: var(--s2-warn-bg); color: var(--s2-warn); }
  .se-ico.view { background: var(--s2-ok-bg); color: var(--s2-ok); }
  mark { background: var(--s2-warn-bg); color: inherit; border-radius: 2px; padding: 0; }

  .se-right { overflow: auto; }
  .se-head { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .se-head h2 { margin: 0; font-size: var(--font-text-md-size, 14px); font-weight: var(--font-weight-semibold, 600); font-family: var(--s2-mono); overflow-wrap: anywhere; }
  .se-head h2 .se-dbpart { color: var(--s2-text-2); font-weight: 400; }
  .se-titlebox { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 260px; }
  .se-badges { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .se-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; margin-bottom: 8px; }
  .se-stat { background: var(--s2-bg-2); border-radius: var(--s2-radius-sm); padding: 5px 9px; min-width: 0; }
  .se-stat .k { font-size: 11px; color: var(--s2-text-3); text-transform: uppercase; letter-spacing: .04em; }
  .se-stat .v { font-weight: var(--font-weight-semibold, 600); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .se-keys { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: var(--s2-fs-xs); }
  .se-key { display: flex; gap: 8px; align-items: baseline; }
  .se-key .k { color: var(--s2-text-2); width: 72px; flex: none; }
  .se-key code { font-family: var(--s2-mono); background: var(--s2-bg-2); padding: 1px 6px; border-radius: 4px; word-break: break-all; }
  .se-key .note { color: var(--s2-text-3); }
  .se-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--s2-border-2); margin-bottom: 8px; }
  .se-tab {
    border: 0; background: none; padding: 6px 10px; cursor: pointer; font-size: var(--s2-fs-xs); color: var(--s2-text-2);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .se-tab:hover { color: var(--s2-text); }
  .se-tab.on { color: var(--s2-text); border-bottom-color: var(--s2-info); font-weight: var(--font-weight-semibold, 600); }
  .se-tab:focus-visible { outline: 2px solid var(--s2-ring); outline-offset: -2px; }
  .se-tabbar-extra { margin-left: auto; display: flex; gap: 6px; align-items: center; padding-bottom: 4px; }
  .se-tag { font-size: 10px; padding: 0 5px; border-radius: 3px; margin-left: 5px; background: var(--s2-bg-3); color: var(--s2-text-2); font-weight: 600; }
  .se-tag.shard { background: var(--s2-info-bg); color: var(--s2-info); }
  .se-tag.sort { background: var(--s2-ok-bg); color: var(--s2-ok); }
  .se-tag.pk { background: var(--s2-warn-bg); color: var(--s2-warn); }
  .se-ddl { max-height: 360px; overflow: auto; white-space: pre; word-break: normal; }
  html[data-display-mode="fullscreen"] .se { height: calc(100vh - 70px); }
  html[data-display-mode="fullscreen"] .se-ddl { max-height: none; }
  html[data-display-mode="fullscreen"] .se-right .s2-table-wrap { max-height: none !important; }
  .se-ddl.wrap { white-space: pre-wrap; word-break: break-word; }
  .se-ddl .hl { background: var(--s2-info-bg); color: var(--s2-info); display: inline-block; min-width: 100%; }
  .se-banner { margin-bottom: 8px; }
  .se-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; color: var(--s2-text-2); text-align: center; padding: 24px; }
  .se-placeholder .big { font-size: var(--font-text-md-size, 14px); color: var(--s2-text); font-weight: var(--font-weight-medium, 500); }

  /* Clean-up panel */
  .cu { display: flex; flex-direction: column; gap: 10px; min-height: 580px; }
  html[data-display-mode="fullscreen"] .cu { min-height: calc(100vh - 70px); }
  .cu-box { border: 1px solid var(--s2-border-2); border-radius: var(--s2-radius); padding: 8px 10px; }
  .cu-opts { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-start; }
  .cu-opts label { display: flex; align-items: center; gap: 6px; font-size: var(--s2-fs-xs); color: var(--s2-text-2); }
  .cu-opts .num { width: 64px; }
  .cu-pat { display: flex; flex-direction: column; gap: 4px; flex: 1 1 300px; min-width: 0; }
  .cu-pat textarea { width: 100%; min-height: 78px; font-family: var(--s2-mono); font-size: var(--s2-fs-xs); resize: vertical; box-sizing: border-box; }
  .cu-side { display: flex; flex-direction: column; gap: 8px; }
  .cu-dbs { display: flex; flex-wrap: wrap; gap: 6px; }
  .cu-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .cu-bar .cu-count { font-weight: var(--font-weight-semibold, 600); }
  .cu-risk { color: var(--s2-warn); font-size: var(--s2-fs-xs); }
  .cu-confirm { border: 1px solid var(--s2-err); background: var(--s2-err-bg); border-radius: var(--s2-radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .cu-confirm.dry { border-color: var(--s2-info); background: var(--s2-info-bg); }
  .cu-confirm pre { margin: 0; max-height: 220px; overflow: auto; }
  .cu-confirm ul { margin: 0; padding-left: 18px; font-size: var(--s2-fs-xs); }
  .cu-res .ok { color: var(--s2-ok); } .cu-res .err { color: var(--s2-err); } .cu-res .warn { color: var(--s2-warn); }
  .cu-res li { font-size: var(--s2-fs-xs); }
  .cu h3 { margin: 0 0 6px; font-size: var(--s2-fs-xs); text-transform: uppercase; letter-spacing: .04em; color: var(--s2-text-3); font-weight: 600; }

  /* Storage icon (bottomless / local) in the database rows */
  .se-store { flex: none; width: 14px; height: 14px; display: inline-flex; color: var(--s2-text-3); }
  .se-store svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .se-store.bottomless { color: var(--s2-info); }
  .se-store.unknown { color: var(--s2-warn); }
  /* Analyze panel */
  .an { border: 1px solid var(--s2-border-2); border-radius: var(--s2-radius); padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
  .an-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .an-head h3 { margin: 0; font-size: var(--s2-fs-sm, 13px); font-weight: var(--font-weight-semibold, 600); }
  .an .stale { color: var(--s2-warn); }
  .an .fresh { color: var(--s2-ok); }
  .an-confirm { border: 1px solid var(--s2-warn); background: var(--s2-warn-bg); border-radius: var(--s2-radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .an-confirm pre { margin: 0; max-height: 200px; overflow: auto; }
  .an-progress { height: 6px; border-radius: 3px; background: var(--s2-bg-3); overflow: hidden; }
  .an-progress > span { display: block; height: 100%; background: var(--s2-info); transition: width .3s; }
  .an-res { margin: 0; padding-left: 18px; font-size: var(--s2-fs-xs); }
  .an-res .ok { color: var(--s2-ok); } .an-res .err { color: var(--s2-err); } .an-res .warn { color: var(--s2-warn); }

  /* Distribution (skew) tab and the database's skew check */
  .sk { display: flex; flex-direction: column; gap: 10px; }
  .sk-notes { border: 1px solid var(--s2-border-2); border-radius: var(--s2-radius); padding: 8px 10px; font-size: var(--s2-fs-xs); display: flex; flex-direction: column; gap: 6px; }
  .sk-notes.high { border-color: var(--s2-err); background: var(--s2-err-bg); }
  .sk-notes.moderate { border-color: var(--s2-warn); background: var(--s2-warn-bg); }
  .sk-notes p { margin: 0; }
  .sk-notes .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .sk h3 { margin: 0 0 4px; font-size: var(--s2-fs-xs); text-transform: uppercase; letter-spacing: .04em; color: var(--s2-text-3); font-weight: 600; }
  .sk-bar { display: inline-block; height: 8px; border-radius: 2px; background: var(--s2-info); vertical-align: middle; margin-right: 6px; }
  .sk-bar.hot { background: var(--s2-err); }
  .sk-lvl-high { color: var(--s2-err); font-weight: 600; } .sk-lvl-moderate { color: var(--s2-warn); font-weight: 600; }
  .sk-lvl-ok { color: var(--s2-ok); } .sk-lvl-small { color: var(--s2-text-3); }

  /* Source switch: SingleStore / SAS libraries / CAS */
  .se-sources { display: flex; border: 1px solid var(--s2-border); border-radius: var(--s2-radius-sm); overflow: hidden; }
  .se-sources button { flex: 1; border: 0; background: transparent; padding: 3px 4px; font-size: 11px; cursor: pointer; color: var(--s2-text-2); white-space: nowrap; }
  .se-sources button + button { border-left: 1px solid var(--s2-border); }
  .se-sources button.on { background: var(--s2-info-bg); color: var(--s2-info); font-weight: 600; }

  @media (max-width: 640px) {
    .se { grid-template-columns: minmax(0, 1fr); height: auto; }
    .se-left { max-height: 260px; }
    .se-right { overflow: visible; }
  }
</style>
</head>
<body>
<div id="root"><div class="s2-empty"><span class="s2-spinner"></span> Loading schema…</div></div>
<script type="module">
const { h, fmt } = S2;
const root = document.getElementById("root");
const SYSTEM = new Set(["information_schema", "cluster", "memsql"]);

const state = {
  dbs: null,                 // [{name, system, tables, views}]
  tables: new Map(),         // db -> {status: "loading"|"ok"|"error", tables, error}
  expanded: new Set(),
  showSystem: false,
  filter: "",
  sel: null,                 // {db, table|null}
  tab: "columns",
  details: new Map(),        // key -> {status, data, error}
  previews: new Map(),       // key -> {status, data, error}
  skew: new Map(),           // key(db, table) -> {status, data, error}: Distribution tab (on demand)
  dbSkew: new Map(),         // db -> {status, data, error}: the database's "Check skew" (on demand)
  banner: null,              // error from the initial tool call
  pending: null,             // tool input args before the result arrives
  mode: "browse",            // "browse" | "cleanup"
  source: "s2",              // "s2" (SingleStore) | "sas" (SAS libraries, Viya Compute) | "cas" (caslibs)
  sasTab: "columns",         // SAS / CAS table: "columns" | "preview"
  cu: {
    settings: null,          // {patterns, older_than_days, recent_days, dry_run}
    patternsText: null, olderOn: false, olderDays: 90, recentDays: 7,
    scan: null,              // {status: "loading"|"ok"|"error", data, error}
    selected: new Set(),     // candidate keys
    views: new Set(),        // dependent view keys the user includes in the drop
    dryRun: true,
    confirm: false,
    running: false,
    result: null,            // last drop result
    log: [],
  },
};
const key = (db, t) => `${db}\u0000${t}`;
const qi = (name) => "`" + String(name).replace(/`/g, "``") + "`";
const fq = (db, t) => `${qi(db)}.${qi(t)}`;

// ---------- formatting ----------
const storageShort = (t) => t.type !== "BASE TABLE" ? ["V", "view", t.type] :
  t.storage === "COLUMNSTORE" ? ["C", "col", "Columnstore" + (t.reference ? " reference" : "")] :
  ["R", "row", (t.storage || "Rowstore").replace("INMEMORY_", "In-memory ").toLowerCase() + (t.reference ? " reference" : "")];
const rowsText = (n) => n == null ? "–" : fmt.number(n);
const compact = (n) => {
  if (n == null) return "";
  const v = Number(n);
  if (v < 1000) return String(v);
  const u = [["B", 1e9], ["M", 1e6], ["K", 1e3]].find(([, d]) => v >= d);
  return (v / u[1]).toFixed(v / u[1] >= 100 ? 0 : 1).replace(/\.0$/, "") + u[0];
};
const highlight = (text, q) => {
  if (!q) return text;
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return text;
  return [text.slice(0, i), h("mark", {}, text.slice(i, i + q.length)), text.slice(i + q.length)];
};
const keyCols = (k) => !k ? null : k.columns.length ? k.columns.join(", ") : null;

// ---------- data loading ----------
// Server errors arrive as "Error executing tool <name>: <message>"; keep just the message.
const cleanError = (e) => new Error(String(e?.message ?? e).replace(/^Error executing tool [^:]+:\s*/, ""));
async function call(name, args) {
  try { return await S2.callTool(name, args); }
  catch (e) { throw cleanError(e); }
}

async function loadDatabases() {
  try {
    const data = await call("schema_explorer_databases", {});
    state.dbs = data.databases;
  } catch (e) { S2.toast(e.message, "err"); }
  render();
}

async function loadTables(db, force = false) {
  const cur = state.tables.get(db);
  if (!force && cur && cur.status !== "error") return;
  state.tables.set(db, { status: "loading" });
  renderTree();
  try {
    const data = await call("schema_explorer_tables", { database: db });
    state.tables.set(db, { status: "ok", tables: data.tables });
  } catch (e) {
    state.tables.set(db, { status: "error", error: e });
  }
  renderTree();
  if (state.sel?.db === db && !state.sel.table) renderRight();
}

async function loadDetail(db, table, force = false) {
  const k = key(db, table);
  const cur = state.details.get(k);
  if (!force && cur && cur.status !== "error") return cur;
  state.details.set(k, { status: "loading" });
  renderRight();
  try {
    const data = await call("schema_explorer_table", { database: db, table });
    state.details.set(k, { status: "ok", data });
  } catch (e) {
    state.details.set(k, { status: "error", error: e });
  }
  if (state.sel?.db === db && state.sel?.table === table) { renderRight(); announce(); }
  return state.details.get(k);
}

async function loadPreview(db, table, force = false) {
  const k = key(db, table);
  const cur = state.previews.get(k);
  if (!force && cur && cur.status !== "error") return;
  state.previews.set(k, { status: "loading" });
  renderRight();
  try {
    const data = await call("schema_explorer_preview", { database: db, table });
    state.previews.set(k, { status: "ok", data });
  } catch (e) {
    state.previews.set(k, { status: "error", error: e });
  }
  if (state.sel?.db === db && state.sel?.table === table) renderRight();
}

// Skew is computed on demand only (the Distribution tab, or "Check skew" on a database), never on a tree click.
async function loadSkew(db, table, force = false) {
  const map = table ? state.skew : state.dbSkew;
  const k = table ? key(db, table) : db;
  const cur = map.get(k);
  if (!force && cur && cur.status !== "error") return;
  map.set(k, { status: "loading" });
  renderRight();
  try {
    const data = await call("schema_explorer_skew", table ? { database: db, table } : { database: db });
    map.set(k, { status: "ok", data });
  } catch (e) {
    map.set(k, { status: "error", error: e });
  }
  if (state.sel?.db === db && (state.sel?.table ?? null) === (table ?? null)) renderRight();
}

// ---------- actions ----------
function toggleDb(db) {
  if (state.expanded.has(db) && !(state.sel?.db === db && state.sel.table)) {
    state.expanded.delete(db);
    renderTree();
    return;
  }
  state.expanded.add(db);
  loadTables(db);
  selectDb(db, false);
}

function selectDb(db, toggle = true) {
  if (toggle && !state.expanded.has(db)) { state.expanded.add(db); loadTables(db); }
  state.sel = { db, table: null };
  state.banner = null;
  renderTree();
  renderRight();
  S2.updateModelContext(`The user is browsing database ${db} in the Schema Explorer.`);
}

function selectTable(db, table) {
  state.sel = { db, table };
  state.banner = null;
  if (state.tab === "preview") loadPreview(db, table);
  if (state.tab === "skew") loadSkew(db, table);  // only while the Distribution tab is the open one
  renderTree();
  renderRight();
  const d = state.details.get(key(db, table));
  if (d?.status === "ok") announce(); else loadDetail(db, table);
}

function announce() {
  const { db, table } = state.sel ?? {};
  const d = state.details.get(key(db, table));
  if (!table || d?.status !== "ok") return;
  const { info, columns, keys } = d.data;
  const parts = [`The user is looking at ${fq(db, table)} in the Schema Explorer: ${info.type}`];
  if (info.type === "BASE TABLE") {
    parts[0] += `, ${info.storage}${info.reference ? " REFERENCE" : ""}, ${rowsText(info.rows)} rows`;
    if (keys?.reference) parts.push("Reference table (replicated to every node)");
    else if (keys) parts.push(`Shard key: ${keyCols(keys.shard) ?? "none/keyless"}; sort key: ${keyCols(keys.sort) ?? "none/unordered"}.`);
  }
  const cols = columns.slice(0, 60).map((c) => `${c.name} ${c.type}`).join(", ");
  parts.push(`Columns (${columns.length}): ${cols}${columns.length > 60 ? ", …" : ""}`);
  S2.updateModelContext(parts.join(". ").replace(/\.\./g, "."));
}

async function askClaude() {
  const { db, table } = state.sel;
  const d = state.details.get(key(db, table))?.data;
  const what = d?.info?.type === "BASE TABLE" ? "table" : "view";
  try {
    await S2.sendPrompt(`Tell me about the SingleStore ${what} ${fq(db, table)}: what the data represents, how it is distributed and sorted (shard key / sort key), notable columns, and anything I should watch out for when querying it.`);
  } catch (e) { S2.toast(`Couldn't send message: ${e.message}`, "err"); }
}

// In Claude: ask in the chat so the grid opens inline. In the browser view
// (no chat), or if the host rejects the message, open the grid in the browser.
async function queryInGrid() {
  const { db, table } = state.sel;
  const sql = `SELECT * FROM ${fq(db, table)} LIMIT 100`;
  try {
    if (S2.embedded()) { S2.openView("sql", { sql: `${sql};`, database: db, run: true }); return; }
    if (!S2.inBrowserView() && (await S2.sendPrompt(`Show ${sql} in the query grid`, { quiet: true }))) return;
    await S2.openAppInBrowser("query_grid", { sql, database: db });
  } catch (e) { S2.toast(`Couldn't open the query grid: ${e.message}`, "err"); }
}

// ---------- storage: bottomless or local-only ----------
// From MV_BOTTOMLESS_DATABASES / MV_BOTTOMLESS_STATUS (server side); system databases carry none.
const SVG_NS = "http://www.w3.org/2000/svg";
function svgIcon(paths) {
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("viewBox", "0 0 16 16");
  svg.setAttribute("aria-hidden", "true");
  for (const d of paths) { const p = document.createElementNS(SVG_NS, "path"); p.setAttribute("d", d); svg.append(p); }
  return svg;
}
const ICON_CLOUD = ["M4.5 12.5h7.2a2.8 2.8 0 0 0 .4-5.6A4 4 0 0 0 4.4 6.2 3.2 3.2 0 0 0 4.5 12.5Z"];
const ICON_DISK = ["M2.5 5.5h11v5h-11z", "M2.5 5.5 4 3h8l1.5 2.5", "M11 8h.01"];

function storeText(d) {
  const s = d.storage;
  if (!s) return "";
  if (s.kind === "bottomless") {
    const where = s.remote_path ? `${s.provider ?? "object storage"}: ${s.remote_path}` : (s.provider ?? "object storage");
    return `Bottomless (unlimited storage). The durable copy of the data is in remote object storage (${where}). ` +
      "Nodes keep recent changes and a blob cache of columnstore data on local disk; data not in the cache is fetched from remote storage when queried." +
      (s.retention_minutes ? ` Remote history is kept ${s.retention_minutes} minutes.` : "") + (s.detached && s.detached !== "ATTACHED" && s.detached !== 0 ? ` State: ${s.detached}.` : "");
  }
  if (s.kind === "local") {
    return "Local-only (not bottomless). All of its data (columnstore blobs, rowstore snapshots and transaction logs) lives on the nodes' own disks" +
      (s.data_directory ? `, under ${s.data_directory} on each node` : "") + "; nothing is copied to object storage.";
  }
  return `Storage type unknown${s.error ? `: ${s.error}` : ""}.`;
}

function storeIcon(d) {
  const s = d.storage;
  if (!s) return null;
  const cls = s.kind === "bottomless" ? "bottomless" : s.kind === "local" ? "local" : "unknown";
  return h("span", { class: `se-store ${cls}`, title: storeText(d), "aria-label": cls === "bottomless" ? "bottomless" : cls === "local" ? "local storage" : "storage unknown" },
    svgIcon(cls === "bottomless" ? ICON_CLOUD : ICON_DISK));
}

// ---------- analyze (ANALYZE TABLE) ----------
// Plan: schema_explorer_analyze_plan (read-only). Run: schema_explorer_analyze with confirm=true, one table
// per call so progress shows and Stop takes effect between tables. Only after the user confirmed here.
const an = { db: null, table: null, plan: null, selected: new Set(), confirm: false, running: false, stop: false, progress: null, results: [] };
const anFor = (db, table) => an.db === db && an.table === (table ?? null);

async function loadAnalyzePlan() {
  const { db, table } = an;
  an.plan = { status: "loading" };
  renderRight();
  try {
    const data = await call("schema_explorer_analyze_plan", table ? { database: db, tables: [table] } : { database: db });
    if (!anFor(db, table)) return;
    an.plan = { status: "ok", data };
    if (!an.selected.size || table) an.selected = new Set(data.tables.map((t) => t.table));
    S2.updateModelContext(`Analyze plan for ${db}${table ? "." + table : ""}: ${data.tables.length} table(s), ${data.stale_tables} with stale or missing statistics. Nothing has run yet.`);
  } catch (e) { an.plan = { status: "error", error: e }; }
  renderRight();
}

function openAnalyze(db, table) {
  Object.assign(an, { db, table: table ?? null, plan: null, selected: new Set(), confirm: false, stop: false, progress: null, results: [] });
  loadAnalyzePlan();
}
function closeAnalyze() { if (an.running) return; an.db = null; renderRight(); }

async function runAnalyze() {
  const data = an.plan?.data;
  if (!data) return;
  const names = data.tables.map((t) => t.table).filter((n) => an.selected.has(n));
  if (!names.length) return;
  Object.assign(an, { running: true, stop: false, confirm: false, results: [], progress: { done: 0, total: names.length, current: names[0] } });
  renderRight();
  for (const name of names) {
    if (an.stop) break;
    an.progress.current = name;
    renderRight();
    try {
      const res = await call("schema_explorer_analyze", { database: data.database, tables: [name], confirm: true });
      an.results.push(...res.results);
    } catch (e) {
      an.results.push({ table: name, status: "error", error: e.message, statement: `ANALYZE TABLE ${fq(data.database, name)};` });
    }
    an.progress.done++;
    renderRight();
  }
  const ok = an.results.filter((r) => r.status === "analyzed").length;
  const errs = an.results.filter((r) => r.status === "error").length;
  an.running = false;
  an.progress = null;
  S2.toast(`ANALYZE: ${ok} table(s) analyzed${errs ? `, ${errs} error(s)` : ""}${an.stop ? " (stopped)" : ""}`, errs ? "err" : "");
  S2.updateModelContext(`The user ran ANALYZE TABLE in ${data.database} on ${an.results.length} table(s): ${an.results.map((r) => `${r.table} ${r.status}`).join(", ")}.`);
  // Fresh statistics ages (read-only).
  const results = an.results;
  await loadAnalyzePlan();
  an.results = results;
  renderRight();
}

function ageText(days) {
  if (days == null) return "–";
  const mins = days * 1440;
  return mins < 60 ? `${Math.max(1, Math.round(mins))} min ago` : days < 1 ? `${Math.round(days * 24)} h ago` : `${Math.round(days)} days ago`;
}

function analyzePanel(db, table) {
  if (!anFor(db, table)) return null;
  const p = an.plan;
  const title = table ? `Analyze ${fq(db, table)}` : `Analyze all tables in ${qi(db)}`;
  const head = h("div", { class: "an-head" },
    h("h3", {}, title),
    h("span", { class: "s2-small s2-faint" }, "Refreshes optimizer statistics with ANALYZE TABLE"),
    h("span", { class: "s2-spacer" }),
    h("button", { class: "s2-btn ghost", onclick: closeAnalyze, disabled: an.running, "aria-label": "Close the analyze panel" }, "Close"));
  if (!p || p.status === "loading") return h("div", { class: "an" }, head, h("div", { class: "s2-empty" }, h("span", { class: "s2-spinner" }), " Reading the current statistics…"));
  if (p.status === "error") return h("div", { class: "an" }, head, S2.errorBox(p.error), h("div", {}, h("button", { class: "s2-btn", onclick: loadAnalyzePlan }, "Retry")));
  const data = p.data;
  if (!data.tables.length) return h("div", { class: "an" }, head, h("div", { class: "s2-small" }, "No base tables to analyze" + (data.skipped_views.length ? " (views have no statistics)." : ".")));
  const rows = data.tables.map((t) => ({
    "": t.table, Table: t.table, Rows: t.rows, "Statistics updated": t.stats.age_days, "Columns with stats": t.stats.columns_with_stats,
    Outdated: t.stats.outdated_columns, Histograms: t.stats.histogram_columns, Status: t.stale ? t.reasons.join("; ") : "", _t: t,
  }));
  const grid = S2.dataTable(table ? ["Table", "Rows", "Statistics updated", "Columns with stats", "Outdated", "Histograms", "Status"]
    : ["", "Table", "Rows", "Statistics updated", "Columns with stats", "Outdated", "Histograms", "Status"], rows, {
    maxHeight: "240px",
    render: {
      "": (name) => h("input", { type: "checkbox", checked: an.selected.has(name), disabled: an.running, "aria-label": `Select ${name}`,
        onclick: (e) => e.stopPropagation(),
        onchange: (e) => { e.target.checked ? an.selected.add(name) : an.selected.delete(name); an.confirm = false; renderRight(); } }),
      Table: (v) => h("span", { class: "s2-mono" }, v),
      Rows: (v) => rowsText(v),
      "Statistics updated": (v, r) => h("span", { title: r._t.stats.last_updated_newest ? `LAST_UPDATED ${r._t.stats.last_updated_newest} (cluster time)` : "No statistics" }, ageText(v)),
      "Columns with stats": (v, r) => `${v} / ${r._t.stats.columns}`,
      Outdated: (v) => v ? h("span", { class: "stale" }, String(v)) : "0",
      Status: (v) => v ? h("span", { class: "stale" }, "⚠ " + v) : h("span", { class: "fresh" }, "looks current"),
    },
  });
  const sel = data.tables.filter((t) => an.selected.has(t.table));
  const bar = h("div", { class: "s2-toolbar" },
    !table ? h("span", { class: "s2-small" }, `${sel.length} of ${data.tables.length} selected · ${data.stale_tables} look stale`) : null,
    !table ? h("button", { class: "s2-btn ghost", disabled: an.running, onclick: () => { an.selected = new Set(data.tables.map((t) => t.table)); an.confirm = false; renderRight(); } }, "Select all") : null,
    !table ? h("button", { class: "s2-btn ghost", disabled: an.running, onclick: () => { an.selected = new Set(data.tables.filter((t) => t.stale).map((t) => t.table)); an.confirm = false; renderRight(); } }, "Select stale only") : null,
    !table ? h("button", { class: "s2-btn ghost", disabled: an.running || !sel.length, onclick: () => { an.selected.clear(); an.confirm = false; renderRight(); } }, "Clear") : null,
    h("span", { class: "s2-spacer" }),
    an.running ? h("button", { class: "s2-btn", disabled: an.stop, onclick: () => { an.stop = true; renderRight(); } }, an.stop ? "Stopping after this table…" : "Stop")
      : h("button", { class: "s2-btn primary", disabled: !sel.length, onclick: () => { an.confirm = true; an.results = []; renderRight(); } },
        `Analyze ${sel.length} table${sel.length === 1 ? "" : "s"}…`));
  const parts = [head,
    h("div", { class: "s2-small s2-faint" }, "Statistics from information_schema.OPTIMIZER_STATISTICS. “Updated” is its LAST_UPDATED: when autostats or ANALYZE last refreshed the column's statistics."),
    grid, bar];
  if (an.confirm && sel.length && !an.running) {
    const big = sel.reduce((a, t) => a + (Number(t.rows) || 0), 0);
    parts.push(h("div", { class: "an-confirm", role: "alertdialog", "aria-label": "Confirm ANALYZE" },
      h("div", {}, h("strong", {}, "This changes the shared cluster. "),
        `ANALYZE TABLE reads each table to rebuild its statistics (${sel.length} table${sel.length === 1 ? "" : "s"}, ${fmt.number(big)} rows in total) ` +
        "and invalidates cached query plans built on stale statistics, so they are re-optimized on their next run. Tables run one at a time; Stop ends after the current one."),
      h("pre", { class: "s2-pre" }, sel.map((t) => t.statement).join("\n")),
      h("div", { class: "s2-toolbar" },
        h("button", { class: "s2-btn ghost", onclick: () => { an.confirm = false; renderRight(); } }, "Cancel"),
        h("button", { class: "s2-btn primary", onclick: runAnalyze }, `Run ANALYZE on ${sel.length} table${sel.length === 1 ? "" : "s"} now`))));
  }
  if (an.progress) {
    const pr = an.progress;
    parts.push(h("div", {},
      h("div", { class: "s2-small" }, h("span", { class: "s2-spinner" }), ` ${pr.done} / ${pr.total} · ANALYZE ${fq(db, pr.current)}…`),
      h("div", { class: "an-progress", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(pr.total), "aria-valuenow": String(pr.done) },
        h("span", { style: { width: `${(pr.done / pr.total) * 100}%` } }))));
  }
  if (an.results.length) {
    const cls = { analyzed: "ok", error: "err", missing: "warn", skipped: "warn" };
    parts.push(h("div", {},
      h("div", { class: "s2-small" }, h("strong", {}, "Result")),
      h("ul", { class: "an-res" }, an.results.map((r) => h("li", {},
        h("span", { class: cls[r.status] ?? "" }, r.status), " ",
        h("span", { class: "s2-mono" }, r.statement),
        r.seconds != null ? ` · ${r.seconds} s` : "",
        r.status === "analyzed" && r.last_updated_after ? h("span", { class: "s2-faint" }, ` · statistics updated ${r.last_updated_before ? fmt.dateTime(r.last_updated_before) : "never"} → ${fmt.dateTime(r.last_updated_after)}`) : null,
        r.error ? h("span", { class: "s2-faint" }, ` — ${r.error}`) : null)))));
  }
  return h("div", { class: "an" }, ...parts.filter(Boolean));
}

// ---------- SAS sources: SAS libraries (Viya Compute) and caslibs (CAS) ----------
// The tree lists libraries → tables; a table shows its columns (type, length, format, label) and a preview.
// SAS/ACCESS libraries on SingleStore (engine S2 / SSTORE) and SingleStore caslibs show their database
// with a link to it in the SingleStore source.
const SOURCES = [["s2", "SingleStore"], ["sas", "SAS libraries"], ["cas", "CAS"]];
const sx = {
  libs: { sas: null, cas: null }, loading: { sas: false, cas: false }, error: { sas: null, cas: null },
  tables: new Map(),     // "sas|LIB" -> {status, data, error}
  columns: new Map(),    // "sas|LIB\u0000T" -> {status, data, error}
  previews: new Map(),   // same key -> {status, data, error}
  sel: { sas: null, cas: null },  // {lib, table|null}
  expanded: new Set(),
};
const skey = (src, lib, t) => (t == null ? `${src}|${lib}` : `${src}|${lib}\u0000${t}`);
async function loadSasLibs(src = state.source, force = false) {
  loadViya();
  if (sx.loading[src] || (sx.libs[src] && !force)) return;
  sx.loading[src] = true; sx.error[src] = null;
  render();
  try {
    sx.libs[src] = src === "cas" ? (await call("cas_caslibs", {})).caslibs : (await call("sas_libraries", { refresh: force })).libraries;
  } catch (e) { sx.error[src] = e; }
  sx.loading[src] = false;
  render();
}
const sasLibMeta = (src, lib) => (sx.libs[src] ?? []).find((l) => l.name === lib) ?? null;
async function loadSasTablesSE(src, lib, force = false) {
  const k = skey(src, lib);
  const cur = sx.tables.get(k);
  if (!force && cur && cur.status !== "error") return;
  sx.tables.set(k, { status: "loading" });
  renderTree(); renderRight();
  try {
    const meta = sasLibMeta(src, lib);
    const data = src === "cas" ? await call("cas_tables", { caslib: lib, database: meta?.singlestore ? meta.database : null })
      : await call("sas_tables", { library: lib });
    sx.tables.set(k, { status: "ok", data });
  } catch (e) { sx.tables.set(k, { status: "error", error: e }); }
  renderTree(); renderRight();
}
async function loadSasColumnsSE(src, lib, table, force = false) {
  const k = skey(src, lib, table);
  const cur = sx.columns.get(k);
  if (!force && cur && cur.status !== "error") return;
  sx.columns.set(k, { status: "loading" });
  renderRight();
  try {
    const data = src === "cas" ? await call("cas_columns", { caslib: lib, table }) : await call("sas_columns", { library: lib, table });
    sx.columns.set(k, { status: "ok", data });
  } catch (e) { sx.columns.set(k, { status: "error", error: e }); }
  renderRight();
}
const sasName_ = (n) => (/^[A-Za-z_][A-Za-z0-9_]{0,31}$/.test(n) ? n : `'${n.replace(/'/g, "''")}'n`);
const fedName_ = (n) => `"${String(n).replace(/"/g, '""')}"`;
const casLib_ = (l) => (/[^A-Za-z0-9_]/.test(l) ? fedName_(l) : l);
function sasPreviewSql(src, lib, table, n = 50) {
  return src === "cas" ? `select * from ${casLib_(lib)}.${fedName_(table)} limit ${n}` : `select * from ${lib}.${sasName_(table)}(obs=${n})`;
}
async function loadSasPreview(src, lib, table, force = false) {
  const k = skey(src, lib, table);
  const cur = sx.previews.get(k);
  if (!force && cur && cur.status !== "error") return;
  sx.previews.set(k, { status: "loading" });
  renderRight();
  try {
    const data = await call("sas_query", { language: src === "cas" ? "cas" : "procsql", sql: sasPreviewSql(src, lib, table),
      library: lib, max_rows: 50, pushdown: false, history: false });
    if (data.needs_confirmation) throw new Error(data.reason);
    if (data.error) throw new Error(data.error);
    sx.previews.set(k, { status: "ok", data });
  } catch (e) { sx.previews.set(k, { status: "error", error: e instanceof Error ? e : new Error(String(e)) }); }
  renderRight();
}
function setSource(src) {
  if (state.source === src) return;
  state.source = src;
  if (src !== "s2") loadSasLibs(src);
  render();
}
// The active SAS Viya connection (Connections → SAS Viya), shown in the header of the SAS sources, with a
// quick switch when there are several. The list is cheap (no call to Viya).
const viya = { data: null, loading: false };
async function loadViya(force = false) {
  if (viya.loading || (viya.data && !force)) return;
  viya.loading = true;
  try { viya.data = await call("sas_connections_state", {}); } catch { viya.data = null; }
  viya.loading = false;
  render();
}
function forgetSas() {
  for (const src of ["sas", "cas"]) { sx.libs[src] = null; sx.error[src] = null; sx.sel[src] = null; }
  sx.tables.clear(); sx.columns.clear(); sx.previews.clear(); sx.expanded.clear();
}
async function switchViya(name, select) {
  if (select) select.disabled = true;
  try { viya.data = await call("sas_connection_activate", { name }); }
  catch (e) { S2.toast(e?.message ?? String(e), "err"); render(); return; }
  forgetSas();
  if (S2.embedded()) window.parent.postMessage({ type: "s2-sas-connection-changed", name }, "*");
  S2.toast(`SAS Viya connection: ${name}`, "ok");
  if (state.source !== "s2") loadSasLibs(state.source, true);
  render();
}
function viyaSwitch() {
  const d = viya.data;
  if (!d) return null;
  if (!d.connections.length) return h("span", { class: "s2-small s2-faint" }, "No SAS Viya connection: add one in Connections");
  if (d.connections.length === 1) return h("span", { class: "s2-badge plain", title: "The active SAS Viya connection (Connections → SAS Viya)" }, `Viya: ${d.active}`);
  return h("select", { class: "s2-input", "aria-label": "SAS Viya connection", title: "The active SAS Viya connection: switching restarts the Workspace's SAS sessions on the other Viya",
    onchange: (e) => switchViya(e.target.value, e.target) },
  d.connections.map((c) => h("option", { value: c.name, selected: c.name === d.active }, `Viya: ${c.name}${c.signed_in ? "" : " (not signed in)"}`)));
}
window.addEventListener("s2:sas-connection-changed", () => {
  forgetSas(); viya.data = null;
  if (state.source !== "s2") { loadViya(true); loadSasLibs(state.source, true); }
  render();
});
function selectSasLib(src, lib) {
  const k = skey(src, lib);
  if (sx.expanded.has(k) && sx.sel[src]?.lib === lib && !sx.sel[src].table) sx.expanded.delete(k);
  else { sx.expanded.add(k); loadSasTablesSE(src, lib); }
  sx.sel[src] = { lib, table: null };
  renderTree(); renderRight();
  const m = sasLibMeta(src, lib);
  S2.updateModelContext(`The user is browsing the ${src === "cas" ? "caslib" : "SAS library"} ${lib} in the Schema Explorer${m?.singlestore ? ` (SingleStore database ${m.database ?? "?"})` : ""}.`);
}
function selectSasTable(src, lib, table) {
  sx.sel[src] = { lib, table };
  loadSasColumnsSE(src, lib, table);
  if (state.sasTab === "preview") loadSasPreview(src, lib, table);
  renderTree(); renderRight();
}
// "Open in SingleStore": the SingleStore source on the library's database.
function openS2Database(db) {
  const hit = (state.dbs ?? []).find((d) => d.name === db) ?? (state.dbs ?? []).find((d) => d.name.toLowerCase() === String(db).toLowerCase());
  if (!hit) { S2.toast(`Database ${db} isn't on the active SingleStore connection`, "err"); return; }
  state.source = "s2";
  state.expanded.add(hit.name);
  loadTables(hit.name);
  state.sel = { db: hit.name, table: null };
  render();
}
function queryInEditor(src, lib, table) {
  const sql = `${sasPreviewSql(src, lib, table, 100)};`;
  if (S2.embedded()) { S2.openView("sql", { sql, language: src === "cas" ? "cas" : "procsql", library: lib, run: true }); return; }
  S2.copy(sql);
  S2.toast("SQL copied: open the SQL Editor in the Workspace to run it as SAS", "ok");
}

function renderSasTree() {
  const src = state.source;
  const q = state.filter.trim().toLowerCase();
  const items = [];
  if (sx.error[src]) items.push(h("div", { class: "se-sub" }, S2.errorBox(sx.error[src]), h("button", { class: "s2-btn", onclick: () => loadSasLibs(src, true) }, "Retry")));
  if (!sx.libs[src]) {
    if (sx.loading[src]) items.push(h("div", { class: "se-sub" }, h("span", { class: "s2-spinner" }), src === "cas" ? "Connecting to CAS…" : "Starting the SAS session (the first time takes a while)…"));
    treeEl.replaceChildren(...items);
    return;
  }
  for (const l of sx.libs[src]) {
    const k = skey(src, l.name);
    const t = sx.tables.get(k);
    const tables = t?.status === "ok" ? t.data.tables : [];
    const matching = q ? tables.filter((x) => x.name.toLowerCase().includes(q)) : tables;
    if (q && !l.name.toLowerCase().includes(q) && !matching.length) continue;
    const open = sx.expanded.has(k) || (q && matching.length > 0);
    const isSel = sx.sel[src]?.lib === l.name && !sx.sel[src].table;
    const kind = src === "cas" ? l.type : l.engine;
    items.push(h("button", { class: `se-row db${isSel ? " sel" : ""}`, onclick: () => selectSasLib(src, l.name),
      title: [l.name, kind, l.singlestore ? `SingleStore database ${l.database ?? "?"}` : null, l.path, l.description].filter(Boolean).join("\n") },
      h("span", { class: `se-caret${open ? " open" : ""}` }, "▶"),
      h("span", { class: `se-ico${l.singlestore ? " col" : ""}`, title: l.singlestore ? "SingleStore" : kind }, l.singlestore ? "S2" : src === "cas" ? "C" : "L"),
      h("span", { class: "se-name" }, highlight(l.name, q)),
      h("span", { class: "se-count" }, t?.status === "ok" ? tables.length : kind ?? "")));
    if (!open) continue;
    if (!t || t.status === "loading") items.push(h("div", { class: "se-sub" }, h("span", { class: "s2-spinner" }), "Loading tables…"));
    else if (t.status === "error") items.push(h("div", { class: "se-sub" }, S2.errorBox(t.error), h("button", { class: "s2-btn", onclick: () => loadSasTablesSE(src, l.name, true) }, "Retry")));
    else if (!matching.length) items.push(h("div", { class: "se-sub" }, q ? "No matching tables" : "No tables"));
    else for (const tb of matching.slice(0, 3000)) {
      const isSelT = sx.sel[src]?.lib === l.name && sx.sel[src]?.table === tb.name;
      items.push(h("button", { class: `se-row tbl${isSelT ? " sel" : ""}`, onclick: () => selectSasTable(src, l.name, tb.name),
        title: `${l.name}.${tb.name}${tb.label ? `\n${tb.label}` : ""}${src === "cas" ? (tb.loaded ? "\nLoaded in CAS memory" : "\nSource table (not loaded)") : ""}` },
        h("span", { class: `se-ico ${tb.type === "VIEW" ? "view" : src === "cas" && tb.loaded ? "col" : "row"}` }, tb.type === "VIEW" ? "V" : src === "cas" ? (tb.loaded ? "M" : "S") : "D"),
        h("span", { class: "se-name" }, highlight(tb.name, q)),
        h("span", { class: "se-count" }, tb.rows != null ? compact(tb.rows) : "")));
    }
  }
  if (!items.length) items.push(h("div", { class: "s2-empty" }, q ? `Nothing matches “${state.filter}”` : "No libraries"));
  const scroll = treeEl.scrollTop;
  treeEl.replaceChildren(...items);
  treeEl.scrollTop = scroll;
}

function renderSasRight() {
  const src = state.source;
  const sel = sx.sel[src];
  if (!sel) {
    return [placeholder(src === "cas" ? "Select a caslib" : "Select a SAS library",
      src === "cas" ? "Caslibs on the CAS server: tables loaded in memory and the source tables behind them, with their columns."

  }

// ---------- left pane ----------
let treeEl, filterEl;

function visibleDbs() {
  return (state.dbs ?? []).filter((d) => state.showSystem || !d.system || state.sel?.db === d.name);

function renderTree() {
  if (!treeEl) return;
  if (state.source !== "s2") { renderSasTree(); return; }
  const q = state.filter.trim().toLowerCase();
  const items = [];
  let shown = 0;
  for (const d of visibleDbs()) {
    const t = state.tables.get(d.name);
    const dbMatch = !q || d.name.toLowerCase().includes(q);
    const tables = t?.status === "ok" ? t.tables : [];
    const matchingTables = q ? tables.filter((x) => x.name.toLowerCase().includes(q)) : tables;
    if (q && !dbMatch && !matchingTables.length) continue;
    shown++;
    const open = state.expanded.has(d.name) || (q && !dbMatch && matchingTables.length > 0);
    const isSel = state.sel?.db === d.name && !state.sel.table;
    const total = d.tables + d.views;
    items.push(h("button", {
      class: `se-row db${isSel ? " sel" : ""}`, title: d.storage ? `${d.name}
${storeText(d)}` : d.name,
      onclick: () => toggleDb(d.name),
    }, h("span", { class: `se-caret${open ? " open" : ""}` }, "▶"),
      storeIcon(d),
      h("span", { class: "se-name" }, highlight(d.name, q)),
      h("span", { class: "se-count" }, q && open && t?.status === "ok" ? `${matchingTables.length}/${total}` : total)));
    if (!open) continue;
    if (!t || t.status === "loading") {
      items.push(h("div", { class: "se-sub" }, h("span", { class: "s2-spinner" }), "Loading tables…"));
    } else if (t.status === "error") {
      items.push(h("div", { class: "se-sub" }, S2.errorBox(t.error),
        h("button", { class: "s2-btn", onclick: () => loadTables(d.name, true) }, "Retry")));
    } else if (!tables.length) {
      items.push(h("div", { class: "se-sub" }, "No tables"));
    } else if (!matchingTables.length) {
      items.push(h("div", { class: "se-sub" }, "No matching tables"));
    } else {
      for (const tb of matchingTables) {
        const [ico, cls, label] = storageShort(tb);
        const isSelT = state.sel?.db === d.name && state.sel?.table === tb.name;
        items.push(h("button", {
          class: `se-row tbl${isSelT ? " sel" : ""}`,
          title: `${tb.name}\n${label}${tb.rows != null ? ` · ${rowsText(tb.rows)} rows` : ""}`,
          onclick: () => selectTable(d.name, tb.name),

          h("span", { class: "se-name" }, highlight(tb.name, q)),

      }
    }
  }
  if (!state.dbs) items.push(h("div", { class: "se-sub" }, h("span", { class: "s2-spinner" }), "Loading…"));
  else if (!shown) items.push(h("div", { class: "s2-empty" }, q ? `Nothing matches “${state.filter}”` : "No databases"));
  if (q && state.dbs) {
    // Table names are only known for databases that have been loaded.
    const unloaded = visibleDbs().filter((d) => !state.tables.has(d.name) && d.tables + d.views > 0);
    if (unloaded.length) {
      items.push(h("div", { class: "se-sub", style: { paddingLeft: "8px", flexWrap: "wrap" } },
        `Tables in ${unloaded.length} unopened database${unloaded.length > 1 ? "s" : ""} aren't searched.`,
        h("button", { class: "s2-btn", onclick: () => unloaded.forEach((d) => loadTables(d.name)) }, "Search all")));
    }

}

  const shard = a.keyless ? "keyless (rows go to random partitions)" : `(${a.shard_columns.join(", ")})${d.keys?.shard?.implicit ? " from PRIMARY KEY" : ""}`;

    info.reference && h("span", { class: "s2-badge plain" }, "REFERENCE"));
  const head = h("div", { class: "se-head" },
    h("div", { class: "se-titlebox" }, title, badges),
    h("div", { class: "s2-toolbar" },
      h("button", { class: "s2-btn primary", onclick: askClaude, title: "Send a question about this table to Claude" }, `Ask Claude about this ${isTable ? "table" : "view"}`),
      h("button", { class: "s2-btn", onclick: queryInGrid, title: "Ask Claude to open this table in the Query Grid" }, "Query in grid"),
      isTable && !SYSTEM.has(db) ? h("button", { class: "s2-btn", onclick: () => openAnalyze(db, table),
        title: "Refresh this table's optimizer statistics (ANALYZE TABLE; shows the plan first)" }, "Analyze…") : null,
      h("button", { class: "s2-btn ghost", title: "Reload", "aria-label": "Reload table", onclick: () => {
        state.previews.delete(key(db, table)); loadDetail(db, table, true);
        if (state.tab === "preview") loadPreview(db, table, true);
      } }, "↻")));
  const stats = h("div", { class: "se-stats" },
    isTable && stat("Rows", rowsText(info.rows)),
    isTable && stat("Size", info.size_bytes == null ? "–" : fmt.bytes(info.size_bytes),
      `On disk (compressed columnstore segments): ${info.disk_bytes == null ? "–" : fmt.bytes(info.disk_bytes)}\nIn memory: ${info.memory_bytes == null ? "–" : fmt.bytes(info.memory_bytes)}`),
    stat("Columns", fmt.number(columns.length)),
    stat("Created", fmt.dateTime(info.created), info.created ?? ""),
    info.altered && stat("Altered", fmt.relTime(info.altered), fmt.dateTime(info.altered)),
    info.owner && stat("Owner", info.owner));
  const keysEl = isTable && keys ? h("div", { class: "se-keys" },
    keys.reference
      ? h("div", { class: "se-key" }, h("span", { class: "k" }, "Shard key"), h("span", { class: "note" }, "reference table — fully replicated to every node"))
      : keyLine("Shard key", keys.shard, "keyless — rows are distributed randomly"),
    info.storage === "COLUMNSTORE" ? keyLine("Sort key", keys.sort, "unordered") : null,
    keys.primary ? keyLine("Primary", keys.primary, "") : null) : null;

  const shardSet = new Set(keys?.shard?.columns?.map((c) => c.replace(/ DESC$/, "")) ?? []);
  const sortSet = new Set(keys?.sort?.columns?.map((c) => c.replace(/ DESC$/, "")) ?? []);
  const pkSet = new Set(keys?.primary?.columns ?? []);

  const tabs = [["columns", `Columns (${columns.length})`], ["preview", "Preview"], ["ddl", isTable ? "DDL" : "Definition"],
    ...(isTable ? [["skew", "Distribution"]] : [])];
  if (state.tab === "skew" && !isTable) state.tab = "columns";
  const tabBar = h("div", { class: "se-tabs", role: "tablist" },
    tabs.map(([id, label]) => h("button", {
      class: `se-tab${state.tab === id ? " on" : ""}`, role: "tab", "aria-selected": String(state.tab === id),
      title: id === "skew" ? "Rows and data per partition and leaf, skew and the shard key (read on demand)" : null,
      onclick: () => { state.tab = id; if (id === "preview") loadPreview(db, table); if (id === "skew") loadSkew(db, table); renderRight(); },
    }, label)),
    h("div", { class: "se-tabbar-extra" },
      state.tab === "ddl" && ddl ? h("button", { class: "s2-btn", onclick: () => S2.download(`${db}.${table}.sql`, ddl + ";\n", "application/sql") }, "Download .sql") : null,
      state.tab === "preview" ? h("button", { class: "s2-btn", onclick: () => loadPreview(db, table, true) }, "Reload") : null,
      state.tab === "skew" ? h("button", { class: "s2-btn", onclick: () => loadSkew(db, table, true) }, "Recheck") : null));

  let body;
  if (state.tab === "columns") {
    const rows = columns.map((c) => ({
      "#": c.position, Name: c.name, Type: c.type, Null: c.nullable ? "YES" : "NO", Key: c.key, Default: c.default, Extra: c.extra, Comment: c.comment,
    }));
    body = columns.length ? S2.dataTable(["#", "Name", "Type", "Null", "Key", "Default", "Extra", "Comment"], rows, {
      maxHeight: "340px",
      render: {
        Name: (v) => [v,
          pkSet.has(v) && h("span", { class: "se-tag pk", title: "Primary key" }, "PK"),
          shardSet.has(v) && h("span", { class: "se-tag shard", title: "Shard key column" }, "SHARD"),
          sortSet.has(v) && h("span", { class: "se-tag sort", title: "Sort key column" }, "SORT")],
        Type: (v) => h("span", { class: "s2-mono" }, v),
        Null: (v) => v === "YES" ? h("span", { class: "s2-faint" }, "yes") : "NOT NULL",
        Key: (v) => v ?? "",
        Extra: (v) => v ?? "",
        Comment: (v) => v ?? "",
      },
    }) : placeholder("No columns visible");
  } else if (state.tab === "skew") {
    body = skewBody(db, table);
  } else if (state.tab === "preview") {
    const p = state.previews.get(key(db, table));
    if (!p || p.status === "loading") body = h("div", { class: "s2-empty" }, h("span", { class: "s2-spinner" }), " Fetching first 50 rows…");
    else if (p.status === "error") body = S2.errorBox(p.error);
    else if (!p.data.rows.length) body = placeholder("No rows", "The table is empty.");
    else body = [S2.dataTable(p.data.columns, p.data.rows, { maxHeight: "320px" }),
      h("div", { class: "s2-small s2-faint", style: { marginTop: "4px" } },
        `First ${p.data.rows.length} row(s) · `, h("span", { class: "s2-mono" }, p.data.sql))];
  } else {
    if (ddl_error) body = S2.errorBox(new Error(ddl_error));
    else if (!ddl) body = placeholder("No DDL available");
    else body = h("pre", { class: `s2-pre se-ddl${isTable ? "" : " wrap"}` }, ddl.split("\n").map((line, i, arr) => {
      const text = line + (i < arr.length - 1 ? "\n" : "");
      return /^\s*,?\s*(SHARD|SORT)\s+KEY\b|USING CLUSTERED COLUMNSTORE/i.test(line) ? h("span", { class: "hl" }, text) : text;
    }));
  }
  return [head, analyzePanel(db, table), stats, keysEl, info.comment && h("div", { class: "s2-small s2-muted", style: { marginBottom: "8px" } }, info.comment), tabBar, body];
}

function renderRight() {
  if (!rightEl) return;
  if (state.source !== "s2") { rightEl.replaceChildren(...renderSasRight().flat().filter(Boolean)); return; }
  const parts = [];
  if (state.banner) parts.push(h("div", { class: "se-banner" }, S2.errorBox(state.banner)));
  if (!state.sel) {
    parts.push(placeholder("Select a database or table", "Expand a database on the left to browse its tables, columns, shard/sort keys, DDL and data."));
  } else if (!state.sel.table) {
    parts.push(...renderDbOverview(state.sel.db));
  } else {
    parts.push(...renderTableDetail(state.sel.db, state.sel.table));
  }
  const selKey = state.sel ? key(state.sel.db, state.sel.table ?? "") : "";
  const scroll = selKey === lastRightSel ? rightEl.scrollTop : 0;
  lastRightSel = selKey;
  rightEl.replaceChildren(...parts.flat().filter(Boolean));
  rightEl.scrollTop = scroll;
}
let lastRightSel = null;

// ---------- clean-up panel (leftover SAS work tables) ----------
// Scan: schema_explorer_cleanup_scan; drop: schema_explorer_cleanup_drop (one
// DROP per object on the server, dry run by default the first time).
const cu = state.cu;
let cuEl = null;
const ckey = (c) => key(c.database, c.name);
const cuCands = () => cu.scan?.status === "ok" ? cu.scan.data.candidates : [];
const cuByKey = () => new Map(cuCands().map((c) => [ckey(c), c]));
const patternsToText = (ps) => (ps ?? []).map((p) => `${p.pattern}  ${p.kind}`).join("\n");
const textToPatterns = (text) => text.split("\n").map((l) => l.trim()).filter((l) => l && !l.startsWith("#"))
  .map((l) => { const m = l.match(/^(\S+)\s*(.*)$/); return { pattern: m[1], kind: m[2].trim() || "work table" }; });
const sizeText = (v) => v == null ? "–" : fmt.bytes(v);
// Times from the cluster carry no zone: compare them with the cluster's own NOW().
function agoText(now, t) {
  const a = fmt.toDate(now), b = fmt.toDate(t);
  if (!a || !b) return "–";
  const s = Math.max(0, (a - b) / 1000);
  return s < 3600 ? `${Math.round(s / 60)} min ago` : s < 172800 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} days ago`;
}

function applyCleanupSettings(s) {
  if (!s) return;
  cu.settings = s;
  if (cu.patternsText == null) cu.patternsText = patternsToText(s.patterns);
  cu.olderOn = Boolean(s.older_than_days);
  if (s.older_than_days) cu.olderDays = s.older_than_days;
  cu.recentDays = s.recent_days ?? 7;
  cu.dryRun = s.dry_run !== false;
}

function enterCleanup() {
  state.mode = "cleanup";
  cu.confirm = false;
  render();
  if (!cu.settings) {
    call("schema_explorer_cleanup_settings", {}).then((d) => { applyCleanupSettings(d.settings); cu.log = d.log ?? []; renderCleanup(); })
      .catch((e) => S2.toast(e.message, "err"));
  }
  if (!cu.scan) cleanupScan(false);
  S2.updateModelContext("The user is in the Schema Explorer's Clean-up panel (leftover SAS work tables).");
}
function leaveCleanup() { state.mode = "browse"; render(); }

async function cleanupScan(save = true) {
  const args = cu.settings || save ? {
    patterns: textToPatterns(cu.patternsText ?? ""),
    older_than_days: cu.olderOn ? Number(cu.olderDays) || null : null,
    recent_days: Number(cu.recentDays) || 7,
    save,
  } : {};
  if (args.patterns && !args.patterns.length && !args.older_than_days) { S2.toast("Add at least one name pattern", "err"); return; }
  cu.scan = { status: "loading" };
  cu.confirm = false;
  renderCleanup();
  try {
    const data = await call("schema_explorer_cleanup_scan", args);
    cu.scan = { status: "ok", data };
    if (!cu.settings || save) applyCleanupSettings(data.settings);
    cu.log = data.log ?? cu.log;
    const keys = new Set(data.candidates.map(ckey));
    for (const k of [...cu.selected]) if (!keys.has(k)) cu.selected.delete(k);
    const n = data.candidates.length;
    S2.updateModelContext(`Clean-up panel: ${n} candidate work table(s), ${fmt.bytes(data.total_bytes)} in total` +
      (n ? `: ${data.candidates.slice(0, 30).map((c) => `${c.database}.${c.name}`).join(", ")}${n > 30 ? ", …" : ""}` : "") + ".");
  } catch (e) { cu.scan = { status: "error", error: e }; }
  renderCleanup();
}

function selection() {
  const by = cuByKey();
  const tables = [...cu.selected].map((k) => by.get(k)).filter(Boolean);
  const views = new Map();
  for (const t of tables) for (const v of t.views) views.set(key(v.database, v.name), v);
  const blocked = tables.filter((t) => t.views.some((v) => !cu.views.has(key(v.database, v.name))));
  const ok = tables.filter((t) => !blocked.includes(t));
  return { tables, ok, blocked, views, size: ok.reduce((a, t) => a + (Number(t.size_bytes) || 0), 0) };
}

async function cleanupDrop() {
  const sel = selection();
  if (!sel.ok.length) return;
  const includedViews = [...sel.views.values()].filter((v) => cu.views.has(key(v.database, v.name)));
  cu.running = true;
  renderCleanup();
  try {
    const res = await call("schema_explorer_cleanup_drop", {
      tables: sel.ok.map((t) => ({ database: t.database, name: t.name })),
      views: includedViews.map((v) => ({ database: v.database, name: v.name })),
      dry_run: cu.dryRun,
    });
    cu.result = res;
    cu.confirm = false;
    if (!res.dry_run) {
      if (res.log) cu.log = res.log;
      cu.selected.clear(); cu.views.clear();
      S2.toast(`Dropped ${res.dropped} object(s), ${fmt.bytes(res.dropped_bytes)} freed${res.errors ? `, ${res.errors} error(s)` : ""}`, res.errors ? "err" : "");
      // The schema changed: refresh the explorer's own tree (the workspace has no schema-changed message).
      const touched = new Set(res.results.filter((r) => r.status === "dropped").map((r) => r.database));
      for (const d of touched) {
        state.tables.delete(d);
        for (const m of [state.details, state.previews]) for (const k of [...m.keys()]) if (k.startsWith(d + "\u0000")) m.delete(k);
        if (state.sel?.db === d && state.sel.table && res.results.some((r) => r.status === "dropped" && r.database === d && r.name === state.sel.table)) state.sel = { db: d, table: null };
      }
      loadDatabases();
      for (const d of touched) if (state.expanded.has(d)) loadTables(d, true);
      S2.updateModelContext(`Clean-up: the user dropped ${res.dropped} object(s): ${res.results.filter((r) => r.status === "dropped").map((r) => `${r.database}.${r.name}`).join(", ")}.`);
      await cleanupScan(false);
    }
  } catch (e) { S2.toast(`Clean-up failed: ${e.message}`, "err"); }
  cu.running = false;
  renderCleanup();
}

function renderCleanupOptions() {
  const ta = h("textarea", { class: "s2-input", spellcheck: false, "aria-label": "Name patterns",
    oninput: (e) => { cu.patternsText = e.target.value; } });
  ta.value = cu.patternsText ?? "";
  const older = h("input", { type: "checkbox", checked: cu.olderOn, onchange: (e) => { cu.olderOn = e.target.checked; } });
  const days = h("input", { class: "s2-input num", type: "number", min: 1, value: cu.olderDays, "aria-label": "Days",
    oninput: (e) => { cu.olderDays = e.target.value; } });
  const recent = h("input", { class: "s2-input num", type: "number", min: 1, value: cu.recentDays, "aria-label": "Recent days",
    oninput: (e) => { cu.recentDays = e.target.value; } });
  return h("div", { class: "cu-box cu-opts" },
    h("div", { class: "cu-pat" },
      h("h3", {}, "Name patterns"),
      ta,
      h("div", { class: "s2-small s2-faint" }, "One per line: pattern, then a label. * and ? are wildcards, case-insensitive. Stored in ~/.singlestore-mcp/cleanup.json.")),
    h("div", { class: "cu-side" },
      h("h3", {}, "Options"),
      h("label", {}, older, "Also every table not changed for", days, "days"),
      h("label", {}, "Risky if used or created within", recent, "days"),
      h("div", { class: "s2-toolbar" },
        h("button", { class: "s2-btn primary", onclick: () => cleanupScan(true), disabled: cu.scan?.status === "loading" }, "Scan"),
        h("button", { class: "s2-btn ghost", title: "Put the default SAS patterns back", onclick: () => {
          cu.patternsText = "_dm*  SAS DM\n_flw*  SAS flow\nSASTMP*  temp\n_tmp*  temp"; renderCleanup();
        } }, "Default patterns"))));
}

function renderCandidates(data) {
  const cands = data.candidates;
  const riskyN = cands.filter((c) => c.risky).length;
  const head = h("div", { class: "se-stats" },
    stat("Candidates", fmt.number(cands.length)),
    stat("Total size", fmt.bytes(data.total_bytes)),
    stat("Risky", fmt.number(riskyN), "Used or created recently, or with dependent views"),
    stat("Tables scanned", fmt.number(data.tables_scanned)));
  const dbs = h("div", { class: "cu-dbs" }, Object.entries(data.by_database).sort().map(([d, v]) =>
    h("span", { class: "s2-badge plain", title: `${v.tables} table(s), ${fmt.number(v.rows)} rows` }, `${d}: ${v.tables} · ${fmt.bytes(v.size_bytes)}`)));
  const hist = data.history;
  const note = h("div", { class: "s2-small s2-faint" },
    hist?.events ? `“Last used” comes from the query history (${fmt.number(hist.events)} queries since ${fmt.dateTime(hist.oldest)}; only queries above its duration threshold are recorded), so “never” is not a guarantee.`
      : "The query history is off or empty, so “last used” is unknown. An admin turns it on with CREATE EVENT TRACE Query_completion WITH (Query_text = on).",
    data.truncated ? " Only the first 2,000 candidates are shown." : "");
  if (!cands.length) return [head, note, placeholder("No leftover work tables found", "Nothing matches the name patterns" + (data.older_than_days ? ` or is older than ${data.older_than_days} days` : "") + ".")];
  const rows = cands.map((c) => ({
    "": ckey(c), Database: c.database, Name: c.name, Kind: c.kind, Rows: c.rows, Size: c.size_bytes,
    Created: c.created, "Created by": c.owner, Age: c.age_days, "Last used": c.last_used?.time ?? null,
    Views: c.views.length || null, Risk: c.risks.join(", ") || null, _c: c,
  }));
  const table = S2.dataTable(["", "Database", "Name", "Kind", "Rows", "Size", "Created", "Created by", "Age", "Last used", "Views", "Risk"], rows, {
    maxHeight: S2.displayMode === "fullscreen" ? "calc(100vh - 470px)" : "300px",
    render: {
      "": (k, r) => h("input", { type: "checkbox", checked: cu.selected.has(k), "aria-label": `Select ${r.Database}.${r.Name}`,
        onclick: (e) => e.stopPropagation(),
        onchange: (e) => { e.target.checked ? cu.selected.add(k) : cu.selected.delete(k); cu.confirm = false; renderCleanupActions(); } }),
      Name: (v) => h("span", { class: "s2-mono" }, v),
      Rows: (v) => rowsText(v),
      Size: (v, r) => h("span", { title: `On disk: ${sizeText(r._c.disk_bytes)}\nIn memory: ${sizeText(r._c.memory_bytes)}` }, sizeText(v)),
      Created: (v) => fmt.dateTime(v),
      "Created by": (v) => v ?? "–",
      Age: (v) => v == null ? "–" : v < 1 ? `${Math.round(v * 24)} h` : `${Math.round(v)} d`,
      "Last used": (v, r) => v ? h("span", { title: `${r._c.last_used.user ?? ""}: ${r._c.last_used.sql}` }, agoText(data.now, v)) : h("span", { class: "s2-faint" }, "never seen"),
      Views: (v, r) => v ? h("span", { class: "cu-risk", title: r._c.views.map((x) => `${x.database}.${x.name}`).join("\n") }, r._c.views.map((x) => x.name).join(", ")) : "",
      Risk: (v) => v ? h("span", { class: "cu-risk" }, "⚠ " + v) : "",
    },
  });
  return [head, dbs, note, table];
}

let cuActionsEl = null;
function renderCleanupActions() {
  if (!cuActionsEl) return;
  const cands = cuCands();
  const sel = selection();
  const setAll = (pred) => { cu.selected = new Set(cands.filter(pred).map(ckey)); cu.confirm = false; renderCleanup(); };
  const dry = h("input", { type: "checkbox", checked: cu.dryRun, onchange: async (e) => {
    cu.dryRun = e.target.checked; cu.confirm = false; renderCleanupActions();
    try { await call("schema_explorer_cleanup_settings", { dry_run: cu.dryRun }); } catch {}
  } });
  const bar = h("div", { class: "cu-bar" },
    h("span", { class: "cu-count" }, `${sel.tables.length} selected`),
    sel.tables.length ? h("span", { class: "s2-muted s2-small" }, fmt.bytes(sel.tables.reduce((a, t) => a + (Number(t.size_bytes) || 0), 0))) : null,
    h("button", { class: "s2-btn ghost", onclick: () => setAll(() => true), disabled: !cands.length }, "Select all"),
    h("button", { class: "s2-btn ghost", title: "Only tables without risk flags", onclick: () => setAll((c) => !c.risky), disabled: !cands.length }, "Select not risky"),
    h("button", { class: "s2-btn ghost", onclick: () => setAll(() => false), disabled: !sel.tables.length }, "Clear"),
    h("span", { class: "s2-spacer" }),
    h("label", { class: "se-toggle", title: "Only show the DROP statements; drop nothing" }, dry, "Dry run"),
    h("button", { class: `s2-btn ${cu.dryRun ? "primary" : "danger"}`, disabled: !sel.tables.length || cu.running,
      onclick: () => { cu.confirm = true; cu.result = null; renderCleanupActions(); } },
      cu.dryRun ? "Show DROP statements…" : `Drop ${sel.tables.length || ""} table${sel.tables.length === 1 ? "" : "s"}…`));
  const parts = [bar];
  if (cu.confirm && sel.tables.length) parts.push(renderConfirm(sel));
  if (cu.result) parts.push(renderResult(cu.result));
  cuActionsEl.replaceChildren(...parts.filter(Boolean));
}

function renderConfirm(sel) {
  const views = [...sel.views.entries()];
  const viewBoxes = views.length ? h("div", {},
    h("div", { class: "s2-small" }, h("strong", {}, "Dependent views"), " — a table with a view on it is only dropped if you include the view (it is dropped first):"),
    h("ul", {}, views.map(([k, v]) => h("li", {}, h("label", { class: "se-toggle" },
      h("input", { type: "checkbox", checked: cu.views.has(k), onchange: (e) => { e.target.checked ? cu.views.add(k) : cu.views.delete(k); renderCleanupActions(); } }),
      h("span", { class: "s2-mono" }, `${v.database}.${v.name}`)))))) : null;
  const incViews = views.filter(([k]) => cu.views.has(k)).map(([, v]) => v);
  const stmts = [...incViews.map((v) => `DROP VIEW IF EXISTS ${fq(v.database, v.name)};`),
    ...sel.ok.map((t) => `DROP TABLE IF EXISTS ${fq(t.database, t.name)};`)];
  const risky = sel.ok.filter((t) => t.risky);
  const go = h("button", { class: `s2-btn ${cu.dryRun ? "primary" : "danger"}`, disabled: !sel.ok.length || cu.running, onclick: cleanupDrop },
    cu.running ? "Working…" : cu.dryRun ? "Run dry run" : `Drop ${sel.ok.length} table${sel.ok.length === 1 ? "" : "s"}${incViews.length ? ` and ${incViews.length} view${incViews.length === 1 ? "" : "s"}` : ""} now`);
  return h("div", { class: `cu-confirm${cu.dryRun ? " dry" : ""}`, role: "alertdialog", "aria-label": "Confirm clean-up" },
    h("div", {}, h("strong", {}, cu.dryRun ? "Dry run — nothing will be dropped. " : "This permanently drops: "),
      `${sel.ok.length} table(s), ${fmt.bytes(sel.size)}${incViews.length ? `, plus ${incViews.length} view(s)` : ""}. One statement per object:`),
    h("pre", { class: "s2-pre" }, stmts.join("\n") || "(nothing)"),
    risky.length ? h("div", { class: "cu-risk" }, `⚠ ${risky.length} risky: `, risky.map((t) => `${t.name} (${t.risks.join(", ")})`).join("; ")) : null,
    sel.blocked.length ? h("div", { class: "cu-risk" }, `Blocked by a dependent view (not included): ${sel.blocked.map((t) => `${t.database}.${t.name}`).join(", ")}`) : null,
    viewBoxes,
    h("div", { class: "s2-toolbar" }, h("button", { class: "s2-btn ghost", onclick: () => { cu.confirm = false; renderCleanupActions(); } }, "Cancel"), go));
}

function renderResult(res) {
  const cls = { dropped: "ok", "dry-run": "", error: "err", blocked: "warn", skipped: "warn" };
  return h("div", { class: "cu-box cu-res" },
    h("h3", {}, res.dry_run ? "Dry run — statements that would run" : `Result: ${res.dropped} dropped, ${fmt.bytes(res.dropped_bytes)} freed, ${res.errors} error(s)`),
    h("ul", {}, res.results.map((r) => h("li", {},
      h("span", { class: cls[r.status] ?? "" }, r.status === "dry-run" ? "would run" : r.status), " ",
      h("span", { class: "s2-mono" }, r.sql ?? `${r.type} ${fq(r.database, r.name)}`),
      r.error ? h("span", { class: "s2-faint" }, ` — ${r.error}`) : null))),
    res.dry_run ? h("div", { class: "s2-small s2-faint" }, "Turn off “Dry run” to drop for real.") : null);
}

function renderLog() {
  if (!cu.log?.length) return h("div", { class: "s2-small s2-faint" }, "Nothing dropped yet. Every drop is logged to ~/.singlestore-mcp/cleanup-log.jsonl.");
  const rows = cu.log.map((e) => ({ Time: e.time, User: e.user ?? e.os_user, Object: `${e.database}.${e.name}`, Type: e.type,
    Rows: e.rows, Size: e.size_bytes, Status: e.status, Error: e.error }));
  return S2.dataTable(["Time", "User", "Object", "Type", "Rows", "Size", "Status", "Error"], rows, {
    maxHeight: "180px", render: { Time: (v) => fmt.dateTime(v), Rows: (v) => rowsText(v), Size: (v) => sizeText(v), Error: (v) => v ?? "" } });
}

function renderCleanup() {
  if (!cuEl || state.mode !== "cleanup") return;
  const s = cu.scan;
  let body;
  if (!s || s.status === "loading") body = h("div", { class: "s2-empty" }, h("span", { class: "s2-spinner" }), " Scanning all databases for work tables…");
  else if (s.status === "error") body = [S2.errorBox(s.error), h("button", { class: "s2-btn", onclick: () => cleanupScan(false) }, "Retry")];
  else body = renderCandidates(s.data);
  cuActionsEl = h("div", { style: { display: "flex", flexDirection: "column", gap: "8px" } });
  const scroll = cuEl.scrollTop;
  cuEl.replaceChildren(...[
    renderCleanupOptions(),
    h("div", {}, body),
    s?.status === "ok" && s.data.candidates.length ? cuActionsEl : null,
    h("div", {}, h("h3", {}, "Recent clean-ups"), renderLog()),
  ].flat().filter(Boolean));
  renderCleanupActions();
  cuEl.scrollTop = scroll;
}

function render() {
  const cleanup = state.mode === "cleanup";
  const header = h("div", { class: "s2-header" },
    h("h1", { class: "s2-title" }, cleanup ? "Schema Explorer · Clean up" : "Schema Explorer"),
    h("span", { class: "s2-subtitle" }, cleanup ? "leftover SAS work tables" : state.source === "sas" ? "SAS libraries (Viya Compute)" : state.source === "cas" ? "caslibs (CAS)" : state.dbs ? `${state.dbs.filter((d) => !d.system).length} databases` : ""),
    !cleanup && state.source !== "s2" ? viyaSwitch() : null,
    h("span", { class: "s2-spacer" }),
    cleanup
      ? h("button", { class: "s2-btn", onclick: leaveCleanup, title: "Back to browsing the schema" }, "← Schema")
      : h("button", { class: "s2-btn", onclick: enterCleanup, title: "Find and drop leftover SAS work tables (_dm…, _flw…, temp)" }, "🧹 Clean up"),
    h("button", { class: "s2-btn ghost", title: cleanup ? "Scan again" : "Reload database list", onclick: () => {
      if (cleanup) { cleanupScan(false); return; }
      state.tables.clear(); state.details.clear(); state.previews.clear();
      loadDatabases();
      for (const db of state.expanded) loadTables(db, true);
      if (state.sel?.table) loadDetail(state.sel.db, state.sel.table, true);
    } }, "↻ Refresh"),
    cleanup ? S2.openInBrowserButton("cleanup_work_tables", () => ({}))
      : S2.openInBrowserButton("schema_explorer", () => ({ database: state.sel?.db, table: state.sel?.table })),
    S2.fullscreenButton());
  if (cleanup) {
    cuEl = h("div", { class: "cu" });
    root.replaceChildren(...[header, cuEl].filter(Boolean));
    renderCleanup();
    return;
  }
  cuEl = null;
  rightEl = h("div", { class: "se-pane se-right" });
  const focused = document.activeElement === filterEl;
  const caret = filterEl?.selectionStart;
  const treeScroll = treeEl?.scrollTop ?? 0;
  root.replaceChildren(...[header, h("div", { class: "se" }, buildLeft(), rightEl)].filter(Boolean));
  treeEl.scrollTop = treeScroll;
  renderRight();
  if (focused) { filterEl.focus(); try { filterEl.setSelectionRange(caret, caret); } catch {} }
}

// ---------- initial tool result ----------
async function applyInitial(data) {
  state.dbs = data.databases ?? [];
  state.banner = data.error ? new Error(data.error) : null;
  if (data.mode === "cleanup") {
    // Opened by cleanup_work_tables: straight into the Clean-up panel.
    applyCleanupSettings(data.cleanup_settings);
    enterCleanup();
    return;
  }
  const db = data.database;
  if (db && state.dbs.some((d) => d.name === db)) {
    if (SYSTEM.has(db)) state.showSystem = true;
    state.expanded.add(db);
    if (data.tables) state.tables.set(db, { status: "ok", tables: data.tables });
    state.sel = { db, table: null };
    if (data.detail) {
      state.details.set(key(db, data.detail.table), { status: "ok", data: data.detail });
      state.sel = { db, table: data.detail.table };
    }
  }
  render();
  // The opening result leaves the table list out (it would bloat the model's
  // context in hosts that show it structuredContent), so fetch it here.
  if (db && state.expanded.has(db) && !state.tables.has(db)) await loadTables(db);
  if (state.sel?.table) {
    announce();
    // Bring the selected table into view in the tree.
    // (Not scrollIntoView: that can also scroll the host page around the iframe.)
    const row = treeEl.querySelector(".se-row.tbl.sel");
    if (row) treeEl.scrollTop = row.offsetTop - treeEl.offsetTop - treeEl.clientHeight / 2;
  } else if (state.sel) {
    S2.updateModelContext(`The user is browsing database ${state.sel.db} in the Schema Explorer.`);
  }
}

S2.onDisplayModeChange = () => { if (state.dbs) render(); };
await S2.connect({
  name: "singlestore-schema-explorer",
  onToolInput(args) {
    state.pending = args;
    if (!state.dbs && args?.database) {
      root.replaceChildren(h("div", { class: "s2-empty" }, h("span", { class: "s2-spinner" }),
        ` Opening ${args.database}${args.table ? "." + args.table : ""}…`));
    }
  },
  async onToolResult(result) {
    try { await applyInitial(S2.resultData(result)); }
    catch (e) {
      // The opening call failed: still offer a browsable explorer.
      state.banner = cleanError(e);
      render();
      loadDatabases();
    }
  },
});
</script>
</body>
</html>
