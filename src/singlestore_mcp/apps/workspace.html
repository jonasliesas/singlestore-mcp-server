<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SingleStore Workspace</title>
<!--S2:HEAD-->
<style>
  body { padding: 0; }
  .ws { display: grid; grid-template-columns: 58px minmax(0, 1fr); height: 760px; background: var(--s2-bg); }
  html[data-display-mode="fullscreen"] .ws { height: 100vh; }
  .ws-rail { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0;
    background: var(--s2-bg-2); border-right: 1px solid var(--s2-border-2); }
  .ws-rail button { width: 48px; padding: 6px 0 5px; border: 0; border-radius: 8px; background: transparent; cursor: pointer;
    color: var(--s2-text-2); display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative;
    font-size: 10px; line-height: 1.1; font-family: var(--s2-font); }
  .ws-rail button:hover { background: var(--s2-bg-3); color: var(--s2-text); }
  .ws-rail button:focus-visible { outline: 2px solid var(--s2-ring); outline-offset: -2px; }
  .ws-rail button[aria-current="page"] { background: var(--s2-info-bg); color: var(--s2-info); font-weight: var(--font-weight-semibold, 600); }
  .ws-rail button[aria-current="page"]::before { content: ""; position: absolute; left: -5px; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--s2-info); }
  .ws-rail svg { width: 19px; height: 19px; flex: none; }
  .ws-rail .gap { flex: 1; }
  .ws-rail .tool { padding: 7px 0; }
  .ws-main { position: relative; min-width: 0; }
  .ws-main iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--s2-bg); }
  .ws-main iframe[hidden] { display: none; }
  .ws-main.has-tabs iframe { top: 32px; height: calc(100% - 32px); }
  .ws-tabs { position: absolute; top: 0; left: 0; right: 0; height: 32px; display: flex; align-items: flex-end; gap: 2px; padding: 0 8px;
    border-bottom: 1px solid var(--s2-border-2); background: var(--s2-bg-2); overflow-x: auto; z-index: 1; }
  .ws-tabs[hidden] { display: none; }
  .ws-tab { display: flex; align-items: center; border: 1px solid var(--s2-border-2); border-bottom: 0; border-radius: 6px 6px 0 0;
    background: var(--s2-bg-3); max-width: 220px; height: 27px; }
  .ws-tab.on { background: var(--s2-bg); position: relative; top: 1px; }
  .ws-tab button { border: 0; background: none; cursor: pointer; color: var(--s2-text-2); font: inherit; font-size: var(--s2-fs-xs); }
  .ws-tab .name { padding: 0 6px 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-tab.on .name { color: var(--s2-text); font-weight: var(--font-weight-semibold, 600); }
  .ws-tab .dirty { color: var(--s2-warn); }
  .ws-tab .x { padding: 0 8px 0 2px; font-size: 14px; }
  .ws-tab .x:hover, .ws-tab .x.armed { color: var(--s2-err); }
  .ws-tab .x.armed { font-size: var(--s2-fs-xs); font-weight: 600; }
  .ws-tab-add { border: 0; background: none; cursor: pointer; color: var(--s2-text-2); font-size: 16px; padding: 0 8px; height: 27px; }
  .ws-tab-add:hover { color: var(--s2-info); }
  .ws-loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--s2-text-2); font-size: var(--s2-fs-xs); }
  .ws-loading[hidden] { display: none; }
  .ws-loading .s2-error { max-width: 420px; }
  .ws-badge { position: absolute; top: 1px; right: 7px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px;
    background: var(--s2-err); color: #fff; font-size: 10px; font-weight: 600; line-height: 16px; text-align: center; pointer-events: none; }
  .ws-badge[hidden] { display: none; }
</style>
</head>
<body>
<div id="root"><div class="s2-empty"><span class="s2-spinner"></span> Opening the workspace…</div></div>
<script type="module">
// The workspace hosts the other apps as views, each in its own iframe, and
// plays the MCP Apps *host* for them: it answers their ui/initialize, gives
// them their opening tool result, and relays their tool calls, chat messages
// and model-context updates to the real host through its own App connection.
const { h } = S2;
const root = document.getElementById("root");
const svg = (paths) => {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "1.8"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
  s.setAttribute("aria-hidden", "true");
  s.innerHTML = paths; // static, trusted markup
  return s;
};
const ICONS = {
  sql: '<polyline points="8 7 3 12 8 17"/><polyline points="16 7 21 12 16 17"/><line x1="13.5" y1="5" x2="10.5" y2="19"/>',
  notebook: '<path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><line x1="6" y1="3" x2="6" y2="21"/><line x1="10" y1="8" x2="15" y2="8"/><line x1="10" y1="12" x2="15" y2="12"/>',
  schema: '<rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9.5" x2="21" y2="9.5"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="9.5" x2="9" y2="20"/>',
  pipelines: '<rect x="3" y="3.5" width="7" height="6" rx="1.5"/><rect x="14" y="14.5" width="7" height="6" rx="1.5"/><path d="M6.5 9.5v2.5a3 3 0 0 0 3 3h4.5"/><polyline points="12 13 14 15 12 17"/>',
  cluster: '<rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><line x1="7" y1="7.5" x2="7.01" y2="7.5"/><line x1="7" y1="16.5" x2="7.01" y2="16.5"/><line x1="11" y1="7.5" x2="17" y2="7.5"/><line x1="11" y1="16.5" x2="17" y2="16.5"/>',
  history: '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>',
  alerts: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  connections: '<path d="M9 7V3"/><path d="M15 7V3"/><path d="M6 7h12v4a6 6 0 0 1-12 0z"/><path d="M12 17v4"/>',
  browser: '<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  fullscreen: '<path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/>',
};
const VIEWS = {
  sql: { label: "SQL", title: "SQL Editor", uri: "ui://singlestore/sql-editor.html", tool: "sql_editor" },
  notebook: { label: "Notebook", title: "Notebook", uri: "ui://singlestore/notebook.html", tool: "notebook" },
  schema: { label: "Schema", title: "Schema Explorer", uri: "ui://singlestore/schema-explorer.html", tool: "schema_explorer" },
  pipelines: { label: "Pipelines", title: "Pipeline Monitor", uri: "ui://singlestore/pipeline-monitor.html", tool: "pipeline_monitor" },
  connections: { label: "Connect", title: "Connections", uri: "ui://singlestore/connections.html", tool: "connections_window", bottom: true },
  cluster: { label: "Cluster", title: "Cluster Monitor", uri: "ui://singlestore/cluster-monitor.html", tool: "cluster_monitor" },
  history: { label: "History", title: "Query History", uri: "ui://singlestore/query-history.html", tool: "query_history" },
  alerts: { label: "Alerts", title: "Alerts", uri: "ui://singlestore/alerts.html", tool: "alerts" },
};

// Notebook tabs: each is its own view keyed "notebook", "notebook:2", … with its own kernel.
const viewDef = (key) => VIEWS[String(key).split(":")[0]];
const isNotebook = (key) => String(key).startsWith("notebook");
let notebookSeq = 1;

const ws = {
  args: {},            // the workspace's own tool arguments (sql_editor)
  sqlResult: null,     // its tool result, which is also the SQL view's opening result
  current: null,
  frames: {},          // view -> {iframe, args, result, pending: [messages after init]}
  contexts: {},        // view -> latest model-context text from that view
  titles: {},          // notebook tab -> title reported by the notebook
  lastNotebook: null,
};
const railButtons = {};
const mainEl = h("div", { class: "ws-main" });

// ---------------------------------------------------------------- layout
function buildShell() {
  const rail = h("nav", { class: "ws-rail", "aria-label": "Workspace views" });
  const railButton = (key, v) => (railButtons[key] = h("button", { title: v.title, "aria-label": v.title,
    onclick: () => openView(key === "notebook" ? (ws.lastNotebook ?? "notebook") : key) }, svg(ICONS[key]), v.label));
  for (const [key, v] of Object.entries(VIEWS)) if (!v.bottom) rail.append(railButton(key, v));
  rail.append(h("div", { class: "gap" }));
  for (const [key, v] of Object.entries(VIEWS)) if (v.bottom) rail.append(railButton(key, v));
  refreshConnectionLabel();
  if (!S2.inBrowserView()) {
    rail.append(h("button", { class: "tool", title: "Open the workspace full-window in your browser", "aria-label": "Open in browser",
      onclick: async () => {
        try {
          await S2.openAppInBrowser("sql_editor", { view: ws.current, database: ws.args.database });
        } catch (e) { S2.toast(`Couldn't open in browser: ${e.message}`, "err"); }
      } }, svg(ICONS.browser)));
  }
  if (S2.canFullscreen() && !S2.inBrowserView()) {
    rail.append(h("button", { class: "tool", title: "Full screen (Esc to exit)", "aria-label": "Full screen", onclick: () => S2.toggleFullscreen() }, svg(ICONS.fullscreen)));
  }
  mainEl.append(tabsEl);
  root.replaceChildren(h("div", { class: "ws" }, rail, mainEl));
  startAlertBadge();
}

// ---------------------------------------------------------------- alerts badge
// The server checks the cluster in the background; this only reads its in-memory
// state (no cluster queries), so polling it is cheap.
const ALERT_POLL_MS = 30000;
const alertBadge = h("span", { class: "ws-badge", hidden: true, "aria-hidden": "true" });
const alertSeen = new Set();
let alertFirstPoll = true, alertNotify = false;
function startAlertBadge() {
  railButtons.alerts?.append(alertBadge);
  pollAlerts();
  setInterval(() => { if (!document.hidden) pollAlerts(); }, ALERT_POLL_MS);
  // Asking for notification permission needs a click in this (top) page; the Alerts view's
  // "Notify me" switch only records the wish.
  document.addEventListener("pointerdown", () => {
    if (alertNotify && "Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {});
  });
}
async function pollAlerts() {
  let b;
  try { b = await S2.callTool("alerts_badge", {}); } catch { return; }
  const n = Number(b.unacknowledged) || 0;
  alertBadge.hidden = n === 0;
  alertBadge.textContent = n > 99 ? "99+" : String(n);
  const btn = railButtons.alerts;
  if (btn) btn.title = btn.ariaLabel = n ? `Alerts · ${n} unacknowledged` : "Alerts";
  alertNotify = Boolean(b.notify);
  const fresh = (b.newest_unacked ?? []).filter((a) => !alertSeen.has(a.id));
  for (const a of b.newest_unacked ?? []) alertSeen.add(a.id);
  if (!alertFirstPoll && fresh.length && alertNotify && "Notification" in window && Notification.permission === "granted") {
    try {
      const note = new Notification(fresh.length === 1 ? `SingleStore alert: ${fresh[0].title}` : `${fresh.length} new SingleStore alerts`,
        { body: fresh.map((a) => a.title).join("\n"), tag: "s2-alerts" });
      note.onclick = () => { window.focus(); openView("alerts"); note.close(); };
    } catch { /* not allowed in this frame */ }
  }
  alertFirstPoll = false;
}

// ---------------------------------------------------------------- views
function openView(view, handoff) {
  // "notebook:new" (from a notebook's New / Open): a fresh notebook tab.
  if (view === "notebook:new") view = `notebook:${++notebookSeq}`;
  if (!viewDef(view)) return;
  ws.current = view;
  if (isNotebook(view)) ws.lastNotebook = view;
  const base = String(view).split(":")[0];
  for (const [key, btn] of Object.entries(railButtons)) btn.setAttribute("aria-current", key === base ? "page" : "false");
  if (!ws.frames[view]) createFrame(view, handoff);
  else if (handoff) deliver(view, { ...handoff, type: "s2-set-sql" });
  for (const [key, f] of Object.entries(ws.frames)) {
    if (!f.iframe) continue;
    f.iframe.hidden = key !== view;
    f.iframe.contentWindow?.postMessage({ type: "s2-visibility", hidden: key !== view }, "*");
  }
  for (const el of mainEl.querySelectorAll(".ws-loading")) el.hidden = el.dataset.view !== view;
  renderTabs();
  pushContext();
}

// ---------------------------------------------------------------- active connection
// One SingleStore connection is active for the whole server. After a switch,
// the monitors reload; the SQL Editor and notebooks are told (they keep their
// work: SQL text, cells and kernel variables).
async function refreshConnectionLabel() {
  try {
    const st = await S2.callTool("connections_state", {});
    ws.connection = st.active;
  } catch { return; }
  const btn = railButtons.connections;
  if (btn) btn.title = btn.ariaLabel = `Connections · active: ${ws.connection ?? "none"}`;
  pushContext();
}
function connectionChanged(name) {
  ws.connection = name;
  for (const key of Object.keys(ws.frames)) {
    if (["schema", "pipelines", "cluster", "history"].includes(key)) {
      ws.frames[key].iframe?.remove();
      mainEl.querySelector(`.ws-loading[data-view="${key}"]`)?.remove();
      delete ws.frames[key]; delete ws.contexts[key];
    } else if (key !== "connections") {
      deliver(key, { type: "s2-connection-changed", name });
    }
  }
  refreshConnectionLabel();
}

// ---------------------------------------------------------------- notebook tabs
const tabsEl = h("div", { class: "ws-tabs", role: "tablist", "aria-label": "Notebooks" });
function renderTabs() {
  const show = isNotebook(ws.current);
  tabsEl.hidden = !show;
  mainEl.classList.toggle("has-tabs", show);
  if (!show) return;
  const keys = Object.keys(ws.frames).filter(isNotebook);
  tabsEl.replaceChildren(...keys.map((key) => {
    const t = ws.titles[key] ?? { title: "untitled", dirty: false };
    return h("div", { class: `ws-tab${key === ws.current ? " on" : ""}`, role: "tab", "aria-selected": String(key === ws.current) },
      h("button", { class: "name", title: t.path ?? t.title, onclick: () => { ws.closeArmed = null; openView(key); } }, t.title, t.dirty ? h("span", { class: "dirty" }, " ●") : null),
      ws.closeArmed === key
        ? h("button", { class: "x armed", title: "Unsaved changes: click again to close without saving", onclick: () => closeNotebook(key) }, "Discard ×")
        : h("button", { class: "x", title: "Close this notebook (its Python kernel stops)", "aria-label": `Close ${t.title}`, onclick: () => closeNotebook(key) }, "×"));
  }), h("button", { class: "ws-tab-add", title: "New notebook tab", "aria-label": "New notebook", onclick: () => openView(`notebook:${++notebookSeq}`) }, "+"));
}
function closeNotebook(key) {
  const t = ws.titles[key];
  // Dialogs are blocked in the sandbox: an unsaved tab needs a second click on ×.
  if (t?.dirty && ws.closeArmed !== key) { ws.closeArmed = key; renderTabs(); return; }
  ws.closeArmed = null;
  send(key, { type: "s2-close" });  // the notebook stops its kernel
  const f = ws.frames[key];
  setTimeout(() => f?.iframe?.remove(), 300);
  mainEl.querySelector(`.ws-loading[data-view="${key}"]`)?.remove();
  delete ws.frames[key]; delete ws.titles[key]; delete ws.contexts[key];
  const rest = Object.keys(ws.frames).filter(isNotebook);
  if (ws.lastNotebook === key) ws.lastNotebook = rest[rest.length - 1] ?? null;
  if (ws.current === key) openView(ws.lastNotebook ?? "notebook");
  else renderTabs();
}

async function createFrame(view, handoff) {
  const v = viewDef(view);
  const loading = h("div", { class: "ws-loading", dataset: { view } }, h("span", {}, h("span", { class: "s2-spinner" }), ` Loading ${v.title}…`));
  mainEl.append(loading);
  const f = (ws.frames[view] = { iframe: null, pending: [], args: {}, result: null, ready: false });
  if (view === "sql") {
    f.args = { database: ws.args.database ?? null, sql: handoff?.sql ?? ws.args.sql ?? null };
    f.result = ws.sqlResult;
    if (handoff?.run) f.pending.push({ ...handoff, type: "s2-set-sql" });
  } else if (isNotebook(view)) {
    f.args = { database: handoff?.database ?? ws.args.database ?? null, name: handoff?.name ?? null };
    ws.titles[view] = { title: "untitled", dirty: false };
  } else if (view === "schema") {
    f.args = ws.args.table ? { database: ws.args.database, table: ws.args.table } : ws.args.database ? { database: ws.args.database } : {};
  }
  try {
    // Fetched with a tool call rather than resources/read: hosts may cache
    // resources for the session, which would keep an old view after a restart.
    let html = null;
    try { html = (await S2.callTool("app_page", { uri: v.uri })).html; }
    catch { html = (await S2.app.readServerResource({ uri: v.uri }))?.contents?.[0]?.text; }
    if (!html) throw new Error("empty page");
    const debugSameOrigin = Boolean(S2.app.getHostContext()?.s2DebugSameOrigin);
    f.iframe = h("iframe", { title: v.title, srcdoc: html, allow: "clipboard-write",
      sandbox: `allow-scripts allow-downloads allow-popups${debugSameOrigin ? " allow-same-origin" : ""}` });
    f.iframe.hidden = ws.current !== view;
    mainEl.append(f.iframe);
  } catch (e) {
    loading.replaceChildren(S2.errorBox(new Error(`Couldn't load ${v.title}: ${e.message ?? e}`)));
  }
}

function frameFor(source) {
  return Object.entries(ws.frames).find(([, f]) => f.iframe && f.iframe.contentWindow === source);
}

function send(view, msg) { ws.frames[view]?.iframe?.contentWindow?.postMessage(msg, "*"); }
function deliver(view, msg) {
  const f = ws.frames[view];
  if (f?.ready) send(view, msg); else f?.pending.push(msg);
}
const reply = (view, id, result) => send(view, { jsonrpc: "2.0", id, result });
const replyError = (view, id, message, code = -32603) => send(view, { jsonrpc: "2.0", id, error: { code, message } });

function innerContext(view) {
  const outer = S2.app.getHostContext() ?? {};
  const rect = mainEl.getBoundingClientRect();
  return {
    theme: outer.theme, styles: outer.styles, locale: outer.locale, timeZone: outer.timeZone, platform: outer.platform,
    deviceCapabilities: outer.deviceCapabilities,
    // Views fill the workspace, so they get their full-height layouts.
    displayMode: "fullscreen", availableDisplayModes: ["fullscreen"],
    containerDimensions: { width: Math.round(rect.width), height: Math.round(rect.height) },
    // The App SDK validates toolInfo.tool as a full MCP Tool (inputSchema required).
    toolInfo: { tool: outer.toolInfo?.tool?.name === viewDef(view).tool
      ? outer.toolInfo.tool : { name: viewDef(view).tool, inputSchema: { type: "object" } } },
  };
}

async function openingResult(view) {
  const f = ws.frames[view];
  if (f.result) return f.result;
  try {
    return await S2.app.callServerTool({ name: viewDef(view).tool, arguments: f.args });
  } catch (e) {
    return { isError: true, content: [{ type: "text", text: String(e?.message ?? e) }] };
  }
}

// Messages from the views (JSON-RPC as to a host, plus "s2-*" hand-offs).
window.addEventListener("message", async (ev) => {
  const hit = frameFor(ev.source);
  if (!hit) return;
  const [view, f] = hit;
  const msg = ev.data;
  if (msg?.type === "s2-open-view") { openView(msg.view, msg); return; }
  if (msg?.type === "s2-connection-changed") { connectionChanged(msg.name); return; }
  if (msg?.type === "s2-alerts-changed") { pollAlerts(); return; }
  if (msg?.type === "s2-title") { ws.titles[view] = { title: String(msg.title || "untitled"), dirty: Boolean(msg.dirty), path: msg.path }; renderTabs(); return; }
  if (msg?.jsonrpc !== "2.0" || !msg.method) return;
  const { id, method, params } = msg;
  try {
    switch (method) {
      case "ui/initialize": {
        const outerCaps = S2.app.getHostCapabilities() ?? {};
        return reply(view, id, {
          protocolVersion: params.protocolVersion,
          hostCapabilities: {
            serverTools: {}, serverResources: {}, logging: {},
            ...(outerCaps.openLinks ? { openLinks: {} } : {}),
            ...(outerCaps.downloadFile ? { downloadFile: {} } : {}),
            ...(outerCaps.message ? { message: outerCaps.message } : {}),
            ...(outerCaps.updateModelContext ? { updateModelContext: outerCaps.updateModelContext } : {}),
          },
          hostInfo: { name: "singlestore-workspace", version: "0.5.0" },
          hostContext: innerContext(view),
        });
      }
      case "ui/notifications/initialized": {
        send(view, { jsonrpc: "2.0", method: "ui/notifications/tool-input", params: { arguments: f.args } });
        send(view, { jsonrpc: "2.0", method: "ui/notifications/tool-result", params: await openingResult(view) });
        f.ready = true;
        mainEl.querySelector(`.ws-loading[data-view="${view}"]`)?.remove();
        send(view, { type: "s2-visibility", hidden: ws.current !== view });
        for (const m of f.pending.splice(0)) send(view, m);
        return;
      }
      case "tools/call": {
        try { return reply(view, id, await S2.app.callServerTool(params)); }
        catch (e) { return reply(view, id, { isError: true, content: [{ type: "text", text: String(e?.message ?? e) }] }); }
      }
      case "resources/read": return reply(view, id, await S2.app.readServerResource(params));
      case "ui/message": return reply(view, id, (await S2.app.sendMessage(params)) ?? {});
      case "ui/update-model-context": {
        ws.contexts[view] = (params?.content ?? []).filter((c) => c.type === "text").map((c) => c.text).join("\n");
        pushContext();
        return reply(view, id, {});
      }
      case "ui/download-file": return reply(view, id, (await S2.app.downloadFile(params)) ?? {});
      case "ui/open-link": return reply(view, id, (await S2.app.openLink(params)) ?? {});
      case "ui/request-display-mode": return reply(view, id, { mode: "fullscreen" });
      case "ping": return reply(view, id, {});
      default:
        if (id !== undefined) replyError(view, id, `Method not found: ${method}`, -32601);
    }
  } catch (e) {
    if (id !== undefined) replyError(view, id, String(e?.message ?? e));
  }
});

// One combined model context, so a view's report (e.g. the SQL Editor's id)
// isn't lost when another view reports.
let ctxTimer = null;
function pushContext() {
  clearTimeout(ctxTimer);
  ctxTimer = setTimeout(() => {
    const label = (key) => `${viewDef(key)?.title ?? "?"}${isNotebook(key) ? ` "${ws.titles[key]?.title ?? "untitled"}"` : ""}`;
    const parts = [`SingleStore Workspace is open (active connection: ${ws.connection ?? "?"}); the user is on the ${label(ws.current)} view.`];
    for (const [view, text] of Object.entries(ws.contexts)) if (text) parts.push(`[${label(view)}]\n${text}`);
    S2.updateModelContext(parts.join("\n\n"));
  }, 250);
}

// ---------------------------------------------------------------- host wiring
let started = false;
S2.onDisplayModeChange = () => {};
await S2.connect({
  name: "singlestore-workspace",
  onToolInput(args) { ws.args = args ?? {}; },
  onToolResult(result) {
    if (started) return;
    started = true;
    try {
      const data = S2.resultData(result);
      ws.sqlResult = result;
      ws.args = { ...ws.args, database: data.database ?? ws.args.database, sql: data.sql ?? ws.args.sql, table: data.table ?? ws.args.table };
      buildShell();
      openView(viewDef(data.view) ? data.view : "sql");
      if (data.connection_error) S2.toast(`The active connection fails: ${data.connection_error.slice(0, 160)}`, "err");
    } catch (e) {
      root.replaceChildren(S2.errorBox(e));
    }
  },
  onHostContext(ctx) {
    // Theme and style changes reach every view.
    for (const view of Object.keys(ws.frames)) {
      send(view, { jsonrpc: "2.0", method: "ui/notifications/host-context-changed", params: { theme: ctx.theme, styles: ctx.styles } });
    }
  },
});
</script>
