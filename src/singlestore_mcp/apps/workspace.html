<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SingleStore Workspace</title>
<!--S2:HEAD-->
<style>
  body { padding: 0; }
  .ws { display: grid; grid-template-columns: 58px minmax(0, 1fr); height: 760px; background: var(--s2-bg); }
  html[data-display-mode="fullscreen"] .ws { height: 100vh; }
  .ws-rail { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0;
    background: var(--s2-bg-2); border-right: 1px solid var(--s2-border-2); }
  .ws-rail button { width: 48px; padding: 6px 0 5px; border: 0; border-radius: 8px; background: transparent; cursor: pointer;
    color: var(--s2-text-2); display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative;
    font-size: 10px; line-height: 1.1; font-family: var(--s2-font); }
  .ws-rail button:hover { background: var(--s2-bg-3); color: var(--s2-text); }
  .ws-rail button:focus-visible { outline: 2px solid var(--s2-ring); outline-offset: -2px; }
  .ws-rail button[aria-current="page"] { background: var(--s2-info-bg); color: var(--s2-info); font-weight: var(--font-weight-semibold, 600); }
  .ws-rail button[aria-current="page"]::before { content: ""; position: absolute; left: -5px; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--s2-info); }
  .ws-rail svg { width: 19px; height: 19px; flex: none; }
  .ws-rail .gap { flex: 1; }
  .ws-rail .tool { padding: 7px 0; }
  .ws-main { position: relative; min-width: 0; }
  .ws-main iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--s2-bg); }
  .ws-main iframe[hidden] { display: none; }
  .ws-loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--s2-text-2); font-size: var(--s2-fs-xs); }
  .ws-loading[hidden] { display: none; }
  .ws-loading .s2-error { max-width: 420px; }
</style>
</head>
<body>
<div id="root"><div class="s2-empty"><span class="s2-spinner"></span> Opening the workspace…</div></div>
<script type="module">
// The workspace hosts the other apps as views, each in its own iframe, and
// plays the MCP Apps *host* for them: it answers their ui/initialize, gives
// them their opening tool result, and relays their tool calls, chat messages
// and model-context updates to the real host through its own App connection.
const { h } = S2;
const root = document.getElementById("root");
const svg = (paths) => {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "1.8"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
  s.setAttribute("aria-hidden", "true");
  s.innerHTML = paths; // static, trusted markup
  return s;
};
const ICONS = {
  sql: '<polyline points="8 7 3 12 8 17"/><polyline points="16 7 21 12 16 17"/><line x1="13.5" y1="5" x2="10.5" y2="19"/>',
  schema: '<rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9.5" x2="21" y2="9.5"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="9.5" x2="9" y2="20"/>',
  pipelines: '<rect x="3" y="3.5" width="7" height="6" rx="1.5"/><rect x="14" y="14.5" width="7" height="6" rx="1.5"/><path d="M6.5 9.5v2.5a3 3 0 0 0 3 3h4.5"/><polyline points="12 13 14 15 12 17"/>',
  cluster: '<rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><line x1="7" y1="7.5" x2="7.01" y2="7.5"/><line x1="7" y1="16.5" x2="7.01" y2="16.5"/><line x1="11" y1="7.5" x2="17" y2="7.5"/><line x1="11" y1="16.5" x2="17" y2="16.5"/>',
  browser: '<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  fullscreen: '<path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/>',
};
const VIEWS = {
  sql: { label: "SQL", title: "SQL Editor", uri: "ui://singlestore/sql-editor.html", tool: "sql_editor" },
  schema: { label: "Schema", title: "Schema Explorer", uri: "ui://singlestore/schema-explorer.html", tool: "schema_explorer" },
  pipelines: { label: "Pipelines", title: "Pipeline Monitor", uri: "ui://singlestore/pipeline-monitor.html", tool: "pipeline_monitor" },
  cluster: { label: "Cluster", title: "Cluster Monitor", uri: "ui://singlestore/cluster-monitor.html", tool: "cluster_monitor" },
};

const ws = {
  args: {},            // the workspace's own tool arguments (sql_editor)
  sqlResult: null,     // its tool result, which is also the SQL view's opening result
  current: null,
  frames: {},          // view -> {iframe, args, result, pending: [messages after init]}
  contexts: {},        // view -> latest model-context text from that view
};
const railButtons = {};
const mainEl = h("div", { class: "ws-main" });

// ---------------------------------------------------------------- layout
function buildShell() {
  const rail = h("nav", { class: "ws-rail", "aria-label": "Workspace views" });
  for (const [key, v] of Object.entries(VIEWS)) {
    railButtons[key] = h("button", { title: v.title, "aria-label": v.title, onclick: () => openView(key) }, svg(ICONS[key]), v.label);
    rail.append(railButtons[key]);
  }
  rail.append(h("div", { class: "gap" }));
  if (!S2.inBrowserView()) {
    rail.append(h("button", { class: "tool", title: "Open the workspace full-window in your browser", "aria-label": "Open in browser",
      onclick: async () => {
        try {
          await S2.openAppInBrowser("sql_editor", { view: ws.current, database: ws.args.database });
        } catch (e) { S2.toast(`Couldn't open in browser: ${e.message}`, "err"); }
      } }, svg(ICONS.browser)));
  }
  if (S2.canFullscreen() && !S2.inBrowserView()) {
    rail.append(h("button", { class: "tool", title: "Full screen (Esc to exit)", "aria-label": "Full screen", onclick: () => S2.toggleFullscreen() }, svg(ICONS.fullscreen)));
  }
  root.replaceChildren(h("div", { class: "ws" }, rail, mainEl));
}

// ---------------------------------------------------------------- views
function openView(view, handoff) {
  if (!VIEWS[view]) return;
  ws.current = view;
  for (const [key, btn] of Object.entries(railButtons)) btn.setAttribute("aria-current", key === view ? "page" : "false");
  if (!ws.frames[view]) createFrame(view, handoff);
  else if (handoff) deliver(view, { ...handoff, type: "s2-set-sql" });
  for (const [key, f] of Object.entries(ws.frames)) {
    if (!f.iframe) continue;
    f.iframe.hidden = key !== view;
    f.iframe.contentWindow?.postMessage({ type: "s2-visibility", hidden: key !== view }, "*");
  }
  for (const el of mainEl.querySelectorAll(".ws-loading")) el.hidden = el.dataset.view !== view;
  pushContext();
}

async function createFrame(view, handoff) {
  const v = VIEWS[view];
  const loading = h("div", { class: "ws-loading", dataset: { view } }, h("span", {}, h("span", { class: "s2-spinner" }), ` Loading ${v.title}…`));
  mainEl.append(loading);
  const f = (ws.frames[view] = { iframe: null, pending: [], args: {}, result: null, ready: false });
  if (view === "sql") {
    f.args = { database: ws.args.database ?? null, sql: handoff?.sql ?? ws.args.sql ?? null };
    f.result = ws.sqlResult;
    if (handoff?.run) f.pending.push({ ...handoff, type: "s2-set-sql" });
  } else if (view === "schema") {
    f.args = ws.args.table ? { database: ws.args.database, table: ws.args.table } : ws.args.database ? { database: ws.args.database } : {};
  }
  try {
    const res = await S2.app.readServerResource({ uri: v.uri });
    const html = res?.contents?.[0]?.text;
    if (!html) throw new Error("empty page");
    const debugSameOrigin = Boolean(S2.app.getHostContext()?.s2DebugSameOrigin);
    f.iframe = h("iframe", { title: v.title, srcdoc: html, allow: "clipboard-write",
      sandbox: `allow-scripts allow-downloads allow-popups${debugSameOrigin ? " allow-same-origin" : ""}` });
    f.iframe.hidden = ws.current !== view;
    mainEl.append(f.iframe);
  } catch (e) {
    loading.replaceChildren(S2.errorBox(new Error(`Couldn't load ${v.title}: ${e.message ?? e}`)));
  }
}

function frameFor(source) {
  return Object.entries(ws.frames).find(([, f]) => f.iframe && f.iframe.contentWindow === source);
}

function send(view, msg) { ws.frames[view]?.iframe?.contentWindow?.postMessage(msg, "*"); }
function deliver(view, msg) {
  const f = ws.frames[view];
  if (f?.ready) send(view, msg); else f?.pending.push(msg);
}
const reply = (view, id, result) => send(view, { jsonrpc: "2.0", id, result });
const replyError = (view, id, message, code = -32603) => send(view, { jsonrpc: "2.0", id, error: { code, message } });

function innerContext(view) {
  const outer = S2.app.getHostContext() ?? {};
  const rect = mainEl.getBoundingClientRect();
  return {
    theme: outer.theme, styles: outer.styles, locale: outer.locale, timeZone: outer.timeZone, platform: outer.platform,
    deviceCapabilities: outer.deviceCapabilities,
    // Views fill the workspace, so they get their full-height layouts.
    displayMode: "fullscreen", availableDisplayModes: ["fullscreen"],
    containerDimensions: { width: Math.round(rect.width), height: Math.round(rect.height) },
    // The App SDK validates toolInfo.tool as a full MCP Tool (inputSchema required).
    toolInfo: { tool: outer.toolInfo?.tool?.name === VIEWS[view].tool
      ? outer.toolInfo.tool : { name: VIEWS[view].tool, inputSchema: { type: "object" } } },
  };
}

async function openingResult(view) {
  const f = ws.frames[view];
  if (f.result) return f.result;
  try {
    return await S2.app.callServerTool({ name: VIEWS[view].tool, arguments: f.args });
  } catch (e) {
    return { isError: true, content: [{ type: "text", text: String(e?.message ?? e) }] };
  }
}

// Messages from the views (JSON-RPC as to a host, plus "s2-*" hand-offs).
window.addEventListener("message", async (ev) => {
  const hit = frameFor(ev.source);
  if (!hit) return;
  const [view, f] = hit;
  const msg = ev.data;
  if (msg?.type === "s2-open-view") { openView(msg.view, msg); return; }
  if (msg?.jsonrpc !== "2.0" || !msg.method) return;
  const { id, method, params } = msg;
  try {
    switch (method) {
      case "ui/initialize": {
        const outerCaps = S2.app.getHostCapabilities() ?? {};
        return reply(view, id, {
          protocolVersion: params.protocolVersion,
          hostCapabilities: {
            serverTools: {}, serverResources: {}, logging: {},
            ...(outerCaps.openLinks ? { openLinks: {} } : {}),
            ...(outerCaps.downloadFile ? { downloadFile: {} } : {}),
            ...(outerCaps.message ? { message: outerCaps.message } : {}),
            ...(outerCaps.updateModelContext ? { updateModelContext: outerCaps.updateModelContext } : {}),
          },
          hostInfo: { name: "singlestore-workspace", version: "0.4.0" },
          hostContext: innerContext(view),
        });
      }
      case "ui/notifications/initialized": {
        send(view, { jsonrpc: "2.0", method: "ui/notifications/tool-input", params: { arguments: f.args } });
        send(view, { jsonrpc: "2.0", method: "ui/notifications/tool-result", params: await openingResult(view) });
        f.ready = true;
        mainEl.querySelector(`.ws-loading[data-view="${view}"]`)?.remove();
        send(view, { type: "s2-visibility", hidden: ws.current !== view });
        for (const m of f.pending.splice(0)) send(view, m);
        return;
      }
      case "tools/call": {
        try { return reply(view, id, await S2.app.callServerTool(params)); }
        catch (e) { return reply(view, id, { isError: true, content: [{ type: "text", text: String(e?.message ?? e) }] }); }
      }
      case "resources/read": return reply(view, id, await S2.app.readServerResource(params));
      case "ui/message": return reply(view, id, (await S2.app.sendMessage(params)) ?? {});
      case "ui/update-model-context": {
        ws.contexts[view] = (params?.content ?? []).filter((c) => c.type === "text").map((c) => c.text).join("\n");
        pushContext();
        return reply(view, id, {});
      }
      case "ui/download-file": return reply(view, id, (await S2.app.downloadFile(params)) ?? {});
      case "ui/open-link": return reply(view, id, (await S2.app.openLink(params)) ?? {});
      case "ui/request-display-mode": return reply(view, id, { mode: "fullscreen" });
      case "ping": return reply(view, id, {});
      default:
        if (id !== undefined) replyError(view, id, `Method not found: ${method}`, -32601);
    }
  } catch (e) {
    if (id !== undefined) replyError(view, id, String(e?.message ?? e));
  }
});

// One combined model context, so a view's report (e.g. the SQL Editor's id)
// isn't lost when another view reports.
let ctxTimer = null;
function pushContext() {
  clearTimeout(ctxTimer);
  ctxTimer = setTimeout(() => {
    const parts = [`SingleStore Workspace is open; the user is on the ${VIEWS[ws.current]?.title ?? "?"} view.`];
    for (const [view, text] of Object.entries(ws.contexts)) if (text) parts.push(`[${VIEWS[view].title}]\n${text}`);
    S2.updateModelContext(parts.join("\n\n"));
  }, 250);
}

// ---------------------------------------------------------------- host wiring
let started = false;
S2.onDisplayModeChange = () => {};
await S2.connect({
  name: "singlestore-workspace",
  onToolInput(args) { ws.args = args ?? {}; },
  onToolResult(result) {
    if (started) return;
    started = true;
    try {
      const data = S2.resultData(result);
      ws.sqlResult = result;
      ws.args = { ...ws.args, database: data.database ?? ws.args.database, sql: data.sql ?? ws.args.sql, table: data.table ?? ws.args.table };
      buildShell();
      openView(VIEWS[data.view] ? data.view : "sql");
    } catch (e) {
      root.replaceChildren(S2.errorBox(e));
    }
  },
  onHostContext(ctx) {
    // Theme and style changes reach every view.
    for (const view of Object.keys(ws.frames)) {
      send(view, { jsonrpc: "2.0", method: "ui/notifications/host-context-changed", params: { theme: ctx.theme, styles: ctx.styles } });
    }
  },
});
</script>
</body>
</html>
