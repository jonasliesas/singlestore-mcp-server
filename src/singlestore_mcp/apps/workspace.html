<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAS SpeedyStore Studio · Workspace</title>
<!--S2:HEAD-->
<style>
  body { padding: 0; }
  .ws { display: grid; grid-template-columns: 58px minmax(0, 1fr); height: 760px; background: var(--s2-bg); }
  html[data-display-mode="fullscreen"] .ws { height: calc(100vh / var(--s2-zoom)); }
  .ws-rail { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0;
    background: var(--s2-bg-2); border-right: 1px solid var(--s2-border-2); overflow-y: auto; scrollbar-width: none; }
  .ws-rail > * { flex: none; }
  .ws-rail .gap { flex: 1 0 4px; }
  .ws-rail button { width: 48px; padding: 6px 0 5px; border: 0; border-radius: 8px; background: transparent; cursor: pointer;
    color: var(--s2-text-2); display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative;
    font-size: 10px; line-height: 1.1; font-family: var(--s2-font); }
  .ws-rail button:hover { background: var(--s2-bg-3); color: var(--s2-text); }
  .ws-rail button:focus-visible { outline: 2px solid var(--s2-ring); outline-offset: -2px; }
  .ws-rail button[aria-current="page"] { background: var(--s2-info-bg); color: var(--s2-info); font-weight: var(--font-weight-semibold, 600); }
  .ws-rail button[aria-current="page"]::before { content: ""; position: absolute; left: -5px; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--s2-info); }
  .ws-rail svg { width: 19px; height: 19px; flex: none; }

  .ws-rail .tool { padding: 7px 0; }
  .ws-main { position: relative; min-width: 0; }
  .ws-main iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--s2-bg); }
  .ws-main iframe[hidden] { display: none; }
  .ws-main.has-tabs iframe { top: 32px; height: calc(100% - 32px); }
  .ws-tabs { position: absolute; top: 0; left: 0; right: 0; height: 32px; display: flex; align-items: flex-end; gap: 2px; padding: 0 8px;
    border-bottom: 1px solid var(--s2-border-2); background: var(--s2-bg-2); overflow-x: auto; z-index: 1; }
  .ws-tabs[hidden] { display: none; }
  .ws-tab { display: flex; align-items: center; border: 1px solid var(--s2-border-2); border-bottom: 0; border-radius: 6px 6px 0 0;
    background: var(--s2-bg-3); max-width: 220px; height: 27px; }
  .ws-tab.on { background: var(--s2-bg); position: relative; top: 1px; }
  .ws-tab button { border: 0; background: none; cursor: pointer; color: var(--s2-text-2); font: inherit; font-size: var(--s2-fs-xs); }
  .ws-tab .name { padding: 0 6px 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-tab.on .name { color: var(--s2-text); font-weight: var(--font-weight-semibold, 600); }
  .ws-tab .dirty { color: var(--s2-warn); }
  .ws-tab .x { padding: 0 8px 0 2px; font-size: 14px; }
  .ws-tab .x:hover, .ws-tab .x.armed { color: var(--s2-err); }
  .ws-tab .x.armed { font-size: var(--s2-fs-xs); font-weight: 600; }
  .ws-tab-add { border: 0; background: none; cursor: pointer; color: var(--s2-text-2); font-size: 16px; padding: 0 8px; height: 27px; }
  .ws-tab-add:hover { color: var(--s2-info); }
  .ws-tab.drop { box-shadow: inset 2px 0 0 var(--s2-info); }
  .ws-tab .rename { width: 140px; margin: 0 4px 0 6px; padding: 1px 4px; font: inherit; font-size: var(--s2-fs-xs);
    border: 1px solid var(--s2-border); border-radius: 4px; background: var(--s2-bg); color: var(--s2-text); }
  .ws-loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--s2-text-2); font-size: var(--s2-fs-xs); }
  .ws-loading[hidden] { display: none; }
  .ws-loading .s2-error { max-width: 420px; }
  .ws-badge { position: absolute; top: 1px; right: 7px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px;
    background: var(--s2-err-fill); color: #fff; font-size: 10px; font-weight: 600; line-height: 16px; text-align: center; pointer-events: none; }
  .ws-badge[hidden] { display: none; }
  /* The Studio's mark at the top of the rail (the name is on the splash and above the app) */
  .ws-brand { display: flex; justify-content: center; width: 48px; padding: 2px 0 9px; margin-bottom: 4px; border-bottom: 1px solid var(--s2-border-2); }
  .ws-brand svg { width: 30px; height: 30px; display: block; }
  /* Before the shell is built the splash (an overlay) needs the page's height (hosts size the frame to the page). */
  #root:empty { height: 760px; }
  html[data-display-mode="fullscreen"] #root:empty { height: calc(100vh / var(--s2-zoom)); }
  /* Connection health: "Connection to SingleStore lost – retrying…" over the views while it's away */
  .ws-net { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 3; max-width: calc(100% - 24px);
    display: flex; align-items: center; gap: 8px; padding: 5px 14px; border-radius: 999px; box-sizing: border-box;
    background: var(--s2-warn-bg); color: var(--s2-warn); border: 1px solid currentColor; font-size: var(--s2-fs-xs);
    box-shadow: 0 2px 8px rgba(0,0,0,.12); pointer-events: auto; }
  .ws-net[hidden] { display: none; }
  .ws-net .spin { width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
    animation: ws-spin 0.9s linear infinite; flex: none; }
  .ws-net button { border: 0; background: none; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
  @keyframes ws-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ws-net .spin { animation: none; } }
  .ws-rail button.present[aria-pressed="true"] { background: var(--s2-warn-bg); color: var(--s2-warn); font-weight: var(--font-weight-semibold, 600); }
</style>
</head>
<body>
<!--S2:SPLASH-->
<div id="root"></div>
<script type="module">
// The workspace hosts the other apps as views, each in its own iframe, and
// plays the MCP Apps *host* for them: it answers their ui/initialize, gives
// them their opening tool result, and relays their tool calls, chat messages
// and model-context updates to the real host through its own App connection.
const { h } = S2;
const root = document.getElementById("root");
const svg = (paths) => {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "1.8"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
  s.setAttribute("aria-hidden", "true");
  s.innerHTML = paths; // static, trusted markup
  return s;
};
const ICONS = {
  sql: '<polyline points="8 7 3 12 8 17"/><polyline points="16 7 21 12 16 17"/><line x1="13.5" y1="5" x2="10.5" y2="19"/>',
  notebook: '<path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><line x1="6" y1="3" x2="6" y2="21"/><line x1="10" y1="8" x2="15" y2="8"/><line x1="10" y1="12" x2="15" y2="12"/>',
  schema: '<rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9.5" x2="21" y2="9.5"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="9.5" x2="9" y2="20"/>',
  pipelines: '<rect x="3" y="3.5" width="7" height="6" rx="1.5"/><rect x="14" y="14.5" width="7" height="6" rx="1.5"/><path d="M6.5 9.5v2.5a3 3 0 0 0 3 3h4.5"/><polyline points="12 13 14 15 12 17"/>',
  cluster: '<rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><line x1="7" y1="7.5" x2="7.01" y2="7.5"/><line x1="7" y1="16.5" x2="7.01" y2="16.5"/><line x1="11" y1="7.5" x2="17" y2="7.5"/><line x1="11" y1="16.5" x2="17" y2="16.5"/>',
  history: '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>',
  alerts: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  workload: '<polyline points="3 17 8 11 12 14 17 7 21 10"/><line x1="3" y1="21" x2="21" y2="21"/>',
  security: '<path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><polyline points="9 12 11 14 15 10"/>',
  config: '<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/>',
  connections: '<path d="M9 7V3"/><path d="M15 7V3"/><path d="M6 7h12v4a6 6 0 0 1-12 0z"/><path d="M12 17v4"/>',
  browser: '<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  fullscreen: '<path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/>',
  present: '<rect x="3" y="4" width="18" height="12" rx="1.5"/><line x1="12" y1="16" x2="12" y2="20"/><line x1="8" y1="20" x2="16" y2="20"/><circle cx="12" cy="10" r="2.5"/>',
  account: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
};
// SAS SpeedyStore Studio's mark (a data store with speed streaks): the splash's logo, kept before the splash goes,
// without its sheen and with its own gradient id (the splash's animations only apply inside the splash).
const MARK = (() => {
  const s = document.getElementById("s2-splash-mark")?.cloneNode(true);
  if (!s) return null;
  s.removeAttribute("id");
  s.querySelector("[clip-path]")?.remove();
  s.innerHTML = s.innerHTML.replaceAll("s2m-", "s2r-"); // static, trusted markup
  return s;
})();
const brandMark = () => MARK?.cloneNode(true) ?? svg(ICONS.schema);

// ---------------------------------------------------------------- splash
// The Studio logo (splash.html) until the first view is usable, then a short fade - never longer. Its status line
// says what it waits for. In the browser view the host page shows the logo over this page (one animation from
// the start), so this page hides its own and sends the host its progress.
const splash = {
  status(text) {
    window.S2Splash?.status(text);
    if (S2.inBrowserView()) window.parent.postMessage({ type: "s2-splash", text }, "*");
  },
  done() {
    if (splash.over) return;
    splash.over = true;
    window.S2Splash?.done();
    if (S2.inBrowserView()) window.parent.postMessage({ type: "s2-splash-done" }, "*");
  },
  over: false,
};
// Rail order follows this object's order (bottom: true goes to the bottom of the rail).
const VIEWS = {
  schema: { label: "Schema", title: "Schema Explorer", uri: "ui://singlestore/schema-explorer.html", tool: "schema_explorer" },
  sql: { label: "SQL", title: "SQL Editor", uri: "ui://singlestore/sql-editor.html", tool: "sql_editor" },
  notebook: { label: "Notebook", title: "Notebook", uri: "ui://singlestore/notebook.html", tool: "notebook" },
  pipelines: { label: "Pipelines", title: "Pipeline Monitor", uri: "ui://singlestore/pipeline-monitor.html", tool: "pipeline_monitor" },
  connections: { label: "Connect", title: "Connections", uri: "ui://singlestore/connections.html", tool: "connections_window", bottom: true },
  cluster: { label: "Cluster", title: "Cluster Monitor", uri: "ui://singlestore/cluster-monitor.html", tool: "cluster_monitor" },
  history: { label: "History", title: "Query History", uri: "ui://singlestore/query-history.html", tool: "query_history" },
  security: { label: "Security", title: "Security", uri: "ui://singlestore/security.html", tool: "security" },
  config: { label: "Config", title: "Config", uri: "ui://singlestore/config.html", tool: "cluster_config" },
  alerts: { label: "Alerts", title: "Alerts", uri: "ui://singlestore/alerts.html", tool: "alerts" },
  workload: { label: "Workload", title: "Workload", uri: "ui://singlestore/workload.html", tool: "workload" },
};

// Tabbed views: each tab is its own view (own iframe).
//  - Notebook tabs are keyed "notebook", "notebook:2", … each with its own kernel; they
//    exist while their frame does.
//  - SQL Editor tabs are keyed "sql:<tab id>"; the list (order, active tab, titles) is
//    kept by the server (sql_editor_tabs), so it comes back after a restart, and each
//    tab autosaves its own draft. A tab's frame loads the first time it's shown.
//    "sql" alone means the active SQL tab.
const viewDef = (key) => VIEWS[String(key).split(":")[0]];
const isNotebook = (key) => String(key).startsWith("notebook");
const isSql = (key) => String(key) === "sql" || String(key).startsWith("sql:");
const tabGroup = (key) => (isNotebook(key) ? "notebook" : isSql(key) ? "sql" : null);
const sqlKey = (id) => (id ? `sql:${id}` : "sql");  // "sql" alone: the tab list couldn't be loaded
const tabIdOf = (key) => String(key).split(":")[1] ?? null;
const baseName = (p) => (p ? String(p).split(/[\\/]/).pop() : null);
const errText = (e) => String(e?.message ?? e).replace(/^Error executing tool [\w-]+:\s*/, "");
let notebookSeq = 1;

const ws = {
  args: {},            // the workspace's own tool arguments (sql_editor)
  sqlResult: null,     // its tool result, which is also the opening result of the SQL tab active at start
  startSqlKey: null,   // that tab (it gets the SQL Claude opened the workspace with)
  current: null,
  frames: {},          // view -> {iframe, args, result, pending: [messages after init]}
  contexts: {},        // view -> latest model-context text from that view
  titles: {},          // notebook tab -> title reported by the notebook
  lastNotebook: null,
  features: {},        // server mode switches from the opening result ({server, notebooks, assistant, user, notes})
  sqlTabs: [],         // SQL tabs in order: {id, n, title, file, path, dirty} (server list + live updates)
  lastSql: null,       // id of the active SQL tab
};
const sqlTab = (key) => ws.sqlTabs.find((t) => t.id === tabIdOf(key));
const sqlLabel = (t) => t.title || baseName(t.file) || `untitled ${t.n}`;
const railButtons = {};
const mainEl = h("div", { class: "ws-main" });

// ---------------------------------------------------------------- layout
function buildShell() {
  const rail = h("nav", { class: "ws-rail", "aria-label": "Workspace views" },
    h("div", { class: "ws-brand", role: "img", "aria-label": "SAS SpeedyStore Studio", title: `SAS SpeedyStore Studio · build ${S2.build}` },
      brandMark()));
  const railButton = (key, v) => (railButtons[key] = h("button", { title: v.title, "aria-label": v.title,
    onclick: () => openView(key === "notebook" ? (ws.lastNotebook ?? "notebook") : key) }, svg(ICONS[key]), v.label));
  for (const [key, v] of Object.entries(VIEWS)) if (!v.bottom) rail.append(railButton(key, v));
  rail.append(h("div", { class: "gap" }));
  rail.append(presentButton);
  for (const [key, v] of Object.entries(VIEWS)) if (v.bottom) rail.append(railButton(key, v));
  if (ws.features.server && S2.inBrowserView()) {
    // Studio on a server (behind the hub): the user's account page (sign out, admin) replaces this page.
    const who = ws.features.user ? `Signed in as ${ws.features.user}` : "Account";
    rail.append(h("button", { class: "tool", title: `${who} · Sign out`, "aria-label": "Account and sign out",
      onclick: () => window.parent.postMessage({ type: "s2-account" }, "*") }, svg(ICONS.account)));
  }
  refreshConnectionLabel();
  if (!S2.inBrowserView()) {
    rail.append(h("button", { class: "tool", title: "Open the workspace full-window in your browser", "aria-label": "Open in browser",
      onclick: async () => {
        try {
          await S2.openAppInBrowser("sql_editor", { view: String(ws.current).split(":")[0], database: ws.args.database });
        } catch (e) { S2.toast(`Couldn't open in browser: ${e.message}`, "err"); }
      } }, svg(ICONS.browser)));
  }
  if (S2.canFullscreen() && !S2.inBrowserView()) {
    rail.append(h("button", { class: "tool", title: "Full screen (Esc to exit)", "aria-label": "Full screen", onclick: () => S2.toggleFullscreen() }, svg(ICONS.fullscreen)));
  }
  mainEl.append(tabsEl, healthEl);
  root.replaceChildren(h("div", { class: "ws" }, rail, mainEl));
  startAlertBadge();
  startHealth();
  // Tab shortcuts while the focus is in the workspace itself (the SQL Editor forwards its own).
  window.addEventListener("keydown", (e) => {
    const action = tabKeyAction(e);
    if (action && isSql(ws.current)) { e.preventDefault(); sqlTabKey(action); }
  }, true);
}

// ---------------------------------------------------------------- presenter mode
// One switch for every view: bigger text and neutral names for hosts, connections and users (S2.presenter). Remembered
// per browser: the browser page keeps it (s2-presenter-save), and so does this page where it may use storage.
const PRESENT_KEY = "s2-presenter";
const presentButton = h("button", { class: "present", "aria-pressed": "false",
  title: "Presenter mode: bigger text, and neutral names for connections, hosts, users and e-mail addresses in every view (for projectors and screen shares). Query results stay as they are.",
  onclick: () => setPresenter(!ws.presenter) }, svg(ICONS.present), "Present");
function setPresenter(on, { save = true } = {}) {
  ws.presenter = Boolean(on);
  presentButton.setAttribute("aria-pressed", String(ws.presenter));
  presentButton.setAttribute("aria-label", ws.presenter ? "Presenter mode: on" : "Presenter mode: off");
  S2.presenter.set(ws.presenter);
  for (const key of Object.keys(ws.frames)) deliver(key, { type: "s2-presenter", on: ws.presenter });
  if (!save) return;
  try { localStorage.setItem(PRESENT_KEY, ws.presenter ? "1" : "0"); } catch { /* sandboxed: the browser page keeps it */ }
  window.parent.postMessage({ type: "s2-presenter-save", on: ws.presenter }, "*");
}
function initialPresenter() {
  const ctx = S2.app.getHostContext() ?? {};
  if ("s2Presenter" in ctx) return Boolean(ctx.s2Presenter);
  try { return localStorage.getItem(PRESENT_KEY) === "1"; } catch { return false; }
}

// ---------------------------------------------------------------- alerts badge
// The server checks the cluster in the background; this only reads its in-memory
// state (no cluster queries), so polling it is cheap.
const ALERT_POLL_MS = 30000;
const alertBadge = h("span", { class: "ws-badge", hidden: true, "aria-hidden": "true" });
const alertSeen = new Set();
let alertFirstPoll = true, alertNotify = false;
function startAlertBadge() {
  railButtons.alerts?.append(alertBadge);
  pollAlerts();
  setInterval(() => { if (!document.hidden) pollAlerts(); }, ALERT_POLL_MS);
  // Asking for notification permission needs a click in this (top) page; the Alerts view's
  // "Notify me" switch only records the wish.
  document.addEventListener("pointerdown", () => {
    if (alertNotify && "Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {});
  });
}
async function pollAlerts() {
  let b;
  try { b = await S2.callTool("alerts_badge", {}); } catch { return; }
  const n = Number(b.unacknowledged) || 0;
  alertBadge.hidden = n === 0;
  alertBadge.textContent = n > 99 ? "99+" : String(n);
  const btn = railButtons.alerts;
  if (btn) btn.title = btn.ariaLabel = n ? `Alerts · ${n} unacknowledged` : "Alerts";
  alertNotify = Boolean(b.notify);
  const fresh = (b.newest_unacked ?? []).filter((a) => !alertSeen.has(a.id));
  for (const a of b.newest_unacked ?? []) alertSeen.add(a.id);
  if (!alertFirstPoll && fresh.length && alertNotify && "Notification" in window && Notification.permission === "granted") {
    try {
      const note = new Notification(fresh.length === 1 ? `SingleStore alert: ${fresh[0].title}` : `${fresh.length} new SingleStore alerts`,
        { body: fresh.map((a) => a.title).join("\n"), tag: "s2-alerts" });
      note.onclick = () => { window.focus(); openView("alerts"); note.close(); };
    } catch { /* not allowed in this frame */ }
  }
  alertFirstPoll = false;
}

// ---------------------------------------------------------------- connection health
// After a network break (VPN dropped or moved, sleep, Wi-Fi) the server notices and reconnects by itself (netguard);
// this line says so while SingleStore or SAS Viya can't be reached ("… lost – retrying"), and when they're back the
// views hear "s2-reconnected" (to reload what failed meanwhile) and the SAS session is checked at once. In-memory on
// the server (no cluster query): every 30 s, every 3 s while something is down, and at once when the page comes back
// online or is shown again.
const HEALTH_MS = 30000, HEALTH_DOWN_MS = 3000;
const healthText = h("span", {});
const healthEl = h("div", { class: "ws-net", role: "status", "aria-live": "polite", hidden: true },
  h("span", { class: "spin", "aria-hidden": "true" }), healthText,
  h("button", { title: "Check again now", onclick: () => pollHealth("all") }, "Retry now"));
const health = { down: new Set(), timer: null, lastNotice: 0, opened: Date.now() / 1000, busy: false };
const SERVICE_NAMES = { singlestore: "SingleStore", sas: "SAS Viya" };
function startHealth() {
  setTimeout(() => pollHealth("none"), 2500);
  window.addEventListener("online", () => pollHealth("all"));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pollHealth("down"); });
}
async function pollHealth(probe = "down") {
  clearTimeout(health.timer);
  if (health.busy) return;
  health.busy = true;
  let d = null;
  try { d = await S2.callTool("connection_health", { probe, after_notice: health.lastNotice }); } catch { /* the page's own reconnect handles a server restart */ }
  health.busy = false;
  if (d) showHealth(d);
  health.timer = setTimeout(() => pollHealth("down"), health.down.size ? HEALTH_DOWN_MS : HEALTH_MS);
}
function showHealth(d) {
  const services = d.services ?? {};
  const down = Object.entries(services).filter(([, s]) => s.state === "down");
  const back = [...health.down].filter((k) => services[k]?.state !== "down");
  health.down = new Set(down.map(([k]) => k));
  if (down.length) {
    const since = Math.min(...down.map(([, s]) => Number(s.since) || Date.now() / 1000));
    const at = new Date(since * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const names = down.map(([k, s]) => s.name ?? SERVICE_NAMES[k] ?? k).join(" and ");
    healthText.textContent = `Connection to ${names} lost (since ${at}) – retrying…`;
    healthEl.title = down.map(([k, s]) => `${s.name ?? k}: ${s.error ?? "unreachable"}`).join("\n");
  }
  healthEl.hidden = !down.length;
  for (const k of back) {
    const name = services[k]?.name ?? SERVICE_NAMES[k] ?? k;
    S2.toast(`Reconnected to ${name}`, "ok");
    for (const view of Object.keys(ws.frames)) deliver(view, { type: "s2-reconnected", service: k });
    if (k === "sas") sasPrewarm();

// ---------------------------------------------------------------- SAS session

// Asked again every 4 minutes while the Workspace is open: the server then checks the session (a state request keeps

// ---------------------------------------------------------------- views
function openView(view, handoff) {

  // "sql:new" (the editor's New, Ctrl+Alt+N): a fresh SQL tab; "sql" (rail, hand-offs): the active one.
  if (view === "sql:new") { newSqlTab(handoff); return; }
  if (view === "sql" || (isSql(view) && !sqlTab(view))) view = sqlKey(ws.lastSql);
  if (!viewDef(view)) {
    if (isNotebook(view) && ws.features.notes?.notebooks) S2.toast(ws.features.notes.notebooks);
    return;
  }
  ws.current = view;
  if (isNotebook(view)) ws.lastNotebook = view;
  if (isSql(view) && tabIdOf(view) && ws.lastSql !== tabIdOf(view)) {
    ws.lastSql = tabIdOf(view);

  }

  if (!ws.frames[view]) createFrame(view, handoff);
  else if (handoff) deliver(view, { ...handoff, type: handoff.type === "s2-open-file" ? "s2-open-file" : "s2-set-sql" });
  for (const [key, f] of Object.entries(ws.frames)) {

// ---------------------------------------------------------------- view pages

// sql_editor (on tool input).

}

// the same block (the Notebook after the SQL Editor) comes without it and gets this copy back (name -> {hash, html}).
const vendorBlocks = new Map();

  const res = await S2.callTool("app_page", { uri, ...(headHash ? { head: headHash } : {}), ...(known?.build ? { build: known.build } : {}),
    ...(Object.keys(have).length ? { vendors: have } : {}) });

    if (res.vendors_omitted?.length) {

async function createFrame(view, handoff) {
  const v = viewDef(view);
  const loading = h("div", { class: "ws-loading", dataset: { view } }, h("span", {}, h("span", { class: "s2-spinner" }), ` Loading ${v.title}…`));
  mainEl.append(loading);
  splash.status(`Opening ${v.title}…`);
  const f = (ws.frames[view] = { iframe: null, pending: [], args: {}, result: null, ready: false });
  if (isSql(view)) {
    // The tab active at start gets the workspace's own result (with the SQL Claude sent);
    // other tabs open like a plain sql_editor call. tab_id / tab_label tell the editor
    // which tab's draft is its own (not sql_editor arguments: callArgs leaves them out).
    const first = view === ws.startSqlKey && ws.sqlResult;
    const t = sqlTab(view);
    f.callArgs = { database: ws.args.database ?? null };
    f.args = { ...f.callArgs, sql: first ? ws.args.sql ?? null : null, tab_id: t?.id ?? null, tab_label: t ? sqlLabel(t) : null };
    f.label = f.args.tab_label;
    if (first) { f.result = ws.sqlResult; ws.sqlResult = null; }
    if (handoff) f.pending.push({ ...handoff, type: handoff.type === "s2-open-file" ? "s2-open-file" : "s2-set-sql" });
  } else if (isNotebook(view)) {
    f.args = { database: handoff?.database ?? ws.args.database ?? null, name: handoff?.name ?? null };
    ws.titles[view] = { title: "untitled", dirty: false };
  } else if (view === "workload") {

    if (handoff?.sql || handoff?.statements) f.pending.push({ ...handoff, type: "s2-set-sql" });
  } else if (view === "security") {

    // statement's plan-cache entry (``plan``) when only the plan cache knows it.
    if (handoff?.search || handoff?.plan) f.pending.push({ ...handoff, type: "s2-set-sql" });
  } else if (view === "schema") {

      sandbox: `allow-scripts allow-downloads allow-popups${debugSameOrigin ? " allow-same-origin" : ""}` });
    f.iframe.hidden = ws.current !== view;
    mainEl.append(f.iframe);
  } catch (e) {
    loading.replaceChildren(S2.errorBox(new Error(`Couldn't load ${v.title}: ${e.message ?? e}`)));
    splash.done();
  }
}

  if (msg?.type === "s2-files-changed") {

  if (msg?.type === "s2-notify") { if (ws.frames[msg.view]) deliver(msg.view, msg.payload ?? {}); return; }

    // An editor's open file and unsaved changes, for its tab.
    const t = sqlTab(view);
    if (t) { t.live = { file: msg.title || null, path: msg.path ?? null, dirty: Boolean(msg.dirty) }; Object.assign(t, t.live); }
    if (ws.closeArmed === view && !t?.dirty) ws.closeArmed = null;
    renderTabs(); pushContext();
    return;
  }
  if (msg?.type === "s2-title") { ws.titles[view] = { title: String(msg.title || "untitled"), dirty: Boolean(msg.dirty), path: msg.path }; renderTabs(); return; }
  if (msg?.type === "s2-open-file" && isSql(view)) { openSqlFile(view, msg); return; }
  if (msg?.type === "s2-tab-key" && isSql(view)) { sqlTabKey(msg.action); return; }
  if (msg?.jsonrpc !== "2.0" || !msg.method) return;
  const { id, method, params } = msg;
  try {
    switch (method) {
      case "ui/initialize": {
        const outerCaps = S2.app.getHostCapabilities() ?? {};
        return reply(view, id, {
          protocolVersion: params.protocolVersion,
          hostCapabilities: {
            serverTools: {}, serverResources: {}, logging: {},
            ...(outerCaps.openLinks ? { openLinks: {} } : {}),
            ...(outerCaps.downloadFile ? { downloadFile: {} } : {}),
            ...(outerCaps.message ? { message: outerCaps.message } : {}),
            ...(outerCaps.updateModelContext ? { updateModelContext: outerCaps.updateModelContext } : {}),
          },
          hostInfo: { name: "singlestore-workspace", version: "0.5.0" },
          hostContext: innerContext(view),
        });
      }
      case "ui/notifications/initialized": {
        send(view, { jsonrpc: "2.0", method: "ui/notifications/tool-input", params: { arguments: f.args } });
        send(view, { jsonrpc: "2.0", method: "ui/notifications/tool-result", params: await openingResult(view) });
        f.ready = true;
        mainEl.querySelector(`.ws-loading[data-view="${view}"]`)?.remove();
        requestAnimationFrame(() => splash.done());  // the first view is usable: the logo goes
        send(view, { type: "s2-visibility", hidden: ws.current !== view });
        for (const m of f.pending.splice(0)) send(view, m);
        return;
      }
      case "tools/call": {
        try { return reply(view, id, await S2.app.callServerTool(params)); }
        catch (e) { return reply(view, id, { isError: true, content: [{ type: "text", text: String(e?.message ?? e) }] }); }
      }
      case "resources/read": return reply(view, id, await S2.app.readServerResource(params));
      case "ui/message": return reply(view, id, (await S2.app.sendMessage(params)) ?? {});
      case "ui/update-model-context": {
        ws.contexts[view] = (params?.content ?? []).filter((c) => c.type === "text").map((c) => c.text).join("\n");
        pushContext();
        return reply(view, id, {});
      }
      case "ui/download-file": return reply(view, id, (await S2.app.downloadFile(params)) ?? {});
      case "ui/open-link": return reply(view, id, (await S2.app.openLink(params)) ?? {});
      case "ui/request-display-mode": return reply(view, id, { mode: "fullscreen" });
      case "ping": return reply(view, id, {});
      default:
        if (id !== undefined) replyError(view, id, `Method not found: ${method}`, -32601);
    }
  } catch (e) {
    if (id !== undefined) replyError(view, id, String(e?.message ?? e));
  }
});

// One combined model context, so a view's report (e.g. the SQL Editor's id)
// isn't lost when another view reports.
let ctxTimer = null;
function pushContext() {
  clearTimeout(ctxTimer);
  ctxTimer = setTimeout(() => {
    const label = (key) => `${viewDef(key)?.title ?? "?"}${isNotebook(key) ? ` "${ws.titles[key]?.title ?? "untitled"}"`
      : sqlTab(key) ? ` tab "${sqlLabel(sqlTab(key))}"` : ""}`;
    const parts = [`SAS SpeedyStore Studio (the SingleStore Workspace) is open (active connection: ${ws.connection ?? "?"}); the user is on the ${label(ws.current)} view.`
      + (ws.presenter ? " Presenter mode is on: the user is presenting, so keep host names, connection names and user names out of answers where you can." : "")];
    for (const [view, text] of Object.entries(ws.contexts)) if (text) parts.push(`[${label(view)}]\n${text}`);
    S2.updateModelContext(parts.join("\n\n"));
  }, 250);
}

// ---------------------------------------------------------------- host wiring
let started = false;
S2.onDisplayModeChange = () => {};
const app = await S2.connect({
  name: "singlestore-workspace",
  onToolInput(args) {
    ws.args = args ?? {};
    splash.status("Connecting to SingleStore…");
    prefetchPage(viewDef(ws.args.view ?? "sql")?.uri);
    prefetchSqlTabs();
  },
  async onToolResult(result) {
    if (started) return;
    started = true;
    try {
      const data = S2.resultData(result);
      ws.sqlResult = result;
      ws.args = { ...ws.args, database: data.database ?? ws.args.database, sql: data.sql ?? ws.args.sql, table: data.table ?? ws.args.table };
      // Server mode: views switched off there (notebooks) leave the rail; opening one says why.
      ws.features = data.features ?? {};
      if (ws.features.notebooks === false) delete VIEWS.notebook;
      buildShell();
      setPresenter(initialPresenter(), { save: false });
      await loadSqlTabs(data.tab_id, { early: true });  // sql_editor(new_tab=true) made that tab
      openView(viewDef(data.view) ? data.view : "sql");
      startSasPrewarm();
      if (data.connection_error) S2.toast(`The active connection fails: ${data.connection_error.slice(0, 160)}`, "err");
    } catch (e) {
      root.replaceChildren(S2.errorBox(e));
      splash.done();
    }
  },
  onHostContext(ctx) {
    // Theme and style changes reach every view.
    for (const view of Object.keys(ws.frames)) {
      send(view, { jsonrpc: "2.0", method: "ui/notifications/host-context-changed", params: { theme: ctx.theme, styles: ctx.styles } });
    }
  },
});
if (app && S2.inBrowserView() && !splash.over) window.S2Splash?.hide();  // the host page's logo is on top
</script>
</body>
</html>
