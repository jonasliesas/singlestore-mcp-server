[project]
name = "singlestore-mcp-server"
version = "0.8.1"
description = "Local MCP server for SingleStore (Helios or self-managed) with first-class pipeline support, built on the official mcp and singlestoredb SDKs."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "mcp[cli]>=2.0.0",
    "singlestoredb>=1.0.0",
    "keyring>=25",        # saved connection passwords in the OS credential store
    "cryptography>=42",   # encrypted fallback where there's no OS credential store
    "msal>=1.31",         # Microsoft Entra ID sign-in for connections
    "pymsalruntime>=0.18; sys_platform == 'win32' or sys_platform == 'darwin'",  # Entra ID: use the Windows / macOS sign-in
]

[project.scripts]
singlestore-mcp-server = "singlestore_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/singlestore_mcp"]
