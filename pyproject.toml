[project]
name = "singlestore-mcp-server"
version = "0.4.0"
description = "Local MCP server for SingleStore (Helios or self-managed) with first-class pipeline support, built on the official mcp and singlestoredb SDKs."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "mcp[cli]>=2.0.0",
    "singlestoredb>=1.0.0",
]

[project.scripts]
singlestore-mcp-server = "singlestore_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/singlestore_mcp"]
